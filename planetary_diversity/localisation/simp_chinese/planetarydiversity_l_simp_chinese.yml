 job_pd_reef_coral_harvester: "珊瑚采集者"
 job_pd_reef_coral_harvester_plural: "珊瑚采集者"
 job_pd_reef_coral_harvester_desc: "珊瑚采集者在富含矿物的珊瑚礁中进行挖掘，在开采出矿石之余，也会将可食用的捕获物一并带出水面。"
 job_pd_reef_coral_harvester_drone: "珊瑚采集者"
