l_french:
###Lithoid Planets
#Decision
 decision_pd_aw_lithoid_planet: "Créer un écosystème lithotrophe"
 decision_pd_aw_lithoid_planet_desc: "Ce monde n'attend que d'être taillé dans le cristal et la pierre. Le fragile écosystème biologique se dresse sur notre chemin."
 decision_pd_aw_lithoid_planet_effects_short: "Un écosystème lithotrophe sera façonné sur ce monde, ce qui nous permettra d'ajuster finement les fréquences cristallines selon nos besoins."
 decision_pd_aw_lithoid_planet_tooltip: "Une fois l'opération achevée, nous pourrons choisir la fréquence des cristaux lithotrophes de cette planète."
 decision_pd_aw_lithoid_planet_cleanup: "Restaurer l'écosystème biologique"
 decision_pd_aw_lithoid_planet_cleanup_desc: "Nous devons rendre à l'écosystème biologique de cette planète sa splendeur d'origine."
 decision_pd_aw_lithoid_planet_cleanup_effects_short: "L'écosystème lithotrophe artificiel sera supprimé et la planète retrouvera sa nature biologique."
 decision_pd_aw_lithoid_planet_cleanup_tooltip: "Tous les modificateurs lithotrophes seront supprimés et la planète retrouvera un écosystème biologique."
 decision_pd_aw_lithoid_change_frequency: "Changer la fréquence lithotrophe"
 decision_pd_aw_lithoid_change_frequency_desc: "Nous allons changer la fréquence des cristaux de l'écosystème lithotrophe pour mieux répondre à nos besoins."
 decision_pd_aw_lithoid_change_frequency_effects_short: "Nous pouvons changer la fréquence des cristaux de cette planète."
 decision_pd_aw_lithoid_change_frequency_tooltip: "Le modificateur lithotrophe actuel sera supprimé, ce qui nous permettra de choisir une autre fréquence."

#Modifiers
 pd_aw_lithoid_planet_cyan: "Monde lithotrophe"
 pd_aw_lithoid_planet_cyan_desc: "Longueur d'onde: 500 nm\nLes vibrations de résonance favorisent la bonne volonté et catalysent un taux de croissance accéléré pour les Lithoïdes."
 pd_aw_lithoid_planet_red: "Monde lithotrophe"
 pd_aw_lithoid_planet_red_desc: "Longueur d'onde: 650 nm\nLa résonance cristalline robuste se combine avec les gisements minéraux, les rendant plus accessibles pour l'extraction."
 pd_aw_lithoid_planet_yellow: "Monde lithotrophe"
 pd_aw_lithoid_planet_yellow_desc: "Longueur d'onde: 580 nm\nLes harmoniques dynamiques de cette résonance cristalline s'intègrent à nos réseaux d'énergie, débloquant leur capacité totale."

#Acension Perk
 ap_pd_lithoid_worlds: "Mondes lithotrophes"
 ap_pd_lithoid_worlds_desc: "Nous sculpterons nos mondes en paradis lithotrophes inébranlables, socle d'une stabilité éternelle."
 allow_lithoid_worlds: "§HDébloque la décision :§! $decision_pd_aw_lithoid_planet$"
 describe_lithoid_worlds: "Les §YMondes lithotrophes§! sont une classe planétaire spéciale aux écosystèmes lithotrophes. Leurs structures cristallines sont accordées sur l'une de trois longueurs d'onde, et peuvent être réaccordées plus tard grâce à la décision §Y$decision_pd_aw_lithoid_change_frequency$§!.\n\n§H500 nm :§! $job_bureaucrat$ $i_unity$ §G+1§!, $mod_LITHOID_logistic_growth_mult$ §G25%§!\n§H650 nm :§! $job_miner$ $i_minerals$ §G+2§!, $mod_LITHOID_logistic_growth_mult$ §G10%§!\n§H580 nm :§! $job_technician$ $i_energy$ §G+2§!, $mod_LITHOID_logistic_growth_mult$ §G10%§!\n\n§HToutes les fréquences :§!\n$MOD_LITHOID_POP_HAPPINESS$ : §G25%§!\n$MOD_BIOLOGICAL_POP_HAPPINESS$ : §R-50%§!\n$MOD_BIO_LOGISTIC_GROWTH_MULT$ : §R-50%§!"

#Notification Message
 MESSAGE_PD_AW_LITHOID_DESC:1 "$PLANET|Y$ est désormais un §YMonde lithotrophe§!"
 MESSAGE_PD_AW_LITHOID_MESSAGE_TYPE_TITLE: "Biome lithotrophe achevé"
 MESSAGE_PD_AW_LITHOID_CLEANUP_DESC:1 "Le biome biologique de $PLANET|Y$ a été restauré."
 MESSAGE_PD_AW_LITHOID_CLEANUP_MESSAGE_TYPE_TITLE: "Biome lithotrophe supprimé"

#Choose Event
 pdawlithoidplanets.100.name: "Fréquence cristalline"
 pdawlithoidplanets.100.desc: "Sur quelle fréquence de résonance accorderons-nous le biome lithotrophe de §Y[This.GetName]§! ?"
 pdawlithoidplanets.100.cyan: "Cyan"
 pdawlithoidplanets.100.cyan.tooltip: "Cette fréquence de résonance agit comme une force cohésive, favorisant l'unité parmi notre population lithoïde et nourrissant une augmentation harmonieuse de la croissance démographique."
 pdawlithoidplanets.100.red: "Rouge"
 pdawlithoidplanets.100.red.tooltip: "Cette résonance se combine avec les gisements minéraux, les rendant plus accessibles et propices à l'extraction."
 pdawlithoidplanets.100.yellow: "Jaune"
 pdawlithoidplanets.100.yellow.tooltip: "Cette fréquence de résonance s'intègre à nos réseaux d'énergie, débloquant une augmentation de leur capacité totale."

