 # Ammonia signature buildings (pick one)
 building_pd_ammonia_fixation_institute: "Institut de synthèse de l'ammoniac"
 building_pd_ammonia_fixation_institute_desc: "La chimie riche en azote de cette planète offre à nos biologistes et à nos ingénieurs une multitude de réactions inédites à étudier et à perfectionner."
 building_pd_ammonia_pharma_works: "Usine pharmaceutique à l'ammoniac"
 building_pd_ammonia_pharma_works_desc: "L'abondant ammoniac de ce monde est facilement raffiné en produits pharmaceutiques et en agents nettoyants qui approvisionnent les marchés de tout l'empire."
 building_pd_ammonia_biome_reserve: "Réserve du biome ammoniaqué"
 building_pd_ammonia_biome_reserve_desc: "L'étrange écosystème à chimie froide de ce monde attire des visiteurs curieux venus de toutes les étoiles."

 # Methane signature buildings (pick one)
 building_pd_methane_tholin_lab: "Laboratoire de chimie du méthane"
 building_pd_methane_tholin_lab_desc: "L'épaisse brume organique de ce monde regorge de chimie exotique à basse température que nos chercheurs peuvent percer à jour."
 building_pd_methane_hydrocarbon_foundry: "Fonderie de craquage du méthane"
 building_pd_methane_hydrocarbon_foundry_desc: "Les hydrocarbures inépuisables de ce monde sont craqués et refondus en alliages, et le combustible local bon marché fait tourner nos fonderies."
 building_pd_methane_polymer_plant: "Usine de polymères de méthane"
 building_pd_methane_polymer_plant_desc: "Les mers de méthane offrent une matière première presque illimitée pour les plastiques et autres produits finis."

 # Nitrogen signature buildings (pick one)
 building_pd_nitrogen_supercomputer: "Complexe de supercalculateurs à l'azote"
 building_pd_nitrogen_supercomputer_desc: "Le froid profond naturel permet à nos ordinateurs supraconducteurs de fonctionner à des vitesses qui feraient fondre des machines sur n'importe quel monde plus chaud."
 building_pd_nitrogen_munitions_foundry: "Fonderie de munitions à l'azote"
 building_pd_nitrogen_munitions_foundry_desc: "Les riches strates de nitrates de ce monde se transforment facilement en explosifs et en alliages militaires pour nos armées."
 building_pd_nitrogen_cryonics_sanctuary: "Sanctuaire cryonique à l'azote"
 building_pd_nitrogen_cryonics_sanctuary_desc: "Ce froid qui conserve parfaitement fait de ce monde un sanctuaire idéal, qui attire clients et touristes de toutes les étoiles."

