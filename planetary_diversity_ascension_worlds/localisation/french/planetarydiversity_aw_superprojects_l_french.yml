 tech_pd_planetary_stripmine_desc: "Nous pourrions extraire des ressources de chaque parcelle de la surface d'une planète en construisant des excavatrices industrielles et des foreuses avancées. L'écosystème naturel en souffrira considérablement."
 tech_pd_planetary_stripmine_tooltip: "§HDébloque la décision :§! $decision_pd_aw_stripmine$"
