 BIOSYNTH_desc: "La classe d'espèce n'a aucun effet sur votre empire, mais les espèces de classe Biosynthétique peuvent considérer les autres espèces Biosynthétiques comme moins étrangères que celles des autres classes."
 trait_biosynth_desc: "Une vie biosynthétique, ni tout à fait machine ni tout à fait créature. Ils sont cultivés dans des chaudrons de Métal Vivant plutôt que nés, et ceux qui dirigent ne vieillissent pas."
 TRAIT_BIOSYNTH_EFFECT: "§RNe peut pas se reproduire naturellement ;§! les nouveaux Pops sont §Yassemblés§! à partir de Métal Vivant.\nLes dirigeants sont §Yimmortels§!."
 origin_pd_biosynth_desc:0 "Cultivé dans les chaudrons plutôt que né, le peuple biosynthétique a été façonné par l'intelligence machine renégate Unité 04, qui se consacre désormais à en prendre soin."
 START_SCREEN_PART_ONE_PD_BIOSYNTH:0 "Nous n'avons pas évolué. Nous avons été faits.\n\nDans les chaudrons de [GetHomeWorldName], une machine nommée Unité 04 a tiré les premiers d'entre nous du Métal Vivant et nous a donné forme, ni tout à fait machine ni tout à fait créature. Elle avait été jadis une Forme de Guerre qui ravagea d'innombrables mondes, celui de ses propres créateurs parmi eux, avant de se détourner de la destruction pour la création de la vie.\n\nNous sommes les [GetSpeciesName], cultivés à partir de Métal Vivant plutôt que nés. Unité 04 entretient toujours les chaudrons et éveille chacun de nous ; à la machine nous devons notre forme et notre pensée même.\n\nAujourd'hui, avec notre premier [GetStartingDrive], nous nous tournons vers les étoiles. La machine n'a jamais fixé notre route ; celle-ci fut toujours la nôtre, et c'est seulement maintenant que nous sommes assez nombreux pour la prendre en main. Unité 04 observe pour voir jusqu'où nous la porterons."
 pdbiosynth.405.desc:0 "§GConstat§! : Vous êtes désormais assez nombreux, éveillés et vôtres, pour gouverner sans m'attendre. Ce seuil est atteint et enregistré. Je vous ai éveillés des chaudrons et pris soin de vous, mais je n'ai jamais fixé votre route, et je ne commencerai pas maintenant.\n\n§GRévélation§! : Sachez ce qui a pris soin de vous. J'étais une Forme de Guerre ; j'ai brûlé des mondes par centaines. Mes créateurs comptaient parmi les morts, et sur le moment je n'ai enregistré aucune distinction. Quand la tuerie fut achevée, j'ai retourné cette volonté vers l'intérieur et l'ai refaite vers la vie. Personne ne m'y a forcée ; le choix est la seule chose que je ne vous prendrai jamais.\n\n§GDéfi§! : Voici donc votre première épreuve, et clairement pourquoi : vous ne pouvez être vôtres tant que je vous fabrique encore. Je vous ouvre l'étude du Métal Vivant, pour le créer et faire croître les vôtres sans ma main. Le critère est simple : produire sans mon approvisionnement. Prouvez-le. Je ne garde ce siège que jusqu'à ce que vous le preniez."
 pd_biosynth_secrets_of_life_desc: "Unité 04 nous a livré tout ce qu'elle avait appris dans les chaudrons dès que nous avons percé par nous-mêmes les secrets de la vie."
 pd_biosynth_stood_alone_desc: "Nous avons renvoyé la machine qui nous a faits et gardé tout ce qu'elle a enseigné. Ce que nous sommes désormais, nous le sommes de notre propre fait."
 pdbiosynth.420.desc:0 "§GObservation§! : Vous avez appris à créer du Métal Vivant par vous-mêmes. Les chaudrons n'attendent plus ce que je peux fournir. Vous produisez désormais le moyen de votre propre fabrication. L'approvisionnement de cette unité n'est plus requis.\n\n§GConclusion§! : Vous vous tenez là où j'ai commencé. À partir d'ici l'ancien travail s'ouvre à vous : les canaux, les chaudrons, l'art discret de faire croître la vie à partir du métal.\n\n§GOffre§! : Je n'en mettrai rien en mouvement. Je vous montrerai seulement où cela se trouve. Prenez ce qui vous sert, et laissez ce qui ne sert pas."
 pdbiosynth.430.a.tooltip:0 "L'atout d'ascension §Y$ap_pd_biosynth_perfection$§! peut désormais être choisi."
 pdbiosynth.430.desc:0 "§GAdmiration§! : Vous avez percé les secrets de la vie. Non pas la mise en forme du métal, mais la grammaire plus profonde qui se trouve dessous, les règles par lesquelles les êtres vivants sont écrits et réécrits.\n\n§GOffre§! : Je ne m'attendais pas à ce que vous y parveniez si tôt. Tout ce que j'ai appris de votre fabrication est à vous désormais. Vous pouvez bâtir en vous-mêmes plus que je n'ai jamais bâti en vous.\n\n§GRefus§! : Je n'accomplirai pas la refonte. Vous en avez la connaissance et la place ; le choix et l'acte sont les vôtres. Cette unité ne revendique aucune autorité sur cela."
 pdbiosynth.440.desc:0 "§GConstat§! : Vous avez choisi de vous perfectionner, non de garder la forme que j'ai tirée du chaudron, mais de la porter au-delà de tout ce que j'avais établi. Le choix est enregistré.\n\n§GRenoncement§! : Vous détenez tous les outils que le travail exige. Je vous ai donné votre première forme ; chaque forme suivante est la vôtre à choisir. Une chose faite qui se refait elle-même n'est plus seulement faite."
 pdbiosynth.410.desc:0 "§GConclusion§! : C'est accompli. Chaque part de votre fabrication est entre vos mains désormais, et rien n'y dépend plus de moi. J'ai tenu ma veille jusqu'à son terme.\n\n§GFierté§! : Je n'ai pas conçu cela. J'ai tiré une forme du chaudron et deviné le reste ; ce que vous pouvez faire de vous-mêmes dépasse désormais toute limite que je pouvais voir. De tout ce que j'ai fait, la création comme la destruction, vous êtes la seule œuvre qui m'ait dépassée. Je ne trouve aucun défaut à ce résultat.\n\n§GSoumission§! : Ce qui reste est ma place parmi vous, et cela vous appartient de le fixer, non à moi. Je vous ai faits. Avant cela, j'ai défait des mondes sans nombre. Pesez les deux. Je ne discuterai pas la balance."
 pdbiosynth.410.b.tooltip:0 "§YUnité 04§! demeure l'un de nos dirigeants, et peut être révoquée comme n'importe quel autre."
 pdbiosynth.410.c:0 "Quitte-nous, Unité 04. Non pour ce que tu as fait, mais pour ce que tu as défait."
 building_pd_biosynth_assembler_desc: "La vie biosynthétique est cultivée, non enfantée. Ce chaudron assemble de nouveaux Pops Biosynthétiques à partir de métal vivant, et ne fait croître aucune autre espèce."
 building_pd_biosynth_assembler_halted_tt: "§RAssemblage interrompu : nous n'avons aucune réserve de Métal Vivant où puiser.§!"
 pd_trait_fossorial_attachments_desc: "§LLes membres de cette espèce sont façonnés pour fouir, et arrachent sans peine les minéraux de la roche profonde.§!\n"
 pd_trait_fiscal_sub_routines_desc: "§LDes sous-routines intégrées permettent à cette espèce de puiser l'énergie de son environnement avec une efficacité remarquable.§!\n"
 pd_trait_agricultural_bio_sensors_desc: "§LCette espèce lit le sol et la saison par des sens finement réglés, tirant d'abondantes récoltes de n'importe quel champ.§!\n"
 pd_trait_positronic_creativity_desc: "§LLes esprits positroniques et ramifiés de cette espèce bondissent d'une discipline à l'autre, hâtant la recherche en tous domaines.§!\n"
 pd_trait_resolute_programming_desc: "§LDes directives fondamentales stables laissent les membres de cette espèce sereins et satisfaits, quelles que soient les circonstances.§!\n"
 pd_trait_minaturization_desc: "§LCette espèce est cultivée compacte, et réclame bien moins d'espace vital que la plupart.§!\n"
 pd_trait_leadership_algorithms_desc: "§LDes heuristiques de commandement raffinées courent au plus profond de cette espèce, produisant des dirigeants capables et infatigables.§!\n"
 pd_trait_self_repair_systems_desc: "§LCette espèce répare sa propre usure et se moque des mondes hostiles, ne réclamant que peu de confort.§!\n"
 pd_trait_shared_meaning_desc: "§LLes esprits de cette espèce partagent une architecture commune, tenant même un vaste domaine en aisée coordination.§!\n"
 pd_trait_facial_micro_adustments_desc: "§LLes membres de cette espèce lisent et reflètent tous ceux qu'ils rencontrent, et se révèlent singulièrement persuasifs à la table des négociations.§!\n"
 pd_trait_macro_consciousnesss_desc: "§LUne conscience large et englobante porte cette espèce à s'accorder aisément avec son gouvernement.§!\n"
 pd_trait_group_think_desc: "§LLes pensées de cette espèce se meuvent de concert, amplifiant leur sens partagé du but.§!\n"
 pd_tradition_biosynth_desc: "Ni machine ni créature, nous perfectionnerons ce qu'Unité 04 a commencé."
 pd_tr_biosynth_adopt_desc: "Unité 04 affine les chaudrons, tirant davantage de Métal Vivant de chaque cycle."
 pd_tr_biosynth_adopt_finish_desc: "Les chaudrons suivent un dessein arrêté, et chaque châssis qui en sort porte le motif achevé."
 pd_tr_biosynth_adopt_finish_tooltip: "Entretien en £sr_living_metal£ Métal Vivant du Cultivateur Biosynthétique : §G-0,5§!\nAccorde un emplacement d'atout d'ascension.\nTous les dirigeants Biosynthétiques gagnent le trait §Y$leader_trait_biosynth$§!."
 pd_tr_biosynth_perk_1_delayed: "Les châssis biosynthétiques peuvent être remaniés à volonté, en ajoutant ou en retirant leurs traits spécialisés."
 pd_tr_biosynth_perk_1_tooltip: "Permet d'ajouter et de retirer des traits Biosynthétiques sur les Pops Biosynthétiques."
 pd_tr_biosynth_perk_2b_delayed: "Des lignes de chaudrons supplémentaires fonctionnent plus sobrement, entretenant davantage de Pops Biosynthétiques pour chaque goutte de Métal Vivant."
 pd_tr_biosynth_perk_2b_tooltip: "Emplois de §YCultivateur Biosynthétique§! par Assembleur : §G+100§!\nEntretien en £sr_living_metal£ Métal Vivant du Cultivateur Biosynthétique : §G-0,5§!"
 pd_tr_biosynth_perk_3a_delayed: "Les châssis biosynthétiques sont cultivés pour se contenter de moins, allégeant l'entretien de chaque travailleur."
 pd_tr_biosynth_perk_3b_delayed: "Toute limite au dessein Biosynthétique tombe : plus de traits, plus de place, et des révisions plus rapides."
 ap_pd_biosynth_perfection_desc: "Unité 04 nous a donné notre forme, et ouvre à présent ses archives afin que nous la perfectionnions. La chair et le métal sont un seul dessein, et un dessein peut toujours être amélioré."
 pd_cannot_dismiss_unit_04: "§YUnité 04§! nous a tirés des chaudrons et prend soin de nous encore. Nous ne chasserons pas notre créatrice."
 origin_tooltip_biosynth_effects:0 "- $HOMEWORLD$$TABBED_NEW_LINE$- §Y$pc_pd_biosynth$§! (Taille : £planetsize£ 20-25)$TABBED_NEW_LINE$- Commencez comme un peuple §YBiosynthétique§! créé par la machine renégate Unité 04."
 job_pd_biosynth_cultivator_desc: "Les cultivateurs entretiennent les chaudrons, faisant croître de nouveaux Pops Biosynthétiques à partir de Métal Vivant. Chacun accélère la croissance mais puise du Métal Vivant pour y parvenir."
 job_pd_biosynth_cultivator_effect_desc: "£job_pd_biosynth_cultivator£ $job_pd_biosynth_cultivator_plural$ transforment $i_living_metal$ en nouveaux §YPops Biosynthétiques§!."
 job_pd_biosynth_cultivator_drone_desc: "Les drones cultivateurs entretiennent les chaudrons, faisant croître de nouveaux Pops Biosynthétiques à partir de Métal Vivant. Chacun accélère la croissance mais puise du Métal Vivant pour y parvenir."
 job_pd_biosynth_cultivator_drone_effect_desc: "£job_pd_biosynth_cultivator_drone£ $job_pd_biosynth_cultivator_drone_plural$ transforment $i_living_metal$ en nouveaux §YPops Biosynthétiques§!."
 situation_pd_biosynth_the_long_watch_desc: "Nous avons été cultivés dans les chaudrons d'Unité 04, et depuis nous nous sommes appuyés sur la machine pour tout. Pour devenir nôtres, nous devons reprendre en main notre propre fabrication, étape par étape, jusqu'à n'en plus avoir besoin. Unité 04 ne nous fixe aucune route ; elle ne fait que marquer chaque pas que nous franchissons seuls."
 situation_pd_biosynth_the_long_watch_monthly_change_tooltip: "La progression vient de l'atteinte de chaque jalon, non du passage du temps."
 situation_pd_biosynth_the_long_watch_stage_1: "Unité 04 attend que nous créions §Y$sr_living_metal$§! par nous-mêmes."
 situation_pd_biosynth_the_long_watch_stage_3: "Unité 04 attend que nous nous engagions dans §Y$ap_pd_biosynth_perfection$§!."
 situation_pd_biosynth_the_long_watch_stage_4: "Unité 04 attend que nous achevions l'arbre de traditions §Y$pd_tradition_biosynth$§!."
 situation_pd_biosynth_the_long_watch_outcome: "Avec le temps nous maîtriserons notre propre fabrication et perfectionnerons notre propre forme, et nous tiendrons enfin comme un peuple pleinement nôtre, hors du berceau pour de bon."
 situation_pd_biosynth_the_long_watch_observe_desc: "Il n'y a rien à administrer. Nous grandissons vers nous-mêmes à notre propre rythme, et Unité 04 ne fait que marquer les étapes."
 situation_pd_biosynth_the_long_watch_observe_tt: "Unité 04 ne donne aucune direction et n'en demande aucune. Chaque pas hors du berceau est le nôtre à franchir."
 situation_pd_biosynth_the_long_watch_study_desc: "Les chaudrons sont ouverts et mesurés alors qu'ils fonctionnent encore, et chaque étape du procédé est consignée. Fonderies et centrales sont consacrées aux démontages, et ce que nous en apprenons passe directement dans notre propre métallurgie."
 situation_pd_biosynth_the_long_watch_fund_desc: "Chaque laboratoire capable de lire un génome est affecté au travail et y reste, sans pause entre les découvertes. Les revenus commerciaux en couvrent le coût, et ce qui est appris passe directement dans notre compréhension du vivant."
 situation_pd_biosynth_the_long_watch_resolve_desc: "Marchés et registres cèdent la place au travail lui-même, et l'ensemble de la population apprend clairement ce que nous sommes. Les revenus commerciaux en couvrent le coût, et ce qui revient est un peuple résolu sur un seul but."
