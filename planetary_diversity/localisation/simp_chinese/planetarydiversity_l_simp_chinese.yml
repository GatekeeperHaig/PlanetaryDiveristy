 job_pd_petrified_fossil_quarrier: "化石采掘者"
 job_pd_petrified_fossil_quarrier_plural: "化石采掘者"
 job_pd_petrified_fossil_quarrier_desc: "化石采掘工从石化地层中开采矿物，他们发掘出的标本能为社会学研究提供少量的产出。"
 job_pd_petrified_fossil_quarrier_drone: "化石采掘者"
 job_pd_petrified_fossil_quarrier_drone_plural: "化石采掘者"
