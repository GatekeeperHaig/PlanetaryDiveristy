 job_pd_biosynth_cultivator_drone_effect_desc: "£job_pd_biosynth_cultivator_drone£ $job_pd_biosynth_cultivator_drone_plural$ turn $i_living_metal$ into new §YBiosynthetic Pops§!."
 situation_pd_biosynth_the_long_watch: "Out of the Cradle"
 situation_pd_biosynth_the_long_watch_type: "Out of the Cradle"
 situation_pd_biosynth_the_long_watch_desc: "We were grown in Unit 04's cauldrons, and we have leaned on the machine for everything since. To become our own, we must take up the making of ourselves, step by step, until we need it no longer. Unit 04 sets us no course; it only marks each step we manage alone."
 situation_pd_biosynth_the_long_watch_monthly_change_tooltip: "Progress comes from reaching each milestone, not from the passing of time."
 situation_pd_biosynth_the_long_watch_stage_1: "Unit 04 waits for us to create §Y$sr_living_metal$§! for ourselves."
 situation_pd_biosynth_the_long_watch_stage_2: "Unit 04 waits for us to research §Y$tech_gene_tailoring$§!."
 situation_pd_biosynth_the_long_watch_stage_3: "Unit 04 waits for us to commit to §Y$ap_pd_biosynth_perfection$§!."
 situation_pd_biosynth_the_long_watch_stage_4: "Unit 04 waits for us to complete the §Y$pd_tradition_biosynth$§! tradition tree."
 situation_pd_biosynth_the_long_watch_outcome: "In time we will master our own making and perfect our own form, and stand at last as a people wholly our own, out of the cradle for good."
 situation_pd_biosynth_the_long_watch_observe: "Finding Our Feet"
 situation_pd_biosynth_the_long_watch_observe_desc: "There is nothing to administer. We grow into ourselves at our own pace, and Unit 04 only marks the steps."
 situation_pd_biosynth_the_long_watch_observe_tt: "Unit 04 gives no direction and asks for none. Each step out of the cradle is ours to take."
 situation_pd_biosynth_the_long_watch_study: "Study the Cauldrons"
 situation_pd_biosynth_the_long_watch_study_desc: "The cauldrons are opened up and measured while they still run, and every stage of the process is recorded. Foundries and power plants are turned over to the teardowns, and what we learn from them goes straight into our own metallurgy."
 situation_pd_biosynth_the_long_watch_fund: "Fund the Gene Work"
 situation_pd_biosynth_the_long_watch_fund_desc: "Every laboratory that can read a genome is put on the work and kept there, with no pause between findings. Trade revenue covers the cost, and what is learned goes straight into our understanding of living things."
 situation_pd_biosynth_the_long_watch_resolve: "Gather the Resolve"
 situation_pd_biosynth_the_long_watch_resolve_desc: "Markets and ledgers give way to the work itself, and the whole population is told plainly what we are for. Trade revenue covers the cost, and what comes back is a people settled on one purpose."