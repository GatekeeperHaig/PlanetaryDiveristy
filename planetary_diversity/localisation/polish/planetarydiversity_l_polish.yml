 zone_pd_geothermal_grid: "Geotermalna sieć energetyczna"
 zone_pd_geothermal_grid_desc: "Wykorzystując silną aktywność geotermalną tej planety do zasilania naszej sieci energetycznej, możemy zwiększyć produkcję naszych techników."
 zone_pd_geothermal_foundry: "Geotermalne filtry zawiesinowe"
 zone_pd_geothermal_foundry_desc: "Zawiesina geotermalna jest pełna rzadkich i cennych zasobów. Odpowiednia filtracja pozwala zwiększyć produkcję naszych odlewni."
 zone_pd_geothermal_lab: "Geotermalny wydział inżynieryjny"
 zone_pd_geothermal_lab_desc: "Silna aktywność geotermalna i ekstremalne różnice temperatur zmuszają inżynierów do stosowania unikalnych rozwiązań wobec typowych problemów inżynieryjnych."
