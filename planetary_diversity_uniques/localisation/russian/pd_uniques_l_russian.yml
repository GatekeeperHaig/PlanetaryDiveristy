 #Events
 pdbonefield.10.name: "Кольцо из тел"
 pdbonefield.10.desc: "The §Y[Root.GetName]§! has arrived in §Y[Root.GetStarName]§!, where an abnormal concentration of Tiyanki herds drifts between the gas giants, feeding on their rich gases.\n\nThere is a debris ring on our charts made of countless dead Tiyanki. The oldest are little more than ribs and frozen skin, and the bodies are thickest around a habitable moon of the second gas giant. Something draws them here to die, and a closer scan of that moon may tell us what."
 pdbonefield.10.a: "Давайте взглянем поближе."
 pdbonefield.20.name: "Кладбище тиянки"
 pdbonefield.20.desc.shared: "Tiyanki carcasses cover this moon in every stage of decay, from recent falls to bones the forest has grown over.\n\nOver the ages, their bodies have laced the ground with exotic nutrients. A colony here would let us study the remains up close."
 pdbonefield.20.desc: "$pdbonefield.20.desc.shared$"
 pdbonefield.20.desc.ort: "$pdbonefield.20.desc.shared$\n\nUnlike the dead at Tiyun Ort, these break down and feed the soil."
 pdbonefield.20.a: "So this is where the herds end up."
 pdbonefield.30.name: "Первое нисхождение"
 pdbonefield.30.desc: "A Bull Tiyanki came down eleven kilometers from our main settlement on §Y[Root.GetName]§! last night. It was old, and already dying when it entered the atmosphere.\n\nThe impact left a crater. The land will take time to heal, but the carcass will nourish the ground for generations. More will follow, and as our colony grows, it is only a matter of time before one hits a city."
 pdbonefield.30.a: "Мы должны не потерять ни одного поселения из-за подобной катастрофы."
 pdbonefield.120.name: "The Descent Line"
 pdbonefield.120.desc: "We can now control where a dying Tiyanki comes down on §Y[Root.Target.GetName]§!. A signal could guide one onto ground of our choosing. A gravitic barrier could stop it short of the atmosphere altogether. Either system would take the colony out of harm's way.\n\nGuided descents would keep fresh carcasses coming, but the land set aside for them would be closed to construction. A barrier would open the whole surface to settlement. Without new falls, though, the exotic nutrients in the soil would no longer be replenished.\n\nConstruction will take years, and we can retune the system later if we change our minds."
 pdbonefield.120.a: "Направляйте их к открытым пространствам."
 pdbonefield.130.name: "End of the Line"
 pdbonefield.130.desc.control: "The signal towers on §Y[Root.Target.GetName]§! are finished, ringing the land set aside for the descents.

When the next dying Tiyanki falls, it will land where we have chosen, and rendering crews will be waiting."
 pdbonefield.130.desc.stop: "The barrier over §Y[Root.Target.GetName]§! is complete. No dying Tiyanki will make the approach again, and construction can go wherever our colony needs it."
 pdbonefield.130.a: "Send the crews to their posts."
 pdbonefield.130.b: "The whole world is open to our builders."

