l_russian:

#Flooded/Aquatic Planets
 decision_pd_aw_flood_planet: "Расширить планетарное море"
 decision_pd_aw_flood_planet_desc: "Этот океанический мир прекрасен, но он может стать для нас идеальным. Углубив океаны и переместив города под воду, мы сможем расширить пригодные для жизни области."
 decision_pd_aw_flood_planet_tooltip: "Лёд будет добыт в системе со станцией §Y$sm_ice_mining_station$§!\nДобавляется модификатор §Y$pd_aw_flooded_planet$§!:\n$pd_aw_flooded_planet_tooltip$"
 flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YПригодность для неводных видов§!: §R-20%§!"
 decision_pd_aw_unflood_planet: "Осушить планету"
 decision_pd_aw_unflood_planet_desc: "Этот океанический мир прекрасен, но он может стать для нас идеальным. Снизив уровень моря и переместив города на острова, мы сможем расширить пригодные для жизни области."
 decision_pd_aw_flood_ringworld: "Затопить мир-кольцо"
 decision_pd_aw_flood_ringworld_desc: "Этот мир-кольцо прекрасен, но он может стать для нас идеальным. Углубив моря и переместив города под воду, мы сможем расширить пригодные для жизни области."
 decision_pd_aw_unflood_ringworld: "Осушить мир-кольцо"
 decision_pd_aw_unflood_ringworld_desc: "Этот мир-кольцо прекрасен, но он может стать для нас идеальным. Снизив уровень моря и переместив города на сушу, мы сможем расширить пригодные для жизни области."
 decision_pd_aw_unflood_habitat: "Осушить орбитальное поселение"
 decision_pd_aw_unflood_habitat_desc: "Это орбитальное поселение прекрасно, но может стать для нас идеальным. Если мы его осушим, оно прекрасно подойдёт для сухопутных видов."
 decision_pd_aw_flood_habitat_tooltip: "Пригодность: §R-20%§!\nСоответствует §Yокеаническому§! миру для §Yаквоидов§!.\nЛёд будет добываться в системе, космическая база которой обладает модулем §Y$sm_ice_mining_station$§!."
 ap_hydrocentric_tooltip "Allows the construction of §YIce Mining Stations§! on starbases, which enable the following decisions:\n    - §Y$decision_pd_aw_flood_planet$§!: §Y$pc_ocean$§!, §Y$pc_gaia$§!, §Y$pc_hive$§!, §Y$pc_machine$§!, §Y$pc_relic$§!, §Y$pc_city$§!\n    - §Y$decision_flood_habitat$§!: §Y$pc_habitat$§!\n    - §Y$decision_pd_aw_flood_ringworld$§!: §Y$pc_ringworld_habitable$§!\n§RNo other planet class can be flooded.§!\nSpecies with the §Y$trait_aquatic$§! or §Y$trait_robot_aquatic$§! trait gain 50% greater benefits for living on §YOcean§! worlds, but penalties for living on non-§YWet§! worlds are likewise amplified."

 flooded_habitat: "Затопленное орбитальное поселение"
 flooded_habitat_desc: "Залитое водой, это орбитальное поселение идеально подходит для аквоидов."
 pd_aw_flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YПригодность для неводных видов§!: §R-20%§!\n$MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$: §G-10%§!"

 pd_aw_flooded_planet: "Затопленный мир"
 pd_aw_flooded_planet_desc: "Эта океаническая планета идеально подходит для аквоидов или прочих приспособленных для жизни под водой."
 pd_aw_flooded_habitat: "Затопленное орбитальное поселение"
 pd_aw_flooded_habitat_desc: "Залитое водой, это орбитальное поселение идеально подходит для аквоидов."

 ICE_MINING_PLANET_SUCCESS_TITLE: "Затопление планеты завершено"
 ICE_MINING_PLANET_SUCCESS_DESC: "Благодаря добыче льда в системе $SYSTEM|Y$, нам удалось затопить поверхность §Y[This.GetName]§!."

 ocean_paradise_2: "$ocean_paradise$"
 ocean_paradise_2_desc: "$ocean_paradise_desc$"
 ocean_paradise_hive_2: "$ocean_paradise_hive$"
 ocean_paradise_hive_2_desc: "$ocean_paradise_hive_desc$"

 #Pelagic Planet
 pd_pelagic_planet: "Панталассический мир"
 pd_pelagic_planet_desc: "Эта планета целиком покрыта глобальным океаном, и на его поверхность не пробивается ни единого кусочка земли."