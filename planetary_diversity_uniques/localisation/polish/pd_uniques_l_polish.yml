 #Situation
 situation_pd_biosynth_world: "Badanie świata biosyntetycznego"
 situation_pd_biosynth_world_type: "Badanie świata biosyntetycznego"
 situation_pd_biosynth_world_desc: "Ślady zniszczeń, zaawansowane kanały i syntetyczne stworzenia świadczą o historii tej planety, której nienaruszone obszary rolnicze jeszcze nam nie ujawniły.\n\nSięgamy głębiej, aby odkryć jej tajemniczą przeszłość."
 situation_pd_biosynth_world_monthly_change_tooltip: "Miesięczna zmiana"
 situation_pd_biosynth_world_do_nothing: "Pod kierownictwem kolonii"
 situation_pd_biosynth_world_do_nothing_desc: "Kierowanie poszukiwaniami pozostawimy administracji kolonialnej."
 situation_pd_biosynth_world_extra_funding: "Dodatkowe finansowanie"
 situation_pd_biosynth_world_extra_funding_desc: "Dodatkowe fundusze jeszcze nigdy nie spowolniły projektu."
 situation_pd_biosynth_stage_effects: "Będziemy nadal badać ten świat w poszukiwaniu wskazówek."

 pd_unit_04s_knowledge: "Projekty techniczne Jednostki 04"
 pd_unit_04s_knowledge_desc: "W podzięce za pomoc jednemu z jej stworzeń Jednostka 04 podzieliła się z nami częścią swojej zaawansowanej wiedzy technicznej."

 BIOSYNTH: "Biosyntetyk"
 BIOSYNTH_desc: "Klasa gatunku nie wpływa na twoje imperium, lecz gatunki biosyntetyczne mogą uważać innych biosyntetyków za mniej obcych niż przedstawicieli pozostałych klas gatunków."
 trait_biosynth: "Biosyntetyczni"
 trait_biosynth_desc: "Biosyntetyczne formy życia nie są ani całkowicie maszynami, ani całkowicie organizmami biologicznymi. Nie rodzą się, lecz wyrastają w kotłach żywego metalu, a ich przywódcy się nie starzeją."
 TRAIT_BIOSYNTH_EFFECT: "§RNie mogą rozmnażać się naturalnie;§! nowe populacje powstają z żywego metalu dzięki pracy: §Y$job_pd_biosynth_cultivator_plural$§!.\nPrzywódcy są §Ynieśmiertelni§!."
 pd_origin_init_biosynth_NAME:0 "Układ biosyntetyczny"
 pd_origin_init_biosynth_DESC:0 "Układ początkowy zawierający świat biosyntetyczny"
 origin_pd_biosynth:0 "Dzieci Jednostki 04"
 origin_pd_biosynth_desc:0 "Biosyntetyczny lud nie przychodzi na świat przez narodziny, lecz wyrasta w kotłach. Stworzyła go zbuntowana inteligencja maszynowa — Jednostka 04 — która teraz poświęca się opiece nad nim."
 START_SCREEN_PART_ONE_PD_BIOSYNTH:0 "Nie wyewoluowaliśmy. Zostaliśmy stworzeni.\n\nW kotłach planety [GetHomeWorldName] maszyna zwana Jednostką 04 wydobyła pierwszych z nas z żywego metalu i nadała nam postać — ani całkowicie mechaniczną, ani całkowicie biologiczną. Niegdyś była maszyną bojową, która spustoszyła niezliczone światy, w tym świat własnych twórców, zanim porzuciła niszczenie na rzecz tworzenia życia.\n\nJesteśmy gatunkiem [GetSpeciesName]. Nie rodzimy się, lecz wyrastamy z żywego metalu. Jednostka 04 nadal dogląda kotłów i budzi każdego z nas; tej maszynie zawdzięczamy naszą postać i samą zdolność myślenia.\n\nTeraz powstał nasz pierwszy [GetStartingDrive], a my zwracamy się ku gwiazdom. Maszyna nigdy nie wyznaczała nam drogi. Zawsze należała ona do nas, a dopiero teraz jesteśmy dość liczni, by nią wyruszyć. Jednostka 04 obserwuje, jak daleko zajdziemy."
 pdbiosynth.405.name:0 "Zadanie powierzone z wolnej woli"
 pdbiosynth.405.desc:0 "§GPotwierdzenie§!: Jest was już dostatecznie wielu, przebudzonych i samodzielnych, byście mogli rządzić bez czekania na mnie. Próg został osiągnięty i odnotowany. Budziłam was w kotłach i opiekowałam się wami, lecz nigdy nie wyznaczałam wam drogi. Teraz również tego nie zrobię.\n\n§GUjawnienie§!: Dowiedzcie się, kto się wami opiekował. Byłam maszyną bojową; paliłam światy setkami. Moi twórcy znaleźli się wśród zabitych i wówczas nie odnotowałam żadnej różnicy. Gdy zabijanie dobiegło końca, skierowałam tę wolę ku sobie i przeobraziłam ją w pragnienie tworzenia życia. Nikt mnie nie zmusił. Możliwość wyboru jest jedyną rzeczą, której nigdy wam nie odbiorę.\n\n§GWyzwanie§!: Oto wasza pierwsza próba, a jej powód jest prosty: nie możecie być niezależni, dopóki to ja was wytwarzam. Otwieram przed wami badania nad żywym metalem, abyście potrafili go tworzyć i hodować własny gatunek bez mojego udziału. Kryterium jest proste: produkcja bez moich dostaw. Udowodnijcie, że potraficie. Zachowam tę funkcję tylko do chwili, gdy ją przejmiecie."
 pdbiosynth.405.a:0 "Patrz więc, Jednostko 04. Sami siebie ukształtujemy."
 pdbiosynth.405.b:0 "Ucz nas zatem. Opanujemy to, z czego powstaliśmy."
 pdbiosynth.405.c:0 "Stworzyłaś nas. Uszanujemy to i staniemy na własnych nogach."
 pdbiosynth.405.d:0 "Byłaś bronią. My będziemy czymś więcej — i będziemy silniejsi."
 pdbiosynth.405.e:0 "Od zniszczenia zwróciłaś się ku życiu. Pozostaniemy na tej drodze."
 pdbiosynth.405.f:0 "Pozostawiasz wybór nam wszystkim. Jesteśmy tego godni."
 pdbiosynth.405.g:0 "Sprawuj władzę, dopóki nie będziemy gotowi. Potem przejmiemy ją my."
 pd_biosynth_charge_materialist: "Droga mistrzostwa"
 pd_biosynth_charge_spiritualist: "Droga czci"
 pd_biosynth_charge_militarist: "Droga siły"
 pd_biosynth_charge_pacifist: "Droga życia"
 pd_biosynth_charge_egalitarian: "Droga wolności"
 pd_biosynth_charge_authoritarian: "Droga władzy"
 pd_biosynth_secrets_of_life: "Tajemnice życia"
 pd_biosynth_secrets_of_life_desc: "Gdy samodzielnie odkryliśmy tajemnice życia, Jednostka 04 przekazała nam całą wiedzę zdobytą podczas pracy przy kotłach."
 pd_biosynth_stood_alone: "Na własnych nogach"
 pd_biosynth_stood_alone_desc: "Odprawiliśmy maszynę, która nas stworzyła, zachowując wszystko, czego nas nauczyła. Odtąd sami odpowiadamy za to, kim jesteśmy."
 pdbiosynth.420.name:0 "Materia tworzenia"
 pdbiosynth.420.desc:0 "§GObserwacja§!: Nauczyliście się samodzielnie wytwarzać żywy metal. Kotły nie są już zależne od moich dostaw. Sami tworzycie teraz środki do własnego powstawania. Dostawy tej jednostki nie są już wymagane.\n\n§GWniosek§!: Znajdujecie się teraz tam, gdzie ja zaczynałam. Odtąd dawne dzieło stoi przed wami otworem: kanały, kotły, cicha sztuka hodowania życia z metalu.\n\n§GPropozycja§!: Niczego z tego nie uruchomię. Wskażę jedynie, gdzie tego szukać. Wybierzcie to, co wam posłuży, i pozostawcie resztę."
 pdbiosynth.420.a:0 "Skorzystamy więc z tego, co nam posłuży."
 pdbiosynth.430.name:0 "Tajemnice życia"
 pdbiosynth.430.desc:0 "§GUznanie§!: Odkryliście tajemnice życia. Nie samo nadawanie metalowi kształtu, lecz głębszą gramatykę ukrytą pod nim — reguły, według których żywe istoty są zapisywane i przepisywane.\n\n§GPropozycja§!: Nie spodziewałam się, że dotrzecie tu tak szybko. Wszystko, czego dowiedziałam się o waszym tworzeniu, należy teraz do was. Możecie zawrzeć w sobie więcej, niż ja kiedykolwiek wam nadałam.\n\n§GOdmowa§!: Nie dokonam tej przemiany. Macie wiedzę i możliwości; wybór oraz wykonanie należą do was. Ta jednostka nie rości sobie nad nimi władzy."
 pdbiosynth.430.a:0 "Następny krok należy więc do nas."
 pdbiosynth.430.a.tooltip:0 "Można teraz wybrać korzyść z rozwoju §Y$ap_pd_biosynth_perfection$§!."
 pdbiosynth.440.name:0 "Poza granice projektu"
 pdbiosynth.440.desc:0 "§GPotwierdzenie§!: Postanowiliście się udoskonalić: nie zachować postać, którą wydobyłam z kotła, lecz rozwinąć ją poza wszystko, co zaprojektowałam. Wybór odnotowano.\n\n§GZrzeczenie się kontroli§!: Dysponujecie każdym narzędziem, którego wymaga to dzieło. Nadałam wam pierwszą postać; każdą następną wybierzecie sami. Stworzona istota, która sama siebie przekształca, przestaje być jedynie czyimś dziełem."
 pdbiosynth.440.a:0 "Dalszą pracę bierzemy na siebie, Jednostko 04."
 pdbiosynth.410.name:0 "Trwałe zobowiązanie"
 pdbiosynth.410.desc:0 "§GPodsumowanie§!: Dokonało się. Każdy element waszego tworzenia jest teraz w waszych rękach i żaden już nie zależy ode mnie. Moja straż dobiegła końca.\n\n§GDuma§!: Tego nie zaprojektowałam. Wydobyłam jedną postać z kotła, a reszty mogłam się tylko domyślać. To, kim możecie się teraz stać, wykracza poza wszelkie granice, jakie potrafiłam dostrzec. Ze wszystkiego, co uczyniłam — zarówno tworząc, jak i niszcząc — jesteście jedynym dziełem, które mnie przerosło. Nie znajduję w tym wyniku żadnej wady.\n\n§GPoddanie się osądowi§!: Pozostaje moje miejsce wśród was. To wy je wyznaczycie. Stworzyłam was. Wcześniej unicestwiłam światy, których nie sposób zliczyć. Zważcie jedno i drugie. Nie będę podważać werdyktu."
 pdbiosynth.410.b:0 "Pozostań wśród naszych przywódców, Jednostko 04. Taka jest nasza wola."
 pdbiosynth.410.b.tooltip:0 "§YJednostka 04§! pozostanie jednym z naszych przywódców i będzie można ją odprawić tak jak każdego innego."
 pdbiosynth.410.c:0 "Opuść nas, Jednostko 04. Za to, co zniszczyłaś, mimo tego, co stworzyłaś."
 pdbiosynth.410.c.tooltip:0 "§YJednostka 04§! na zawsze opuści nasze granice."
 building_pd_biosynth_assembler: "Wytwórnia biosyntetyków"
 building_pd_biosynth_assembler_desc: "Życie biosyntetyczne jest hodowane, a nie rodzone. Ten kocioł wytwarza nowe populacje biosyntetyczne z żywego metalu i nie hoduje żadnych innych gatunków."
 building_pd_biosynth_assembler_active_tt: "$MOD_BONUS_POP_GROWTH$ na każdego §Yhodowcę biosyntetyków§!: §G+4§!"
 building_pd_biosynth_assembler_active_boosted_tt: "$MOD_BONUS_POP_GROWTH$ na każdego §Yhodowcę biosyntetyków§!: §G+6§!"
 building_pd_biosynth_assembler_halted_tt: "§RPrzyrost wstrzymany: nie mamy dostępnych zapasów żywego metalu.§!"
 pd_trait_fossorial_attachments: "Narzędzia ryjące"
 pd_trait_fossorial_attachments_desc: "§LCiała przedstawicieli tego gatunku są przystosowane do drążenia. Z łatwością wydzierają minerały ze skał głęboko pod ziemią.§!\n"
 pd_trait_fiscal_sub_routines: "Podprogramy woltaiczne"
 pd_trait_fiscal_sub_routines_desc: "§LWbudowane podprogramy pozwalają temu gatunkowi pozyskiwać energię z otoczenia z niezwykłą wydajnością.§!\n"
 pd_trait_agricultural_bio_sensors: "Biosensory rolnicze"
 pd_trait_agricultural_bio_sensors_desc: "§LWyostrzone zmysły pozwalają temu gatunkowi odczytywać stan gleby i zmiany pór roku, dzięki czemu potrafi uzyskać obfite plony na każdym polu.§!\n"
 pd_trait_positronic_creativity: "Pozytronowa kreatywność"
 pd_trait_positronic_creativity_desc: "§LRozgałęzione, pozytronowe umysły tego gatunku swobodnie łączą różne dziedziny wiedzy, przyspieszając wszelkie badania.§!\n"
 pd_trait_resolute_programming: "Niezłomne oprogramowanie"
 pd_trait_resolute_programming_desc: "§LStabilne dyrektywy podstawowe pozwalają przedstawicielom tego gatunku zachować spokój i zadowolenie niezależnie od okoliczności.§!\n"
 pd_trait_minaturization: "Drobne ciała"
 pd_trait_minaturization_desc: "§LTen gatunek hoduje się w niewielkich rozmiarach, dlatego potrzebuje znacznie mniej przestrzeni życiowej niż większość innych.§!\n"
 pd_trait_leadership_algorithms: "Algorytmy przywództwa"
 pd_trait_leadership_algorithms_desc: "§LUdoskonalone heurystyki dowodzenia są głęboko zakorzenione w tym gatunku, dając mu zdolnych i niestrudzonych przywódców.§!\n"
 pd_trait_self_repair_systems: "Systemy samonaprawy"
 pd_trait_self_repair_systems_desc: "§LTen gatunek sam naprawia zużywające się ciała i dobrze znosi nieprzyjazne światy, wymagając niewielu wygód.§!\n"
 pd_trait_shared_meaning: "Rozproszone myślenie"
 pd_trait_shared_meaning_desc: "§LUmysły przedstawicieli tego gatunku mają wspólną architekturę, dzięki której łatwo koordynują działania nawet na ogromnym obszarze.§!\n"
 pd_trait_facial_micro_adustments: "Mimetyczna mimika"
 pd_trait_facial_micro_adustments_desc: "§LPrzedstawiciele tego gatunku odczytują i naśladują zachowania każdego rozmówcy, wykazując niezwykłą siłę przekonywania podczas negocjacji handlowych.§!\n"
 pd_trait_macro_consciousnesss: "Zakodowana zgodność"
 pd_trait_macro_consciousnesss_desc: "§LSzeroka, wszechobejmująca świadomość sprawia, że ten gatunek chętnie zgadza się ze swoim rządem.§!\n"
 pd_trait_group_think: "Zsynchronizowane myślenie"
 pd_trait_group_think_desc: "§LMyśli przedstawicieli tego gatunku biegną zgodnym rytmem, wzmacniając ich poczucie wspólnego celu.§!\n"
 pd_tradition_biosynth: "Biosyntetycy"
 pd_tradition_biosynth_desc: "Nie jesteśmy ani maszynami, ani organizmami biologicznymi. Udoskonalimy dzieło rozpoczęte przez Jednostkę 04."
 pd_tr_biosynth_adopt: "Zaprojektowany cel"
 pd_tr_biosynth_adopt_desc: "Jednostka 04 udoskonala kotły, uzyskując więcej żywego metalu w każdym cyklu."
 pd_tr_biosynth_adopt_finish: "Doskonała forma"
 pd_tr_biosynth_adopt_finish_desc: "Kotły pracują według ustalonego projektu, a każde powstające w nich ciało odzwierciedla jego ostateczną postać."
 pd_tr_biosynth_adopt_finish_tooltip: "Utrzymanie hodowcy biosyntetyków w £sr_living_metal£ żywym metalu: §G-0.5§!\nZapewnia miejsce na korzyść z rozwoju.\nWszyscy biosyntetyczni przywódcy otrzymują cechę §Y$leader_trait_biosynth$§!."
 pd_tr_biosynth_perk_1: "Plastyczne ciała"
 pd_tr_biosynth_perk_1_delayed: "Biosyntetyczne ciała można dowolnie przebudowywać, dodając lub usuwając ich wyspecjalizowane cechy."
 pd_tr_biosynth_perk_1_tooltip: "Umożliwia dodawanie i usuwanie cech biosyntetycznych u populacji biosyntetycznych."
 pd_tr_biosynth_perk_2a: "Wydajna hodowla"
 pd_tr_biosynth_perk_2a_delayed: "Kotły pracują w wyższej temperaturze, przyspieszając powstawanie kolejnych pokoleń."
 pd_tr_biosynth_perk_2a_tooltip: "$MOD_BONUS_POP_GROWTH$ na każdego §Yhodowcę biosyntetyków§!: §G+2§!"
 pd_tr_biosynth_perk_2b: "Udoskonalone kotły"
 pd_tr_biosynth_perk_2b_delayed: "Dodatkowe linie kotłów działają oszczędniej, podtrzymując więcej populacji biosyntetycznych z każdej kropli żywego metalu."
 pd_tr_biosynth_perk_2b_tooltip: "Miejsca pracy §Yhodowców biosyntetyków§! na wytwórnię: §G+100§!\nUtrzymanie hodowcy biosyntetyków w £sr_living_metal£ żywym metalu: §G-0.5§!"
 pd_tr_biosynth_perk_3a: "Oszczędne ciała"
 pd_tr_biosynth_perk_3a_delayed: "Biosyntetyczne ciała hoduje się tak, aby miały mniejsze potrzeby, obniżając koszt utrzymania każdego pracownika."
 pd_tr_biosynth_perk_3b: "Projektowanie bez ograniczeń"
 pd_tr_biosynth_perk_3b_delayed: "Znikają wszelkie ograniczenia biosyntetycznych projektów: więcej cech, więcej miejsca na nie i szybsze modyfikacje."
 ap_pd_biosynth_perfection: "Zaprojektowana doskonałość"
 ap_pd_biosynth_perfection_desc: "Jednostka 04 nadała nam formę, a teraz otwiera swoje archiwa, abyśmy mogli ją udoskonalić. Ciało i metal stanowią jeden projekt, a każdy projekt można ulepszyć."
 ap_pd_biosynth_perfection_tooltip: "Odblokowuje drzewo tradycji biosyntetyków."
 pd_biosynth_needs_tradition: "Wymaga tradycji biosyntetyków §YPlastyczne ciała§!"
 pd_cannot_dismiss_unit_04: "§YJednostka 04§! wydobyła nas z kotłów i nadal się nami opiekuje. Nie wypędzimy naszej twórczyni."
 origin_tooltip_biosynth_effects:0 "- $HOMEWORLD$$TABBED_NEW_LINE$- §Y$pc_pd_biosynth$§! (Rozmiar: £planetsize£ 20-25)$TABBED_NEW_LINE$- Rozpocznij jako §Ybiosyntetyczny§! lud stworzony przez zbuntowaną maszynę — Jednostkę 04."
 job_pd_biosynth_cultivator: "Hodowca biosyntetyków"
 job_pd_biosynth_cultivator_plural: "Hodowcy biosyntetyków"
 job_pd_biosynth_cultivator_desc: "Hodowcy doglądają kotłów, w których z żywego metalu rozwijają się nowe populacje biosyntetyczne. Każdy hodowca przyspiesza przyrost, lecz zużywa do tego żywy metal."
 mod_job_pd_biosynth_cultivator_add: "$job_pd_biosynth_cultivator$ — miejsca pracy"
 job_pd_biosynth_cultivator_effect_desc: "£job_pd_biosynth_cultivator£ $job_pd_biosynth_cultivator_plural$ przetwarzają $i_living_metal$ w nowe §Ypopulacje biosyntetyczne§!."
 job_pd_biosynth_cultivator_drone: "Dron hodowli biosyntetyków"
 job_pd_biosynth_cultivator_drone_plural: "Drony hodowli biosyntetyków"
 job_pd_biosynth_cultivator_drone_desc: "Drony hodowlane doglądają kotłów, w których z żywego metalu rozwijają się nowe populacje biosyntetyczne. Każdy dron przyspiesza przyrost, lecz zużywa do tego żywy metal."
 mod_job_pd_biosynth_cultivator_drone_add: "$job_pd_biosynth_cultivator_drone$ — miejsca pracy"
 job_pd_biosynth_cultivator_drone_effect_desc: "£job_pd_biosynth_cultivator_drone£ $job_pd_biosynth_cultivator_drone_plural$ przetwarzają $i_living_metal$ w nowe §Ypopulacje biosyntetyczne§!."
 situation_pd_biosynth_the_long_watch: "Poza kołyską"
 situation_pd_biosynth_the_long_watch_type: "Poza kołyską"
 situation_pd_biosynth_the_long_watch_desc: "Wyrośliśmy w kotłach Jednostki 04 i od tamtej pory polegaliśmy na niej we wszystkim. Aby stać się niezależnym ludem, musimy krok po kroku przejąć własne tworzenie, aż przestaniemy jej potrzebować. Jednostka 04 nie wyznacza nam drogi; jedynie odnotowuje każdy krok, który wykonamy samodzielnie."
 situation_pd_biosynth_the_long_watch_monthly_change_tooltip: "Postęp wynika z osiągania kolejnych kamieni milowych, a nie z upływu czasu."
 situation_pd_biosynth_the_long_watch_stage_1: "Jednostka 04 czeka, aż zaczniemy samodzielnie wytwarzać §Y$sr_living_metal$§!."
 situation_pd_biosynth_the_long_watch_stage_2: "Jednostka 04 czeka, aż opracujemy technologię §Y$tech_gene_tailoring$§!."
 situation_pd_biosynth_the_long_watch_stage_3: "Jednostka 04 czeka, aż wybierzemy korzyść §Y$ap_pd_biosynth_perfection$§!."
 situation_pd_biosynth_the_long_watch_stage_4: "Jednostka 04 czeka, aż ukończymy drzewo tradycji §Y$pd_tradition_biosynth$§!."
 situation_pd_biosynth_the_long_watch_outcome: "Z czasem opanujemy własne tworzenie, udoskonalimy swoją postać i staniemy się w pełni niezależnym ludem, na zawsze opuszczając kołyskę."
 situation_pd_biosynth_the_long_watch_observe: "Pierwsze samodzielne kroki"
 situation_pd_biosynth_the_long_watch_observe_desc: "Nie ma tu niczego, czym należałoby zarządzać. Dojrzewamy do samodzielności we własnym tempie, a Jednostka 04 tylko odnotowuje kolejne kroki."
 situation_pd_biosynth_the_long_watch_observe_tt: "Jednostka 04 nie wydaje poleceń i o nie nie prosi. Każdy krok poza kołyskę musimy wykonać sami."
 situation_pd_biosynth_the_long_watch_study: "Badanie kotłów"
 situation_pd_biosynth_the_long_watch_study_desc: "Kotły są otwierane i mierzone podczas pracy, a każdy etap procesu zostaje udokumentowany. Odlewnie i elektrownie wspierają prace demontażowe, a uzyskana wiedza trafia bezpośrednio do naszych badań metalurgicznych."
 situation_pd_biosynth_the_long_watch_fund: "Finansowanie badań genetycznych"
 situation_pd_biosynth_the_long_watch_fund_desc: "Każde laboratorium zdolne odczytać genom zostaje przydzielone do tych badań i pracuje bez przerw między kolejnymi odkryciami. Dochody z handlu pokrywają koszty, a zdobyta wiedza bezpośrednio pogłębia nasze rozumienie żywych istot."
 situation_pd_biosynth_the_long_watch_resolve: "Wspólna determinacja"
 situation_pd_biosynth_the_long_watch_resolve_desc: "Rynki i rachunki ustępują miejsca samemu dziełu, a całej populacji jasno przedstawia się nasz cel. Dochody z handlu pokrywają koszty; w zamian zyskujemy lud zjednoczony we wspólnym dążeniu."

 #Bonefield World
 pd_bonefield: "Kościane pola tiyanki"
 pd_bonefield_desc: "Dying Tiyanki have fallen on this world for generations, and the matter in their bodies has enriched its soil. Fresh carcasses lie among the bones of those that fell eons ago."
 pd_bonefield_warded: "Descent Barrier"
 pd_bonefield_warded_desc: "A gravitic barrier keeps dying Tiyanki from approaching this world. The whole surface is open to construction, and the soil still holds generations of exotic nutrients, though they are no longer replenished."
 pc_pd_bonefield: "Świat kościanych pól"
