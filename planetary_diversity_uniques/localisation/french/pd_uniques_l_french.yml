 trait_unit_04_children_tt: "$r_living_metal$ Entretien : §R+0.01§!"

 #Technology
 tech_biosynth_canals: "Canaux Biosynthétiques"
 tech_biosynth_canals_desc: "En étudiant le système de canaux présent sur le Monde Biosynthétique, nous pourrons peut-être en reproduire de plus petites versions sur d'autres planètes pour améliorer la production agricole."
 tech_biosynth_canals_tt_desc: "§HDéverrouille Décision :§! $decision_pd_add_biosynth_canal_system$"
 tech_biosynth_cauldron: "Chaudrons Biosynthétiques"
 tech_biosynth_cauldron_desc: "Inspirés des usines souterraines du Monde Biosynthétique, nous devrions être capables de créer des usines adaptables construites avec du métal vivant pour améliorer considérablement la production industrielle."
 tech_biosynth_edicts: "Utilisation du Métal Vivant"
 tech_biosynth_edicts_desc: "Grâce aux exemples complexes fournis par les lignes de production du Chaudron souterrain de l'Unité 04, nous avons découvert plusieurs applications nouvelles pour le Métal Vivant."
 tech_biosynth_edicts_tooltip: "§HDéverrouille :§! Édits de Métal Vivant"
 tech_biosynth_trait: "Système Robotique Biosynthétique"
 tech_biosynth_trait_desc: "En intégrant les principes de conception de l'Unité 04, nous pouvons améliorer notre population robotique avec des systèmes biosynthétiques, améliorant significativement la vitesse d'assemblage et la production."
 tech_biosynth_trait_tt_desc: "§HDéverrouille Trait :§! $trait_unit_04_children$"

 #Decisions
 decision_pd_add_biosynth_canal_system: "Construire un Système de Canaux Biosynthétique"
 decision_pd_add_biosynth_canal_system_desc: "Basés sur ceux du Monde Biosynthétique, nous pouvons construire des canaux pour améliorer la production agricole de cette planète."

 #Buildings
 building_pd_biosynth_cauldron: "Chaudron Biosynthétique"
