 building_pd_ammonia_fixation_institute: "Instytut syntezy amoniaku"
 building_pd_ammonia_fixation_institute_desc: "Bogate w azot środowisko chemiczne tej planety dostarcza naszym biologom i inżynierom mnóstwa nowych reakcji do badania i doskonalenia."
 building_pd_ammonia_pharma_works: "Amoniakalne zakłady farmaceutyczne"
 building_pd_ammonia_pharma_works_desc: "Obficie występujący tu amoniak można łatwo przetwarzać na leki i środki czyszczące, które trafiają na rynki całego imperium."
 building_pd_ammonia_biome_reserve: "Rezerwat biomu amoniakalnego"
 building_pd_ammonia_biome_reserve_desc: "Osobliwy ekosystem tego świata, oparty na chemii niskich temperatur, przyciąga ciekawych go przybyszów z całej galaktyki."
 building_pd_methane_tholin_lab: "Laboratorium chemii metanu"
 building_pd_methane_tholin_lab_desc: "W gęstej organicznej mgle tego świata zachodzi wiele egzotycznych reakcji chemicznych w niskich temperaturach, czekających na odkrycie przez naszych badaczy."
 building_pd_methane_hydrocarbon_foundry: "Odlewnia z krakingiem metanu"
 building_pd_methane_hydrocarbon_foundry_desc: "Nieprzebrane zasoby węglowodorów poddaje się tu krakingowi i przetwarza na stopy, a tanie miejscowe paliwo zapewnia nieprzerwaną pracę naszych odlewni."
 building_pd_methane_polymer_plant: "Zakład polimerów z metanu"
 building_pd_methane_polymer_plant_desc: "Morza metanu zapewniają niemal nieograniczone zasoby surowca do produkcji tworzyw sztucznych i innych wyrobów gotowych."
 building_pd_nitrogen_supercomputer: "Azotowy kompleks superkomputerowy"
 building_pd_nitrogen_supercomputer_desc: "Naturalne, głębokie zimno pozwala naszym nadprzewodzącym komputerom pracować z szybkością, która stopiłaby maszyny na każdym cieplejszym świecie."
 building_pd_nitrogen_munitions_foundry: "Azotowa odlewnia amunicji"
 building_pd_nitrogen_munitions_foundry_desc: "Bogate warstwy azotanów tego świata można łatwo przetwarzać na materiały wybuchowe i stopy na potrzeby naszych armii."
 building_pd_nitrogen_cryonics_sanctuary: "Azotowe sanktuarium krioniczne"
 building_pd_nitrogen_cryonics_sanctuary_desc: "Zimno, które doskonale chroni przed rozkładem, czyni ten świat idealnym sanktuarium, przyciągającym klientów i turystów z całej galaktyki."
