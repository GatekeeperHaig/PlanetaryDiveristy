l_french:

#Flooded/Aquatic Planets
 decision_pd_aw_flood_planet: "Expand Planetary Sea"
 decision_pd_aw_flood_planet_desc: "This oceanic planet has the potential to be an ideal home for our people. By adjusting sea levels and moving cities underwater, we can ensure that life flourishes for those adapted to live beneath the waves."
 decision_pd_aw_flood_planet_tooltip: "De la glace sera récoltée dans un système doté d'une §Y$sm_ice_mining_station$§!\nLe modificateur §Y$pd_aw_flooded_planet$§! est ajouté :\n$pd_aw_flooded_planet_tooltip$"
 flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YHabitabilité non aquatique§!: §R-20%§!"
 decision_pd_aw_unflood_planet: "Unflood Planet"
 decision_pd_aw_unflood_planet_desc: "This oceanic planet has the potential to be an ideal home for our people. By lowering sea levels and moving cities to islands, we can ensure that life flourishes for those adapted to live above the waves."
 decision_pd_aw_flood_ringworld: "Flood Ringworld"
 decision_pd_aw_flood_ringworld_desc: "This ringworld has the potential to be an ideal home for our people. By adjusting sea levels and moving cities underwater, we can ensure that life flourishes for those adapted to live beneath the waves."
 decision_pd_aw_unflood_ringworld: "Unflood Ringworld"
 decision_pd_aw_unflood_ringworld_desc: "This ringworld has the potential to be an ideal home for our people. By lowering sea levels and moving cities back to land, we can ensure that life flourishes for those adapted to live above the waves."
 decision_pd_aw_unflood_habitat: "Unflood Habitat"
 decision_pd_aw_unflood_habitat_desc: "This habitat has the potential to be an ideal home for our people. By draining this habitat, we can ensure that life flourishes for those adapted to live above the waves."
 decision_pd_aw_flood_habitat_tooltip: "Habitability: §R-20%§!\nConsidered an §YOcean§! world for §YAquatic§! species.\nIce will be harvested from a system with an §Y$sm_ice_mining_station$§! on the starbase."
 ap_hydrocentric_tooltip "Permet la construction de §Ystations de minage de glace§! sur les bases stellaires, donnant accès aux décisions suivantes :\n    - §Y$decision_pd_aw_flood_planet$§!: §Y$pc_ocean$§!, §Y$pc_gaia$§!, §Y$pc_hive$§!, §Y$pc_machine$§!, §Y$pc_relic$§!, §Y$pc_city$§!\n    - §Y$decision_flood_habitat$§!: §Y$pc_habitat$§!\n    - §Y$decision_pd_aw_flood_ringworld$§!: §Y$pc_ringworld_habitable$§!\n§RAucune autre classe de planète ne peut être inondée.§!\nLes espèces ayant le trait §Y$trait_aquatic$§! ou §Y$trait_robot_aquatic$§! tirent 50% de bénéfices supplémentaires lorsqu'elles vivent sur les mondes §Yocéaniques§!, mais les pénalités liées aux mondes §Ynon humides§! sont elles aussi majorées."

 flooded_habitat: "Flooded"
 flooded_habitat_desc: "Engulfed by water, this world is an idyllic environment for aquatic denizens."
 pd_aw_flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YHabitabilité non aquatique§!: §R-20%§!\n$MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$: §G-10%§!"

 pd_aw_flooded_planet: "Flooded World"
 pd_aw_flooded_planet_desc: "This oceanic planet is an ideal home for aquatic species. Life flourishes for those adapted to live beneath the waves."
 pd_aw_flooded_habitat: "Flooded Habitat"
 pd_aw_flooded_habitat_desc: "This habitat has been flooded with water, imitating the natural environment of Aquatic creatures."

 ICE_MINING_PLANET_SUCCESS_TITLE: "Planet Flooded"
 ICE_MINING_PLANET_SUCCESS_DESC: "Using ice mined from the $SYSTEM|Y$ system, we have managed to flood §Y[This.GetName]§!."

 ocean_paradise_2: "$ocean_paradise$"
 ocean_paradise_2_desc: "$ocean_paradise_desc$"
 ocean_paradise_hive_2: "$ocean_paradise_hive$"
 ocean_paradise_hive_2_desc: "$ocean_paradise_hive_desc$"

 #Pelagic Planet
 pd_pelagic_planet: "Pelagic"
 pd_pelagic_planet_desc: "This planet is almost entirely enveloped by a global ocean, with almost no landmasses breaching the surface."