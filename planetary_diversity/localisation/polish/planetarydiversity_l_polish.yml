 job_pd_tidally_duskbelt_astrobiologist_plural: "Astrobiolodzy pasa zmierzchu"
 job_pd_tidally_duskbelt_astrobiologist_desc: "Astrobiolodzy pasa zmierzchu badają, jak życie zróżnicowało się między spaloną, zamarzniętą i pogrążoną w półmroku częścią planety, rozwijając badania socjologiczne i fizyczne."
