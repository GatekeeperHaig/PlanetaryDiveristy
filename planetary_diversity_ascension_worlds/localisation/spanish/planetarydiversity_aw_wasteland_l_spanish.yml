 allow_wasteland_worlds: "§YDesbloquea Decisión:§! $decision_pd_aw_wasteland_planet$ en planetas no ideales"
 describe_wasteland_worlds: "§Y$pd_aw_wasteland_planet$§! modificador:\n$t$- $MOD_HABITABILITY_CEIL$: §Y60%§!\n$t$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\n$t$- $mod_planet_jobs_alloys_produces_mult$: §G+100%§!\n$t$- $mod_planet_jobs_consumer_goods_produces_mult$: §G+100%§!\n$t$- $mod_planet_farmers_food_produces_mult$: §R-200%§!"
