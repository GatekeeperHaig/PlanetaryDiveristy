 #Deposits
 d_pd_bonefield_descent_site: "Tiyanki Descent Site"
 d_pd_bonefield_descent_site_desc: "Our signal towers draw a few dying Tiyanki down onto land set aside for them, away from our settlements. Rendering crews work each carcass where it falls."

 #Technologies
 tech_tiyanki_butchery: "Tiyanki Byproduct Processing"
 tech_tiyanki_butchery_desc: "Many parts of a fallen Tiyanki have a use, from its rare glands to its void-hardened hide."
 tech_tiyanki_descent_sites: "Tiyanki Descent Sites"
 tech_tiyanki_descent_sites_desc: "The signal we developed to guide dying Tiyanki could draw a few of them down onto our other worlds."
 tech_tiyanki_observatory: "Tiyanki Observation Sciences"
 tech_tiyanki_observatory_desc: "Our work at the Bonefield has taught us to read the subspace vibrations Tiyanki use to communicate. With that, we can follow the herds along their migrations and study them across their whole range."
 tech_tiyanki_beacon: "Tiyanki Carcass Harvesting"
 tech_tiyanki_beacon_desc: "The carcasses ringing the Bonefield system can be worked in orbit, if a waystation is fitted to process them."

 #Buildings
 building_pd_tiyanki_observatory: "Tiyanki Observatory"
 building_pd_tiyanki_observatory_desc: "A tracking station tuned to the subspace vibrations of Tiyanki herds, letting our biologists follow them across the sector."
 building_pd_tiyanki_observatory_tt: "$mod_planet_jobs_society_research_produces_mult$: §G+2%§! per §Y$building_pd_tiyanki_observatory$§!
(Current Value: §G+[pd_tiyanki_observatory_network]%§!)"

 #Decision
 decision_pd_bonefield_descent_site: "Establish Tiyanki Descent Site"
 decision_pd_bonefield_descent_site_desc: "Using what we learned at the Bonefield, we can draw a small share of the dying herds to this world without disturbing their wider migration. The land set aside for them cannot be built on."
 edict_tiyanki_resonant_planning: "Tiyanki Resonance Planning"
 edict_tiyanki_resonant_planning_desc: "The subspace vibrations Tiyanki use to calm their herds can be built into the layout of our cities to soothe our own population."
 edict_tiyanki_resonant_network: "Tiyanki Resonance Network"
 edict_tiyanki_resonant_network_desc: "Tuning our network to the subspace vibrations Tiyanki use to calm their herds steadies every drone connected to it."
 edict_tiyanki_luxury_goods: "Tiyanki Luxuries"
 edict_tiyanki_luxury_goods_desc: "Rare Tiyanki glands are processed into luxury goods, and traders pay well for them."
 edict_tiyanki_luxury_fuel: "Tiyanki Fuel Rendering"
 edict_tiyanki_luxury_fuel_desc: "Rare Tiyanki glands and tissues are broken down and burned in our generators."
 edict_tiyanki_void_hide: "Tiyanki Hide Plating"
 edict_tiyanki_void_hide_desc: "Processed Tiyanki hide is applied to our hulls as a coating that survives the void and repairs its own damage."
 decision_pd_bonefield_to_warded: "Raise the Descent Barrier"
 decision_pd_bonefield_to_warded_desc: "A gravitic barrier will keep dying Tiyanki from approaching this world. The land set aside for their descents opens to construction, but the exotic nutrients in the soil will no longer be replenished."
 decision_pd_bonefield_to_controlled: "Guide the Descents"
 decision_pd_bonefield_to_controlled_desc: "With the barrier lowered, signal towers will guide each dying Tiyanki onto land set aside for it, away from our settlements. Fresh carcasses will replenish the exotic nutrients in the soil, but that land cannot be built on."

