pc_pd_barren_tidally_locked: "Monde Stérile Tidallement Verrouillé"
pc_pd_barren_tidally_locked_desc: "Monde rocheux et stérile avec une atmosphère mince ou inexistante qui est tidallement verrouillé. La surface est couverte de cratères d'impact de météorites et complètement dépourvue de vie."
pc_pd_nuked_tidally_locked: "Monde Mort Crépusculaire"
pc_pd_nuked_tidally_locked_desc: "Un monde rocheux tidallement verrouillé avec une atmosphère azote-oxygène, cette planète connaît actuellement un hiver nucléaire, avec de denses couches d'aérosols fuligineux dans l'atmosphère. Il y a des signes minimes de vie."

###Cave
pc_pd_cold_cave: "Monde de Caverne Froide"
pc_pd_cold_cave_desc: "Monde rocheux avec une atmosphère azote-oxygène. Avec un magnétosphère faible, une grande partie de la surface de ce monde est constituée de roche stérile. Sous la surface se trouvent une série infinie de cavernes avec une hydrosphère gelée qui soutient les lichens et les mousses."
pc_pd_cold_cave_adj: "caverneux"
mod_pc_pd_cold_cave_habitability: "Habitabilité de Caverne Froide"
trait_pc_pd_cold_cave_preference: "Préférence de Caverne Froide"
