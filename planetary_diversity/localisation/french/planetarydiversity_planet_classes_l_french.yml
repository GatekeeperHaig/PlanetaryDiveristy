pc_pd_cold_tidally_locked: "Monde Crépusculaire Froid"
pc_pd_cold_tidally_locked_desc: "Un monde humide et rocheux, gelé, avec une atmosphère azote-oxygène, cette planète est verrouillée de façon tidale à son étoile parente. Le côté diurne est un océan dégelé constamment bombardé par la lumière du soleil, tandis que son côté nocturne est composé de glaciers gelés. Des vents forts et de puissants courants se rencontrent au bord de ces deux côtés distincts."
pc_pd_cold_tidally_locked_adj: "tidallement verrouillé"
mod_pc_pd_cold_tidally_locked_habitability: "Habitabilité Crépusculaire Froid"
