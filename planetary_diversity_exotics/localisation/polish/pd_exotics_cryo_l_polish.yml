 job_livestock_cryophile_desc: "$job_livestock_desc$"
 tech_pd_cryogenic_terraforming: "Terraformowanie kriogeniczne"
 tech_pd_cryogenic_terraforming_desc: "Postępy w inżynierii kriogenicznej i chemii egzotycznych rozpuszczalników umożliwiają geoinżynierię w temperaturach i pod ciśnieniami, które dotąd wydawały się nieosiągalne. Możemy terraformować świat kriogeniczny w planetę o umiarkowanej temperaturze."
