 zone_pd_cave_mine: "Пещерный добывающий консорциум"
 zone_pd_cave_mine_desc: "Глубокие пещеры позволяют легко добраться до богатых рудных жил, обеспечивая более эффективную добычу минералов."
 concept_zone_pd_cave_mine: "$zone_pd_cave_mine$"
 concept_zone_pd_cave_mine_desc: "§L$zone_pd_cave_mine_desc$§!\n\n£building£ $MOD_PLANET_MAX_BUILDINGS_ADD$: §G+3§!\nДолжности[pd_cave_karst_delver.GetIcon] «[pd_cave_karst_delver.GetName]» за каждый £district£: §G+100§!\n[pd_cave_karst_delver.GetIcon] [pd_cave_karst_delver.GetNamePlural] производят £minerals£ £food£"
 zone_pd_cave_lab: "Пещерная инженерная гильдия"
 zone_pd_cave_lab_desc: "Строительство городов под землей - немалый подвиг. Эта гильдия координирует свои действия с местными исследователями, способствуя их инженерным разработкам."
 concept_zone_pd_cave_lab: "$zone_pd_cave_lab$"
 concept_zone_pd_cave_lab_desc: "§L$zone_pd_cave_lab_desc$§!\n\n£building£ $MOD_PLANET_MAX_BUILDINGS_ADD$: §G+3§!\nДолжности[pd_cave_speleo_engineer.GetIcon] «[pd_cave_speleo_engineer.GetName]» за каждый £district£: §G+100§!\n[pd_cave_speleo_engineer.GetIcon] [pd_cave_speleo_engineer.GetNamePlural] производят £engineering_research£ £energy£"
 zone_pd_superhab_lab: "Лаборатории изучения эволюции на суперземлях"
 zone_pd_superhab_lab_desc: "Хотя суперземли не являются идеальными для всех существ, они идеально подходят для развития биологической жизни. Частота совершаемых открытий способствует социальным исследованиям в пределах планеты."
