 district_pd_fortress_arcology_housing_plural: "Arkologie obrony cywilnej"
 district_pd_fortress_arcology_housing_desc: "Te arkologie łączą siłę militarną z życiem cywilnym. Obywatele żyją tu pod stałą ochroną, wiedząc, że ich bezpieczeństwa strzeże czujne państwo."
 district_pd_fortress_arcology_urban_1: "Arkologia centralnego dowództwa"
 district_pd_fortress_arcology_urban_1_desc: "Ta arkologia mieści strategiczne centrum dowodzenia tego ufortyfikowanego świata. Wojskowi administratorzy z niezachwianą dyscypliną dbają tu o organizację, sprawowanie i utrzymanie władzy sił zbrojnych."
