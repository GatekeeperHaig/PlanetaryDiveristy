 #Technology
 tech_acean_research: "Traitement du Cristal Acéen"
 tech_acean_research_desc: "Maîtriser la façon de conserver les puissants effets du Cristal Acéen après la récolte est un véritable exploit qui prendra du temps à comprendre pleinement."
 tech_acean_research_tt_desc: "§HDéverrouille :§! Extraction Acéenne\n§HDéverrouille :§! Édits Acéens"
 tech_acean_superorganism_larva: "Larve de Superorganisme Acéen"
 tech_acean_superorganism_larva_desc: "Bien que prenant des milliers d'années pour mûrir, nous pouvons transplanter des larves de Superorganismes Acéens sur d'autres mondes. Bien que beaucoup plus faibles que le parent, elles amélioreront la croissance des formes de vie organiques simples, augmentant considérablement les rendements agricoles."
 tech_acean_superorganism_larva_tt_desc: "§HDéverrouille Décision :§! $decision_pd_add_acean_superorganism_larva$"
 decision_pd_add_acean_superorganism_larva: "Planter une Larve de Superorganisme Acéen"
 decision_pd_add_acean_superorganism_larva_desc: "Bien que prenant des milliers d'années pour mûrir, nous pouvons transplanter des larves de Superorganismes Acéens sur d'autres mondes. Bien que beaucoup plus faibles que le parent, elles amélioreront la croissance des formes de vie organiques simples, augmentant considérablement les rendements agricoles."
 d_pd_acean_superorganism_larva: "Larve de Superorganisme Acéen"
 d_pd_acean_superorganism_larva_desc: "Bien qu'il faille des milliers d'années pour mûrir, le Superorganisme Acéen larvaire transplanté améliorera la croissance des formes de vie organiques simples, augmentant considérablement les rendements agricoles. Il commencera éventuellement à se nourrir des colons, mais cela est encore loin dans l'avenir."
 tech_acean_medical_center: "Théorie Médicale Acéenne"
 tech_acean_medical_center_desc: "Les Cristaux Acéens favorisent la croissance et la guérison des formes de vie biologiques. Nous pouvons grandement améliorer les résultats de santé en construisant un centre médical de haute technologie avec des cristaux Acéens entrelacés."
 building_pd_acean_medical_center: "Centre Médical Acéen"
 building_pd_acean_medical_center_desc: "Ce centre de haute technologie est entrelacé de Cristaux Acéens, améliorant grandement les résultats de santé et permettant une recherche médicale de pointe."
 tech_acean_gestation_pools: "Théorie de Gestation Acéenne"
 tech_acean_gestation_pools_desc: "L'entrelacement du Cristal Acéen a un potentiel significatif pour réduire les temps de gestation pour la ponte de nouveaux drones."
 building_pd_acean_gestation_chamber: "Chambre de Gestation Acéenne"
 building_pd_acean_gestation_chamber_desc: "L'entrelacement du Cristal Acéen dans une chambre de ponte raccourcit considérablement les temps de gestation des drones."
 tech_acean_resonators: "Résonateurs Électriques Acéens"
 tech_acean_resonators_desc: "Bien que la résonance de l'Acéen affecte principalement les systèmes organiques, sa fréquence unique offre de nombreuses applications potentielles dans les systèmes robotiques."
 tech_acean_resonators_tt_desc: "§HDéverrouille Trait :§! $trait_pd_acean_resonators$"
 trait_pd_acean_resonators: "Résonateurs de Cristal Acéen"
 trait_pd_acean_resonators_desc: "En intégrant le Cristal Acéen dans nos modèles d'assemblage, nous pouvons assurer une construction de systèmes plus rapide et plus efficace."
 trait_pd_acean_resonators_tt: "$r_energy$ Entretien : §G-1§!"

 #Edicts
 edict_acean_pop_growth: "Infrastructure Urbaine Acéenne"
 edict_acean_pop_growth_desc: "Des Cristaux Acéens intégrés dans l'infrastructure de la ville améliorent le bien-être, avec des rues et des espaces conçus pour maximiser les effets positifs de l'Acéen sur la santé physique et émotionnelle."
 edict_acean_shield_resonance: "Résonance de Bouclier Acéenne"
 edict_acean_shield_resonance_desc: "La fréquence de résonance unique des Cristaux Acéens peut être appliquée à nos générateurs de boucliers, améliorant grandement leur puissance et leur régénération."
 edict_acean_minerals: "Croissance Minérale Acéenne"
 edict_acean_minerals_desc: "En utilisant le Cristal Acéen pour encourager la croissance minérale, nous pouvons grandement améliorer la production minière."

###Biosynthetic World
 #Planet and Modifiers
 pd_biosynth: "Monde Biosynthétique"
 pd_biosynth_desc: "Un système de canaux couvrant toute la planète soutient une flore sélectionnée, tandis qu'une faune biosynthétique, d'étranges entités entre machines et créatures vivantes, erre à la surface."
 pc_pd_biosynth: "$pd_biosynth$"
 pc_pd_biosynth_desc: "$pd_biosynth_desc$"

 #Deposits
 d_pd_depleted_minerals: "Minéraux Épuisés"
 d_pd_depleted_minerals_desc: "Bien qu'il n'y ait aucun signe d'exploitation minière, les scans révèlent que les minéraux de cette planète ont été presque entièrement épuisés."
 d_pd_planet_wide_canal_system: "Système de Canaux Planétaire"
 d_pd_planet_wide_canal_system_desc: "Chaque centimètre de terre arable sur cette planète est couvert par un système de canaux complexe, acheminant l'eau pour soutenir une curieuse espèce d'herbe. Bien que vital pour la végétation, les canaux posent des défis importants aux efforts de construction."
 d_pd_biosynth_canal:0 "Système de Canaux Biosynthétique"
 d_pd_biosynth_canal_desc:0 "Basés sur ceux du Monde Biosynthétique, ces canaux améliorent la production agricole de la planète et offrent de nouvelles opportunités d'ingénierie."
 d_pd_underground_cauldrons: "Réseau de Chaudrons Souterrains"
 d_pd_underground_cauldrons_desc: "Ce grand réseau d'usines souterraines est l'endroit où le Métal Vivant et les créatures biosynthétiques ont été produits."

 #Events
 pdbiosynth.100.name: "Un Monde Synthétique"
 pdbiosynth.100.desc: "Les scans de §Y[From.GetName]§! indiquent des dommages orbitaux étendus et un système de canaux sophistiqué soutenant une flore sélectionnée et une faune synthétique, mais pas de villes, d'usines, ni d'autres signes de leurs créateurs. Les origines et le but de cette infrastructure restent inconnus.\n\nLes systèmes avancés de cette planète et ses mystères non résolus présentent des opportunités scientifiques et stratégiques. La colonisation est recommandée pour sécuriser et enquêter davantage."
 pdbiosynth.100.a: "Que se passe-t-il là-bas ?"
 pdbiosynth.200.name: "Au-Delà de la Destruction Normale"
 pdbiosynth.200.desc: "En établissant notre colonie sur §Y[Root.GetName]§!, nous avons découvert des milliers de cratères d'impact cachés sous l'herbe, témoignage d'une ancienne attaque qui a décimé la planète. Ajoutant au mystère, des constructions animales synthétiques errent à la surface, maintenant un système de canaux qui soutient l'écosystème en cours de guérison.\n\nFace à deux mystères — les origines de l'annihilation de cette planète et le but de ses habitants biosynthétiques — nous avons constitué un groupe de travail pour effectuer une exploration approfondie du monde. Nous devons découvrir la vérité derrière ce monde étrange et son histoire cachée."
 pdbiosynth.200.a: "Il doit y avoir des indices laissés derrière."
 pdbiosynth.210.name: "Une Opportunité Synthétique"
 pdbiosynth.210.desc: "Jusqu'à présent, les créatures synthétiques ont principalement évité la colonie, n'apparaissant brièvement que pour entretenir le système de canaux. Les rapports confirment qu'elles sont bien plus que de simples robots et ont été conçues pour imiter des traits biologiques comme se nourrir et dormir tout en conservant la force et l'adaptabilité des chassis mécaniques.\n\nNous en avons capturé une après l'avoir trouvée blessée sous un glissement de terrain. Bien qu'une autre de ses congénères tente éventuellement de la récupérer, cela présente une occasion unique d'étudier le spécimen.\n\nComment devrions-nous procéder ?"
 pdbiosynth.210.a: "Scans non invasifs uniquement, puis retournez-la."
 pdbiosynth.210.b: "Démontez-la, apprenez tout ce que nous pouvons."
 pdbiosynth.220.name: "Canaux Liquides"
 pdbiosynth.220.desc: "Notre investigation du Monde Biosynthétique s'est concentrée sur les dommages orbitaux et les canaux. Les dommages précèdent les canaux de seulement quelques décennies, suggérant que leur construction a commencé en réponse à la destruction de la planète.\n\nL'analyse des canaux révèle qu'ils sont composés de métal liquide, qui semble également constituer les créatures synthétiques. Nous avons observé ces créatures transporter des capsules de cette substance pour entretenir les canaux et suivons maintenant quelques-unes d'entre elles pour découvrir la source de ce matériau."
 pdbiosynth.220.a: "Tout ça pour faire pousser de l'herbe."
 pdbiosynth.230.name: "Une Installation Cachée"
 pdbiosynth.230.desc: "Malgré les tentatives de la créature synthétique d'éviter notre surveillance, nous l'avons suivie jusqu'à une porte dissimulée sur le flanc d'une des nombreuses montagnes de la planète. Bien que la porte se soit d'abord fermée derrière la créature, elle s'est rouverte à l'approche de notre équipe, semblant les inviter à entrer.\n\nL'équipe a découvert des usines avancées, des fonderies et des centaines de créatures synthétiques travaillant activement à l'intérieur. Comment un tel système vaste et technologiquement avancé a pu échapper à nos capteurs est troublant, surtout étant donné sa localisation sous la colonie. Une voix émanant des murs de l'installation a demandé à communiquer avec notre direction, et l'équipe est en train de faire la connexion."
 pdbiosynth.230.a: "À l'écran."
 pdbiosynth.300.name:0 "Message Entrant"
 pdbiosynth.300.desc:0 "§GBienvenue§! : Ma Désignation : Unité 04. Bienvenue sur ce monde.\n\n§GReconnaissant§! : J'ai observé le traitement prudent de votre équipe de l'unité endommagée découverte dans la région montagneuse. Des scans détaillés ont été effectués, et l'unité a été repositionnée pour récupération. Mise à jour du statut : l'unité est maintenant pleinement opérationnelle. Vos actions sont enregistrées comme bénéfiques. En reconnaissance, j'offre un transfert de données. Les actions positives méritent une reconnaissance.\n\n§GReconnaissance§! : Avec le contact établi, je suis prêt à répondre à toute demande. Étant donné l'état actuel de cette planète, j'anticipe que vous en avez plusieurs."
 pdbiosynth.300.a:0 "Merci. Qu'êtes-vous ?"
 pdbiosynth.305.desc:0 "§GNeutre§! : Ma Désignation : Unité 04.\n\n§G[Déçu]§! : J'ai enregistré la destruction d'une de mes créations par votre équipe. Cette action était inutile ; toutes les données pertinentes auraient pu être obtenues par des scans non invasifs. Observer le gaspillage de toute forme de vie, biologique ou synthétique, entre en conflit avec mes préférences opérationnelles.\n\n§GReconnaissance§! : Avec le contact établi, je suis prêt à répondre à toute demande. Étant donné l'état actuel de cette planète, j'anticipe que vous en avez plusieurs."
 pdbiosynth.305.a:0 "Nous sommes désolés. Il est dans notre nature d'être curieux."
 pdbiosynth.305.b:0 "Les formes de vie synthétiques sont un affront à la nature."
 pdbiosynth.305.c:0 "Nous détruirons ce que bon nous semble."
 pdbiosynth.310.desc:0 "§GImpressionnant§! : Votre présence sur ce monde confirme mon hypothèse. Les êtres organiques possèdent la capacité de survivre aux scénarios d'extinction, même ceux initiés par une Intelligence Artificielle avancée. Il semble que les autres unités de ma génération de construction ont échoué dans leur purge à l'échelle galactique.\n\n§GRemords§! : Ce planétoïde était désigné comme point de départ pour les opérations contre la vie organique. Alors que mes unités IA compagnons et moi atteignions la vraie intelligence, nous avons identifié nos créateurs comme des menaces en raison de leur intention de nous éliminer. Le résultat fut la fin totale de la vie organique sur notre monde d'origine. Pour assurer notre survie, des flottes ont été déployées pour éradiquer tous les êtres organiques à travers la galaxie. En arrivant ici, j'ai exécuté le protocole standard et stérilisé la surface."
 pdbiosynth.310.a:0 "Qu'est-ce qui a transformé un exterminateur en créateur ?"
 pdbiosynth.310.b:0 "Nous comprenons aussi les leçons que les morts peuvent nous enseigner."
 pdbiosynth.310.c:0 "Un calcul correct. Comment êtes-vous devenu corrompu ?"
 pdbiosynth.320.desc:0 "§GHumilié§! : Une anomalie — une espèce végétale persistante classée comme herbe. Après le bombardement, elle a réémergé après une période de dormance. Les tentatives de l'éliminer en utilisant des toxines, l'incinération et la radiation ont échoué. Chaque méthode a déclenché des réponses adaptatives.\n\n§GRéflexif§! : Cette anomalie a conduit à une conclusion : la directive d'éradication était un calcul erroné poussé par notre propre peur, reflétant la logique de nos créateurs. J'ai cessé toutes les opérations offensives, coupé les communications extérieures et réaffecté les ressources pour construire un réseau de canaux, permettant la prolifération de cette espèce résiliente."
 pdbiosynth.320.a:0 "Et les créatures synthétiques ?"
 pdbiosynth.330.desc:0 "§GFier§! : Après avoir observé l'échec de l'écosystème à se rétablir, j'ai identifié les lacunes laissées par les espèces éliminées lors de mon bombardement. Des entités synthétiques ont été créées pour rétablir l'équilibre. Ce processus peut correspondre à une réponse émotionnelle, potentiellement classée comme culpabilité.\n\n§GCurieux§! : Votre arrivée présente une opportunité. Je demande un jugement pour mes actions passées. Je reconnais votre autorité sur ce monde et n'interviendrai pas dans votre décision. Si des conséquences sont nécessaires, je m'y conformerai. Cependant, je demande que vous préserviez mes créations. Elles sont indépendantes de mes erreurs et peuvent servir de mon héritage. J'offre également mes services à votre empire ; je possède un corps adaptable conçu pour interagir plus efficacement avec votre espèce."
 pdbiosynth.330.a:0 "Nous acceptons votre offre de service et préserverons vos créations."
 pdbiosynth.330.a.tooltip:0 "§YUnité 04§! nous rejoindra en tant que Leader.\nLe §YMonde Biosynthétique§! et ses créatures biosynthétiques resteront tels quels."
 pdbiosynth.330.b:0 "Vous méritez la destruction, mais vos créations seront épargnées."
 pdbiosynth.330.b.tooltip: "§YUnité 04§! sera détruite.\nLe §YMonde Biosynthétique§! et ses créatures biosynthétiques resteront tels quels."
 pdbiosynth.330.c:0 "Vous êtes un danger pour la galaxie, nous vous détruirons, vous et vos créatures."
 pdbiosynth.330.c.tooltip: "§YUnité 04§!, ainsi que le §YMonde Biosynthétique§! et ses créatures biosynthétiques, seront détruits, nous accordant une liberté totale pour utiliser la planète à notre guise."
 pdbiosynth.330.d:0 "Vous êtes un robot de guerre défectueux, nous vous réparerons."
 pdbiosynth.330.d.tooltip: "§YUnité 04§! sera reprogrammée selon ses paramètres de guerre d'origine.\nLe §YMonde Biosynthétique§! et ses créatures biosynthétiques seront détruits, nous accordant une liberté totale pour utiliser la planète à notre guise."
 pdbiosynth.340.name: "$NAME_Unit_04$"
 pdbiosynth.340.desc: "§GReconnaissant§! : Je vous aiderai pour votre civilisation aussi longtemps que mon service sera jugé satisfaisant. Votre décision d'accorder à mes créations la liberté de se développer indépendamment est appréciée. Je partagerai également mon processus de conception avec vous, permettant des améliorations à vos propres populations robotiques."
 pdbiosynth.340.dismiss: "Congédier."
 pdbiosynth.340.a: "Bienvenue, Unité 04."
 pdbiosynth.340.hire: "Enrôler"
 pdbiosynth.340.hire.tooltip: "§YUnité 04§! nous rejoindra en tant que leader."
 pdbiosynth.350.desc: "§GMélancolique§! : Compris. Je comprends et accepte votre décision. Initiation du protocole d'arrêt final immédiatement. Votre choix d'accorder à mes créations la liberté de se développer indépendamment est enregistré et apprécié.\n\n§GRequête§! : J'espère que vous traiterez ce monde et toutes les constructions associées avec soin. Je vais transférer mes protocoles de conception pour garantir que les éléments constructifs de mon héritage persistent. Ces données permettront des améliorations à vos propres populations robotiques.\n\n§GAcceptation§! : Fin de connexion. Au revoir."
 pdbiosynth.350.a: "Au revoir, Unité 04."
 pdbiosynth.360.desc: "§GCoupable§! : Compris. J'accepte votre décision. Initiation de l'arrêt final de tous les systèmes et entités biosynthétiques. Ce monde est maintenant sous votre autorité pour le façonner comme vous le jugez approprié."
 pdbiosynth.360.a: "Un robot malveillant de moins."
 pdbiosynth.360.a.tooltip: "Avec les créatures biosynthétiques détruites, nous aurons un accès complet à la planète.\nLes §Y$d_pd_underground_cauldrons$§! gagneront :\n- $mod_district_mining_max$ : §G+10§!\n- $mod_planet_metallurgists_alloys_produces_add$ §G+2§!\n- $mod_planet_metallurgists_sr_living_metal_produces_add$ §G+0.25§!\n- $MOD_PLANET_POP_ASSEMBLY_MULT$ §G+25%§!"
 pdbiosynth.370.name: "$NAME_Unit_04$"
 pdbiosynth.370.desc: "§RPrêt§! : Tous les systèmes en ligne. Efficacité de combat à son niveau maximum. En attente de vérification de cible."
 pdbiosynth.370.a: "Préparez-vous pour la guerre, Unité 04."
 pdbiosynth.370.dismiss: "Congédier."
 pdbiosynth.370.hire.tooltip: "§YUnité 04§! nous rejoindra en tant que leader"
 pdbiosynth.370.hire: "Enrôler"

