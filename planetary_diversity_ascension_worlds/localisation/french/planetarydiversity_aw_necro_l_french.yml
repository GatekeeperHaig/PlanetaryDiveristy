#Decision
 decision_pd_aw_necro_planet: "Bâtir une nécropole planétaire"
 decision_pd_aw_necro_planet_desc: "Nous pouvons faire de ce monde un temple tentaculaire dédié aux morts. Tout être vivant à sa surface dépérira, et ses champs deviendront des lieux de sépulture."
 decision_pd_aw_necro_planet_effects_short: "S'il s'agit d'un monde habitable non urbain, la planète devient un §Y$pc_nuked$§!.\nLe modificateur §Y$pd_aw_necro_planet$§! et le gisement §Y$d_pd_necro_deposit$§! sont ajoutés."
 decision_pd_aw_necro_planet_cleanup: "Supprimer la nécropole planétaire"
 decision_pd_aw_necro_planet_cleanup_desc: "Nous devons faire disparaître les temples et les tombeaux laissés par les anciens propriétaires de cette planète."
 decision_pd_aw_necro_planet_cleanup_effects_short: "Le modificateur §Y$pd_aw_necro_planet$§! sera supprimé."

#Modifiers
 pd_aw_necro_planet: "Nécropole"
 pd_aw_necro_planet_tooltip: "$MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$: §G-25%§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\n$mod_planet_jobs_unity_produces_mult$: §G+25%§!\n$mod_planet_farmers_food_produces_mult$: §R-50%§!"
 pd_aw_necro_planet_desc: "Ce monde est un temple tentaculaire. Rien ne pousse à sa surface, vouée aux sanctuaires et aux flèches."
