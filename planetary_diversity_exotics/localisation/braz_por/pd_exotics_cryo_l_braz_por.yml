 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Pressurizar as cúpulas"
 decision_pd_exotic_domed_add_atmosphere_desc: "Reequipe as cúpulas da colônia com nossa atmosfera criogênica para que os nossos possam se estabelecer aqui. Depois que o ar mudar, apenas espécies adaptadas ao frio extremo poderão viver sob as cúpulas."
 decision_pd_exotic_domed_remove_atmosphere: "Ventilar as cúpulas"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Remova a atmosfera criogênica das cúpulas e a substitua por uma mistura de oxigênio convencional. Espécies criogênicas não poderão mais se estabelecer aqui."
