#Origin
 origin_pd_interplanetary_settlers: "Międzyplanetarni osadnicy"
 origin_pd_interplanetary_settlers_desc: "Zanim zdołała dotrzeć do gwiazd, ta cywilizacja położyła podwaliny swojego imperium, wznosząc kopułowe siedliska na księżycach i planetach macierzystego układu. Teraz, dysponując technologią podróży nadświetlnych, stoi u progu nowej ery i jest gotowa rozszerzyć swój zasięg na niezbadane obszary kosmosu."
 origin_tooltip_pd_interplanetary_settlers_start_effects: "- $INITIAL_POPS$ §G+200§!$NEW_LINE$- $HOMEWORLD$$TABBED_NEW_LINE$- ['concept_pd_network_hub', $d_pd_solar_system_network_hub$]$NEW_LINE$- Księżyc macierzystej planety:$TABBED_NEW_LINE$- ['concept_pd_moonbase', $pd_domed_base_0$]$NEW_LINE$- Kolonia:$TABBED_NEW_LINE$- ['concept_pd_domed_colony', $pd_domed_colony_0$]$NEW_LINE$- $ADDITIONAL_TECHNOLOGIES_STRING$ ['concept_tech_pd_domed_colonies', £engineering£ $tech_pd_domed_colonies$]"
 pd_interplanetary_system_initializer_NAME: "Międzyplanetarni osadnicy"
