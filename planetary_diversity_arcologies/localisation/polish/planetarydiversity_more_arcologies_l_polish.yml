#Modifiers
 pd_garden_arcology: "Arkologia ogrodowa"
 pd_garden_arcology_desc: "To ekumenopolis wyróżnia się rozległymi obszarami starannie urządzonych i kontrolowanych ogrodów, które tworzą szerokie pasy zieleni pośród miejskiej zabudowy."
 pd_fortress_arcology: "Arkologia-twierdza"
 pd_fortress_arcology_desc: "To ekumenopolis pełni funkcję ogólnoplanetarnego centrum dowodzenia wojskowego, wypełnionego koszarami, ośrodkami szkoleniowymi i zakładami produkcji broni."
 pd_commercial_arcology: "Arkologia handlowa"
 pd_commercial_arcology_desc: "To ekumenopolis jest międzygalaktycznym węzłem handlowym, pełnym tętniących życiem targowisk, rozległych centrów handlowych i rozbudowanej infrastruktury logistycznej."
 pd_garden_arcology_rs: "$pd_garden_arcology$"
 pd_garden_arcology_rs_desc: "$pd_garden_arcology_desc$"
 pd_fortress_arcology_rs: "$pd_fortress_arcology$"
 pd_fortress_arcology_rs_desc: "$pd_fortress_arcology_desc$"

#Districts
 district_pd_arcology_research: "Arkologia badawcza"
 district_pd_arcology_research_plural: "Arkologie badawcze"
 district_pd_arcology_research_desc: "W strzelistych laboratoriach pracują wybitne umysły, a rywalizacja jest równie intensywna jak prowadzone badania."
 district_pd_arcology_industrial: "Arkologia przemysłowa"
 district_pd_arcology_industrial_plural: "Arkologie przemysłowe"
 district_pd_arcology_industrial_desc: "Wypełnione hutami i fabrykami dzielnice przetwarzają surowce w zaawansowane produkty wewnątrz swoich strzelistych budowli."
 district_arcology_pd_trade: "Arkologia handlowa"
 district_arcology_pd_trade_plural: "Arkologie handlowe"
 district_arcology_pd_trade_desc: "Wielkie wieże i iglice handlowe wznoszą się ku niebu, ich masywne sylwetki zasłaniają światło."
 district_pd_arcology_naval: "Arkologia logistyczna"
 district_pd_arcology_naval_plural: "Arkologie logistyczne"
 district_pd_arcology_naval_desc: "Wielopiętrowe biurowce i sale dowodzenia pozwalają maksymalnie usprawnić działania floty."

#Jobs
 #Regular Logistics
 job_pd_naval_admin: "Logistyk"
 job_pd_naval_admin_plural: "Logistycy"
 job_pd_naval_admin_desc: "Doskonale wyszkoleni w zarządzaniu zaopatrzeniem specjaliści zapewniają sprawne działanie floty, utrzymując i monitorując kluczowe linie dostaw."
