 concept_pd_cryogenic_planet: "Planeta kriogeniczna"
 concept_pd_cryogenic_planets: "Planety kriogeniczne"
 concept_pd_cryogenic_planet_desc: "Określenie „$concept_pd_cryogenic_planet$” odnosi się do światów, których biosfery opierają się na chemii kriogenicznej, a nie na ciekłej wodzie:$NEW_LINE$- $pc_pd_ammonia$$NEW_LINE$- $pc_pd_methane$$NEW_LINE$- $pc_pd_nitrogen$"
 pd_cryothermal_workforce: "Kriotermiczna optymalizacja pracy"
 pd_cryothermal_workforce_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_drone: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_drone_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_machine: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_machine_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_shared_desc: "Szkolenia uwzględniające specyfikę atmosfery, wzmocnione narzędzia i łańcuchy dostaw egzotycznych wodorków zwiększają wydajność wszystkich pracowników kadzi chemosyntetycznych."
 pd_cryothermal_engineered_planet: "Przebudowa kriotermiczna"
 pd_cryothermal_engineered_planet_desc: "Infrastruktura przystosowana do atmosfery i przechłodzone linie przetwórcze umożliwiają gęstsze zaludnienie tego świata, niż pozwalałyby na to jego warunki naturalne."
 mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult: "[pdexotic_cryo_chemist.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"
 mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult: "[pdexotic_cryo_chemist_drone.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"
 mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult: "[pdexotic_cryo_chemist_machine.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"
 tech_pd_pressure_suits: "Kombinezony ciśnieniowe"
 tech_pd_pressure_suits_desc: "Wzmocnione kombinezony przystosowane do zimna i próżni oraz hermetyczne siedliska pozwalają naszym kolonistom znosić tlen, ciśnienie i ciepło obcych światów. Z kolei inne gatunki mogą dzięki nim przetrwać w naszych atmosferach."
 tech_pd_pressure_suits_effect_title: "§HOdblokowuje kolonizację:§! ['concept_pd_cryogenic_planet'] — dla gatunków nieprzystosowanych do warunków kriogenicznych"
 tech_pd_pressure_suits_effect_desc: "§HZamieszkiwanie w warunkach kriogenicznych§!\nSiedliska z atmosferą pod ciśnieniem i kombinezony przystosowane do zimna i próżni pozwalają kolonistom oddychającym tlenem przeżyć w atmosferach metanowych, amoniakalnych i azotowych."
 tech_pd_cryoforming: "Krioformowanie"
 tech_pd_cryoforming_desc: "Postępy w chemii kriogenicznej i przekształcaniu atmosfer pozwalają nam rozszerzyć naszą biosferę na światy, na których nie powstaje ona naturalnie. Planetę o umiarkowanej temperaturze można przekształcić w świat z zimną, gęstą atmosferą, której potrzebuje nasz gatunek."
 tech_pd_cryoforming_effect_title: "§HOdblokowuje funkcję:§! Terraformowanie kriogeniczne"
 tech_pd_cryoforming_effect_desc: "Pozwala nam terraformować światy o umiarkowanej temperaturze w światy amoniakalne, metanowe i azotowe."
 tech_pd_cryogenic_terraforming_effect_title: "§HOdblokowuje funkcję:§! Terraformowanie kriogeniczne"
 tech_pd_cryogenic_terraforming_effect_desc: "Pozwala nam terraformować światy amoniakalne, metanowe i azotowe w światy o umiarkowanej temperaturze."
 decision_pd_exotic_habitat_add_ammonia_atmosphere: "Wprowadź atmosferę amoniakalną"
 decision_pd_exotic_habitat_add_ammonia_atmosphere_desc: "Wypełnij systemy podtrzymywania życia stacji mieszkalnej amoniakiem i azotem, by nasz gatunek mógł się tu osiedlić. Po zmianie atmosfery tylko gatunki przystosowane do warunków kriogenicznych będą mogły tu zamieszkać."
 decision_pd_exotic_habitat_remove_ammonia_atmosphere: "Usuń atmosferę amoniakalną"
 decision_pd_exotic_habitat_remove_ammonia_atmosphere_desc: "Usuń atmosferę amoniakalną ze stacji mieszkalnej i zastąp ją standardową mieszaniną tlenową. Gatunki kriogeniczne nie będą już mogły się tu osiedlać."
 decision_pd_exotic_habitat_add_methane_atmosphere: "Wprowadź atmosferę metanową"
 decision_pd_exotic_habitat_add_methane_atmosphere_desc: "Wypełnij systemy podtrzymywania życia stacji mieszkalnej azotem i metanem, by nasz gatunek mógł się tu osiedlić. Po zmianie atmosfery tylko gatunki przystosowane do warunków kriogenicznych będą mogły tu zamieszkać."
 decision_pd_exotic_habitat_remove_methane_atmosphere: "Usuń atmosferę metanową"
 decision_pd_exotic_habitat_remove_methane_atmosphere_desc: "Usuń atmosferę metanową ze stacji mieszkalnej i zastąp ją standardową mieszaniną tlenową. Gatunki kriogeniczne nie będą już mogły się tu osiedlać."
 decision_pd_exotic_habitat_add_nitrogen_atmosphere: "Wprowadź atmosferę azotową"
 decision_pd_exotic_habitat_add_nitrogen_atmosphere_desc: "Wypełnij systemy podtrzymywania życia stacji mieszkalnej czystym azotem i utrzymuj go pod ciśnieniem odpowiednim dla warunków kriogenicznych, by nasz gatunek mógł się tu osiedlić. Po zmianie atmosfery tylko gatunki przystosowane do warunków kriogenicznych będą mogły tu zamieszkać."
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere: "Usuń atmosferę azotową"
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere_desc: "Usuń kriogeniczną atmosferę azotową ze stacji mieszkalnej i zastąp ją standardową mieszaniną tlenową. Gatunki kriogeniczne nie będą już mogły się tu osiedlać."
 d_pd_cryo_clathrate_pockets: "Kieszenie klatratów"
 d_pd_cryo_clathrate_pockets_desc: "Lotne gazy uwięzione w klatkach z zamarzniętej wody i lodu amoniakalnego. Ciepło wytwarzane podczas wydobycia rozbija ich sieci krystaliczne i uwalnia użyteczne pyłki."
 d_pd_cryo_volatile_geyser_fields: "Pola gejzerów substancji lotnych"
 d_pd_cryo_volatile_geyser_fields_desc: "Rozległe równiny, na których substancje lotne pod ciśnieniem wytryskują ze szczelin w zamarzniętej skorupie. Erupcje stale dostarczają na powierzchnię pyłki nadające się do rafinacji."
 d_pd_cryo_cryocrystal_caverns: "Jaskinie kriokryształów"
 d_pd_cryo_cryocrystal_caverns_desc: "Podpowierzchniowe jaskinie wyłożone rzadkimi sieciami krystalicznymi, które powstają wyłącznie w skrajnym zimnie. Złoża pozostają stabilne, dopóki otaczający je lód nie zostanie naruszony."
 d_pd_cryo_cryocrystal_spires: "Iglice kriokryształów"
 d_pd_cryo_cryocrystal_spires_desc: "Powierzchniowe formacje igłowatych rzadkich kryształów, powstałe przez tysiące lat powolnego wytrącania. Eksploatacja każdej iglicy dostarcza dużych ilości rzadkich kryształów."
 d_pd_cryo_gas_seeps: "Zamarznięte wysięki gazowe"
 d_pd_cryo_gas_seeps_desc: "Powolne wycieki gazów egzotycznych ze szczelin pod lodem. Wydajność jest niewielka, lecz równomierna na otaczającym terenie."
 d_pd_cryo_gas_columns: "Zamarznięte kolumny gazowe"
 d_pd_cryo_gas_columns_desc: "Stałe strumienie gazów egzotycznych wznoszące się z głębokich podpowierzchniowych zbiorników. Wydajnością dorównują największym polom gazowym na cieplejszych światach."
 d_pd_cryo_betharian_deposit: "Zamarznięte pole betariańskie"
 d_pd_cryo_betharian_deposit_desc: "Kamienie betariańskie tkwiące głęboko w lodowcach na rozległym obszarze. Złoża pozostają nieaktywne do czasu rozmrożenia i przetworzenia."
 d_pd_cryo_alien_pets_deposit: "Osłonięta dolina kriofauny"
 d_pd_cryo_alien_pets_deposit_desc: "Osłonięta nizina, na której rodzima fauna zimnych światów występuje niezwykle licznie. Miejscowe zwierzęta są łagodne i dobrze nadają się na towarzyszy."
 d_pd_cryo_toxic_mire: "£blocker£ Toksyczne kriomokradła"
 d_pd_cryo_toxic_mire_desc: "Rozległy obszar chemicznie aktywnej brei, w której toksyczne związki gromadzą się w temperaturze krzepnięcia. Na skażonym terenie nie można bezpiecznie budować infrastruktury osadniczej."
 d_pd_cryo_glacier_wall: "£blocker£ Zamarznięta ściana lodowcowa"
 d_pd_cryo_glacier_wall_desc: "Ogromna ściana zbitego, pradawnego lodu przecina krajobraz. Masa lodu jest zbyt gruba i niestabilna, by można było na niej budować bez specjalistycznych prac usuwających przeszkodę."
 tech_pd_cryo_toxic_mire: "Rekultywacja kriomokradeł"
 tech_pd_cryo_toxic_mire_desc: "Płyny neutralizujące związki chemiczne i płuczki działające w niskich temperaturach pozwalają nam osuszać i odkażać toksyczne mokradła na światach kriogenicznych. Odzyskany teren można następnie bezpiecznie zagospodarować."
 tech_pd_cryo_glacier_wall: "Wiercenie w lodowcach kriogenicznych"
 tech_pd_cryo_glacier_wall_desc: "Podgrzewane urządzenia wiertnicze i ładunki kumulacyjne przebijają zwarte ściany lodu hamujące ekspansję kolonii na światach kriogenicznych. Ekipy usuwające przeszkody mogą udrożnić teren w ułamku czasu potrzebnego na naturalne stopnienie lodu."
