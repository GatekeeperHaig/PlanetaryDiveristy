 pc_pd_hive_cave_arc: "Jaskiniowy świat Nadumysłu"
 pc_pd_hive_cave_arc_adj: "$pc_hive_adj$"
 pc_pd_hive_cave_arc_desc: "Ten jaskiniowy świat jest olbrzymim żywym organizmem, nierozerwalnie związanym z umysłem zbiorowym, który go stworzył. Ukształtowano go jako silnie broniony bastion zaawansowanych procesów myślowych. Sam teren jest gotów zaatakować każdego nieproszonego gościa."
 pc_pd_hive_superhabitable_arc: "Superziemski świat Nadumysłu"
 pc_pd_hive_superhabitable_arc_adj: "$pc_hive_adj$"
 pc_pd_hive_superhabitable_arc_desc: "Ten superziemski świat jest olbrzymim żywym organizmem, nierozerwalnie związanym z umysłem zbiorowym, który go stworzył. Ukształtowano go jako silnie broniony bastion zaawansowanych procesów myślowych. Sam teren jest gotów zaatakować każdego nieproszonego gościa."
 pc_pd_hive_tidally_locked_arc: "Synchroniczny świat Nadumysłu"
 pc_pd_hive_tidally_locked_arc_adj: "$pc_hive_adj$"
 pc_pd_hive_tidally_locked_arc_desc: "Ten świat o rotacji synchronicznej jest olbrzymim żywym organizmem, nierozerwalnie związanym z umysłem zbiorowym, który go stworzył. Ukształtowano go jako silnie broniony bastion zaawansowanych procesów myślowych. Sam teren jest gotów zaatakować każdego nieproszonego gościa."
 pc_pd_machine_cave_arc: "Jaskiniowy Nexus maszyn"
 pc_pd_machine_cave_arc_adj: "maszynowy"
 pc_pd_machine_cave_arc_desc: "Skalisty, jaskiniowy świat pokryty sztucznymi konstrukcjami. Rozrzedzona atmosfera składa się głównie z zanieczyszczeń przemysłowych i nie jest w stanie podtrzymać życia biologicznego."
 pc_pd_machine_superhabitable_arc: "Superziemski świat Nexusa"
 pc_pd_machine_superhabitable_arc_adj: "maszynowy"
 pc_pd_machine_superhabitable_arc_desc: "Skalisty, superziemski świat pokryty sztucznymi konstrukcjami. Rozrzedzona atmosfera składa się głównie z zanieczyszczeń przemysłowych i nie jest w stanie podtrzymać życia biologicznego."
