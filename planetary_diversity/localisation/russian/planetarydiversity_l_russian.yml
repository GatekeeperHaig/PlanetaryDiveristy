 pd_geothermal_vent_tapper: "$job_pd_geothermal_vent_tapper$"
 job_pd_geothermal_vent_tapper: "Жерловый бурильщик"
 job_pd_geothermal_vent_tapper_plural: "Жерловые бурильщики"
 job_pd_geothermal_vent_tapper_desc: "Жерловые бурильщики бурят скважины прямо в геотермальных источниках планеты, извлекая гораздо больше энергии, чем смогла бы выдать обычная станция. Из богатого минералами раствора, который они откачивают, постоянно извлекают полезные ископаемые."
 pd_geothermal_vent_tapper_drone: "$job_pd_geothermal_vent_tapper_drone$"
 job_pd_geothermal_vent_tapper_drone: "Дрон-жерловый бурильщик"
 job_pd_geothermal_vent_tapper_drone_plural: "Дроны-жерловые бурильщики"
 job_pd_geothermal_vent_tapper_drone_desc: "$job_pd_geothermal_vent_tapper_desc$"
 pd_geothermal_slurry_refiner: "$job_pd_geothermal_slurry_refiner$"
 job_pd_geothermal_slurry_refiner: "Переработчик шлама"
 job_pd_geothermal_slurry_refiner_plural: "Переработчики шлама"
 job_pd_geothermal_slurry_refiner_desc: "Переработчики шлама получают сырьё из богатой минералами геотермальной суспензии, а не руды, поэтому могут позволить себе производство с меньшими затратами, а также проводить небольшие инженерные разработки в области металлургии."
 pd_geothermal_slurry_refiner_drone: "$job_pd_geothermal_slurry_refiner_drone$"
 job_pd_geothermal_slurry_refiner_drone: "Дрон-переработчик шлама"
 job_pd_geothermal_slurry_refiner_drone_plural: "Дроны-переработчики шлама"
 job_pd_geothermal_slurry_refiner_drone_desc: "$job_pd_geothermal_slurry_refiner_desc$"
 pd_geothermal_geologist: "$job_pd_geothermal_geologist$"
 job_pd_geothermal_geologist: "Геотермальный геолог"
 job_pd_geothermal_geologist_plural: "Геотермальнй геолог"
 job_pd_geothermal_geologist_desc: "Геотермальные геологи изучают активные разломы и температурные градиенты планеты, чем продвигают развитие инженерных и физических технологий."
 pd_geothermal_geologist_drone: "$job_pd_geothermal_geologist_drone$"
 job_pd_geothermal_geologist_drone: "Дрон-геотермальный геолог"
 job_pd_geothermal_geologist_drone_plural: "Дроны-геотермальные геологи"
 job_pd_geothermal_geologist_drone_desc: "$job_pd_geothermal_geologist_desc$"
 pd_megaflora_rootbreaker: "$job_pd_megaflora_rootbreaker$"
 job_pd_megaflora_rootbreaker: "Корнепроходчик"
 job_pd_megaflora_rootbreaker_plural: "Корнепроходчики"
 job_pd_megaflora_rootbreaker_desc: "Корнепроходчики используют колоссальные корни мегафлоры, чтобы добывать залегающие глубоко в земной коре минералы, недоступные обычным способом, и поднимают на поверхность не только руду, но и съедобную корневую массу."
 pd_megaflora_rootbreaker_drone: "$job_pd_megaflora_rootbreaker_drone$"
 job_pd_megaflora_rootbreaker_drone: "Дрон-корнепроходчик"
 job_pd_megaflora_rootbreaker_drone_plural: "Дроны-корнепроходчики"
 job_pd_megaflora_rootbreaker_drone_desc: "$job_pd_megaflora_rootbreaker_desc$"
 pd_megaflora_canopy_ecologist: "$job_pd_megaflora_canopy_ecologist$"
 job_pd_megaflora_canopy_ecologist: "Лесной эколог"
