 job_pd_petrified_amber_artisan: "琥珀工匠"
 job_pd_petrified_amber_artisan_plural: "琥珀工匠"
 job_pd_petrified_amber_artisan_desc: "琥珀工匠将星球上的化石树脂加工成备受青睐的消费品，这些物品精美绝伦，提升了整个殖民地的舒适度。"
 job_pd_petrified_amber_artisan_drone: "琥珀工匠"
