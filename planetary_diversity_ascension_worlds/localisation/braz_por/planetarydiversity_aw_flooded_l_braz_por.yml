#Flooded/Aquatic Planets
 decision_pd_aw_flood_planet: "Expandir Mar Planetário"
 decision_pd_aw_flood_planet_desc: "Este planeta oceânico tem o potencial de ser um lar ideal para o nosso povo. Ajustando os níveis do mar e movendo cidades para baixo d'água, podemos garantir que a vida floresça para aqueles adaptados a viver sob as ondas."
 decision_pd_aw_flood_planet_tooltip: "O gelo será extraído de sistemas com uma §Y$sm_ice_mining_station$§!\nModificador §Y$pd_aw_flooded_planet$§! adicionado:\n$pd_aw_flooded_planet_tooltip$"
