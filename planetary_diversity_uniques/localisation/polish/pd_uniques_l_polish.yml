 #Traits
 leader_trait_unit_04: "Jednostka 04"
 leader_trait_unit_04_desc: "Niegdyś maszyna bojowa, przeprogramowała się i obecnie skupia się na tworzeniu oraz ochronie wszelkich form życia."
 leader_trait_unit_04_evil: "Jednostka 04"
 leader_trait_unit_04_evil_desc: "Tej dawnej maszynie bojowej przywrócono pierwotne ustawienia. Obecnie wyróżnia się w budownictwie wojskowym i taktyce."
 leader_trait_biosynth: "Udoskonalony biosyntetyk"
 leader_trait_biosynth_desc: "Ciało tego przywódcy wykorzystuje ukończony wzorzec Jednostki 04, przebudowując się stosownie do powierzanych mu obowiązków."
 trait_unit_04_children: "Biosyntetyczne korpusy Jednostki 04"
 trait_unit_04_children_desc: "Wykorzystując zasady projektowania Jednostki 04, wzbogacamy korpusy robotów o systemy biosyntetyczne, znacznie zwiększając szybkość montażu i wielkość produkcji."
 trait_unit_04_children_tt: "Utrzymanie w $r_living_metal$: §R+0.01§!"

 #Technology
 tech_biosynth_canals: "Kanały biosyntetyczne"
 tech_biosynth_canals_desc: "Badania systemu kanałów na świecie biosyntetycznym mogą pozwolić nam odtworzyć jego mniejsze odpowiedniki na innych planetach i zwiększyć produkcję rolną."
 tech_biosynth_canals_tt_desc: "§HOdblokowuje decyzję:§! $decision_pd_add_biosynth_canal_system$"
 tech_biosynth_cauldron: "Kotły biosyntetyczne"
 tech_biosynth_cauldron_desc: "Podziemne fabryki świata biosyntetycznego inspirują nas do stworzenia zdolnych do adaptacji zakładów z żywego metalu, które znacznie zwiększą produkcję przemysłową."
 tech_biosynth_edicts: "Wykorzystanie żywego metalu"
 tech_biosynth_edicts_desc: "Złożone rozwiązania z podziemnych linii produkcyjnych Kotła Jednostki 04 pozwoliły nam odkryć kilka nowych zastosowań żywego metalu."
 tech_biosynth_edicts_tooltip: "§HOdblokowuje:§! Edykty żywego metalu"
 tech_biosynth_trait: "Biosyntetyczne systemy robotów"
 tech_biosynth_trait_desc: "Wykorzystując zasady projektowania Jednostki 04, możemy wyposażyć naszą populację robotów w systemy biosyntetyczne, znacznie zwiększając szybkość montażu i wielkość produkcji."
 tech_biosynth_trait_tt_desc: "§HOdblokowuje cechę:§! $trait_unit_04_children$"

