 #Zones
 zone_pd_command_nexus: "Kwatera główna dowództwa"
 zone_pd_command_nexus_desc: "Kwatera główna jest centralnym ośrodkiem administracji wojskowej planety. Planowanie strategiczne, koordynacja operacyjna i bezkompromisowy nadzór pozwalają jej utrzymywać sprawną organizację działań wojennych."

 ##Commercial
 #Tooltip
 decision_commercial_arcology_project_effects: "Przekształca planetę w §Y$pc_city$§!, zwiększając £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§!. Odblokowuje specjalne £district£ §Ydzielnice arkologii handlowej§!. Wszystkie zasoby naturalne stają się jednak §Rniedostępne§!. Trwale uniemożliwia to budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!."
