 pd_superhab_biosphere_ecologist: "$job_pd_superhab_biosphere_ecologist$"
 job_pd_superhab_biosphere_ecologist: "Суперземельный эколог"
 job_pd_superhab_biosphere_ecologist_plural: "Суперземельные экологи"
 job_pd_superhab_biosphere_ecologist_desc: "Эти экологи - настоящие специалисты по изучению суперземель: планет, где жизнь развивается быстрее всего. Они также занимаются поиском видов, пригодных для обеспечения колонии пищей."
