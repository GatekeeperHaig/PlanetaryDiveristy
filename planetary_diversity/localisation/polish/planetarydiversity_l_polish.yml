 zone_pd_cave_grid: "Jaskiniowy odwiert geotermalny"
 zone_pd_cave_grid_desc: "Głębokie jaskinie pozwalają na łatwy dostęp do bogatych źródeł energii geotermalnej, zwiększając produkcję energii na planecie."
