###Wasteland Planets
#AP
 ap_pd_wasteland_worlds: "Unregulated Industrialism"
 ap_pd_wasteland_worlds_desc: "En quête d'une productivité sans entraves, nous devons écarter les contraintes environnementales pour libérer le véritable potentiel industriel de la planète. Disponible pour un ['concept_pd_toxoid_empire']."
 allow_wasteland_worlds: "§YUnlocks Decision:§! $decision_pd_aw_wasteland_planet$ on non-ideal planets"
 describe_wasteland_worlds: "§Y$pd_aw_wasteland_planet$§! modificateur:\n$t$- $MOD_HABITABILITY_CEIL$: §Y60%§!\n$t$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\n$t$- $mod_planet_jobs_alloys_produces_mult$: §G+100%§!\n$t$- $mod_planet_jobs_consumer_goods_produces_mult$: §G+100%§!\n$t$- $mod_planet_farmers_food_produces_mult$: §R-200%§!"
 concept_pd_toxoid_empire: "Empire toxoïde"
 concept_pd_toxoid_empires: "Empires toxoïdes"
 concept_pd_toxoid_empire_desc: "$concept_pd_toxoid_empire$ regroupe les empires dotés de \n- $TOX$ $SPECIES_CLASS$$NEW_LINE$- ['civic:civic_relentless_industrialists']$NEW_LINE$- ['civic:civic_corporate_relentless_industrialists']$NEW_LINE$- ['civic:civic_toxic_baths']$NEW_LINE$- ['civic:civic_hive_toxic_baths']$NEW_LINE$- ['civic:civic_machine_toxic_baths']$NEW_LINE$- ['civic:civic_corporate_toxic_baths']$NEW_LINE$- ['civic:origin_overtuned']"

#Decisions
 decision_pd_aw_wasteland_planet: "Unregulated Industrial Standards"
 decision_pd_aw_wasteland_planet_desc: "Environmental concerns do nothing but hold us back. By ignoring the state of the planet's natural ecosystem, we will unlock the planet's true industrial potential."
 decision_pd_aw_wasteland_planet_effects_short: "Le modificateur §Y$pd_aw_wasteland_planet$§! est ajouté.\n\nAugmente la §GProduction industrielle§! mais réduit l'£mod_pop_environment_tolerance£ §RHabitabilité§! et la production de £food£ §RNourriture§!.\nTous les £district£ §Y$district_farming_plural$§! et les Obstacles seront supprimés."
 decision_pd_aw_wasteland_planet_cleanup: "Environmental Clean Up"
 decision_pd_aw_wasteland_planet_cleanup_desc: "The severe environmental degradation on this planet has left its ecosystem in a precarious state. We will rectify the damage inflicted upon this world."
 decision_pd_aw_wasteland_planet_cleanup_tooltip: "We will restore this planet's original ecosystem."

#Modifiers
 pd_aw_wasteland_planet: "Industrial Wasteland"
 pd_aw_wasteland_planet_desc: "$decision_pd_aw_wasteland_planet_desc$"
 pd_aw_wasteland_planet_tooltip: "$MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\n$mod_planet_jobs_alloys_produces_mult$: §G+100%§!\n$mod_planet_jobs_consumer_goods_produces_mult$: §G+100%§!\n$MOD_HABITABILITY_CEIL$: §R-40%§!\n$mod_planet_farmers_food_produces_mult$: §R-200%§!"
 pd_wasteland_planet: "Industrial Wasteland"
 pd_wasteland_planet_desc: "$pd_aw_wasteland_planet_desc$"
 pd_wasteland_planet_tooltip: "$pd_aw_wasteland_planet_tooltip$"

#Notification Message
 MESSAGE_PD_AW_WASTELAND_DESC:1 "$PLANET|Y$ now has §Y$decision_pd_aw_wasteland_planet$§!"
 MESSAGE_PD_AW_WASTELAND_MESSAGE_TYPE_TITLE: "Environmental Regulations Abolished"
 MESSAGE_PD_AW_WASTELAND_CLEANUP_DESC:1 "The ecosystem on $PLANET|Y$ has been repaired."
 MESSAGE_PD_AW_WASTELAND_CLEANUP_MESSAGE_TYPE_TITLE: "Environmental Regulations Returned"
