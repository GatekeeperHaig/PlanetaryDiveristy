 job_pd_cave_deepvent_technician_plural: "Technicy głębinowych kominów"
 job_pd_cave_deepvent_technician_desc: "Technicy głębinowych kominów pozyskują energię z ciepła geotermalnego w głębokich systemach jaskiń. Skały, przez które wiercą, dostarczają również użytecznych minerałów."
