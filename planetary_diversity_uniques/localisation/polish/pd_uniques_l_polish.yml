 #Situation
 situation_pd_bonefield_flight: "Kontrola opadania"
 situation_pd_bonefield_flight_desc: "More Tiyanki will fall here. We are working out how to steer a descent onto open ground, or stop one before it reaches the surface."
 situation_pd_bonefield_flight_stage_1: "Plotting the Descents"
 situation_pd_bonefield_flight_stage_1_effect_tt: "We are learning to predict where a descent will end."
 situation_pd_bonefield_flight_stage_2: "Breaking Ground"
 situation_pd_bonefield_flight_stage_2_effect_tt: "The design is settled, and construction is underway."
 situation_pd_bonefield_flight_low: "Niski priorytet"
