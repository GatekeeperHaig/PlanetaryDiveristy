 decision_pd_aw_unflood_planet: "Drenar Planeta"
 decision_pd_aw_unflood_planet_desc: "Este planeta oceânico tem o potencial de ser um lar ideal para o nosso povo. Baixando os níveis do mar e movendo cidades para ilhas, podemos garantir que a vida floresça para aqueles adaptados a viver sobre as ondas."
 decision_pd_aw_flood_ringworld: "Inundar Mundo Anelar"
 decision_pd_aw_flood_ringworld_desc: "Este mundo anelar tem o potencial de ser um lar ideal para o nosso povo. Ajustando os níveis do mar e movendo cidades para baixo d'água, podemos garantir que a vida floresça para aqueles adaptados a viver sob as ondas."
