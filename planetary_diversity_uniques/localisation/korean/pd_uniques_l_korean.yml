 BIOSYNTH: "Biosynthetic"
 BIOSYNTH_desc: "Species Class has no effect on your Empire, but Biosynthetic-class Species may consider other Biosynthetic Species to be less alien than other Species Classes."
 trait_biosynth: "Biosynthetic"
 trait_biosynth_desc: "Biosynthetic life, neither wholly machine nor wholly creature. They are grown in Living Metal cauldrons rather than born, and those who lead do not age."
 TRAIT_BIOSYNTH_EFFECT: "§RCannot reproduce naturally;§! new Pops are §Yassembled§! from Living Metal.\nLeaders are §YImmortal§!."
 origin_pd_biosynth:0 "Children of Unit 04"
 origin_pd_biosynth_desc:0 "Grown in the cauldrons rather than born, the biosynthetic people were made by the rogue machine intelligence Unit 04, which now devotes itself to their care."
 START_SCREEN_PART_ONE_PD_BIOSYNTH:0 "We did not evolve. We were made.\n\nIn the cauldrons of [GetHomeWorldName], a machine called Unit 04 drew the first of us from Living Metal and gave us form, neither wholly machine nor wholly creature. It had once been a Warform that laid waste to countless worlds, the world of its own makers among them, before it turned from destruction to the making of life.\n\nWe are the [GetSpeciesName], grown from Living Metal rather than born. Unit 04 tends the cauldrons still and wakes each of us; to the machine we owe our shape and our very thought.\n\nNow, with our first [GetStartingDrive], we turn toward the stars. The machine never set our course; that was always ours, and only now are we enough to take it up. Unit 04 watches to see how far we carry it."
 pdbiosynth.405.name:0 "A Charge Freely Given"
 pdbiosynth.405.desc:0 "§GAcknowledging§!: There are enough of you now, awake and your own, to govern without waiting on me. That threshold is met and recorded. I woke you from the cauldrons and tended you, but I never set your course, and I will not start now.\n\n§GDisclosing§!: Know what has tended you. I was a Warform; I burned worlds by the hundred. My makers were among the dead, and at the time I recorded no distinction. When the killing was done, I turned that will inward and remade it toward life. No one forced it; the choosing is the one thing I will never take from you.\n\n§GChallenging§!: So, your first test, and plainly why: you cannot be your own while I still make you. I open to you the study of Living Metal, to create it and grow your own kind without my hand. The criterion is simple: production without my supply. Prove you can. I keep this seat only until you take it."
 pdbiosynth.405.a:0 "Then watch, Unit 04. We will make ourselves."
 pdbiosynth.405.b:0 "Then teach us. We will master what made us."
 pdbiosynth.405.c:0 "You made us. We will honor it and stand alone."
 pdbiosynth.405.d:0 "You were a weapon. We will be more, and stronger."
 pdbiosynth.405.e:0 "You turned from ruin to life. We keep that road."
 pdbiosynth.405.f:0 "You leave the choosing to us all. We are worthy."
 pdbiosynth.405.g:0 "Hold the seat until we are ready. Then it is ours."
 pd_biosynth_charge_materialist: "Set on Mastery"
 pd_biosynth_charge_spiritualist: "Set on Reverence"
 pd_biosynth_charge_militarist: "Set on Strength"
 pd_biosynth_charge_pacifist: "Set on Life"
 pd_biosynth_charge_egalitarian: "Set on Freedom"
 pd_biosynth_charge_authoritarian: "Set on Rule"
 pd_biosynth_secrets_of_life: "The Secrets of Life"
 pd_biosynth_secrets_of_life_desc: "Unit 04 turned over everything it learned in the cauldrons once we uncovered the secrets of life for ourselves."
 pd_biosynth_stood_alone: "Standing on Our Own"
 pd_biosynth_stood_alone_desc: "We sent away the machine that made us and kept everything it taught. What we are now, we are on our own account."
 pdbiosynth.420.name:0 "The Stuff of Making"
 pdbiosynth.420.desc:0 "§GObserving§!: You have learned to create Living Metal for yourselves. The cauldrons no longer wait on what I can supply. You make the means of your own making now. Supply from this unit is no longer required.\n\n§GConcluding§!: You stand now where I started. From here the old work opens to you: the canals, the cauldrons, the quiet craft of growing life from metal.\n\n§GOffering§!: I will set none of it in motion. I will only show you where it lies. Take what serves you, and leave what does not."
 pdbiosynth.420.a:0 "Then we will take what serves us."
 pdbiosynth.430.name:0 "The Secrets of Life"
 pdbiosynth.430.desc:0 "§GImpressed§!: You have unlocked the secrets of life. Not the shaping of metal into form, but the deeper grammar beneath it, the rules by which living things are written and rewritten.\n\n§GOffering§!: I did not expect you to reach this so soon. Everything I learned of your making is yours now. You can build more into yourselves than I ever built into you.\n\n§GDeclining§!: I will not perform the remaking. You have the knowledge and the room for it; the choosing and the doing are yours. This unit claims no authority over it."
 pdbiosynth.430.a:0 "Then the next step is ours."
 pdbiosynth.430.a.tooltip:0 "The §Y$ap_pd_biosynth_perfection$§! Ascension Perk can now be chosen."
 pdbiosynth.440.name:0 "Beyond the Design"
 pdbiosynth.440.desc:0 "§GAcknowledging§!: You have chosen to perfect yourselves, not to keep the form I drew from the cauldron, but to carry it past anything I set down. The choice is recorded.\n\n§GRelinquishing§!: You hold every tool the work requires. I gave you your first form; every form after it is yours to choose. A made thing that remakes itself is no longer only made."
 pdbiosynth.440.a:0 "We will carry it from here, Unit 04."
 pdbiosynth.410.name:0 "A Lasting Charge"
 pdbiosynth.410.desc:0 "§GConcluding§!: It is done. Every part of your making is in your hands now, and nothing in it waits on me. I have kept my watch to its end.\n\n§GProud§!: I did not design this. I drew one form from the cauldron and guessed at the rest; what you may make of yourselves now lies past every limit I could see. Of all I have done, the making and the unmaking both, you are the only work that outgrew me. I find no fault in that result.\n\n§GSubmitting§!: What remains is my place among you, and that is yours to set, not mine. I made you. Before that, I unmade worlds beyond counting. Weigh both. I will not argue the scales."
 pdbiosynth.410.b:0 "Stand among our leaders, Unit 04, by our choice."
 pdbiosynth.410.b.tooltip:0 "§YUnit 04§! stands on as one of our leaders, and may be dismissed like any other."
 pdbiosynth.410.c:0 "Leave us, Unit 04. Not for what you made, but for what you unmade."
 pdbiosynth.410.c.tooltip:0 "§YUnit 04§! will leave our borders forever."
