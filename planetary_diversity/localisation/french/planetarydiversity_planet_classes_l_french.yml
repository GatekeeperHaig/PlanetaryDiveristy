l_french:


###Continenetal
pc_pd_retinal: "Monde Rétinal"
pc_pd_retinal_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Hydrosphère active et stable avec de vastes masses terrestres séparées par des océans. La vie végétale est basée sur le rétinaldéhyde plutôt que sur la chlorophylle, ce qui donne à la planète une teinte violette distinctive."
pc_pd_retinal_adj: "violet"
mod_pc_pd_retinal_habitability: "Habitabilité Continentale"
trait_pc_pd_retinal_preference: "Préférence Continentale"
trait_pc_pd_retinal_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_lake: "Monde Lacustre"
pc_pd_lake_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Hydrosphère extrêmement active et stable. Le territoire est une seule zone couverte de millions de lacs de toutes tailles, tandis que le climat varie du subtropical au subarctique."
pc_pd_lake_adj: "lacustre"
mod_pc_pd_lake_habitability: "Habitabilité Continentale"
trait_pc_pd_lake_preference: "Préférence Continentale"
trait_pc_pd_lake_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_forest: "Monde Forestier"
pc_pd_forest_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Hydrosphère active et stable. De vastes masses terrestres sont presque entièrement recouvertes de forêts denses."
pc_pd_forest_adj: "forestier"
mod_pc_pd_forest_habitability: "Habitabilité Continentale"
trait_pc_pd_forest_preference: "Préférence Continentale"
trait_pc_pd_forest_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_tepid: "Monde Tiède"
pc_pd_tepid_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Hydrosphère active et stable avec de vastes masses terrestres séparées par des océans. N'ayant presque aucun axe d'inclinaison, les conditions de croissance idéales de cette planète ont permis l'évolution de nombreux types de processus photosynthétiques."
pc_pd_tepid_adj: "idyllique"
mod_pc_pd_tepid_habitability: "Habitabilité Continentale"
trait_pc_pd_tepid_preference: "Préférence Continentale"
trait_pc_pd_tepid_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_temperate: "Monde Tempéré"
pc_pd_temperate_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Hydrosphère active et stable avec de vastes masses terrestres séparées par des océans."
pc_pd_temperate_adj: "tempéré"
mod_pc_pd_temperate_habitability: "Habitabilité Continentale"
trait_pc_pd_temperate_preference: "Préférence Continentale"
trait_pc_pd_temperate_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_sakura: "Monde Sakura"
 pc_pd_sakura_desc: "Monde rocheux à l'atmosphère azote-oxygène. Hydrosphère active et stable, avec de grandes masses continentales séparées par des océans. La surface est recouverte de forêts luxuriantes d'arbres en fleurs."
 pc_pd_sakura_adj: "sakura"
 mod_pc_pd_sakura_habitability: "Habitabilité Continentale"
 trait_pc_pd_sakura_preference: "Préférence Continentale"
 trait_pc_pd_sakura_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_moss: "Monde Moussu"
 pc_pd_moss_desc: "La surface de la planète est entièrement recouverte d'une mousse dense et tentaculaire. Cette flore envahissante couvre les terres, créant un écosystème spongieux qui stabilise l'hydrosphère."
 pc_pd_moss_adj: "moussu"
 mod_pc_pd_moss_habitability: "Habitabilité Continentale"
 trait_pc_pd_moss_preference: "Préférence Continentale"
 trait_pc_pd_moss_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_marsh: "Monde Marécageux"
 pc_pd_marsh_desc: "De denses marais salants tempérés recouvrent la surface de la planète. Des mares saumâtres s'étendent jusqu'à l'horizon, où une végétation fibreuse filtre le ruissellement et ancre le sol."
 pc_pd_marsh_adj: "marécageux"
 mod_pc_pd_marsh_habitability: "Habitabilité Continentale"
 trait_pc_pd_marsh_preference: "Préférence Continentale"
 trait_pc_pd_marsh_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_carotene: "Monde Caroténoïde"
 pc_pd_carotene_desc: "De vastes plaines et des hauts plateaux dominés par une végétation riche en pigments caroténoïdes, baignant le paysage d'ambre et d'ocre. Le climat tempéré de la planète soutient une biosphère diversifiée et stable malgré la quasi-absence de vie à base de chlorophylle."
 pc_pd_carotene_adj: "caroténoïde"
 mod_pc_pd_carotene_habitability: "Habitabilité Continentale"
 trait_pc_pd_carotene_preference: "Préférence Continentale"
 trait_pc_pd_carotene_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_petrified: "Monde de Bois Pétrifiés"
pc_pd_petrified_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène avec une hydrosphère active et stable. Les vastes masses terrestres sont séparées par des océans, avec de grandes variations climatiques. En raison de l'effet d'un déluge planétaire après une ère glaciaire, des restes pétrifiés de géants arbres peuvent être trouvés à la fois à la surface et enterrés dans le sol."
pc_pd_petrified_adj: "pétrifié"
mod_pc_pd_petrified_habitability: "Habitabilité Continentale"
trait_pc_pd_petrified_preference: "Préférence Continentale"
trait_pc_pd_petrified_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_megaflora: "Monde de Mégaflore"
pc_pd_megaflora_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Densement boisé avec une hydrosphère forte et saine. Cette planète abrite une mégafloraison géante qui recouvre la surface de la planète."
pc_pd_megaflora_adj: "forestier"
mod_pc_pd_megaflora_habitability: "Habitabilité Continentale"
trait_pc_pd_megaflora_preference: "Préférence Continentale"
trait_pc_pd_megaflora_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_mushroom: "Monde de Champignons"
pc_pd_mushroom_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Densement boisé avec une hydrosphère forte et saine. Cette planète est le foyer de champignons géants."
pc_pd_mushroom_adj: "fongique"
mod_pc_pd_mushroom_habitability: "Habitabilité Continentale"
trait_pc_pd_mushroom_preference: "Préférence Continentale"
trait_pc_pd_mushroom_preference_desc: "$trait_pc_arctic_preference_desc$"

###Ocean
pc_pd_cascadian: "Monde Cascadien"
pc_pd_cascadian_desc: "Monde montagneux sub-tempéré avec une atmosphère à base d'azote et d'oxygène composé de forêts côtières et de chaînes de montagnes imposantes. Une hydrosphère active et tempétueuse avec de fortes différences entre les hivers enneigés et les courtes étés plus chauds."
pc_pd_cascadian_adj: "escarpé"
mod_pc_pd_cascadian_habitability: "Habitabilité Océanique"
trait_pc_pd_cascadian_preference: "Préférence Océanique"
trait_pc_pd_cascadian_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_swamp: "Monde de Marais"
pc_pd_swamp_desc: "Un monde humide avec une atmosphère à base d'azote et d'oxygène. La majeure partie de la planète est couverte de zones humides forestières denses avec très peu de surfaces émergées. L'hydrosphère est forte et stable principalement dans les mers peu profondes, les marais et les tourbières, et soutient une grande abondance de vie végétale et animale."
pc_pd_swamp_adj: "marécageux"
mod_pc_pd_swamp_habitability: "Habitabilité Océanique"
trait_pc_pd_swamp_preference: "Préférence Océanique"
trait_pc_pd_swamp_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_crag: "Monde d'Ocean Boréal"
pc_pd_crag_desc: "Monde froid et rocheux avec une atmosphère à base d'azote et d'oxygène et une hydrosphère significative. Les océans et les calottes glaciaires polaires couvrent plus de 99% de la surface, avec des îles escarpées parsemées. Il y a une abondance d'activité volcanique et géothermique qui soutient les écosystèmes marins."
pc_pd_crag_adj: "subarctique"
mod_pc_pd_crag_habitability: "Habitabilité Océanique"
trait_pc_pd_crag_preference: "Préférence Océanique"
trait_pc_pd_crag_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_fog: "Monde Brumeux"
pc_pd_fog_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène et une hydrosphère significative. Les océans couvrent une grande partie de la surface et l'humidité extrême provoque un brouillard presque constant qui se déplace sur les forêts luxuriantes et les prairies."
pc_pd_fog_adj: "brumeux"
mod_pc_pd_fog_habitability: "Habitabilité Océanique"
trait_pc_pd_fog_preference: "Préférence Océanique"
trait_pc_pd_fog_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_kelp: "Monde d'Algues Marines"
pc_pd_kelp_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène et une hydrosphère significative. Des océans riches en forêts de varech recouvrent une grande partie de la surface."
pc_pd_kelp_adj: "algueux"
mod_pc_pd_kelp_habitability: "Habitabilité Océanique"
trait_pc_pd_kelp_preference: "Préférence Océanique"
trait_pc_pd_kelp_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_algae: "Monde d'Algues Roses"
pc_pd_algae_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène et une hydrosphère significative. Des océans riches en blooms d'algues roses recouvrent une grande partie de la surface."
pc_pd_algae_adj: "rosâtre"
mod_pc_pd_algae_habitability: "Habitabilité Océanique"
trait_pc_pd_algae_preference: "Préférence Océanique"
trait_pc_pd_algae_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_columnar: "Monde Colonnaire"
 pc_pd_columnar_desc: "Monde rocheux à l'atmosphère azote-oxygène et à l'hydrosphère étendue. La surface est recouverte d'océans entrecoupés de masses continentales formées de structures basaltiques colonnaires, résultant d'éons d'activité volcanique intense."
 pc_pd_columnar_adj: "colonnaire"
 mod_pc_pd_columnar_habitability: "Habitabilité Océanique"
 trait_pc_pd_columnar_preference: "Préférence Océanique"
 trait_pc_pd_columnar_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_tidepool: "Monde à Bassins de Marée"
 pc_pd_tidepool_desc: "Monde océanique rocheux à l'atmosphère azote-oxygène et aux mers peu profondes. Les marées quotidiennes exposent de vastes champs de bassins de marée, créant des écosystèmes littoraux dynamiques qui abritent une faune marine diversifiée."
 pc_pd_tidepool_adj: "peu profond"
 mod_pc_pd_tidepool_habitability: "Habitabilité Océanique"
 trait_pc_pd_tidepool_preference: "Préférence Océanique"
 trait_pc_pd_tidepool_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_barnacle: "Monde à Balanes"
 pc_pd_barnacle_desc: "Vaste monde océanique à l'atmosphère azote-oxygène, parsemé d'îlots rocheux. Des balanes de toutes tailles incrustent les rivages et les hauts-fonds, depuis de petits amas sur les rochers côtiers jusqu'à d'imposantes formations ancestrales qui dominent le littoral."
 pc_pd_barnacle_adj: "couvert de balanes"
 mod_pc_pd_barnacle_habitability: "Habitabilité Océanique"
 trait_pc_pd_barnacle_preference: "Préférence Océanique"
 trait_pc_pd_barnacle_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_reef: "Monde de Récifs"
pc_pd_reef_desc: "Monde rocheux tempéré avec une atmosphère à base d'azote et d'oxygène et une hydrosphère significative. Les océans peu profonds recouvrent plus de 99% de la surface et sous la surface, des systèmes de récifs significatifs peuvent être vus depuis l'orbite. Les seules zones émergées sont là où le système de récifs a atteint une hauteur suffisante pour créer des chaînes d'îles coralliennes éparpillées."
pc_pd_reef_adj: "récifal"
mod_pc_pd_reef_habitability: "Habitabilité Océanique"
trait_pc_pd_reef_preference: "Préférence Océanique"
trait_pc_pd_reef_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_archipelago: "Monde d'Archipel"
pc_pd_archipelago_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène et une hydrosphère significative. Un océan planétaire avec des archipels d'îles dispersées couvre la surface. L'activité volcanique riche fait que les îles apparaissent et disparaissent à un taux relativement élevé, créant un paysage toujours changeant."
pc_pd_archipelago_adj: "insulaire"
mod_pc_pd_archipelago_habitability: "Habitabilité Océanique"
trait_pc_pd_archipelago_preference: "Préférence Océanique"
trait_pc_pd_archipelago_preference_desc: "$trait_pc_arctic_preference_desc$"

###Tropical
pc_pd_atoll: "Monde d'Atoll"
pc_pd_atoll_desc: "Une planète océanique avec une atmosphère à base d'azote et d'oxygène. Des lagons peu profonds, des récifs coralliens et des îles tropicales constituent la majeure partie de cette planète, avec des températures chaudes soutenant une très grande biosphère."
pc_pd_atoll_adj: "tropical"
mod_pc_pd_atoll_habitability: "Habitabilité Tropicale"
trait_pc_pd_atoll_preference: "Préférence Tropicale"
trait_pc_pd_atoll_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_tepui: "Monde Tepui"
pc_pd_tepui_desc: "Monde rocheux montagneux et luxuriant avec une atmosphère à base d'azote et d'oxygène. Avec une hydrosphère significative et recouvert d'une végétation dense, il y a une différence notable entre les plateaux pluvieux plus frais des tepuys et la jungle humide plus chaude au niveau du sol."
pc_pd_tepui_adj: "montagneux"
mod_pc_pd_tepui_habitability: "Habitabilité Tropicale"
trait_pc_pd_tepui_preference: "Préférence Tropicale"
trait_pc_pd_tepui_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_mangrove: "Monde de Mangroves"
pc_pd_mangrove_desc: "Un monde humide avec une atmosphère à base d'azote et d'oxygène. La majeure partie de la planète est couverte de mers peu profondes avec très peu de terre au-dessus du niveau de la mer. Les jungles s'étendent sur des centaines de kilomètres au-delà des côtes des rares îles existantes. L'hydrosphère est forte et stable, et soutient une grande abondance de vie végétale et animale."
pc_pd_mangrove_adj: "forestier"
mod_pc_pd_mangrove_habitability: "Habitabilité Tropicale"
trait_pc_pd_mangrove_preference: "Préférence Tropicale"
trait_pc_pd_mangrove_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_cenote: "Monde de Cenotes"
pc_pd_cenote_desc: "Monde rocheux et humide avec une atmosphère dense à base d'azote et d'oxygène. De grands gouffres et des systèmes de rivières souterraines serpentent sous la surface de cette planète. La plupart des masses terrestres sont couvertes d'une végétation dense."
pc_pd_cenote_adj: "percé"
mod_pc_pd_cenote_habitability: "Habitabilité Tropicale"
trait_pc_pd_cenote_preference: "Préférence Tropicale"
trait_pc_pd_cenote_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_fungal: "Monde Fongique"
pc_pd_fungal_desc: "Un monde rocheux et humide avec une atmosphère dense à base d'azote et d'oxygène, cette planète connaît des saisons de précipitations importantes. Les masses terrestres sont recouvertes de végétation à base de champignons et regorgent de vie."
pc_pd_fungal_adj: "fongique"
mod_pc_pd_fungal_habitability: "Habitabilité Tropicale"
trait_pc_pd_fungal_preference: "Préférence Tropicale"
trait_pc_pd_fungal_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_aerial: "Monde Aérien"
pc_pd_aerial_desc: "Un monde rocheux et humide avec une atmosphère dense à base d'azote et d'oxygène, cette planète connaît des précipitations importantes. Bien au-dessus des masses terrestres recouvertes de végétation dense, d'énormes capsules de graines, portées par la flore unique de la planète, glissent à travers les cieux comme des nuages."
pc_pd_aerial_adj: "flottant"
mod_pc_pd_aerial_habitability: "Habitabilité Tropicale"
trait_pc_pd_aerial_preference: "Préférence Tropicale"
trait_pc_pd_aerial_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_lilypad: "Monde de Nénuphars"
pc_pd_lilypad_desc: "Ce monde rocheux luxuriant enveloppé dans une atmosphère dense à base d'azote et d'oxygène berce des océans chauds et peu profonds avec une biodiversité vibrante. À la surface, les feuilles robustes de la flore aquatique forment un écosystème secondaire basé sur la surface."
pc_pd_lilypad_adj: "flottant"
mod_pc_pd_lilypad_habitability: "Habitabilité Tropicale"
trait_pc_pd_lilypad_preference: "Préférence Tropicale"
trait_pc_pd_lilypad_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_obsidian: "Monde d'Obsidienne"
 pc_pd_obsidian_desc: "Ce monde humide possède une atmosphère azote-oxygène et des mers tropicales peu profondes bordées d'importants gisements d'obsidienne, où une flore résiliente s'est établie sur le terrain volcanique."
 pc_pd_obsidian_adj: "obsidien"
 mod_pc_pd_obsidian_habitability: "Habitabilité Tropicale"
 trait_pc_pd_obsidian_preference: "Préférence Tropicale"
 trait_pc_pd_obsidian_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_thunder: "Monde des Orages"
 pc_pd_thunder_desc: "Ce monde tropical est ravagé par des orages quasi permanents. Une épaisse couverture nuageuse et des pluies incessantes alimentent de vastes systèmes tempétueux qui balayent sans relâche ses océans et ses jungles, créant un cycle hydrologique extrêmement actif."
 pc_pd_thunder_adj: "orageux"
 mod_pc_pd_thunder_habitability: "Habitabilité Tropicale"
 trait_pc_pd_thunder_preference: "Préférence Tropicale"
 trait_pc_pd_thunder_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_geothermal: "Monde Géothermique"
pc_pd_geothermal_desc: "Planète froide et glaciale avec des rifts tropicaux qui brisent les étendues de glace, chauffés par des évents géothermiques naturels avec une atmosphère à base d'azote et d'oxygène. L'hydrosphère est en eau de fonte et en vapeur montant des évents."
pc_pd_geothermal_adj: "géothermique"
mod_pc_pd_geothermal_habitability: "Habitabilité Tropicale"
trait_pc_pd_geothermal_preference: "Préférence Tropicale"
trait_pc_pd_geothermal_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_biolumen: "Monde Bioluminescent"
pc_pd_biolumen_desc: "Un monde rocheux tropical avec une atmosphère à base d'azote et d'oxygène. Des particules exotiques mais non toxiques dans l'atmosphère provoquent une couverture nuageuse presque constante sur cette planète. Malgré cela, en raison de l'effet de serre et de l'activité géothermique, la vie prospère à la surface. Presque toute la flore et la faune présentent des traits bioluminescents."
pc_pd_biolumen_adj: "lumineux"
mod_pc_pd_biolumen_habitability: "Habitabilité Tropicale"
trait_pc_pd_biolumen_preference: "Préférence Tropicale"
trait_pc_pd_biolumen_preference_desc: "$trait_pc_arctic_preference_desc$"

###Desert
pc_pd_dune: "Monde de Dunes"
pc_pd_dune_desc: "Planète rocheuse chaude et sèche avec une atmosphère à base d'azote et d'oxygène. Des mers de dunes couvrent une partie considérable de la surface. L'hydrosphère se trouve principalement dans les aquifères souterrains qui jaillissent dans les oasis et les sources de montagne."
pc_pd_dune_adj: "sablé"
mod_pc_pd_dune_habitability: "Habitabilité Désertique"
trait_pc_pd_dune_preference: "Préférence Désertique"
trait_pc_pd_dune_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_oasis: "Monde d'Oasis"
pc_pd_oasis_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. L'hydrosphère ne supporte qu'un seul grand plan d'eau avec une bande de végétation autour, et la pluie manque souvent au désert intérieur qui couvre la majeure partie de la planète."
pc_pd_oasis_adj: "sec"
mod_pc_pd_oasis_habitability: "Habitabilité Désertique"
trait_pc_pd_oasis_preference: "Préférence Désertique"
trait_pc_pd_oasis_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_outback: "Monde d'Arrière-pays"
pc_pd_outback_desc: "Un monde chaud et sec avec une atmosphère à base d'azote et d'oxygène. La majeure partie de la planète est couverte de broussailles arides ou semi-arides et de déserts, tandis que les zones autour de l'eau ont plus de végétation. L'hydrosphère est principalement confinée à quelques mers intérieures et sources souterraines naturelles."
pc_pd_outback_adj: "desséché"
mod_pc_pd_outback_habitability: "Habitabilité Désertique"
trait_pc_pd_outback_preference: "Préférence Désertique"
trait_pc_pd_outback_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_coastal: "Monde Côtier"
pc_pd_coastal_desc: "Un monde sec subtropical avec une atmosphère à base d'azote et d'oxygène. Les océans profonds et froids ont des courants qui provoquent une forte stabilité atmosphérique réduisant les précipitations sur terre mais permettant le brouillard, ce qui fournit une humidité suffisante pour soutenir une variété de lichens, de succulentes et d'arbustes."
pc_pd_coastal_adj: "côtier"
mod_pc_pd_coastal_habitability: "Habitabilité Désertique"
trait_pc_pd_coastal_preference: "Préférence Désertique"
trait_pc_pd_coastal_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_fungi: "Monde Fongique"
pc_pd_fungi_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Le terrain recouvert de cendres volcaniques soutient de grandes colonies de champignons désertiques, et une grande partie de la surface est inhospitalière pour la plupart des formes de vie végétale et animale."
pc_pd_fungi_adj: "fongique"
mod_pc_pd_fungi_habitability: "Habitabilité Désertique"
trait_pc_pd_fungi_preference: "Préférence Désertique"
trait_pc_pd_fungi_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_ironsand: "Monde de Sable Ferreux"
 pc_pd_ironsand_desc: "Cette planète désertique possède des gisements de fer inhabituellement élevés, donnant un sable rouge vif dû à l'oxydation du fer, ainsi que des roches sombres riches en minéraux non oxydés."
 pc_pd_ironsand_adj: "sableux"
 mod_pc_pd_ironsand_habitability: "Habitabilité Désertique"
 trait_pc_pd_ironsand_preference: "Préférence Désertique"
 trait_pc_pd_ironsand_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_cactus: "Monde des Cactus"
 pc_pd_cactus_desc: "Cette planète désertique est dominée par d'imposants cactus, qui stockent de vastes réserves d'eau dans leurs troncs épais et épineux."
 pc_pd_cactus_adj: "épineux"
 mod_pc_pd_cactus_habitability: "Habitabilité Désertique"
 trait_pc_pd_cactus_preference: "Préférence Désertique"
 trait_pc_pd_cactus_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_dust: "Monde des Tempêtes de Poussière"
 pc_pd_dust_desc: "Les cycles d'humidité instables et les puissants courants aériens de ce monde désertique déclenchent de vastes fronts de poussière qui balaient la surface. Ces tempêtes traversent la planète lentement mais avec force, ensevelissant le terrain et remodelant le paysage."
 pc_pd_dust_adj: "poussiéreux"
 mod_pc_pd_dust_habitability: "Habitabilité Désertique"
 trait_pc_pd_dust_preference: "Préférence Désertique"
 trait_pc_pd_dust_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_sodalite: "Monde de Sodalite"
 pc_pd_sodalite_desc: "Monde désertique rocheux à l'atmosphère azote-oxygène. De vastes gisements de sodalite strient les plaines arides et les parois des canyons, entrecoupés d'affleurements rocheux dispersés sur le terrain désertique."
 pc_pd_sodalite_adj: "minéral"
 mod_pc_pd_sodalite_habitability: "Habitabilité Désertique"
 trait_pc_pd_sodalite_preference: "Préférence Désertique"
 trait_pc_pd_sodalite_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_salt: "Monde de Sel"
pc_pd_salt_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Le terrain couvert de minéraux se compose principalement de plaines de sel et de chaînes de montagnes et de grandes formations cristallines. Une grande partie de la surface est inhospitalière pour la plupart des formes de vie végétale et animale."
pc_pd_salt_adj: "salé"
mod_pc_pd_salt_habitability: "Habitabilité Désertique"
trait_pc_pd_salt_preference: "Préférence Désertique"
trait_pc_pd_salt_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_aquifer: "Monde Aquifère"
pc_pd_aquifer_desc: "Monde sec et rocheux avec une atmosphère à base d'azote et d'oxygène. Cette planète possède une riche hydrosphère sous la surface, et d'innombrables lagunes parsèment la surface. Bien que le sable sec et chaud ne soutienne pas beaucoup de vie, les lagunes et les rivières souterraines sont riches en biodiversité."
pc_pd_aquifer_adj: "lagunaire"
mod_pc_pd_aquifer_habitability: "Habitabilité Désertique"
trait_pc_pd_aquifer_preference: "Préférence Désertique"
trait_pc_pd_aquifer_preference_desc: "$trait_pc_arctic_preference_desc$"

###Arid
pc_pd_mesa: "Monde de Mesas"
pc_pd_mesa_desc: "Monde rocheux chaud et sec avec une atmosphère à base d'azote et d'oxygène. Les grands plateaux et les mesas sont courants autour de l'équateur, avec des régions polaires plus fraîches et boisées. L'hydrosphère se trouve principalement dans de grands fleuves avec des canyons coupés et une végétation couvrant les lits de rivières."
pc_pd_mesa_adj: "aride"
mod_pc_pd_mesa_habitability: "Habitabilité Aride"
trait_pc_pd_mesa_preference: "Préférence Aride"
trait_pc_pd_mesa_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_fog_desert: "Monde Désertique Brumeux"
pc_pd_fog_desert_desc: "Monde rocheux froid, sec, avec une atmosphère à base d'azote et d'oxygène. Les pics d'altitude extrême provoquent des ombres de pluie pour la majeure partie de la surface. Les salines et les vallées arides composent la majeure partie des plateaux, et l'hydrosphère est dans quelques lacs et sources de montagne."
pc_pd_fog_desert_adj: "impraticable"
mod_pc_pd_fog_desert_habitability: "Habitabilité Aride"
trait_pc_pd_fog_desert_preference: "Préférence Aride"
trait_pc_pd_fog_desert_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_mediterranean: "Monde Méditerranéen"
pc_pd_mediterranean_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène. L'hydrosphère soutient plusieurs grands lacs intérieurs, entourés d'une végétation clairsemée et de buissons. À l'écart des plans d'eau, le terrain est aride."
pc_pd_mediterranean_adj: "chaud"
mod_pc_pd_mediterranean_habitability: "Habitabilité Aride"
trait_pc_pd_mediterranean_preference: "Préférence Aride"
trait_pc_pd_mediterranean_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_badlands: "Monde de Terres Arides"
pc_pd_badlands_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène. Le terrain sec se compose principalement de roches sédimentaires et de sols argileux érodés par le vent et l'eau. La végétation se compose principalement de buissons et de graminées robustes."
pc_pd_badlands_adj: "accidenté"
mod_pc_pd_badlands_habitability: "Habitabilité Aride"
trait_pc_pd_badlands_preference: "Préférence Aride"
trait_pc_pd_badlands_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_succulent: "Monde de Succulentes"
pc_pd_succulent_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène, avec un terrain aride couvert de poussière. Les températures élevées et les faibles précipitations sporadiques ont incité la végétation à s'adapter à des techniques de rétention d'eau."
pc_pd_succulent_adj: "juteux"
mod_pc_pd_succulent_habitability: "Habitabilité Aride"
trait_pc_pd_succulent_preference: "Préférence Aride"
trait_pc_pd_succulent_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_coral: "Monde de Coraux"
pc_pd_coral_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène. Autrefois couvert d'océans, il a presque entièrement perdu son hydrosphère en raison de facteurs écologiques. Les coraux de ce monde se sont adaptés à l'environnement sec."
pc_pd_coral_adj: "corallien"
mod_pc_pd_coral_habitability: "Habitabilité Aride"
trait_pc_pd_coral_preference: "Préférence Aride"
trait_pc_pd_coral_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_primal: "Monde Primal"
pc_pd_primal_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. L'activité volcanique de ce jeune monde a ralenti, donnant naissance à une flore et une faune de plus en plus complexes, ce qui a contribué à créer une atmosphère respirable et une hydrosphère stabilisante."
pc_pd_primal_adj: "primordial"
mod_pc_pd_primal_habitability: "Habitabilité Aride"
trait_pc_pd_primal_preference: "Préférence Aride"
trait_pc_pd_primal_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_striped: "Monde Rayé"
pc_pd_striped_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène. Une composition minéralogique frappante est visible sur son terrain aride couvert de poussière."
pc_pd_striped_adj: "rayé"
mod_pc_pd_striped_habitability: "Habitabilité Aride"
trait_pc_pd_striped_preference: "Préférence Aride"
trait_pc_pd_striped_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_amethyst: "Monde d'Améthyste"
 pc_pd_amethyst_desc: "Ce monde aride a connu un passé géologique très actif, entraînant d'importants gisements de quartz améthyste dans toute la croûte de la planète."
 pc_pd_amethyst_adj: "améthyste"
 mod_pc_pd_amethyst_habitability: "Habitabilité Aride"
 trait_pc_pd_amethyst_preference: "Préférence Aride"
 trait_pc_pd_amethyst_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_opal: "Monde d'Opale"
 pc_pd_opal_desc: "Des eaux riches en silice ont autrefois infiltré la croûte de ce monde aride, comblant fissures et cavités. En séchant, la planète a durci ces dépôts en de colossales formations d'opale qui dominent aujourd'hui le paysage."
 pc_pd_opal_adj: "opalin"
 mod_pc_pd_opal_habitability: "Habitabilité Aride"
 trait_pc_pd_opal_preference: "Préférence Aride"
 trait_pc_pd_opal_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_superbloom: "Monde de Floraison Explosive"
pc_pd_superbloom_desc: "Monde sec et rocheux à l'atmosphère azote-oxygène. Des sols riches en nutriments et de rares mais intenses pluies saisonnières déclenchent des floraisons en cascade à travers la surface, tapissant plaines et fonds de canyons de denses vagues de végétation fleurie."
pc_pd_superbloom_adj: "fleuri"
mod_pc_pd_superbloom_habitability: "Habitabilité Aride"
trait_pc_pd_superbloom_preference: "Préférence Aride"
trait_pc_pd_superbloom_preference_desc: "$trait_pc_arctic_preference_desc$"

###Savannah
pc_pd_steppe: "Monde de Steppes"
pc_pd_steppe_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène. Cette prairie semi-aride est composée de collines ondulantes et de plaines couvrant une grande partie de la surface. Bien que presque aucun arbre ne pousse, les précipitations peuvent soutenir des buissons et des herbes."
pc_pd_steppe_adj: "prairial"
mod_pc_pd_steppe_habitability: "Habitabilité Savane"
trait_pc_pd_steppe_preference: "Préférence Savane"
trait_pc_pd_steppe_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_prairie: "Monde de Prairies"
pc_pd_prairie_desc: "Monde rocheux avec une atmosphère à base d'azote et d'oxygène. Hydrosphère saisonnière avec un seul grand massif terrestre, de grands lacs intérieurs, de courts étés secs et des hivers froids et rigoureux."
pc_pd_prairie_adj: "des prairies"
mod_pc_pd_prairie_habitability: "Habitabilité Savane"
trait_pc_pd_prairie_preference: "Préférence Savane"
trait_pc_pd_prairie_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_veld: "Monde de Velds"
pc_pd_veld_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène, ce paysage subtropical est couvert de broussailles et de savanes ouvertes dans un monde rocheux sec avec une atmosphère à base d'azote et d'oxygène. Ce monde a des hivers doux et de longs étés chauds."
pc_pd_veld_adj: "veldien"
mod_pc_pd_veld_habitability: "Habitabilité Savane"
trait_pc_pd_veld_preference: "Préférence Savane"
trait_pc_pd_veld_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_semi_arid: "Monde Semi-Aride"
pc_pd_semi_arid_desc: "Monde rocheux recouvert de terres brûlées et de vallées rocheuses avec une atmosphère à base d'azote et d'oxygène, et l'hydrosphère permet une courte mais importante saison des pluies. Cependant, à l'exception de quelques types d'herbes omniprésents, la végétation est principalement concentrée autour des vallées protégées et près des grands plans d'eau."
pc_pd_semi_arid_adj: "aride"
mod_pc_pd_semi_arid_habitability: "Habitabilité Savane"
trait_pc_pd_semi_arid_preference: "Préférence Savane"
trait_pc_pd_semi_arid_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_aspen: "Monde de Peupliers"
pc_pd_aspen_desc: "Monde rocheux sec avec une atmosphère à base d'azote et d'oxygène constitué de bosquets d'arbres entrecoupés de prairies. Une hydrosphère de ruisseaux et de vallées fluviales supporte les forêts et les buissons denses."
pc_pd_aspen_adj: "boisé"
mod_pc_pd_aspen_habitability: "Habitabilité Savane"
trait_pc_pd_aspen_preference: "Préférence Savane"
trait_pc_pd_aspen_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_sandstone: "Monde de Grès"
pc_pd_sandstone_desc: "Un monde sec et rocheux possédant une atmosphère à base d'azote et d'oxygène comprenant d'immenses prairies et des formations de grès sculptées par les vents incessants. Son hydrosphère soutient les herbes résilientes qui se sont adaptées pour prospérer dans cet environnement."
pc_pd_sandstone_adj: "venteux"
mod_pc_pd_sandstone_habitability: "Habitabilité Savane"
trait_pc_pd_sandstone_preference: "Préférence Savane"
trait_pc_pd_sandstone_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_turquoise: "Monde de Turquoise"
 pc_pd_turquoise_desc: "Cette planète de prairies subtropicales est parsemée de vastes gisements de pierres de turquoise, que l'on retrouve presque partout à sa surface."
 pc_pd_turquoise_adj: "turquoise"
 mod_pc_pd_turquoise_habitability: "Habitabilité Savane"
 trait_pc_pd_turquoise_preference: "Préférence Savane"
 trait_pc_pd_turquoise_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_calcite: "Monde de Calcite"
 pc_pd_calcite_desc: "Cette planète de savane est parsemée d'imposantes formations rocheuses de calcite en pointes. La calcite enrichit le sol, créant des conditions idéales pour les herbes et le reste de la flore."
 pc_pd_calcite_adj: "lamellaire"
 mod_pc_pd_calcite_habitability: "Habitabilité Savane"
 trait_pc_pd_calcite_preference: "Préférence Savane"
 trait_pc_pd_calcite_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_monsoon: "Monde des Moussons"
 pc_pd_monsoon_desc: "Monde rocheux à l'atmosphère azote-oxygène. Des schémas de circulation saisonniers entraînent d'intenses moussons à travers la surface, inondant de vastes plaines avant de se retirer en périodes de chaleur sèche."
 pc_pd_monsoon_adj: "moussonique"
 mod_pc_pd_monsoon_habitability: "Habitabilité Savane"
 trait_pc_pd_monsoon_preference: "Préférence Savane"
 trait_pc_pd_monsoon_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_silvergrass: "Monde d'Herbe Argentée"
 pc_pd_silvergrass_desc: "Un monde de savane avec une atmosphère à base d'azote et d'oxygène et des rayonnements ultraviolets élevés. Ses plaines infinies sont recouvertes d'herbes dont les brins sont enduits d'une cire réfléchissante, une adaptation aux saisons sèches rigoureuses de la planète."
 pc_pd_silvergrass_adj: "argenté"
 mod_pc_pd_silvergrass_habitability: "Habitabilité Savane"
 trait_pc_pd_silvergrass_preference: "Préférence Savane"
 trait_pc_pd_silvergrass_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_supercontinent: "Monde Supercontinent"
pc_pd_supercontinent_desc: "Monde rocheux de prairies et de déserts avec une atmosphère à base d'azote et d'oxygène, les plaques tectoniques de cette planète se trouvent actuellement dans l'état d'un supercontinent. Les zones côtières immédiates sont luxuriantes, mais une grande partie du terrain intérieur est constituée de prairies qui se transforment lentement en grands déserts arides."
pc_pd_supercontinent_adj: "supercontinental"
mod_pc_pd_supercontinent_habitability: "Habitabilité Savane"
trait_pc_pd_supercontinent_preference: "Préférence Savane"
trait_pc_pd_supercontinent_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_sinkhole: "Monde de Gouffres"
pc_pd_sinkhole_desc: "Monde rocheux dominé par des plaines sèches et arides couvertes par une atmosphère à base d'azote et d'oxygène. Bien que la surface ait une hydrosphère petite et stable, un océan souterrain planétaire se cache en dessous, créant des gouffres géants parsemant la surface de ce monde."
pc_pd_sinkhole_adj: "troué"
mod_pc_pd_sinkhole_habitability: "Habitabilité Savane"
trait_pc_pd_sinkhole_preference: "Préférence Savane"
trait_pc_pd_sinkhole_preference_desc: "$trait_pc_arctic_preference_desc$"

###Arctique
pc_pd_cold_desert: "Monde de Déserts Froids"
pc_pd_cold_desert_desc: "Monde rocheux froid avec une atmosphère à base d'azote et d'oxygène. Les précipitations sont faibles, et les grands plans d'eau de surface sont rares. Même pendant la journée, les températures moyennes sont souvent bien en dessous de zéro."
pc_pd_cold_desert_adj: "froid"
mod_pc_pd_cold_desert_habitability: "Habitabilité Arctique"
trait_pc_pd_cold_desert_preference: "Préférence Arctique"
trait_pc_pd_cold_desert_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_glacial: "Monde Glaciaire"
pc_pd_glacial_desc: "Monde glacial et glacé avec une atmosphère à base d'azote et d'oxygène ; l'hydrosphère est bloquée dans la glace glaciaire la majeure partie de l'année, mais les mois d'été connaissent une fonte significative, et la neige est assez courante. L'activité géothermique crée des trous permanents dans la glace et aide à soutenir une abondance de vie marine sous l'épaisse couche de glace de surface."
pc_pd_glacial_adj: "glaciaire"
mod_pc_pd_glacial_habitability: "Habitabilité Arctique"
trait_pc_pd_glacial_preference: "Préférence Arctique"
trait_pc_pd_glacial_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_antarctic: "Monde Antarctique"
pc_pd_antarctic_desc: "Monde rocheux froid avec une atmosphère à base d'azote et d'oxygène et des températures basses, et l'hydrosphère est principalement gelée. Bien que les vents puissent atteindre plus de 25 km par heure en hiver, la vie s'accroche à des poches isolées sous la glace de mer, dans des grottes et des vallées protégées."
pc_pd_antarctic_adj: "gelé"
mod_pc_pd_antarctic_habitability: "Habitabilité Arctique"
trait_pc_pd_antarctic_preference: "Préférence Arctique"
trait_pc_pd_antarctic_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_aeolian: "Monde Éolien"
pc_pd_aeolian_desc: "Monde rocheux froid avec une atmosphère à base d'azote et d'oxygène, les vents de cette planète atteignent régulièrement des vitesses de plus de 300 km par heure. Ces vents ont créé des gouffres creusés, des canyons et des dépressions, permettant à la vie de prospérer à l'intérieur, à l'abri des intempéries."
pc_pd_aeolian_adj: "venteux"
mod_pc_pd_aeolian_habitability: "Habitabilité Arctique"
trait_pc_pd_aeolian_preference: "Préférence Arctique"
trait_pc_pd_aeolian_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_ice_spike: "Monde de Pics de Glace"
pc_pd_ice_spike_desc: "Monde rocheux froid avec une atmosphère à base d'azote et d'oxygène, cette planète a une hydrosphère principalement gelée. L'activité tectonique intense sous la surface heurte la profonde couche de glace, créant les pics de glace imposants qui dominent le paysage."
pc_pd_ice_spike_adj: "crénelé"
mod_pc_pd_ice_spike_habitability: "Habitabilité Arctique"
trait_pc_pd_ice_spike_preference: "Préférence Arctique"
trait_pc_pd_ice_spike_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_crevasse: "Monde de Crevasses"
pc_pd_crevasse_desc: "Monde rocheux froid avec une atmosphère à base d'azote et d'oxygène, cette planète a une hydrosphère principalement gelée. Bien que la surface soit inhospitalière, l'énergie géothermique du noyau planétaire maintient le fond des nombreuses crevasses de cette planète habitable."
pc_pd_crevasse_adj: "crevassé"
mod_pc_pd_crevasse_habitability: "Habitabilité Arctique"
trait_pc_pd_crevasse_preference: "Préférence Arctique"
trait_pc_pd_crevasse_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_supraglacial_lakes: "Monde à Lacs Supraglaciaires"
 pc_pd_supraglacial_lakes_desc: "Monde glacial à l'atmosphère azote-oxygène, cette planète a une surface majoritairement gelée, entrecoupée de vastes lacs d'eau de fonte qui s'accumulent sur d'épaisses calottes glaciaires. Alimentés par l'énergie solaire saisonnière, ces lacs supraglaciaires sont répandus à travers le paysage."
 pc_pd_supraglacial_lakes_adj: "glaciaire"
 mod_pc_pd_supraglacial_lakes_habitability: "Habitabilité Arctique"
 trait_pc_pd_supraglacial_lakes_preference: "Préférence Arctique"
 trait_pc_pd_supraglacial_lakes_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_ice_dunes: "Monde de Dunes de Glace"
pc_pd_ice_dunes_desc: "Monde rocheux froid avec une atmosphère à base d'azote et d'oxygène, cette planète a une hydrosphère principalement gelée. Avec des températures sous le point de congélation pendant la majeure partie de l'année, des particules de glace ressemblant à du sable créent les dunes de cette planète."
pc_pd_ice_dunes_adj: "glacial"
mod_pc_pd_ice_dunes_habitability: "Habitabilité Arctique"
trait_pc_pd_ice_dunes_preference: "Préférence Arctique"
trait_pc_pd_ice_dunes_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_ferrospring: "Monde des Sources Ferrugineuses"
 pc_pd_ferrospring_desc: "Monde glacial et rocheux à l'atmosphère azote-oxygène, dont la croûte gelée est fracturée par une activité géothermique. Des aquifères souterrains riches en fer alimentent des sources et des lacs de surface, teintant les eaux d'un rouge profond sur ce terrain gelé."
 pc_pd_ferrospring_adj: "glacé"
 mod_pc_pd_ferrospring_habitability: "Habitabilité Arctique"
 trait_pc_pd_ferrospring_preference: "Préférence Arctique"
 trait_pc_pd_ferrospring_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_storm: "Monde de Tempêtes"
pc_pd_storm_desc: "Monde rocheux froid avec une atmosphère à base d'azote et d'oxygène, cette planète a une forte hydrosphère. Les masses terrestres de la planète se trouvent aux pôles, séparées par un océan massif qui génère des tempêtes puissantes toute l'année. En raison des conditions extrêmes, la majeure partie de la vie de la planète se trouve sous la surface de l'océan."
pc_pd_storm_adj: "tempétueux"
mod_pc_pd_storm_habitability: "Habitabilité Arctique"
trait_pc_pd_storm_preference: "Préférence Arctique"
trait_pc_pd_storm_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_iceberg: "Monde d'Icebergs"
pc_pd_iceberg_desc: "Monde rocheux froid et glacial avec une atmosphère à base d'azote et d'oxygène, cette planète a une robuste hydrosphère salée. Malgré des températures inférieures au point de congélation, l'océan salé et saumâtre couvre toute la surface et reste liquide. L'eau qui parvient à se séparer du sel finit en icebergs semi-permanents, où prospèrent des colonies de varech d'eau salée."
pc_pd_iceberg_adj: "glacé"
mod_pc_pd_iceberg_habitability: "Habitabilité Arctique"
trait_pc_pd_iceberg_preference: "Préférence Arctique"
trait_pc_pd_iceberg_preference_desc: "$trait_pc_arctic_preference_desc$"

###Alpine
pc_pd_boreal: "Monde Boréal"
pc_pd_boreal_desc: "Une planète rocheuse avec une atmosphère azote-oxygène, cette planète a un climat subarctique avec une vaste plage de température entre l'hiver long et froid et l'été court et chaud. Les forêts boréales couvrent les latitudes les plus chaudes de la planète, avec la toundra et la glace près des pôles."
pc_pd_boreal_adj: "montagneux"
mod_pc_pd_boreal_habitability: "Habitabilité Alpine"
trait_pc_pd_boreal_preference: "Préférence Alpine"
trait_pc_pd_boreal_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_snow: "Monde Enneigé"
pc_pd_snow_desc: "Une planète rocheuse et froide avec une atmosphère azote-oxygène, cette planète connaît actuellement une importante période glaciaire. Alors que les glaciers recouvrent la plupart des latitudes polaires et moyennes, d'épaisses forêts tempérées couvrent la bande équatoriale."
pc_pd_snow_adj: "montagneux"
mod_pc_pd_snow_habitability: "Habitabilité Alpine"
trait_pc_pd_snow_preference: "Préférence Alpine"
trait_pc_pd_snow_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_highland: "Monde de Hautes Terres"
pc_pd_highland_desc: "Un monde froid et humide avec une atmosphère azote-oxygène, le temps est imprévisible, et la brume et les nuages sont typiques. L'hydrosphère est généralement stable entre les chaînes de montagnes gelées et les grands lacs intérieurs, qui soutiennent des herbes robustes et des lichens."
pc_pd_highland_adj: "montagneux"
mod_pc_pd_highland_habitability: "Habitabilité Alpine"
trait_pc_pd_highland_preference: "Préférence Alpine"
trait_pc_pd_highland_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_dune_forest: "Monde Taïga"
pc_pd_dune_forest_desc: "Un monde montagneux froid avec une atmosphère azote-oxygène, cette planète reçoit des niveaux élevés de brouillard mais une faible précipitation. Une grande partie des basses terres est constituée de dunes sèches, mais l'hydrosphère soutient des montagnes enneigées et boisées."
pc_pd_dune_forest_adj: "montagneux"
mod_pc_pd_dune_forest_habitability: "Habitabilité Alpine"
trait_pc_pd_dune_forest_preference: "Préférence Alpine"
trait_pc_pd_dune_forest_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_fjord: "Monde de Fjords"
pc_pd_fjord_desc: "Un monde montagneux avec une atmosphère azote-oxygène, cette planète a une hydrosphère significative avec des océans qui creusent de profonds et étroits bras de mer dans les masses continentales. La variation saisonnière permet des forêts pluviales subarctiques productives le long de la côte et des climats alpins herbeux à des altitudes plus élevées."
pc_pd_fjord_adj: "montagneux"
mod_pc_pd_fjord_habitability: "Habitabilité Alpine"
trait_pc_pd_fjord_preference: "Préférence Alpine"
trait_pc_pd_fjord_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_blossom: "Monde Fleuri"
pc_pd_blossom_desc: "Ce monde montagneux présente une atmosphère azote-oxygène et une hydrosphère limitée, subissant des changements saisonniers dynamiques. Les riches prairies, ornées de flore fleurie vibrante, offrent un spectacle visible depuis l'orbite."
pc_pd_blossom_adj: "fleuri"
mod_pc_pd_blossom_habitability: "Habitabilité Alpine"
trait_pc_pd_blossom_preference: "Préférence Alpine"
trait_pc_pd_blossom_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_taiga: "Monde de Taïga"
 pc_pd_taiga_desc: "Avec son atmosphère azote-oxygène, cette planète forestière et montagneuse possède une hydrosphère active mais glaciale, avec de longs hivers froids et de courts étés frais."
 pc_pd_taiga_adj: "montagneux"
 mod_pc_pd_taiga_habitability: "Habitabilité Alpine"
 trait_pc_pd_taiga_preference: "Préférence Alpine"
 trait_pc_pd_taiga_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_craton: "Monde Cratonique"
 pc_pd_craton_desc: "Avec son atmosphère azote-oxygène, ce monde géologiquement stable présente de vastes régions de roche ancestrale, des bassins cratoniques nichés au sein d'une lithosphère qui se déplace très lentement."
 mod_pc_pd_craton_habitability: "Habitabilité Alpine"
 trait_pc_pd_craton_preference: "Préférence Alpine"
 trait_pc_pd_craton_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_ravine: "Monde des Ravins"
 pc_pd_ravine_desc: "Ce monde alpin est sculpté par de vastes réseaux de ravins qui entaillent profondément sa croûte. L'eau de fonte des glaciers d'altitude alimente d'innombrables cours d'eau qui serpentent à travers des vallées escarpées et des falaises abruptes, façonnant un paysage marqué par une érosion constante."
 mod_pc_pd_ravine_habitability: "Habitabilité Alpine"
 trait_pc_pd_ravine_preference: "Préférence Alpine"
 trait_pc_pd_ravine_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_glaciovolcanic: "Monde Glaciovolcanique"
pc_pd_glaciovolcanic_desc: "Monde montagneux et gelé avec une atmosphère azote-oxygène, cette planète connaît des niveaux élevés d'activité volcanique. Cela résulte en de grands lacs réchauffés géothermiquement qui recouvrent la surface, apportant des minéraux rares et de l'énergie à la surface sinon gelée."
pc_pd_glaciovolcanic_adj: "volcanique"
mod_pc_pd_glaciovolcanic_habitability: "Habitabilité Alpine"
trait_pc_pd_glaciovolcanic_preference: "Préférence Alpine"
trait_pc_pd_glaciovolcanic_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_lanthanide: "Monde de Lanthanides"
pc_pd_lanthanide_desc: "Monde montagneux avec une atmosphère azote-oxygène, cette planète a des niveaux inhabituellement élevés de métaux de terres rares et d'activité magnétique. Ce phénomène naturel crée des sommets de montagnes en forme d'anneaux spectaculaires, mais avec un climat gelé et une variation saisonnière minimale, l'hydrosphère ne peut soutenir que des zones de végétation robuste."
pc_pd_lanthanide_adj: "magnétique"
mod_pc_pd_lanthanide_habitability: "Habitabilité Alpine"
trait_pc_pd_lanthanide_preference: "Préférence Alpine"
trait_pc_pd_lanthanide_preference_desc: "$trait_pc_arctic_preference_desc$"

###Toundra
pc_pd_bog: "Monde Marécageux"
pc_pd_bog_desc: "Monde froid et boueux avec une atmosphère épaisse azote-oxygène. La planète a des étés courts et humides, de longs hivers froids et des précipitations annuelles significatives. Une forte hydrosphère recouvre les masses terrestres de végétation dense et robuste et spongieuse."
pc_pd_bog_adj: "marécageux"
mod_pc_pd_bog_habitability: "Habitabilité de la Toundra"
trait_pc_pd_bog_preference: "Préférence Toundra"
trait_pc_pd_bog_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_mycelium: "Monde de Mycélium"
pc_pd_mycelium_desc: "Un monde froid et rocheux avec une atmosphère azote-oxygène, cette planète a de courts étés frais autour de longs hivers secs et gelés. De vastes zones, des forêts de champignons géants et de denses réseaux de mycélium souterrains recouvrent la plupart des latitudes moyennes de cette planète."
pc_pd_mycelium_adj: "gelé"
mod_pc_pd_mycelium_habitability: "Habitabilité de la Toundra"
trait_pc_pd_mycelium_preference: "Préférence Toundra"
trait_pc_pd_mycelium_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_mud: "Monde Boueux"
pc_pd_mud_desc: "Monde gelé et boueux avec une atmosphère azote-oxygène, cette planète connaît des saisons limitées avec des précipitations importantes. Une abondance élevée d'activité géothermique de bas niveau à la surface a provoqué d'innombrables lacs de boue chaude et volcans de boue sur ce terrain gelé par ailleurs."
pc_pd_mud_adj: "boueux"
mod_pc_pd_mud_habitability: "Habitabilité de la Toundra"
trait_pc_pd_mud_preference: "Préférence Toundra"
trait_pc_pd_mud_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_basalt: "Monde de Basalte"
pc_pd_basalt_desc: "Monde froid et rocheux avec une atmosphère azote-oxygène, cette planète a une variation saisonnière limitée. En raison de l'activité volcanique intermittente, d'immenses champs de lave de basalte recouvrent cette planète. Une biosphère stable existe dans les mousses et lichens qui poussent sur le basalte refroidi."
pc_pd_basalt_adj: "gelé"
mod_pc_pd_basalt_habitability: "Habitabilité de la Toundra"
trait_pc_pd_basalt_preference: "Préférence Toundra"
trait_pc_pd_basalt_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_tuya: "Monde de Tuya"
pc_pd_tuya_desc: "Monde froid et rocheux avec une atmosphère azote-oxygène. Bien que présentant une variation saisonnière limitée et de longs hivers rigoureux, cette planète possède une biosphère stable principalement grâce aux nutriments présents dans le sol volcanique. Les vastes calottes glaciaires et l'activité volcanique élevée ont créé d'innombrables volcans sous-glaciaires qui parsèment la surface."
pc_pd_tuya_adj: "gelé"
mod_pc_pd_tuya_habitability: "Habitabilité de la Toundra"
trait_pc_pd_tuya_preference: "Préférence Toundra"
trait_pc_pd_tuya_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_cryovolcano: "Monde des Cryovolcans"
 pc_pd_cryovolcano_desc: "Planète glaciale et rocheuse à l'atmosphère azote-oxygène. La vie y persiste grâce aux nutriments libérés par les cryovolcans, qui rejettent de l'eau, de l'ammoniac et du méthane depuis les profondeurs de la surface gelée."
 pc_pd_cryovolcano_adj: "cryovolcanique"
 mod_pc_pd_cryovolcano_habitability: "Habitabilité de la Toundra"
 trait_pc_pd_cryovolcano_preference: "Préférence de la Toundra"
 trait_pc_pd_cryovolcano_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_treeline: "Monde de la Limite Forestière"
 pc_pd_treeline_desc: "Planète glaciale et rocheuse à l'atmosphère azote-oxygène, où des étendues gelées dominent la majeure partie de la surface, à l'exception d'un écosystème forestier florissant le long de la bande équatoriale."
 pc_pd_treeline_adj: "glacial"
 mod_pc_pd_treeline_habitability: "Habitabilité de la Toundra"
 trait_pc_pd_treeline_preference: "Préférence de la Toundra"
 trait_pc_pd_treeline_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_peatland: "Monde de Tourbières"
 pc_pd_peatland_desc: "Monde rocheux à l'atmosphère azote-oxygène, où de vastes tourbières s'étendent sur les continents. D'épais tapis de mousse et de végétation en décomposition forment une croûte vivante qui stocke d'immenses réserves de matière organique, relâchant lentement des gaz et de l'humidité dans l'air."
 pc_pd_peatland_adj: "tourbeux"
 mod_pc_pd_peatland_habitability: "Habitabilité de la Toundra"
 trait_pc_pd_peatland_preference: "Préférence de la Toundra"
 trait_pc_pd_peatland_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_travertine: "Monde de Travertin"
 pc_pd_travertine_desc: "Monde froid et rocheux à l'atmosphère azote-oxygène, où des sources chaudes riches en minéraux ont sculpté des terrasses de travertin pâle en cascade à travers la surface gelée. La vie s'accroche aux bassins tièdes entre les gradins, à l'abri de la toundra environnante."
 pc_pd_travertine_adj: "calcaire"
 mod_pc_pd_travertine_habitability: "Habitabilité de la Toundra"
 trait_pc_pd_travertine_preference: "Préférence de la Toundra"
 trait_pc_pd_travertine_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_cryoflora: "Monde de Cryoflore"
pc_pd_cryoflora_desc: "Monde froid et rocheux avec une atmosphère azote-oxygène. Bien que les températures soient souvent en dessous de zéro, la majeure partie de l'hydrosphère est verrouillée dans la neige et la glace. Malgré cela, la flore et la faune de cette planète se sont adaptées grâce à des protéines antigel pour créer un écosystème luxuriant et vibrant."
pc_pd_cryoflora_adj: "lumineux"
mod_pc_pd_cryoflora_habitability: "Habitabilité de la Toundra"
trait_pc_pd_cryoflora_preference: "Préférence Toundra"
trait_pc_pd_cryoflora_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_lichen: "Monde de Lichens"
pc_pd_lichen_desc: "Monde froid et rocheux avec une atmosphère azote-oxygène. Cette planète a une hydrosphère très stable et des températures généralement prévisibles basses, permettant aux forêts de lichens géants qui s'étendent sur toute la planète de pousser entre les montagnes escarpées et les glaciers qui absorbent les minéraux locaux pour les nutriments."
pc_pd_lichen_adj: "lichénisé"
mod_pc_pd_lichen_habitability: "Habitabilité de la Toundra"
trait_pc_pd_lichen_preference: "Préférence Toundra"
trait_pc_pd_lichen_preference_desc: "$trait_pc_arctic_preference_desc$"

###Superhabitable
pc_pd_wet_superhabitable: "Monde Superhabitable Humide"
pc_pd_wet_superhabitable_desc: "Un monde super-terrestre rocheux et humide, cette planète possède une atmosphère dense azote-oxygène. C'est un berceau parfait pour l'évolution de la vie, avec des températures moyennes autour de 25 degrés Celsius et des bassins océaniques peu profonds. Néanmoins, la gravité élevée est un défi pour ceux qui n'y sont pas habitués."
pc_pd_wet_superhabitable_adj: "super-terrestre"
mod_pc_pd_wet_superhabitable_habitability: "Habitabilité Superhabitable Humide"
trait_pc_pd_wet_superhabitable_preference: "Préférence Superhabitable Humide"
trait_pc_pd_wet_superhabitable_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_cold_superhabitable: "Monde Superhabitable Froid"
pc_pd_cold_superhabitable_desc: "Un monde super-terrestre froid et rocheux, cette planète possède une atmosphère dense azote-oxygène. C'est un berceau parfait pour l'évolution de la vie, avec des toundras riches et productives et des bassins océaniques peu profonds. Néanmoins, la gravité élevée est un défi pour ceux qui n'y sont pas habitués."
pc_pd_cold_superhabitable_adj: "super-terrestre"
mod_pc_pd_cold_superhabitable_habitability: "Habitabilité Superhabitable Froide"
trait_pc_pd_cold_superhabitable_preference: "Préférence Superhabitable Froide"
trait_pc_pd_cold_superhabitable_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_dry_superhabitable: "Monde Superhabitable Sec"
pc_pd_dry_superhabitable_desc: "Un monde super-terrestre sec et rocheux, cette planète possède une atmosphère dense azote-oxygène. Le terrain couvert de poussière se compose principalement de mesas et de canyons. C'est un berceau parfait pour l'évolution de la vie, avec des buissons riches et productifs et des bassins fluviaux peu profonds. Néanmoins, la gravité élevée est un défi pour ceux qui n'y sont pas habitués."
pc_pd_dry_superhabitable_adj: "super-terrestre"
mod_pc_pd_dry_superhabitable_habitability: "Habitabilité Superhabitable Sèche"
trait_pc_pd_dry_superhabitable_preference: "Préférence Superhabitable Sèche"
trait_pc_pd_dry_superhabitable_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_barren_superhabitable: "Monde Superhabitable Stérile"
pc_pd_barren_superhabitable_desc: "Monde super-terrestre stérile et rocheux avec une atmosphère mince ou inexistante. La surface est couverte de cratères d'impact de météorites et est complètement dépourvue de vie."
pc_pd_gaia_superhabitable: "Monde Superhabitable Gaia"
pc_pd_gaia_superhabitable_desc: "Un monde super-terrestre idéal et tempéré avec une atmosphère azote-oxygène et un écosystème résilient. Conditions optimales pour toutes les formes de vie supérieures connues à différentes latitudes. C'est un berceau parfait pour l'évolution de la vie, avec des buissons riches et productifs et des bassins fluviaux peu profonds. Néanmoins, la gravité élevée est un défi pour ceux qui n'y sont pas habitués."
pc_pd_gaia_superhabitable_adj: "super-terrestre"
mod_pc_pd_gaia_superhabitable_habitability: "Habitabilité Superhabitable Gaia"
trait_pc_pd_gaia_superhabitable_preference: "Préférence Superhabitable Gaia"
trait_pc_pd_gaia_superhabitable_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_nuked_superhabitable: "Monde Superhabitable Tombe"
pc_pd_nuked_superhabitable_desc: "Un monde superhabitable rocheux avec une atmosphère azote-oxygène, cette planète connaît actuellement un hiver nucléaire, avec de denses couches d'aérosols fuligineux dans l'atmosphère. Il y a des signes minimes de vie et la gravité élevée est un défi pour ceux qui n'y sont pas habitués."

###Tidally Locked
pc_pd_wet_tidally_locked: "Monde Crépusculaire Tempéré"
pc_pd_wet_tidally_locked_desc: "Un monde rocheux et humide avec une atmosphère dense azote-oxygène, cette planète tidalement verrouillée permet une biodiversité riche dans ses zones de jour et de crépuscule."
pc_pd_wet_tidally_locked_adj: "tidallement verrouillé"
mod_pc_pd_wet_tidally_locked_habitability: "Habitabilité Crépusculaire Tempéré"
