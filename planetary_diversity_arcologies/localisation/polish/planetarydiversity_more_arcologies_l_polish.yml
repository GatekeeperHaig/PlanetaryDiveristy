###Hive+Machine Overmind Worlds
 #Planet Classess
 pc_pd_hive: "Świat Nadświadomości Roju"
 pc_pd_hive_desc: "Ten świat jest kolosalnym żywym organizmem o złożonych powiązaniach z umysłem zbiorowym, który go stworzył. Ukształtowano go jako silnie broniony bastion zaawansowanych procesów myślowych. Sam teren jest gotów zaatakować każdego nieproszonego przybysza."
 pc_pd_hive_adj: "$pc_hive_adj$"
 mod_pc_pd_hive_habitability: "$mod_pc_hive_habitability$"
 trait_pc_pd_hive_preference: "$trait_pc_hive_preference$"
 trait_pc_pd_hive_preference_desc: "$trait_pc_hive_preference_desc$"
 pc_pd_machine: "Świat Ogniwa Maszyn"
 pc_pd_machine_desc: "Skalisty glob, którego powierzchnię pokrywają sztuczne konstrukcje podtrzymujące najbardziej zaawansowane procesy obliczeniowe. Cienka atmosfera składa się głównie z przemysłowych zanieczyszczeń i nie jest w stanie utrzymać życia biologicznego."
 pc_pd_machine_adj: "$pc_machine_adj$"
 mod_pc_pd_machine_habitability: "$mod_pc_machine_habitability$"
 trait_pc_pd_machine_preference: "$trait_pc_machine_preference$"
 trait_pc_pd_machine_preference_desc: "$trait_pc_machine_preference_desc$"

 #Districts
 district_pd_hive: "$district_hive$"
 district_pd_hive_plural: "$district_hive_plural$"
 district_pd_hive_desc: "$district_hive_desc$"
 district_pd_hive_industrial: "Dzielnica przemysłowa"
 district_pd_hive_industrial_plural: "Dzielnice przemysłowe"
 district_pd_hive_industrial_desc: "Tę dzielnicę wypełniają huty i fabryki, które przetwarzają surowce w zaawansowane produkty."
 district_pd_gestalt_naval: "Dzielnica logistyczna"
 district_pd_gestalt_naval_plural: "Dzielnice logistyczne"
 district_pd_gestalt_naval_desc: "Drony w tej dzielnicy optymalizują operacje floty, zapewniając ich maksymalną wydajność."
 district_pd_gestalt_research: "Dzielnica badawcza"
 district_pd_gestalt_research_plural: "Dzielnice badawcze"
 district_pd_gestalt_research_desc: "Niezliczone laboratoria wypełnione skupionymi na pracy dronami badawczymi."
 district_pd_gestalt_administrative: "Dzielnica koordynacyjna"
 district_pd_gestalt_administrative_plural: "Dzielnice koordynacyjne"
 district_pd_gestalt_administrative_desc: "Synaptyczny węzeł, który wzmacnia psioniczne połączenia roju, rozszerzając jego wolę i przewodnictwo na cały kosmos."
 district_pd_nexus: "$district_nexus$"
 district_pd_nexus_desc: "$district_nexus_desc$"
 district_pd_nexus_plural: "$district_nexus_plural$"

 #Modifiers
 pd_hive_military: "Świat Nadświadomości"
 pd_hive_military_desc: "Ta planeta jest kluczowa dla podstawowych funkcji umysłu zbiorowego i została ufortyfikowana przeciwko zewnętrznym zagrożeniom oraz wpływom. Potężna tarcza spowija świat, a drony bojowe stoją w gotowości, zapewniając mu ochronę."
 pd_machine_military: "Świat Ogniwa"
 pd_machine_military_desc: "Ta jednostka planetarna stanowi integralną część macierzy operacyjnej tej mechanicznej inteligencji. Przed zewnętrzną ingerencją chroni ją nieprzenikniony mechanizm obronny. Jednostki bojowe pozostają w ciągłej gotowości, strzegąc jej integralności."

 #Decisions
 decision_pd_hive_overmind_project: "Projekt Roju - Nadświadomość"
 decision_pd_hive_overmind_project_desc: "Ta planeta roju zostanie przekształcona w bastion zaawansowanych procesów myślowych dla umysłu zbiorowego."
 decision_pd_hive_overmind_project_effects: "Przekształca planetę w §Y$pc_pd_hive$§!, zwiększając £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§! oraz odblokowując specjalne £district£ §Ydzielnice arkologiczne§! kosztem zasobów naturalnych planety, które stają się §Rniedostępne§!. Uniemożliwia to dalszą budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!."
 decision_pd_hive_overmind_project_effects_short: "Zwiększa £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§!\nOdblokowuje £district£ §Ydzielnice arkologiczne§!\nBlokuje budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!"

 decision_pd_machine_nexus_project: "Projekt Maszyn - Ogniwo"
 decision_pd_machine_nexus_project_desc: "Ta planeta maszyn zostanie rozbudowana w bastion zaawansowanych podprogramów."
 decision_pd_machine_nexus_project_effects: "Przekształca planetę w §Y$pc_pd_machine$§!, zwiększając £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! oraz §Yprzyrost populacji§!, a także odblokowując specjalne £district£ §Ydzielnice arkologiczne§!. Odbywa się to kosztem naturalnych zasobów planety, które stają się §Rniedostępne§!, uniemożliwiając dalszą budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!."
