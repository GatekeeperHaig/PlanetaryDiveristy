 zone_pd_cave_lab: "Guilde d'Ingénierie des Cavernes"
 zone_pd_cave_lab_desc: "La construction de villes souterraines n'est pas une mince affaire. Cette guilde coordonne les chercheurs locaux, améliorant les résultats en ingénierie ici."
