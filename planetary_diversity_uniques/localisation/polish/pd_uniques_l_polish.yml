 #Edicts
 edict_pd_living_metal_robot_assembly: "Żywy metal do montażu robotów "
 edict_pd_living_metal_robot_assembly_desc: "Integracja żywego metalu w procesach produkcji robotów dramatycznie przyspiesza czas konstrukcji."
 edict_pd_living_metal_engineering: "Żywy metal do grantów badawczych"
