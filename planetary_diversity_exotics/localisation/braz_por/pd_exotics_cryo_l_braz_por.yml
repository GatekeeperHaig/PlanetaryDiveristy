 # Cryothermal Engineering ascension perk
 ap_pd_cryothermal_engineering: "Engenharia Criotérmica"
 ap_pd_cryothermal_engineering_desc: "Prosperar em condições criogênicas exige reinventar materiais, biologia e química. Somos pioneiros na ciência do frio."

 # Grayed-out requirement line shown before Terrestrial Sculpting is researched.
 requires_technology_tech_terrestrial_sculpting:0 "$TRIGGER_FAIL$Requer a tecnologia £society£ §Y$tech_terrestrial_sculpting$§!."

 # Civ-conditional job-efficiency effect lines shown in the AP card; only one renders per empire type.
 ap_pd_cryothermal_workforce_effect: "$mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult$: §G+20%§!"
 ap_pd_cryothermal_workforce_drone_effect: "$mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult$: §G+20%§!"
 ap_pd_cryothermal_workforce_machine_effect: "$mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult$: §G+20%§!"

 # Single planet-summary line for the AP card, instead of a per-planet modifier list.
 ap_pd_cryothermal_engineered_planets_effect: "Os ['concept_pd_cryogenic_planets'] do seu império recebem o modificador §Y$pd_cryothermal_engineered_planet$§!."

 # Cryogenic planet concept (linked from the AP tooltip and reusable across exotic content).
 concept_pd_cryogenic_planet: "Planeta Criogênico"
 concept_pd_cryogenic_planets: "Planetas Criogênicos"
 concept_pd_cryogenic_planet_desc: "$concept_pd_cryogenic_planet$ refere-se a mundos cujas biosferas funcionam com química criogênica em vez de água líquida:$NEW_LINE$- $pc_pd_ammonia$$NEW_LINE$- $pc_pd_methane$$NEW_LINE$- $pc_pd_nitrogen$"

 # Country workforce modifiers (auto-render their constituent mults via the mod_job_* keys below)
 pd_cryothermal_workforce: "Otimização da Força de Trabalho Criotérmica"
 pd_cryothermal_workforce_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_drone: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_drone_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_machine: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_machine_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_shared_desc: "Treinamento certificado para a atmosfera, ferramentas reforçadas e linhas de suprimento de hidretos exóticos aumentam a produtividade de toda a força de trabalho dos quimiotanques."

 # Per-planet modifier granted by the AP to cryo (ammonia/methane) worlds
 pd_cryothermal_engineered_planet: "Projetado Criotermicamente"
 pd_cryothermal_engineered_planet_desc: "Infraestrutura certificada para a atmosfera e linhas de processamento super-resfriadas permitem que este mundo sustente um povoamento mais denso do que seu ambiente natural permitiria."

 # Vatkeeper job-efficiency modifiers, shown in the workforce modifier's hover breakdown.
 mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult: "[pdexotic_cryo_chemist.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"
 mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult: "[pdexotic_cryo_chemist_drone.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"
 mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult: "[pdexotic_cryo_chemist_machine.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"

 # Pressure Suits tech (AP-only, granted by ap_pd_cryothermal_engineering)
 tech_pd_pressure_suits: "Trajes Pressurizados"
 tech_pd_pressure_suits_desc: "Trajes reforçados para frio e vácuo e habitats com atmosfera selada permitem que nossos colonos suportem o oxigênio, a pressão e o calor de mundos além do nosso. Outras espécies, por sua vez, podem sobreviver em nossas atmosferas."
 tech_pd_pressure_suits_effect_title: "§HLibera a Colonização:§! ['concept_pd_cryogenic_planet'] para espécies não criogênicas"
 tech_pd_pressure_suits_effect_desc: "§HHabitação Criogênica§!\nHabitats pressurizados e trajes para frio e vácuo mantêm vivos os colonos que respiram oxigênio em atmosferas de metano, amônia e nitrogênio."

 # Cryoforming tech (normal research, cryophile-founder empires only; gates ingress terraforming into ammonia and methane)
 tech_pd_cryoforming: "Crioformação"
 tech_pd_cryoforming_desc: "Avanços na química criogênica e na reformulação atmosférica nos dão os meios de estender nossa biosfera a mundos onde ela não se forma naturalmente. Um planeta temperado pode ser remodelado na atmosfera fria e densa de que nossa espécie precisa."
 tech_pd_cryoforming_effect_title: "§HLibera o Recurso:§! Terraformação Criogênica"
 tech_pd_cryoforming_effect_desc: "Permite terraformar mundos temperados em Mundos de Amônia, Metano e Nitrogênio."
 tech_pd_cryogenic_terraforming_effect_title: "§HLibera o Recurso:§! Terraformação Criogênica"
 tech_pd_cryogenic_terraforming_effect_desc: "Permite terraformar Mundos de Amônia, Metano e Nitrogênio em mundos temperados."

 # Habitat atmosphere toggle decisions (auto-stamped by on_megastructure_built; these let players add it to inherited habitats or vent it after conquest)
 decision_pd_exotic_habitat_add_ammonia_atmosphere: "Pressurizar Atmosfera de Amônia"
 decision_pd_exotic_habitat_add_ammonia_atmosphere_desc: "Inunde o suporte de vida do habitat com amônia e nitrogênio para que os nossos possam se estabelecer aqui. Depois que a atmosfera mudar, apenas espécies adaptadas ao frio criogênico poderão viver a bordo."
 decision_pd_exotic_habitat_remove_ammonia_atmosphere: "Ventilar Atmosfera de Amônia"
 decision_pd_exotic_habitat_remove_ammonia_atmosphere_desc: "Remova a atmosfera de amônia deste habitat e a substitua por uma mistura de oxigênio convencional. Espécies criogênicas não poderão mais se estabelecer aqui."
 decision_pd_exotic_habitat_add_methane_atmosphere: "Pressurizar Atmosfera de Metano"
 decision_pd_exotic_habitat_add_methane_atmosphere_desc: "Inunde o suporte de vida do habitat com nitrogênio e metano para que os nossos possam se estabelecer aqui. Depois que a atmosfera mudar, apenas espécies adaptadas ao frio criogênico poderão viver a bordo."
 decision_pd_exotic_habitat_remove_methane_atmosphere: "Ventilar Atmosfera de Metano"
 decision_pd_exotic_habitat_remove_methane_atmosphere_desc: "Remova a atmosfera de metano deste habitat e a substitua por uma mistura de oxigênio convencional. Espécies criogênicas não poderão mais se estabelecer aqui."
 decision_pd_exotic_habitat_add_nitrogen_atmosphere: "Pressurizar Atmosfera de Nitrogênio"
 decision_pd_exotic_habitat_add_nitrogen_atmosphere_desc: "Inunde o suporte de vida do habitat com nitrogênio puro em pressão criogênica para que os nossos possam se estabelecer aqui. Depois que a atmosfera mudar, apenas espécies adaptadas ao frio criogênico poderão viver a bordo."
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere: "Ventilar Atmosfera de Nitrogênio"
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere_desc: "Remova a atmosfera criogênica de nitrogênio deste habitat e a substitua por uma mistura de oxigênio convencional. Espécies criogênicas não poderão mais se estabelecer aqui."

 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Pressurizar as cúpulas"
 decision_pd_exotic_domed_add_atmosphere_desc: "Reequipe as cúpulas da colônia com nossa atmosfera criogênica para que os nossos possam se estabelecer aqui. Depois que o ar mudar, apenas espécies adaptadas ao frio extremo poderão viver sob as cúpulas."
 decision_pd_exotic_domed_remove_atmosphere: "Ventilar as cúpulas"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Remova a atmosfera criogênica das cúpulas e a substitua por uma mistura de oxigênio convencional. Espécies criogênicas não poderão mais se estabelecer aqui."

 # Cryogenic SR deposits (volatile motes pair)
 d_pd_cryo_clathrate_pockets: "Bolsões de Clatrato"
 d_pd_cryo_clathrate_pockets_desc: "Gases voláteis aprisionados em estruturas de gelo de água e amônia. As estruturas se rompem com o calor da mineração e liberam partículas aproveitáveis."
 d_pd_cryo_volatile_geyser_fields: "Campos de Gêiseres Voláteis"
 d_pd_cryo_volatile_geyser_fields_desc: "Vastas planícies onde voláteis pressurizados irrompem de rachaduras na crosta congelada. As erupções depositam um suprimento constante de partículas refináveis pela superfície."

 # Cryogenic SR deposits (rare crystals pair)
 d_pd_cryo_cryocrystal_caverns: "Cavernas de Criocristais"
 d_pd_cryo_cryocrystal_caverns_desc: "Cavernas subterrâneas revestidas de estruturas cristalinas raras que só se formam no frio extremo. Os depósitos permanecem estáveis enquanto o gelo ao redor não for perturbado."
 d_pd_cryo_cryocrystal_spires: "Agulhas de Criocristais"
 d_pd_cryo_cryocrystal_spires_desc: "Formações de superfície de cristais raros em forma de agulha, crescidas ao longo de milhares de anos de lenta precipitação. Cada agulha rende grandes quantidades de cristais raros quando colhida."

 # Cryogenic SR deposits (exotic gases pair)
 d_pd_cryo_gas_seeps: "Infiltrações de Gás Congelado"
 d_pd_cryo_gas_seeps_desc: "Vazamentos lentos de gases exóticos escapando de fissuras sob o gelo. A produção é modesta, mas constante em todo o terreno ao redor."
 d_pd_cryo_gas_columns: "Colunas de Gás Congelado"
 d_pd_cryo_gas_columns_desc: "Plumas contínuas de gases exóticos subindo de reservatórios subterrâneos profundos. A produção rivaliza com a dos maiores campos de gás encontrados em mundos mais quentes."

 # Cryogenic SR deposits (special)
 d_pd_cryo_betharian_deposit: "Campo Betharian Congelado"
 d_pd_cryo_betharian_deposit_desc: "Pedras Betharian suspensas em gelo glacial profundo por uma ampla região. Os depósitos permanecem inertes até serem descongelados e processados."
 d_pd_cryo_alien_pets_deposit: "Vale Abrigado da Criofauna"
 d_pd_cryo_alien_pets_deposit_desc: "Uma planície protegida onde a fauna nativa de mundo frio sobrevive em abundância incomum. A vida selvagem local é dócil e adequada para companhia."

 # Cryogenic natural blockers and their clear techs
 d_pd_cryo_toxic_mire: "£blocker£ Criolamaçal Tóxico"
 d_pd_cryo_toxic_mire_desc: "Uma ampla extensão de lama gelada quimicamente ativa onde compostos tóxicos se concentram no ponto de congelamento. A infraestrutura de povoamento não pode ser construída com segurança sobre o terreno contaminado."
 d_pd_cryo_glacier_wall: "£blocker£ Muralha Glacial Congelada"
 d_pd_cryo_glacier_wall_desc: "Uma imensa muralha de gelo denso e antigo atravessa a paisagem. A massa é espessa e instável demais para se construir sobre ela sem um trabalho dedicado de remoção."

 tech_pd_cryo_toxic_mire: "Recuperação de Criolamaçais"
 tech_pd_cryo_toxic_mire_desc: "Fluidos de neutralização química e purificadores de baixa temperatura nos permitem drenar e descontaminar lamaçais tóxicos em mundos criogênicos. A terra recuperada fica então segura para o desenvolvimento."
 tech_pd_cryo_glacier_wall: "Perfuração Glacial Criogênica"
 tech_pd_cryo_glacier_wall_desc: "Perfuratrizes aquecidas e cargas moldadas rompem as densas muralhas de gelo que bloqueiam a expansão colonial em mundos criogênicos. As equipes de remoção conseguem abrir terreno transitável em uma fração do tempo do derretimento natural."

 # Empire-creation picker tooltips (rare-world style: concept link, mechanics, then the three building choices)
 pc_pd_ammonia_tooltip: "§YMundos de Amônia§! são ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_chemovat_plural$§!: §G+3§!\n- Velocidade de Crescimento de Pop: §G+10%§!\n- Manutenção de Edifícios e Distritos: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_ammonia_fixation_institute']\n$t$- ['building:building_pd_ammonia_pharma_works']\n$t$- ['building:building_pd_ammonia_biome_reserve']"
 pc_pd_methane_tooltip: "§YMundos de Metano§! são ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_riftvent_plural$§!: §G+3§!\n- Velocidade de Construção: §G+15%§!\n- Custo de Edifícios e Distritos: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_methane_tholin_lab']\n$t$- ['building:building_pd_methane_hydrocarbon_foundry']\n$t$- ['building:building_pd_methane_polymer_plant']"
 pc_pd_nitrogen_tooltip: "§YMundos de Nitrogênio§! são ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_sublimation_plural$§!: §G+3§!\n- £physics£ §YPesquisa de Física§!: §G+10%§!\n- Manutenção de Edifícios e Distritos: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_nitrogen_supercomputer']\n$t$- ['building:building_pd_nitrogen_munitions_foundry']\n$t$- ['building:building_pd_nitrogen_cryonics_sanctuary']"

