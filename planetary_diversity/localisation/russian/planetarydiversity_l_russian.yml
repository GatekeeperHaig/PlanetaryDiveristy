 job_pd_superhab_abundance_cultivator: "Суперземельный фермер"
 job_pd_superhab_abundance_cultivator_plural: "Суперземельные фермеры"
 job_pd_superhab_abundance_cultivator_desc: "Этим земледельцам повезло обрабатывать землю, настолько плодородную, что за ней почти не нужно ухаживать. Их безмятежные сёла отлично подходят для отдыха приезжих колонистов."
 pd_superhab_abundance_cultivator_drone: "$job_pd_superhab_abundance_cultivator_drone$"
 job_pd_superhab_abundance_cultivator_drone: "Дрон-суперземельный фермер"
 job_pd_superhab_abundance_cultivator_drone_plural: "Дроны-суперземельные фермеры"
 job_pd_superhab_abundance_cultivator_drone_desc: "$job_pd_superhab_abundance_cultivator_desc$"
