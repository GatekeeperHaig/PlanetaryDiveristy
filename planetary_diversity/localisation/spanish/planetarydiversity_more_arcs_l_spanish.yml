 #Modifiers
 pd_hive_military: "Mundo Supermente"
 pd_hive_military_desc: "Este mundo es fundamental para las funciones centrales de la Mente Enjambre y está fortificado contra amenazas e influencias externas. Un formidable escudo envuelve el planeta y los drones guerreros están en alerta permanente, garantizando su protección."
 pd_machine_military: "Mundo Nexo"
 pd_machine_military_desc: "Esta unidad planetaria es parte integral de la matriz operativa de esta inteligencia máquina. Está protegida contra interferencias externas, encapsulada por un mecanismo de defensa invulnerable. Las unidades de combate están en disposición perpetua, preservando la integridad de la unidad."
