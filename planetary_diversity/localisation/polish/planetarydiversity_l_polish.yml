 job_pd_superhab_gravitic_forgewright_plural: "Hutnicy grawitacyjni"
 job_pd_superhab_gravitic_forgewright_desc: "Hutnicy grawitacyjni wykorzystują miażdżącą grawitację do odlewania gęstszych i wytrzymalszych stopów. Towarzyszące temu badania materiałowe wnoszą niewielki wkład w badania fizyczne."
