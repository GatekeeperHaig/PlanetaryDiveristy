l_polish:

###Shroud Planets
#AP
 ap_pd_shroud_worlds: "Fazowanie Woalu"
 ap_pd_shroud_worlds_desc: "Bariery między światem śmiertelników a Woalem są cieńsze, niż się spodziewaliśmy. Koncentrując naszą energię psioniczną, możemy dodatkowo osłabić te bariery i tworzyć światy obejmujące oba wymiary."
 allow_shroud_worlds: "§YOdblokowuje decyzję:§! $decision_pd_aw_shroud_planet$"
 describe_shroud_worlds: "§YModyfikator $decision_pd_aw_shroud_planet$§!:\n$t$- §GPsioniczne§! £pop£ Populacje:\n- $mod_planet_psionic_jobs_produces_mult$: §G10%§!\n- $MOD_POP_HAPPINESS$: §G10%§!\n\n§YNie-psioniczne§! £pop£ Populacje:\n- £mod_pop_environment_tolerance£ §YMożliwość zamieszkania planety§!: §R-50%§!\n- $MOD_POP_HAPPINESS$: §R-25%§!\n- $MOD_LOGISTIC_GROWTH_MULT$: §R-25%§!"

#Decisions
 decision_pd_aw_shroud_planet: "Fazowanie Woalu"
 decision_pd_aw_shroud_planet_desc: "Możemy osłabić barierę między tą planetą a Woalem, tworząc równowagę między światem materialnym a sferą psioniczną."
 decision_pd_aw_shroud_planet_effects_short: "Dodaje modyfikator §Y$pd_aw_shroud_planet$§!.\n\nZwiększa £pop£ §Gprodukcję populacji psionicznych§!, ale zmniejsza £pop£ §Yprodukcję populacji niepsionicznych§!."
 decision_pd_aw_shroud_planet_cleanup: "Zablokuj fazowanie planety"
 decision_pd_aw_shroud_planet_cleanup_desc: "Nasi fizycy mogą wzmocnić barierę między tą planetą a Woalem, zakotwiczając ją w świecie materialnym."
 decision_pd_aw_shroud_planet_cleanup_tooltip: "\nUsuniemy wpływ psioniczny z tej planety."
 decision_pd_aw_sever_shroud_planet: "Zerwij więź planety z Woalem"
 decision_pd_aw_sever_shroud_planet_desc: "Nasi psionicy mogą zerwać więź między tą planetą a Woalem, przywracając ją światu materialnemu."
 decision_pd_aw_sever_shroud_planet_tooltip: "\nZerwiemy więź tej planety z Woalem."

#Modifiers
 pd_aw_shroud_planet: "Dotknięta Woalem"
 pd_aw_shroud_planet_desc: "W tym miejscu celowo osłabiona bariera między światem materialnym a Woalem pozwoliła jednostkom obdarzonym zdolnościami psionicznymi w pewnym stopniu kształtować rzeczywistość. Jednak dla tych, którzy nie posiadają takich darów, granica między koszmarem a rzeczywistością zaciera się, rodząc nieskończoną mozaikę cierpienia i udręki."
 pd_aw_shroud_planet_tooltip: "§GPsioniczne§! £pop£ populacje:\n- $mod_psionic_pop_bonus_workforce_mult$: §G10%§!\n- $MOD_POP_HAPPINESS$: §G25%§!\n\n§YNiepsioniczne§! £pop£ populacje:\n- £mod_pop_environment_tolerance£ §YMożliwość zamieszkania planety§!: §R-50%§!\n- $MOD_POP_HAPPINESS$: §R-25%§!\n- $MOD_LOGISTIC_GROWTH_MULT$: §R-25%§!"
 pd_shroud_planet: "$pd_aw_shroud_planet$"
 pd_shroud_planet_desc: "$pd_aw_shroud_planet_desc$"
 pd_shroud_planet_tooltip: "$pd_aw_shroud_planet_tooltip$"
 pd_aw_shroud_severed: "Zerwana więź"
 pd_aw_shroud_severed_desc: "Więź między tym światem a Woalem została zerwana siłą. Ci, którzy niegdyś obcowali z Woalem, pozostali głęboko zranieni i wstrząśnięci."

#Notification Message
 MESSAGE_PD_AW_SHROUD_DESC:1 "Planeta $PLANET|Y$ ma teraz modyfikator §Y$pd_aw_shroud_planet$§!"
 MESSAGE_PD_AW_SHROUD_MESSAGE_TYPE_TITLE: "Nawiązano więź planety z Woalem"
 MESSAGE_PD_AW_SHROUD_CLEANUP_DESC:1 "Usunięto wpływ Woalu z planety $PLANET|Y$."
 MESSAGE_PD_AW_SHROUD_CLEANUP_MESSAGE_TYPE_TITLE: "Planeta odłączona od Woalu"
 MESSAGE_PD_AW_SHROUD_SEVER_DESC:1 "Zerwano więź planety $PLANET|Y$ z Woalem."
