 # Cryothermal Engineering ascension perk
 ap_pd_cryothermal_engineering: "Ingénierie cryothermique"
 ap_pd_cryothermal_engineering_desc: "Prospérer dans des conditions cryogéniques exige de réinventer les matériaux, la biologie et la chimie. Nous sommes les pionniers de la science du froid."

 # Grayed-out requirement line shown before Terrestrial Sculpting is researched.
 requires_technology_tech_terrestrial_sculpting:0 "$TRIGGER_FAIL$Nécessite la technologie £society£ §Y$tech_terrestrial_sculpting$§!."

 # Civ-conditional job-efficiency effect lines shown in the AP card; only one renders per empire type.
 ap_pd_cryothermal_workforce_effect: "$mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult$ : §G+20%§!"
 ap_pd_cryothermal_workforce_drone_effect: "$mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult$ : §G+20%§!"
 ap_pd_cryothermal_workforce_machine_effect: "$mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult$ : §G+20%§!"

 # Single planet-summary line for the AP card, instead of a per-planet modifier list.
 ap_pd_cryothermal_engineered_planets_effect: "Les ['concept_pd_cryogenic_planets'] de votre empire reçoivent le modificateur §Y$pd_cryothermal_engineered_planet$§!."

 # Cryogenic planet concept (linked from the AP tooltip and reusable across exotic content).
 concept_pd_cryogenic_planet: "Planète Cryogénique"
 concept_pd_cryogenic_planets: "Planètes Cryogéniques"
 concept_pd_cryogenic_planet_desc: "Le terme $concept_pd_cryogenic_planet$ désigne les mondes dont la biosphère repose sur une chimie cryogénique plutôt que sur l'eau liquide :$NEW_LINE$- $pc_pd_ammonia$$NEW_LINE$- $pc_pd_methane$$NEW_LINE$- $pc_pd_nitrogen$"

 # Country workforce modifiers (auto-render their constituent mults via the mod_job_* keys below)
 pd_cryothermal_workforce: "Optimisation de la main-d'oeuvre cryothermique"
 pd_cryothermal_workforce_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_drone: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_drone_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_machine: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_machine_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_shared_desc: "Une formation adaptée à l'atmosphère, un outillage renforcé et des chaînes d'approvisionnement en hydrures exotiques augmentent la productivité de toute la main-d'oeuvre des chimiocuves."

 # Per-planet modifier granted by the AP to cryo (ammonia/methane) worlds
 pd_cryothermal_engineered_planet: "Aménagement cryothermique"
 pd_cryothermal_engineered_planet_desc: "Des infrastructures adaptées à l'atmosphère et des chaînes de traitement surfondues permettent à ce monde d'accueillir une population plus dense que son environnement naturel ne le permettrait."

 # Vatkeeper job-efficiency modifiers, shown in the workforce modifier's hover breakdown.
 mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult: "$MOD_POP_BONUS_WORKFORCE_MULT$([pdexotic_cryo_chemist.GetName])"
 mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult: "$MOD_POP_BONUS_WORKFORCE_MULT$([pdexotic_cryo_chemist_drone.GetName])"
 mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult: "$MOD_POP_BONUS_WORKFORCE_MULT$([pdexotic_cryo_chemist_machine.GetName])"

 # Pressure Suits tech (AP-only, granted by ap_pd_cryothermal_engineering)
 tech_pd_pressure_suits: "Combinaisons pressurisées"
 tech_pd_pressure_suits_desc: "Des combinaisons renforcées contre le froid et le vide et des habitats à atmosphère scellée permettent à nos colons de supporter l'oxygène, la pression et la chaleur des mondes étrangers au nôtre. Les autres espèces peuvent à leur tour survivre dans nos atmosphères."
 tech_pd_pressure_suits_effect_title: "§HDébloque la colonisation :§! ['concept_pd_cryogenic_planet'] pour les espèces non cryogéniques"
 tech_pd_pressure_suits_effect_desc: "§HHabitation cryogénique§!\nDes habitats pressurisés et des combinaisons contre le froid et le vide maintiennent en vie les colons respirant de l'oxygène dans les atmosphères de méthane, d'ammoniac et d'azote."

 # Cryoforming tech (normal research, cryophile-founder empires only; gates ingress terraforming into ammonia and methane)
 tech_pd_cryoforming: "Cryoformation"
 tech_pd_cryoforming_desc: "Les progrès de la chimie cryogénique et de la réforme atmosphérique nous donnent les moyens d'étendre notre biosphère à des mondes où elle ne se forme pas naturellement. Une planète tempérée peut être remodelée pour obtenir l'atmosphère froide et dense dont les nôtres ont besoin."
 tech_pd_cryoforming_effect_title: "§HDébloque la fonctionnalité :§! Terraformation cryogénique"
 tech_pd_cryoforming_effect_desc: "Permet de terraformer des mondes tempérés en Mondes à Ammoniac, Mondes à Méthane et Mondes à Azote."
 tech_pd_cryogenic_terraforming_effect_title: "§HDébloque la fonctionnalité :§! Terraformation cryogénique"
 tech_pd_cryogenic_terraforming_effect_desc: "Permet de terraformer des Mondes à Ammoniac, Mondes à Méthane et Mondes à Azote en mondes tempérés."

 # Habitat atmosphere toggle decisions (auto-stamped by on_megastructure_built; these let players add it to inherited habitats or vent it after conquest)
 decision_pd_exotic_habitat_add_ammonia_atmosphere: "Pressuriser une atmosphère d'ammoniac"
 decision_pd_exotic_habitat_add_ammonia_atmosphere_desc: "Remplissez le système de survie de l'habitat d'ammoniac et d'azote afin que les nôtres puissent s'y installer. Une fois l'atmosphère modifiée, seules les espèces adaptées au froid cryogénique pourront vivre à bord."
 decision_pd_exotic_habitat_remove_ammonia_atmosphere: "Purger l'atmosphère d'ammoniac"
 decision_pd_exotic_habitat_remove_ammonia_atmosphere_desc: "Évacuez l'atmosphère d'ammoniac de cet habitat et remplacez-la par un mélange d'oxygène conventionnel. Les espèces cryogéniques ne pourront plus s'y installer."
 decision_pd_exotic_habitat_add_methane_atmosphere: "Pressuriser une atmosphère de méthane"
 decision_pd_exotic_habitat_add_methane_atmosphere_desc: "Remplissez le système de survie de l'habitat d'azote et de méthane afin que les nôtres puissent s'y installer. Une fois l'atmosphère modifiée, seules les espèces adaptées au froid cryogénique pourront vivre à bord."
 decision_pd_exotic_habitat_remove_methane_atmosphere: "Purger l'atmosphère de méthane"
 decision_pd_exotic_habitat_remove_methane_atmosphere_desc: "Évacuez l'atmosphère de méthane de cet habitat et remplacez-la par un mélange d'oxygène conventionnel. Les espèces cryogéniques ne pourront plus s'y installer."
 decision_pd_exotic_habitat_add_nitrogen_atmosphere: "Pressuriser une atmosphère d'azote"
 decision_pd_exotic_habitat_add_nitrogen_atmosphere_desc: "Remplissez le système de survie de l'habitat d'azote pur à pression cryogénique afin que les nôtres puissent s'y installer. Une fois l'atmosphère modifiée, seules les espèces adaptées au froid cryogénique pourront vivre à bord."
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere: "Purger l'atmosphère d'azote"
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere_desc: "Évacuez l'atmosphère d'azote cryogénique de cet habitat et remplacez-la par un mélange d'oxygène conventionnel. Les espèces cryogéniques ne pourront plus s'y installer."

 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Pressuriser les dômes"
 decision_pd_exotic_domed_add_atmosphere_desc: "Réaménagez les dômes de la colonie avec notre atmosphère cryogénique afin que les nôtres puissent s'y installer. Une fois l'air modifié, seules les espèces adaptées au froid extrême pourront vivre sous les dômes."
 decision_pd_exotic_domed_remove_atmosphere: "Purger les dômes"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Évacuez l'atmosphère cryogénique des dômes et remplacez-la par un mélange d'oxygène conventionnel. Les espèces cryogéniques ne pourront plus s'y installer."

 # Cryogenic SR deposits (volatile motes pair)
 d_pd_cryo_clathrate_pockets: "Poches de Clathrate"
 d_pd_cryo_clathrate_pockets_desc: "Des gaz volatils piégés dans des cages de glace d'eau et d'ammoniac. Ces structures se désagrègent sous la chaleur de l'extraction et libèrent des particules exploitables."
 d_pd_cryo_volatile_geyser_fields: "Champs de Geysers Volatils"
 d_pd_cryo_volatile_geyser_fields_desc: "De vastes plaines où des composés volatils sous pression jaillissent des fissures de la croûte gelée. Les éruptions déposent à la surface un flux régulier de particules raffinables."

 # Cryogenic SR deposits (rare crystals pair)
 d_pd_cryo_cryocrystal_caverns: "Cavernes de Cryocristal"
 d_pd_cryo_cryocrystal_caverns_desc: "Des cavernes souterraines tapissées de rares structures cristallines qui ne se forment que dans un froid extrême. Les gisements restent stables tant que la glace environnante n'est pas perturbée."
 d_pd_cryo_cryocrystal_spires: "Flèches de Cryocristal"
 d_pd_cryo_cryocrystal_spires_desc: "Des formations de surface composées de cristaux rares en forme d'aiguilles, formées par des milliers d'années de lente précipitation. Chaque flèche fournit de grandes quantités de cristaux rares une fois récoltée."

 # Cryogenic SR deposits (exotic gases pair)
 d_pd_cryo_gas_seeps: "Suintements de Gaz Gelé"
 d_pd_cryo_gas_seeps_desc: "De lentes fuites de gaz exotiques s'échappent de fissures sous la glace. La production est modeste mais régulière sur tout le terrain environnant."
 d_pd_cryo_gas_columns: "Colonnes de Gaz Gelé"
 d_pd_cryo_gas_columns_desc: "Des panaches continus de gaz exotiques s'élèvent de profonds réservoirs souterrains. La production rivalise avec celle des plus grands gisements de gaz des mondes plus chauds."

 # Cryogenic SR deposits (special)
 d_pd_cryo_betharian_deposit: "Gisement de Béthariane Gelé"
 d_pd_cryo_betharian_deposit_desc: "Des pierres bétharianes prises dans une glace glaciaire profonde sur une vaste région. Les gisements restent inertes jusqu'à ce qu'ils soient dégelés et traités."
 d_pd_cryo_alien_pets_deposit: "Vallée Abritée de Cryofaune"
 d_pd_cryo_alien_pets_deposit_desc: "Une plaine protégée où la faune indigène des mondes froids survit en abondance inhabituelle. Les animaux locaux sont dociles et se prêtent bien à la compagnie."

 # Cryogenic natural blockers and their clear techs
 d_pd_cryo_toxic_mire: "£blocker£ Cryo-Marécage Toxique"
 d_pd_cryo_toxic_mire_desc: "Une vaste étendue de neige fondante chimiquement active où les composés toxiques se concentrent au point de congélation. Les infrastructures de colonisation ne peuvent pas être construites sans danger sur ce terrain contaminé."
 d_pd_cryo_glacier_wall: "£blocker£ Mur Glaciaire Gelé"
 d_pd_cryo_glacier_wall_desc: "Un immense mur de glace dense et ancienne traverse le paysage. Cette masse est trop épaisse et instable pour qu'on y construise sans travaux de dégagement dédiés."

 tech_pd_cryo_toxic_mire: "Assainissement des cryo-marécages"
 tech_pd_cryo_toxic_mire_desc: "Des fluides de neutralisation chimique et des épurateurs à basse température nous permettent d'assécher et de décontaminer les marécages toxiques des mondes cryogéniques. Les terres récupérées peuvent alors être aménagées sans danger."
 tech_pd_cryo_glacier_wall: "Forage glaciaire cryogénique"
 tech_pd_cryo_glacier_wall_desc: "Des foreuses chauffées et des charges creuses percent les murs de glace dense qui bloquent l'expansion coloniale sur les mondes cryogéniques. Les équipes de dégagement peuvent ouvrir un terrain praticable en une fraction du temps de fonte naturelle."

 # Empire-creation picker tooltips (rare-world style: concept link, mechanics, then the three building choices)
 pc_pd_ammonia_tooltip: "Les §YMondes à Ammoniac§! sont des ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_chemovat_plural$§! : §G+3§!\n- Vitesse de dév. des pops : §G+10%§!\n- Maintenance des bâtiments et des districts : §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_ammonia_fixation_institute']\n$t$- ['building:building_pd_ammonia_pharma_works']\n$t$- ['building:building_pd_ammonia_biome_reserve']"
 pc_pd_methane_tooltip: "Les §YMondes à Méthane§! sont des ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_riftvent_plural$§! : §G+3§!\n- Vitesse de construction : §G+15%§!\n- Coût des bâtiments et des districts : §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_methane_tholin_lab']\n$t$- ['building:building_pd_methane_hydrocarbon_foundry']\n$t$- ['building:building_pd_methane_polymer_plant']"
 pc_pd_nitrogen_tooltip: "Les §YMondes à Azote§! sont des ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_sublimation_plural$§! : §G+3§!\n- £physics£ §YRecherche physique§! : §G+10%§!\n- Maintenance des bâtiments et des districts : §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_nitrogen_supercomputer']\n$t$- ['building:building_pd_nitrogen_munitions_foundry']\n$t$- ['building:building_pd_nitrogen_cryonics_sanctuary']"

 # Planet-view "can construct" building lists, shown on the cryo world modifier tooltip in-game (header key lives in main PD)
 pd_ammonia_buildings_tt: "$pd_unlocks_one_building$\n$t$- ['building:building_pd_ammonia_fixation_institute']\n$t$- ['building:building_pd_ammonia_pharma_works']\n$t$- ['building:building_pd_ammonia_biome_reserve']"
 pd_methane_buildings_tt: "$pd_unlocks_one_building$\n$t$- ['building:building_pd_methane_tholin_lab']\n$t$- ['building:building_pd_methane_hydrocarbon_foundry']\n$t$- ['building:building_pd_methane_polymer_plant']"
