#Decisions
 decision_pd_ma_hive_overmind_project: "Proyecto Colmena - Supermente"
 decision_pd_ma_hive_overmind_project_desc: "Este mundo colmena será remodelado como un bastión de procesos de pensamiento avanzados para la mente colmena."
 decision_pd_ma_hive_overmind_project_effects: "Convierte el planeta en un §Y$pc_pd_hive_superhabitable$§!, aumentando £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProducción de Recursos§! y §YCrecimiento Poblacional§! y desbloqueando £district£ §YDistritos de Arcología§! especiales a costa de que los recursos naturales del planeta se vuelvan §Rinaccesibles§!, lo que impide toda construcción futura de £district£ §YDistritos Generadores§!, §YMineros§! y §YAgrícolas§!."
 decision_pd_ma_hive_overmind_project_effects_short: "Aumenta £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProducción de Recursos§! y §YCrecimiento Poblacional§!\nHabilita £district£ §YDistritos de Arcología§!\nDeshabilita la construcción de £district£ §YDistritos Generadores§!, §YMineros§! y §YAgrícolas§!"

 decision_pd_ma_machine_nexus_project: "Proyecto Máquina - Nexo"
 decision_pd_ma_machine_nexus_project_desc: "Este mundo máquina será mejorado hasta convertirse en un bastión de subrutinas avanzadas."
 decision_pd_ma_machine_nexus_project_effects: "Convierte el planeta en un §Y$pc_pd_machine_superhabitable$§!, aumentando £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProducción de Recursos§! y §YCrecimiento Poblacional§! y desbloqueando £district£ §YDistritos de Arcología§! especiales a costa de que los recursos naturales del planeta se vuelvan §Rinaccesibles§!, lo que impide toda construcción futura de £district£ §YDistritos Generadores§!, §YMineros§! y §YAgrícolas§!."
 decision_pd_ma_machine_nexus_project_effects_short: "Aumenta £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProducción de Recursos§! y §YCrecimiento Poblacional§!\nHabilita £district£ §YDistritos de Arcología§!\nDeshabilita la construcción de £district£ §YDistritos Generadores§!, §YMineros§! y §YAgrícolas§!"

