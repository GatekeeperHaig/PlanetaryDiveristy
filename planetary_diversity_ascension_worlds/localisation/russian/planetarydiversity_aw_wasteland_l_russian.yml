 describe_wasteland_worlds: "§Y$pd_aw_wasteland_planet$§! (модификатор):\n$t$- $MOD_HABITABILITY_CEIL$: §Y60%§!\n$t$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!\n$t$- $mod_planet_jobs_alloys_produces_mult$: §G+100%§!\n$t$- $mod_planet_jobs_consumer_goods_produces_mult$: §G+100%§!\n$t$- $mod_planet_farmers_food_produces_mult$: §R-200%§!"

#Decisions
 decision_pd_aw_wasteland_planet: "Нерегулируемые промышленные стандарты"
 decision_pd_aw_wasteland_planet_desc: "Забота об окружающей среде только сдерживает нас. Игнорируя состояние естественной экосистемы планеты, мы раскроем ее истинный промышленный потенциал."
 decision_pd_aw_wasteland_planet_effects_short: "Добавляется модификатор §Y$pd_aw_wasteland_planet$§!.\n\nПовышает §Gпромышленное производство§!, но снижает £mod_pop_environment_tolerance£ §Rпригодность для жизни§! и производство £food£ §Rпищи§!.\nВсе £district£ §Y$district_farming_plural$§! и препятствия будут удалены."
 decision_pd_aw_wasteland_planet_cleanup: "Восстановление экосистемы"
 decision_pd_aw_wasteland_planet_cleanup_desc: "Из-за серьезного ухудшения экологической обстановки на нашей планете её экосистема находится в плачевном состоянии. Мы исправим ущерб, нанесённый этому миру."
 decision_pd_aw_wasteland_planet_cleanup_tooltip: "Мы восстановим прежнюю экосистему планеты."

#Modifiers
 pd_aw_wasteland_planet: "Промышленная пустошь"
