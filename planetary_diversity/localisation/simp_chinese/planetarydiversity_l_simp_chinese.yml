 job_pd_archipelago_tidal_smelter: "潮汐熔炼师 "
 job_pd_archipelago_tidal_smelter_plural: "潮汐熔炼师 "
 job_pd_archipelago_tidal_smelter_desc: "潮汐熔炼师负责精炼直接从海底打捞的矿石，能以异常低的矿物消耗来锻造合金。"
 job_pd_archipelago_tidal_smelter_drone: "潮汐熔炼师 "
 job_pd_archipelago_tidal_smelter_drone_plural: "潮汐熔炼师 "
