 pd_hive_military: "Świat Nadumysłu"
 pd_hive_military_desc: "Ten świat ma kluczowe znaczenie dla podstawowych funkcji umysłu zbiorowego i został ufortyfikowany, by chronić go przed zewnętrznymi zagrożeniami i wpływami. Potężna tarcza otacza planetę, a drony wojenne pozostają w gotowości, zapewniając jej ochronę."
 pd_machine_military: "Świat Nexusa"
 pd_machine_military_desc: "Ta jednostka planetarna stanowi integralną część macierzy operacyjnej inteligencji maszynowej. Chroni ją przed zewnętrznymi zakłóceniami nieprzenikniony mechanizm obronny. Jednostki bojowe pozostają w ciągłej gotowości, strzegąc jej integralności."
