 ap_pd_cryothermal_engineering: "Криотермальная инженерия"
 ap_pd_cryothermal_engineering_desc: "Жизнь в условиях крайне низких температур требует совершенно иных подходов в материаловедении, биологии и химии. Мы должны стать первопроходцами в науке о холоде."
 requires_technology_tech_terrestrial_sculpting:0 "$TRIGGER_FAIL$Требуется технология £society£ §Y$tech_terrestrial_sculpting$§!."
 ap_pd_cryothermal_workforce_effect: "$mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult$: §G+20%§!"
 ap_pd_cryothermal_workforce_drone_effect: "$mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult$: §G+20%§!"
 ap_pd_cryothermal_workforce_machine_effect: "$mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult$: §G+20%§!"
 ap_pd_cryothermal_engineered_planets_effect: "Все ['concept_pd_cryogenic_planets', сверхохлаждённые планеты] в вашей империи получат модификатор §Y$pd_cryothermal_engineered_planet$§!."
 concept_pd_cryogenic_planet: "Сверхохлаждённая планета"
 concept_pd_cryogenic_planets: "Сверхохлаждённые планеты"
 concept_pd_cryogenic_planet_desc: "$concept_pd_cryogenic_planet$ относятся к мирам, биосфера которых основана на низкотемпературной биохимии, а не жидкой воде:$NEW_LINE$- $pc_pd_ammonia$$NEW_LINE$- $pc_pd_methane$$NEW_LINE$- $pc_pd_nitrogen$"
 pd_cryothermal_workforce: "Оптимизация работ под сверхнизкие температуры"
 pd_cryothermal_workforce_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_drone: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_drone_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_machine: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_machine_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_shared_desc: "Подготовка в условиях ледяной атмосферы, закалённая экипировка и налаживание поставок экзотических гидридов повышают производительность труда каждого работника хемосинтетических садов."
 pd_cryothermal_engineered_planet: "Криотермальное проектирование"
 pd_cryothermal_engineered_planet_desc: "Инфраструктура, отвечающая требованиям по качеству атмосферы, и охладительные трассы позволяют заселить этот мир плотнее, чем позволила бы его естественная среда."
 mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult: "$MOD_POP_BONUS_WORKFORCE_MULT$ «[pdexotic_cryo_chemist.GetName]»"
 mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult: "$MOD_POP_BONUS_WORKFORCE_MULT$ «[pdexotic_cryo_chemist_drone.GetName]»"
 mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult: "$MOD_POP_BONUS_WORKFORCE_MULT$ «[pdexotic_cryo_chemist_machine.GetName]»"
 tech_pd_pressure_suits: "Гермоскафандры под давлением"
 tech_pd_pressure_suits_desc: "Теплоизолированные скафандры и герметичные жилища позволят нашим колонистам переносить кислород, давление и тепло миров, отличных от нашего. Другие виды, в свою очередь, смогут выжить в нашей атмосфере."
 tech_pd_pressure_suits_effect_title: "§HВозможность:§! Колонизация ['concept_pd_cryogenic_planet', сверхохлаждённых планет] не-криофилами"
 tech_pd_pressure_suits_effect_desc: "§HЖизнь при сверхнизких температурах§!\nГерметичное жильё под давлением и теплоизолированные скафандры помогут дышащим кислородом колонистам жить в условиях метановой, аммиачной и азотной атмосфер сверхохлаждённых планет."
 tech_pd_cryoforming: "Криоформирование"
 tech_pd_cryoforming_desc: "Достижения в химии низких температур и методах преобразования атмосферы открыли нам путь к переносу нашей биосферы на миры, изначально не подходящие для её существования. Теперь мы можем преобразовать планету с умеренным климатом в сверхохлаждённый мир."
 tech_pd_cryoforming_effect_title: "§HВозможность:§! Криоформирование"
 tech_pd_cryoforming_effect_desc: "Позволяет нам превращать планеты с умеренным климатом в аммиачные, метановые и азотные миры."
 tech_pd_cryogenic_terraforming_effect_title: "§HВозможность:§! Термоформирование"
 tech_pd_cryogenic_terraforming_effect_desc: "Позволяет нам превращать аммиачные, метановые и азотные миры в планеты с умеренным климатом."
 decision_pd_exotic_habitat_add_ammonia_atmosphere: "Нагнать аммиачную атмосферу"
 decision_pd_exotic_habitat_add_ammonia_atmosphere_desc: "Перенастройка систем жизнеобеспечения под азотно-аммиачную атмосферу и заполнение ей всего пространства орбитального поселения. После смены воздуха жить здесь смогут только криофилы."
 decision_pd_exotic_habitat_remove_ammonia_atmosphere: "Сбросить аммиачную атмосферу"
 decision_pd_exotic_habitat_remove_ammonia_atmosphere_desc: "Удаление любых следов аммиачной атмосферы из систем жизнеобеспечения орбитального поселения и её замена на стандартную азотно-кислородную смесь. Станция станет непригодной для криофилов."
 decision_pd_exotic_habitat_add_methane_atmosphere: "Нагнать метановую атмосферу"
 decision_pd_exotic_habitat_add_methane_atmosphere_desc: "Перенастройка систем жизнеобеспечения под азотно-метановую атмосферу и заполнение ей всего пространства орбитального поселения. После смены воздуха жить здесь смогут только криофилы."
 decision_pd_exotic_habitat_remove_methane_atmosphere: "Сбросить метановую атмосферу"
 decision_pd_exotic_habitat_remove_methane_atmosphere_desc: "Удаление любых следов метановой атмосферы из систем жизнеобеспечения орбитального поселения и её замена на стандартную азотно-кислородную смесь. Станция станет непригодной для криофилов."
 decision_pd_exotic_habitat_add_nitrogen_atmosphere: "Нагнать азотную атмосферу"
 decision_pd_exotic_habitat_add_nitrogen_atmosphere_desc: "Перенастройка систем жизнеобеспечения под атмосферу чистого азота и заполнение ей всего пространства орбитального поселения. После смены воздуха жить здесь смогут только криофилы."
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere: "Сбросить азотную атмосферу"
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere_desc: "Удаление любых следов криоазотной атмосферы из систем жизнеобеспечения орбитального поселения и её замена на стандартную азотно-кислородную смесь. Станция станет непригодной для криофилов."
 d_pd_cryo_clathrate_pockets: "Клатратные карманы"
 d_pd_cryo_clathrate_pockets_desc: "Пласты водно-аммиачного льда с включениями взрывоопасных газов, которые можно высвободить путём нагрева."
 d_pd_cryo_volatile_geyser_fields: "Плато пылевых гейзеров"
 d_pd_cryo_volatile_geyser_fields_desc: "Обширная равнина, усеянная трещинами, из которых регулярно вырываются сильные струи пара c пылью под давлением. В результате выбросов на поверхность оседают летучие пылинки, пригодные для дальнейшего использования."
 d_pd_cryo_cryocrystal_caverns: "Криокристалльные пещеры"
 d_pd_cryo_cryocrystal_caverns_desc: "Подземные полости, покрытые редкими кристаллами, растущими лишь при крайне низких температурах. Стабильность отложений прямо зависит от состояния окружающего их льда."
 d_pd_cryo_cryocrystal_spires: "Криокристалльные шпили"
 d_pd_cryo_cryocrystal_spires_desc: "Поверхностные иглообразные образования из редких кристаллов, выросших за тысячи лет медленного осаждения. Сбор каждого такого шпиля даст огромное количество кристаллов."
 d_pd_cryo_gas_seeps: "Источники морозных газов"
 d_pd_cryo_gas_seeps_desc: "Слабые струйки экзотических газов, медленно просачивающихся из трещин подо льдом. Поток небольшой, но постоянный по всей окружающей местности."
 d_pd_cryo_gas_columns: "Столпы из морозных газов"
 d_pd_cryo_gas_columns_desc: "Мощные, усточивые струи экзотических газов, бьющие из глубоких недр. Объём потенциальной добычи не уступает крупнейшим газовым месторождениям, обнаруженным в более тёплых мирах."
 d_pd_cryo_betharian_deposit: "Скопления замёрзшего бетария"
 d_pd_cryo_betharian_deposit_desc: "Залежи бетария, залегающие в глубоких пластах льда на огромной территории. Кристаллы останутся недоступными, пока их не удастся оттаять и обработать."
 d_pd_cryo_alien_pets_deposit: "Скрытая долина криофауны"
 d_pd_cryo_alien_pets_deposit_desc: "Заповедная низменность, изобилующая местной криофауной. Эти дикие животные послушны, легко приручаются и хорошо подходят для общения."
 d_pd_cryo_toxic_mire: "£blocker£ Ядовитое криоболото"
 d_pd_cryo_toxic_mire_desc: "Широкий простор, покрытый химически активной слякотью, полной замёрзших токсинов. Эта местность полностью непригодна для возведения безопасного жилья."
 d_pd_cryo_glacier_wall: "£blocker£ Ледниковая стена"
 d_pd_cryo_glacier_wall_desc: "Огромная стена из плотного, древнего льда, рассекающая местную равнину. Этот массив слишком толстый и неустойчивый, чтобы на нём можно было что-то строить без специальных подготовительных работ."
 tech_pd_cryo_toxic_mire: "Очистка криоболот"
 tech_pd_cryo_toxic_mire_desc: "Для очистки и обеззараживания токсичных болот на сверхохлаждённых мирах нужны специальные химические нейтрализаторы и низкотемпературные поглотители. И только после их использования земли станут достаточно безопасными для использования."
 tech_pd_cryo_glacier_wall: "Бурение ледниковых стен"
 tech_pd_cryo_glacier_wall_desc: "Буровые установки с подогревом и кумулятивные заряды способны пробить плотные ледяные стены, препятствующие колонизации сверхохлаждённых планет. Спецбригады обучаются расчищать ледники в разы быстрее, чем займёт обычное таяние."
 pc_pd_ammonia_tooltip: "§YАммиачные миры§! - это ['concept_pd_cryogenic_planets', сверхохлаждённые планеты]\n- £district£ §Y$district_pdexotic_cryo_chemovat_plural$§!: §G+3§!\n- Скорость роста поселений: §G+10%§!\n- Содержание строений и районов: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_ammonia_fixation_institute']\n$t$- ['building:building_pd_ammonia_pharma_works']\n$t$- ['building:building_pd_ammonia_biome_reserve']"
 pc_pd_methane_tooltip: "§YМетановые миры§! - это ['concept_pd_cryogenic_planets', сверхохлаждённые планеты]\n- £district£ §Y$district_pdexotic_cryo_riftvent_plural$§!: §G+3§!\n- Скорость строительства: §G+15%§!\n- Стоимость постройки строений и районов: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_methane_tholin_lab']\n$t$- ['building:building_pd_methane_hydrocarbon_foundry']\n$t$- ['building:building_pd_methane_polymer_plant']"
 pc_pd_nitrogen_tooltip: "§YАзотные миры§! - это ['concept_pd_cryogenic_planets', сверхохлаждённые планеты]\n- £district£ §Y$district_pdexotic_cryo_sublimation_plural$§!: §G+3§!\n- £physics£ §YФизические исследования§!: §G+10%§!\n- Содержание строений и районов: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_nitrogen_supercomputer']\n$t$- ['building:building_pd_nitrogen_munitions_foundry']\n$t$- ['building:building_pd_nitrogen_cryonics_sanctuary']"
 building_pd_ammonia_fixation_institute: "Институт аммиачной химии"
 building_pd_ammonia_fixation_institute_desc: "Химический состав этой богатой аммиаком планеты открывает нашим биологам и инженерам множество возможностей по изучению экзотических реакций и процессов."
 building_pd_ammonia_pharma_works: "Аммиачный фармзавод"
 building_pd_ammonia_pharma_works_desc: "Изобилующий здесь аммиак перерабатывается в медикаменты и чистящие средства, которые поставляются на рынки по всей империи."
 building_pd_ammonia_biome_reserve: "Заповедник аммиачной биосферы"
 building_pd_ammonia_biome_reserve_desc: "Странная криофильная экосистема этого мира привлекает любопытных посетителей со всей галактики."
 building_pd_methane_tholin_lab: "Лаборатория метановой химии"
 building_pd_methane_tholin_lab_desc: "Плотная органическая дымка этого мира скрывает множество экзотических низкотемпературных реакций, которые предстоит открыть нашим исследователям."
 building_pd_methane_hydrocarbon_foundry: "Метан-крекинговая литейная"
 building_pd_methane_hydrocarbon_foundry_desc: "Здесь расщепляется и перерабатывается в сплавы нескончаемое количество углеводородов, а дешевое местное топливо поддерживает работу литейных цехов."
 building_pd_methane_polymer_plant: "Метан-полимерная фабрика"
 building_pd_methane_polymer_plant_desc: "Метановые моря - почти безграничный источник сырья для производства пластмасс и других готовых изделий."
 building_pd_nitrogen_supercomputer: "Суперкопьютерный комплекс"
 building_pd_nitrogen_supercomputer_desc: "Естественная, критически низкая температура окружающей среды позволяет сверхпроводниковым компьютерам работать без перегревов на мощностях, недоступных на любом более тёплом мире."
 building_pd_nitrogen_munitions_foundry: "Азотная военная фабрика"
 building_pd_nitrogen_munitions_foundry_desc: "Богатые нитратами залежи этого мира легко переработать во взрывчатку и использовать для выплавки военных сплавов, так необходимых для нужд наших армий."
 building_pd_nitrogen_cryonics_sanctuary: "Азотное криохранилище"
 building_pd_nitrogen_cryonics_sanctuary_desc: "Естественный холод этого мира способен сохранить что угодно, что привлекает клиентов и туристов со всей галактики."
