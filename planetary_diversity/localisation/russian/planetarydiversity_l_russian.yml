 job_pd_cave_speleo_engineer_plural: "Спелеоинженеры"
 job_pd_cave_speleo_engineer_desc: "Спелеоинженеры решают сложные задачи строительства подземных городов, а также в процессе работы извлекают немного энергии из геотермальных трещин."
