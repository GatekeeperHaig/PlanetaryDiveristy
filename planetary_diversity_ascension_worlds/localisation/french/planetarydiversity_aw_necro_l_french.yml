#Acension Perk
 ap_pd_necro_worlds: "Mondes nécropoles"
 ap_pd_necro_worlds_desc: "Nos morts méritent des mondes entiers. Nous pouvons transformer nos planètes en temples tentaculaires en leur honneur. Disponible pour un ['concept_pd_necro_empire']."
 allow_necro_worlds: "§HDébloque la décision :§! $decision_pd_aw_necro_planet$"
 describe_necro_worlds: "Débloque l'arme de Colosse §YRayon de nécrose planétaire§! §R(nécessite l'atout de l'ascension §Y$ap_colossus$§!)§!."
 concept_pd_necro_empire: "Empire nécroïde"
 concept_pd_necro_empires: "Empires nécroïdes"
 concept_pd_necro_empire_desc: "$concept_pd_necro_empire$ regroupe les empires dotés de \n- $NECROID$ $SPECIES_CLASS$$NEW_LINE$- ['civic:civic_memorialist']$NEW_LINE$- ['civic:civic_death_cult']$NEW_LINE$- ['civic:civic_death_cult_corporate']$NEW_LINE$- ['civic:civic_permanent_employment']$NEW_LINE$- ['civic:civic_reanimated_armies']$NEW_LINE$- ['civic:civic_hive_cordyceptic_drones']$NEW_LINE$- ['civic:civic_hive_memorialist']$NEW_LINE$- ['civic:civic_machine_memorialist']$NEW_LINE$- ['civic:origin_necrophage']$NEW_LINE$- ['ascension_perk:ap_mechromancy']"

#Necropolis District
 district_pd_aw_necro: "District nécropole"
 district_pd_aw_necro_plural: "Districts nécropoles"
 district_pd_aw_necro_desc: "Des flèches s'élèvent au-dessus des tombes de nos morts, et les fidèles veillent à leur pied."
 district_rw_pd_aw_necro: "Segment nécropole"
 district_rw_pd_aw_necro_desc: "Des flèches s'élèvent au-dessus des tombes de nos morts sur cette section d'anneau-monde, et les fidèles veillent à leur pied."
 district_rw_pd_aw_necro_plural: "Segments nécropoles"

#Notification Message
 MESSAGE_PD_AW_NECRO_DESC:1 "$PLANET|Y$ est désormais une §Y$pd_aw_necro_planet$§!"
 MESSAGE_PD_AW_NECRO_MESSAGE_TYPE_TITLE: "Nécropole planétaire achevée"
 MESSAGE_PD_AW_NECRO_CLEANUP_DESC:1 "La nécropole planétaire de $PLANET|Y$ a été supprimée."
 MESSAGE_PD_AW_NECRO_CLEANUP_MESSAGE_TYPE_TITLE: "Nécropole supprimée"

#Necro Planet Cracker
 PLANET_KILLER_PD_NECRO_RAY: "Rayon de nécrose planétaire"
 PLANET_KILLER_PD_NECRO_RAY_DESC: "Une marée spectrale de nanobots déferlera sur ce monde, anéantissant les robots et éteignant toute fonction supérieure chez les vivants. Dans son sillage, une nécropole s'élèvera sur tout le paysage."
 PLANET_KILLER_PD_NECRO_RAY_ACTION: "Nécromancier"
 FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_PD_NECRO_RAY: "Prépare la nécromancie de $PLANET|Y$"
 MESSAGE_DESC_FOR_PLANET_KILLER_PD_NECRO_RAY: "a subi une transformation nécrotique par la"
 pd_necro_ray.02.name: "Nécromancie planétaire"
 pd_necro_ray.02.desc: "Tandis que se dissipe la colonne de nanobots descendue du [FromFrom.GetName], la surface de [From.GetName] est entièrement transformée. Il n'y a plus là qu'une nécropole."
 pd_necro_ray.02.tooltip: "La planète devient une §Y$pd_aw_necro_planet$§!.\nTous les Pops robotiques, machines et à esprit de ruche seront détruits et tous les autres Pops obtiendront le trait §Y$trait_zombie$§!."
 is_not_necro: "§R$TRIGGER_FAIL$La cible est déjà une §Y$pd_aw_necro_planet$§!§!"
 will_purge_robots_and_zombie: "§RLes Pops robotiques, machines et à esprit de ruche seront détruits et tous les autres Pops obtiendront le trait §Y$trait_zombie$§!§!"
 opinion_pd_necro_a_world: "A nécromancié un monde"
 opinion_pd_necro_my_world: "A nécromancié notre monde"
 opinion_pd_necro_a_primitive_world: "A nécromancié un monde primitif"
 opinion_pd_necro_a_primitive_world_phile: "$opinion_cracked_a_primitive_world_phile$"

#Necropolis Deposit
 d_pd_necro_deposit: "Flèches éternelles"
 d_pd_necro_deposit_desc: "Ces flèches attirent les fidèles de tous nos mondes pour servir en leur cœur. Leurs travaux épousent la forme des traditions que nous tenons pour éternelles."