 job_pd_superhab_gravitic_forgewright: "Гравикузнец"
 job_pd_superhab_gravitic_forgewright_plural: "Гравикузнецы"
 job_pd_superhab_gravitic_forgewright_desc: "Гравикузнецы используют повышенную силу тяжести планеты для литья более плотных и прочных сплавов, а их изыскания слегка продвигают физику и материаловедение."
