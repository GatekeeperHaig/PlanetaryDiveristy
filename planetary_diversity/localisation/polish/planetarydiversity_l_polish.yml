 job_pd_megaflora_xylem_tapper_desc: "Operatorzy sieci ksylemowej pozyskują energię z rozległej sieci ciśnieniowego transportu soków megaflory. Ten samowystarczalny układ dostarcza również jadalnej biomasy."
