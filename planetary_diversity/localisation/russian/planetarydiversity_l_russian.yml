 job_pd_superhab_gravitic_forgewright_drone_desc: "$job_pd_superhab_gravitic_forgewright_desc$"
 zone_pd_geothermal_grid: "Геотермальная энергосеть"
 zone_pd_geothermal_grid_desc: "Подключив нашу энергосистему к мощным геотермальным источникам на планете, мы сможем увеличить производительность нашей техники."
 zone_pd_geothermal_foundry: "Фильтратор геотермального шлама"
 zone_pd_geothermal_foundry_desc: "Геотермальный шлам полон редких и ценных ресурсов, при правильной фильтрации его можно использовать для повышения производительности наших литейных цехов."
 zone_pd_geothermal_lab: "Департамент геотермальной инженерии"
 zone_pd_geothermal_lab_desc: "Высокая геотермальная активность и экстремальные перепады температур вынуждают наших инженеров прибегать к уникальным решениям для обычных инженерных задач."
 concept_zone_pd_geothermal_grid: "$zone_pd_geothermal_grid$"
