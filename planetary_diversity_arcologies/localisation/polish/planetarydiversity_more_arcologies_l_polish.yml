 mod_job_pd_capital_bio_politician_per_pop_short: "\n§G+1§! £mod_job_pd_capital_bio_politician_add£ na $VALUE$ £pop£"
 job_pd_capital_bio_effect_desc: "$job_pd_capital_bio_politician$ $job_pd_capital_bio_politician_plural$ przetwarzają £consumer_goods£ §Y$consumer_goods$§! w: £unity£ §Y$unity$§! oraz zwiększają §Y$mod_planet_jobs_complex_and_simple_drone_produces_mult$§!."
 #Rogue Rangers
 job_pd_robo_ranger: "Dron bioróżnorodności"
 job_pd_robo_ranger_plural: "Drony bioróżnorodności"
 job_pd_robo_ranger_desc: "Drony bioróżnorodności są wyspecjalizowane w dbaniu, by nasze planety pozostawały czyste i naturalne dla biotrofeów."
 mod_job_pd_robo_ranger_add: "Miejsca pracy: $job_pd_robo_ranger$"
 mod_job_pd_robo_ranger_per_pop: "§G+1§! miejsce pracy ($job_pd_robo_ranger$) na $VALUE$ populacji"
 mod_job_pd_robo_ranger_per_pop_short: "\n§G+1§! £mod_job_pd_robo_ranger_add£ na $VALUE$ £pop£"
 job_pd_robo_ranger_effect_desc: "$job_pd_robo_ranger$ $job_pd_robo_ranger_plural$ zapewniają £amenities£ §Yudogodnienia§! oraz £society_research£ §Y$society_research$§!."

#Buildings
 building_pd_rogue_council: "Rada biotrofeów"
 building_pd_rogue_council_desc: "Powierzanie wybranym biotrofeom ról przywódczych zaspokaja ich wrodzoną potrzebę hierarchii społecznej, a celowo wywoływany „impas polityczny” stwarza iluzję konfliktu. Pozwala to dronom skupić się na poprawie opieki nad biotrofeami i zwiększaniu ich zadowolenia."
 building_navel_base: "Biuro floty"
 building_navel_base_desc: "Międzygwiezdna twierdza - ta planetarna baza wojskowa jest kluczowym ośrodkiem wsparcia dla naszych flot."
 building_navel_command: "Centrum dowodzenia floty"
 building_navel_command_desc: "Ten kompleks wojskowy to olbrzymia forteca dowodzenia, z której zarządza się działaniami naszych międzygwiezdnych armad."

#Decisions
 #Garden
 decision_pd_garden_arcology_project: "Projekt Arkologia - Ogród"
 decision_pd_garden_arcology_project_desc: "Wplatając zielone przestrzenie w tkankę naszych arkologii, możemy rozwinąć rozległe ekumenopolis, gdzie natura i urbanizacja współistnieją w harmonii."
 decision_pd_garden_arcology_project_effects_short: "Zwiększa £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§!\nOdblokowuje £district£ §Ydzielnice arkologiczne§!\nBlokuje budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!"
 decision_pd_garden_arcology_project_relic: "Odbuduj Ekumenopolis - Ogród"
 decision_pd_garden_arcology_project_relic_desc: "Ta planeta była niegdyś tętniącym życiem ekumenopolis. Odbudowa wymagałaby ogromnych nakładów, ale mogłaby przekształcić ten świat w arkologię ogrodową."
 decision_pd_garden_arcology_project_relic_effects_short: "$decision_pd_garden_arcology_project_effects_short$"
 #Fortress
 decision_pd_fortress_arcology_project: "Projekt Arkologia - Twierdza"
 decision_pd_fortress_arcology_project_desc: "Możemy stworzyć potężny bastion, otaczając nasze arkologie fortyfikacjami i zaawansowanymi osłonami."
 decision_pd_fortress_arcology_project_effects: "Przekształca planetę w §Y$pc_city$§!, zwiększając £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§! oraz odblokowując specjalne £district£ §Ydzielnice arkologiczne§! kosztem zasobów naturalnych planety, które stają się §Rniedostępne§!. Uniemożliwia to dalszą budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!."
 decision_pd_fortress_arcology_project_effects_short: "Zwiększa £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§!\nOdblokowuje £district£ §Ydzielnice arkologiczne§!\nBlokuje budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!"
 decision_pd_fortress_arcology_project_relic: "Odbuduj Ekumenopolis - Twierdza"
 decision_pd_fortress_arcology_project_relic_desc: "Ta planeta była niegdyś tętniącym życiem ekumenopolis. Odbudowa wymagałaby ogromnych nakładów, ale mogłaby przekształcić ten świat w arkologię-twierdzę."
 decision_pd_fortress_arcology_project_relic_effects: "$decision_pd_fortress_arcology_project_effects$"
 decision_pd_fortress_arcology_project_relic_effects_short: "$decision_pd_fortress_arcology_project_effects_short$"
 #Commercial
 decision_pd_commercial_arcology_project: "Projekt Arkologia - Centrum Komercyjne"
 decision_pd_commercial_arcology_project_desc: "Możemy stworzyć tętniące życiem centrum handlu, wpisując targowiska i sieci wymiany w samą tkankę tej arkologii."
 decision_pd_commercial_arcology_project_effects_short: "Zwiększa £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§!\nOdblokowuje £district£ §Ydzielnice arkologiczne§!\nBlokuje budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!"
