 zone_pd_tidally_lab: "Лаборатории по изучению сумеречных экосистем"
 zone_pd_tidally_lab_desc: "Каждый кусочек терминатора - сумеречной полоски планеты имеет необычные экосистемы, уникальные настолько, что флора и фауна разошлись особыми путями."
