 job_pd_archipelago_kelp_farmer: "巨藻养殖员"
 job_pd_archipelago_kelp_farmer_plural: "巨藻养殖员 "
 job_pd_archipelago_kelp_farmer_desc: "巨藻养殖员负责养护广袤的离岸巨藻床以供应食物，并将多余的生物质转化为能源。"
 job_pd_archipelago_kelp_farmer_drone: "巨藻养殖员"
