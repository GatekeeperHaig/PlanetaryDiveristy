 job_pd_naval_admin_gestalt_plural: "Drony logistyczne"
 job_pd_naval_admin_gestalt_desc: "Wyspecjalizowane w zarządzaniu zaopatrzeniem drony zapewniają sprawne działanie floty, utrzymując i monitorując kluczowe linie dostaw."
 mod_job_pd_naval_admin_gestalt_add: "Miejsca pracy: $job_pd_naval_admin_gestalt$"
 mod_job_pd_naval_admin_gestalt_per_pop: "§G+1§! miejsce pracy ($job_pd_naval_admin_gestalt$) na $VALUE$ populacji"
