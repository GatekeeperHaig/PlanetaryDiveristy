l_french:

###Planetary Infesters
#Civic
 civic_hive_pd_planetary_infesters: "Infestateurs planétaires"
 civic_hive_pd_planetary_infesters_desc: "Cette Conscience s'implante dans les écosystèmes d'une planète. Chaque monde devient une extension d'elle-même et prospère sous sa direction comme un réseau unifié."
 civic_tooltip_pd_planetary_infesters_effects: "Peut construire £building£ $building_pd_aw_planet_infester_1$\n- $building_pd_planet_infestor_desc$\n- Le monde natal est un $pc_hive$"

#Buildings
 building_pd_planet_infestor_desc: "Les §YNœuds d'infestation§! évoluent en trois phases d'amélioration et convertissent progressivement la planète en §YMonde de la Conscience§!."
 building_pd_aw_planet_infester_1: "Nœud d'infestation - Première phase"
 building_pd_aw_planet_infester_1_desc: "Ce nœud, cœur de la phase initiale d'infestation, est vital pour la présence de la Conscience sur cette planète. Sa perte briserait l'emprise de la Conscience sur ce monde."
 building_pd_aw_planet_infester_2: "Nœud d'infestation - Deuxième phase"
 building_pd_aw_planet_infester_2_desc: "Ce nœud massif, désormais à la phase intermédiaire d'infestation, entretient avec la Conscience un lien assez solide pour manipuler des processus planétaires essentiels. Sa perte briserait l'emprise de la Conscience sur ce monde."
 building_pd_aw_planet_infester_3: "Nœud d'infestation planétaire"
 building_pd_aw_planet_infester_3_desc: "Parvenu à son apogée, ce nœud redoutable exerce une domination totale sur tous les processus planétaires. Sa perte briserait l'emprise de la Conscience sur ce monde."
 building_pd_aw_planet_infester_3_effect_desc: "Cette planète sera transformée en §Y$pc_hive$§!."

#Dummy Class
 pc_hive_dummy: "$pc_hive$"
 pc_hive_dummy_desc: "$pc_hive_desc$"
 pc_hive_dummy_adj: "$pc_hive_adj$"
 mod_pc_hive_dummy_habitability: "$mod_pc_hive_habitability$"
 trait_pc_hive_dummy_preference: "$trait_pc_hive_preference$"
 trait_pc_hive_dummy_preference_desc: "$trait_pc_hive_preference_desc$"

#Events
 pdawplanetaryinfesters.120.name: "Conscience planétaire achevée"
 pdawplanetaryinfesters.120.desc: "Le nœud a atteint sa pleine maturité. Ses vrilles parcourent désormais chaque recoin de [Root.GetName], et notre emprise sur la planète est totale."
 pdawplanetaryinfesters.120.a: "Un nouveau foyer pour la Conscience."