 pd_tidally_duskbelt_gardener: "$job_pd_tidally_duskbelt_gardener$"
 job_pd_tidally_duskbelt_gardener: "Ogrodnik pasa zmierzchu"
 job_pd_tidally_duskbelt_gardener_plural: "Ogrodnicy pasa zmierzchu"
 job_pd_tidally_duskbelt_gardener_desc: "Ogrodnicy pasa zmierzchu prowadzą uprawy w umiarkowanym pasie między wiecznym dniem a wieczną nocą. Stałe oświetlenie i nieustanny wiatr wspierają zarówno produkcję żywności, jak i zasilanie sieci energetycznej."
