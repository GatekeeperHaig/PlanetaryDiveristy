 job_pd_megaflora_rootbreaker: "破根者"
 job_pd_megaflora_rootbreaker_plural: "破根者"
 job_pd_megaflora_rootbreaker_desc: "破根者会沿着巨型植被的根系深入地壳，撬出普通矿井根本无法触及的矿物；并在将矿石吊运出井的同时，把可食用的根块也一并拖上地面。"
 job_pd_megaflora_rootbreaker_drone: "破根者"
 job_pd_megaflora_rootbreaker_drone_plural: "破根者"
