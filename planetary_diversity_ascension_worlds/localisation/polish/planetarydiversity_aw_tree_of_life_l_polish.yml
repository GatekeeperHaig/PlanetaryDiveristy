l_polish:

#Origin
 origin_pd_aw_tree_of_life: "Drzewo Życia megaflory"
 origin_pd_aw_tree_of_life_desc: "Ten rój wyewoluował w symbiotycznej relacji z olbrzymim drzewem megaflory, którego korzenie dotarły do każdego zakątka planety i przekształciły ekosystem tak, aby służył zarówno drzewu, jak i dronom. Bez wsparcia drzewa rój miałby ogromne trudności z przetrwaniem."
 origin_tooltip_pd_aw_tree_of_life_start_effects: "- $HOMEWORLD$$TABBED_NEW_LINE$- Cecha planety: ['concept_tree_of_life']$TABBED_NEW_LINE$- Modyfikatory planetarne: ['concept_pd_aw_tree_of_life_modifier']$NEW_LINE$- Skolonizowane planety:$TABBED_NEW_LINE$- Cecha planety: ['concept_pd_aw_tree_of_life_sapling']$NEW_LINE$- Kolonie bez §Ysadzonki Drzewa Życia§!:$TABBED_NEW_LINE$- Decyzja planetarna: ['concept_transplant_pd_aw_tree_of_life']$NEW_LINE$- $AVAILABLE_HOLDINGS$ ['concept_pd_aw_tree_of_life_holding', £building£ $holding_tree_of_life_sapling$] w koloniach poddanych"
 origin_tooltip_pd_aw_tree_of_life_start_negative_effects: "- Nie można terraformować planet"

#Concepts
 concept_pd_aw_tree_of_life: "$d_tree_of_life_home$"
 concept_pd_aw_tree_of_life_desc: "- $MOD_LOGISTIC_GROWTH_MULT$: §G+15%§!\n- $mod_planet_jobs_society_research_produces_mult$: §G+10%§!\n- $MOD_PLANET_HOUSING_ADD$: §G+1000§!\n- $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-1§!\n- Utrzymanie: 5 $i_food$\n\n§L$d_tree_of_life_home_desc$§!"
 concept_pd_aw_tree_of_life_modifier: "$pd_aw_tree_of_life_home$"
 concept_pd_aw_tree_of_life_modifier_desc: "- Odblokowuje ['concept_generator_district', £district£ $district_generator_plural$]$NEW_LINE$- Odblokowuje ['concept_mining_district', £district£ $district_mining_plural$]$NEW_LINE$- Odblokowuje ['concept_farming_district', £district£ $district_farming_plural$]\n\n§L$pd_aw_tree_of_life_home_desc$§!"
 concept_pd_aw_tree_of_life_sapling: "$d_pd_aw_tree_of_life_colony$"
 concept_pd_aw_tree_of_life_sapling_desc: "- $MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n- $mod_planet_jobs_society_research_produces_mult$: §G+10%§!\n- $MOD_PLANET_HOUSING_ADD$: §G+500§!\n- $mod_district_farming_max_add$: §G+2§!\n- $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-1§!\n- Utrzymanie: 20 $i_food$\n\n§L$d_tree_of_life_colony_desc$§!"
 concept_transplant_pd_aw_tree_of_life: "$decision_pd_aw_replant_tree_of_life$"
 concept_transplant_pd_aw_tree_of_life_desc: "Pozwala ponownie zasadzić Drzewo Życia na tej planecie.\n\n§L$decision_pd_aw_replant_tree_of_life_desc$§!"
 concept_pd_aw_tree_of_life_holding: "$holding_tree_of_life_sapling$"
 concept_pd_aw_tree_of_life_holding_desc: "- $MOD_MONTHLY_LOYALTY_GAIN$: §G+1§!\n- $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+10%§!\n- £food£ Żywność z miejsc pracy £job_farmer£ ['concept_farmer']: §G+1§!\n- £mod_job_ranger_add£ ['concept_overlord_arborist', $job_overlord_arborist$] miejsca pracy: §G+1§!\n\n§L$holding_tree_of_life_sapling_desc$§!"

#Deposits
 d_pd_aw_tree_of_life_home: "Drzewo Życia"
 d_pd_aw_tree_of_life_home_desc: "Drzewo Życia od niezliczonych pokoleń zapewnia rojowi schronienie i wsparcie."
 d_pd_aw_tree_of_life_colony: "Sadzonka Drzewa Życia"
 d_pd_aw_tree_of_life_colony_desc: "Pęd Wielkiego Drzewa, przeszczepiony tutaj przez rój. Potrzeba czasu, by osiągnął pełną dojrzałość."
 d_pd_aw_tree_of_life_bloomed: "Rozkwitłe Drzewo Życia"
 d_pd_aw_tree_of_life_bloomed_desc: "Wielkie Drzewo od niezliczonych pokoleń zapewnia rojowi schronienie i wsparcie. Teraz, gdy rozkwitło, każdy dron odczuwa jego dobroczynny wpływ."
 d_pd_tree_of_life_habitat: "Drzewo Życia stacji mieszkalnej"
 d_pd_tree_of_life_habitat_desc: "Pęd Wielkiego Drzewa, przeszczepiony tutaj przez rój. Ta miniaturowa wersja w obrębie stacji mieszkalnej nigdy nie osiągnie pełnego potencjału, ale wesprze drony stacjonujące w tym miejscu."
 d_pd_tree_of_life_ringworld: "Drzewo Życia świata pierścieniowego"
 d_pd_tree_of_life_ringworld_desc: "Pęd Wielkiego Drzewa, przeszczepiony tutaj przez rój. Choć potrafi rosnąć na powierzchni świata pierścieniowego, to zbyt płytka warstwa gleby nie pozwala mu osiągnąć pełnych rozmiarów."

#Planets
 pc_pd_megaflora_hive: "Świat megaflory roju"
 pc_pd_megaflora_hive_desc: "Skalisty świat z atmosferą azotowo-tlenową, gęsto zalesiony i z dobrze rozwiniętą hydrosferą. Jego powierzchnię pokrywa drzewo megaflory, psionicznie połączone z umysłem zbiorowym, który je pielęgnuje. System korzeniowy drzewa stanowi podstawę budowli i siedlisk roju. Choć rośnie powoli, jego zdolności regeneracyjne ułatwiają obronę i naprawę uszkodzeń."
 trait_pc_pd_megaflora_hive_preference: "Preferencja - świat megaflory roju"
 trait_pc_pd_megaflora_hive_preference_desc:1 "$trait_pc_arctic_preference_desc$"
 pc_pd_megaflora_hive_habitability: "Możliwość zamieszkania świata megaflory roju"
 mod_pc_pd_megaflora_hive_habitability: "Możliwość zamieszkania świata megaflory roju"
 pc_pd_megaflora_hive_bloomed: "Świat megaflory roju"
 pc_pd_megaflora_hive_bloomed_desc: "Skalisty świat z atmosferą azotowo-tlenową, gęsto zalesiony i z dobrze rozwiniętą hydrosferą. Jego powierzchnię pokrywa drzewo megaflory, psionicznie połączone z umysłem zbiorowym, który je pielęgnuje."
 trait_pc_pd_megaflora_hive_bloomed_preference: "Preferencja - świat megaflory roju"
 trait_pc_pd_megaflora_hive_bloomed_preference_desc:1 "$trait_pc_arctic_preference_desc$"
 pc_pd_megaflora_hive_bloomed_habitability: "Możliwość zamieszkania świata megaflory roju"
 mod_pc_pd_megaflora_hive_bloomed_habitability: "Możliwość zamieszkania świata megaflory roju"

#Start Text
 START_SCREEN_PD_TREE_OF_LIFE: "Gdy przebudziliśmy się do świadomości, służyliśmy Drzewu, a Drzewo służyło nam. Opiekujemy się Drzewem, karmimy Drzewo, chronimy Drzewo, a Drzewo karmi nas. Dla dobra Drzewa rozprzestrzeniliśmy się po całej planecie [GetHomeWorldName], sadząc i doglądając jego odrostów wszędzie, gdzie się udaliśmy.\n\nNasz świat służy Drzewu od stuleci, a jednak obawiamy się, że Drzewo nie jest całkowicie bezpieczne, odkąd poznaliśmy zagrożenia płynące z otchłani kosmosu. Od dawna wiemy, że to nie jedyna planeta; galaktyka pełna jest światów pozbawionych Drzew, a my pragniemy to zmienić.\n\nMusimy chronić Drzewo. Drzewo musi się rozprzestrzenić. Drzewo musi rosnąć."

#Modifiers
 pd_aw_tree_of_life_bloomed: "Świat rozkwitłego Drzewa Życia"
 pd_aw_tree_of_life_bloomed_desc: "Wielkie Drzewo na tej planecie w pełni dojrzało i rozkwitło. Jego ogromny system korzeniowy zapewnia dodatkową przestrzeń dla dronów-robotników i jest w stanie wytrzymać znaczne uszkodzenia."
 pd_aw_tree_of_life_growing: "Wzrastająca sadzonka Drzewa Życia"
 pd_aw_tree_of_life_growing_desc: "Drony na tej planecie skupiają się na tym, by zasadzona tu sadzonka Wielkiego Drzewa dobrze się przyjęła."
 pd_aw_tree_of_life_home: "Świat Drzewa Życia"
 pd_aw_tree_of_life_home_desc: "Wielkie Drzewo na tej planecie osiągnęło pełne rozmiary. Jego system korzeniowy zapewnia przestrzeń dla dronów-robotników i jest naturalnie odporny na uszkodzenia."
 d_pd_tree_of_life_ringarc: "Drzewo Życia świata pierścieniowego"
 d_pd_tree_of_life_ringarc_desc: "Wielkie Drzewo na tym świecie pierścieniowym osiągnęło największe rozmiary, na jakie pozwalają miejscowe warunki. Jego system korzeniowy zapewnia przestrzeń dla dronów-robotników i jest naturalnie odporny na uszkodzenia."
 pd_aw_no_lifetree: "Brak Drzewa Życia"
 pd_aw_no_lifetree_desc: "Bez Wielkiego Drzewa Życia rój jest niekompletny."
 pd_no_lifetree_arcology: "Brak Drzewa Życia"
 pd_no_lifetree_arcology_desc: "Niekończąca się zabudowa miejska pokrywa tę planetę, przez co nie ma na niej warunków do wzrostu Drzewa Życia."

#Decisions
 decision_pd_aw_replant_tree_of_life: "Zasadź ponownie Drzewo Życia"
 decision_pd_aw_replant_tree_of_life_desc: "Musimy zasadzić tutaj sadzonkę Wielkiego Drzewa Życia, aby nasz rój mógł się rozwijać."
 decision_pd_aw_bloom_tree_of_life: "Pobudź Drzewo Życia do rozkwitu"
 decision_pd_aw_bloom_tree_of_life_desc: "Skłonienie Wielkiego Drzewa Życia do rozkwitu wymaga znacznych zasobów i czasu, ale dzięki temu odblokujemy jego pełen potencjał."
 decision_pd_aw_bloom_tree_of_life_tooltip: "Ta planeta stanie się światem typu §Y$pc_gaia$§!, a jej §Y$d_pd_aw_tree_of_life_home$§! zmieni się w §Y$d_pd_aw_tree_of_life_bloomed$§!."

#Ascension Perk
 ap_pd_tree_of_life_bloomed: "Rozkwitłe światy megaflory roju"
 ap_pd_tree_of_life_bloomed_desc: "Możemy pobudzić każde Wielkie Drzewo Życia do rozkwitu, uwalniając jego pełny potencjał."
 allow_tree_of_life_bloomed: "§HOdblokowuje decyzję:§! $decision_pd_aw_bloom_tree_of_life$"
 describe_tree_of_life_bloomed_worlds: "Planety ze złożem §Y$d_pd_aw_tree_of_life_bloomed$§! stają się światem typu §Y$pc_gaia$§!, zamieszkiwalnym dla wszystkich £pop£ populacji, z produkcją miejsc pracy większą o §G+10%§!. §Y$d_pd_aw_tree_of_life_bloomed$§! zapewnia §G+2000§! £housing£ §Y$PLANET_HOUSING_TITLE$§!, miejsce pracy £pop£ §Y$job_spawning_drone$§! oraz §G+20%§! $MOD_POP_BONUS_WORKFORCE_MULT$, a planeta staje się odporna na $MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$."

#Holdings
 holding_pd_aw_tree_of_life_sapling: "Sadzonka Drzewa Życia megaflory"
 holding_pd_aw_tree_of_life_sapling_desc: "Zwierzchnik tak długo żył ze swoim Drzewem Życia megaflory, że nie jest już w stanie wyobrazić sobie egzystencji bez niego. Teraz pragnie podzielić się tym samym darem ze swoimi wasalami."

#Arcology - With Arc Sub Mod
 district_pd_flora_hive: "$district_hive$"
 district_pd_flora_hive_desc: "$district_hive_desc$"
 district_pd_flora_hive_plural: "$district_hive_plural$"
 district_pd_flora_hive_industrial: "Dzielnica przemysłowa"
 district_pd_flora_hive_industrial_desc: "Huty i fabryki w tej dzielnicy przetwarzają surowce w zaawansowane produkty."
 district_pd_flora_hive_industrial_plural: "Dzielnice przemysłowe"
 district_pd_flora_hive_naval: "Dzielnica logistyczna"
 district_pd_flora_hive_naval_desc: "Tutejsze drony usprawniają działania floty, aby zapewnić jej maksymalną skuteczność."
 district_pd_flora_hive_naval_plural: "Dzielnice logistyczne"
 district_pd_flora_hive_research: "Dzielnica badawcza"
 district_pd_flora_hive_research_desc: "Niezliczone laboratoria wypełnione są dronami skupionymi na badaniach."
 district_pd_flora_hive_research_plural: "Dzielnice badawcze"
 district_pd_flora_hive_administrative: "Dzielnica synaptyczna"
 district_pd_flora_hive_administrative_desc: "Węzeł synaptyczny wzmacniający psioniczne połączenia roju i rozszerzający zasięg jego woli oraz przewodnictwa na cały kosmos."
 district_pd_flora_hive_administrative_plural: "Dzielnice synaptyczne"
 pc_pd_flora_hive: "Świat korony megaflory"
 pc_pd_flora_hive_desc: "Ten rój wyewoluował w symbiotycznej relacji z olbrzymim drzewem megaflory, którego korzenie rozprzestrzeniły się w każdy zakątek planety i zmieniły ekosystem, aby odpowiadał zarówno jemu, jak i dronom. Świat został rozwinięty w bastion zaawansowanych procesów myślowych i jest silnie broniony przez zamieszkujący go rój."
 pc_pd_flora_hive_adj: "zalesiony"
 mod_pc_pd_flora_hive_habitability: "Możliwość zamieszkania świata korony megaflory"
 trait_pc_pd_flora_hive_preference: "Preferencja - świat korony megaflory"
 trait_pc_pd_flora_hive_preference_desc: "$trait_pc_arctic_preference_desc$"
 pd_aw_flora_hive_military: "Świat korony megaflory"
 pd_aw_flora_hive_military_desc: "Ten świat ma kluczowe znaczenie dla funkcjonowania umysłu zbiorowego megaflory i jest ufortyfikowany, by chronić go przed zewnętrznymi zagrożeniami i wpływami. Potężna tarcza otacza planetę, a drony-wojownicy pozostają w gotowości do jej obrony."
 decision_pd_flora_hive_crown_project: "Projekt megaflory roju — Korona"
 decision_pd_flora_hive_crown_project_desc: "Ten świat roju zostanie przekształcony w ośrodek zaawansowanych procesów myślowych umysłu zbiorowego."
 decision_pd_flora_hive_crown_project_effects: "Przekształca planetę w §Y$pc_pd_flora_hive$§!, zwiększając £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§! oraz odblokowując specjalne £district£ §Ydzielnice arkologii§!. Zasoby naturalne planety stają się jednak §Rniedostępne§!, co uniemożliwia dalszą budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!."
 decision_pd_flora_hive_crown_project_effects_short: "Zwiększa £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§!\nOdblokowuje £district£ §Ydzielnice arkologii§!\nBlokuje budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!"
 decision_pd_megaflora_capital_building: "Wyhoduj Wielkie Drzewo Życia"
 decision_pd_megaflora_capital_building_desc: "Aby zamanifestować potęgę i zasięg naszej zbiorowej świadomości, wyhodujemy potężne Wielkie Drzewo Życia. To majestatyczne drzewo znacząco wzmocni nasze operacje wśród gwiazd."
 decision_pd_megaflora_capital_building_effects: "Dodaje §Y$d_pd_megaflora_capital_building$§! na stołecznym świecie megaflory, zwiększając zdolności administracyjne roju kosztem części dostępnych dzielnic."
 d_pd_megaflora_capital_building: "Wielkie Drzewo Życia"
 d_pd_megaflora_capital_building_desc: "To Drzewo góruje nad całą planetą, stanowiąc majestatyczny znak władzy. Jest ośrodkiem naszej zbiorowej woli, od którego rozchodzą się nasze korzenie ku gwiazdom."

#Jobs
 job_pd_tol_naval_admin_gestalt: "Dron logistyczny"
 job_pd_tol_naval_admin_gestalt_plural: "Drony logistyczne"
 job_pd_tol_naval_admin_gestalt_desc: "Te drony specjalizują się w zarządzaniu zaopatrzeniem. Utrzymując i nadzorując kluczowe linie dostaw, zapewniają sprawne działanie floty."
 mod_job_pd_tol_naval_admin_gestalt_add: "Miejsca pracy: $job_pd_tol_naval_admin_gestalt$"
 mod_job_pd_tol_naval_admin_gestalt_per_pop: "§G+1§! miejsce pracy typu $job_pd_tol_naval_admin_gestalt$ na każde $VALUE$ populacji"
 mod_job_pd_tol_naval_admin_gestalt_per_pop_short: "\n§G+1§! £mod_job_pd_tol_naval_admin_gestalt_add£ na $VALUE$ £pop£"
 job_pd_tol_naval_admin_gestalt_effect_desc: "£job_pd_tol_naval_admin_gestalt£ $job_pd_tol_naval_admin_gestalt_plural$ usprawniają działania floty, przetwarzając £minerals£ §Y$minerals$§! i £energy£ §Y$energy$§! w £society£ §Ypunkty badań§!, zwiększają £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§! i tworzą £defense_army£ §Yarmie obronne§!."
