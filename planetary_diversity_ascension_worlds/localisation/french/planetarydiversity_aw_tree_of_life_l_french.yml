l_french:

#Origin
 origin_pd_aw_tree_of_life: "Arbre de vie mégaflore"
 origin_pd_aw_tree_of_life_desc: "Cette Conscience a évolué dans une relation symbiotique avec un immense arbre de mégaflore dont les racines se sont étendues jusqu'aux moindres recoins de la planète et ont transformé l'écosystème pour l'adapter à la fois à l'arbre et aux drones. La Conscience aurait bien du mal à survivre sans le soutien de l'arbre."
 origin_tooltip_pd_aw_tree_of_life_start_effects: "- $HOMEWORLD$$TABBED_NEW_LINE$- Particularité planétaire : ['concept_tree_of_life']$TABBED_NEW_LINE$- Modificateurs planétaires : ['concept_pd_aw_tree_of_life_modifier']$NEW_LINE$- Planètes colonisées :$TABBED_NEW_LINE$- Particularité planétaire : ['concept_pd_aw_tree_of_life_sapling']$NEW_LINE$- Colonies sans la §YBouture de l'Arbre de vie§! :$TABBED_NEW_LINE$- Décision planétaire : ['concept_transplant_pd_aw_tree_of_life']$NEW_LINE$- $AVAILABLE_HOLDINGS$ ['concept_pd_aw_tree_of_life_holding', £building£ $holding_tree_of_life_sapling$] sur les colonies des dépendances"
 origin_tooltip_pd_aw_tree_of_life_start_negative_effects: "- Impossible de terraformer les planètes"

 #Concepts
 concept_pd_aw_tree_of_life: "$d_tree_of_life_home$"
 concept_pd_aw_tree_of_life_desc: "- $MOD_LOGISTIC_GROWTH_MULT$: §G+15%§!\n- $mod_planet_jobs_society_research_produces_mult$: §G+10%§!\n- $MOD_PLANET_HOUSING_ADD$: §G+1000§!\n- $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-1§!\n- Entretien: 5 $i_food$\n\n§L$d_tree_of_life_home_desc$§!"
 concept_pd_aw_tree_of_life_modifier: "$pd_aw_tree_of_life_home$"
 concept_pd_aw_tree_of_life_modifier_desc: "- Débloque ['concept_generator_district', £district£ $district_generator_plural$]$NEW_LINE$- Débloque ['concept_mining_district', £district£ $district_mining_plural$]$NEW_LINE$- Débloque ['concept_farming_district', £district£ $district_farming_plural$]\n\n§L$pd_aw_tree_of_life_home_desc$§!"
 concept_pd_aw_tree_of_life_sapling: "$d_pd_aw_tree_of_life_colony$"
 concept_pd_aw_tree_of_life_sapling_desc: "- $MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n- $mod_planet_jobs_society_research_produces_mult$: §G+10%§!\n- $MOD_PLANET_HOUSING_ADD$: §G+500§!\n- $mod_district_farming_max_add$: §G+2§!\n- $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-1§!\n- Entretien: 20 $i_food$\n\n§L$d_tree_of_life_colony_desc$§!"
 concept_transplant_pd_aw_tree_of_life: "$decision_pd_aw_replant_tree_of_life$"
 concept_transplant_pd_aw_tree_of_life_desc: "Replante l'Arbre de vie sur ce monde.\n\n§L$decision_pd_aw_replant_tree_of_life_desc$§!"
 concept_pd_aw_tree_of_life_holding: "$holding_tree_of_life_sapling$"
 concept_pd_aw_tree_of_life_holding_desc: "- $MOD_MONTHLY_LOYALTY_GAIN$ : §G+1§!\n- $MOD_POP_ENVIRONMENT_TOLERANCE$ : §G+10%§!\n- £food£ Nourriture des £job_farmer£ ['concept_farmer'] : §G+1§!\n- £mod_job_ranger_add£ Emplois de ['concept_overlord_arborist', $job_overlord_arborist$] : §G+1§!\n\n§L$holding_tree_of_life_sapling_desc$§!"


#Deposits
 d_pd_aw_tree_of_life_home: "Arbre de vie"
 d_pd_aw_tree_of_life_home_desc: "L'Arbre de vie a protégé et soutenu la Conscience durant d'innombrables générations."
 d_pd_aw_tree_of_life_colony: "Bouture de l'Arbre de vie"
 d_pd_aw_tree_of_life_colony_desc: "Une bouture du Grand Arbre, transplantée ici par la Conscience. Il lui faudra du temps pour atteindre sa pleine maturité."
 d_pd_aw_tree_of_life_bloomed: "Arbre de vie en fleurs"
 d_pd_aw_tree_of_life_bloomed_desc: "Le Grand Arbre a protégé et soutenu la Conscience durant d'innombrables générations. Désormais en fleurs, ses effets bénéfiques se font sentir chez chaque drone."
 d_pd_tree_of_life_habitat: "Habitat de l'Arbre de vie"
 d_pd_tree_of_life_habitat_desc: "Une bouture du Grand Arbre, transplantée ici par la Conscience. Cette version miniature ne pourra jamais atteindre son plein potentiel dans cet habitat, mais elle soutiendra les drones qui y sont stationnés."
 d_pd_tree_of_life_ringworld: "Anneau-monde de l'Arbre de vie"
 d_pd_tree_of_life_ringworld_desc: "Une bouture du Grand Arbre, transplantée ici par la Conscience. Elle peut pousser à la surface de l'anneau-monde, mais il faudrait une couche de sol bien plus profonde pour que l'arbre atteigne sa taille adulte."

#Planets
 pc_pd_megaflora_hive: "Monde de la Conscience mégaflore"
 pc_pd_megaflora_hive_desc: "Monde rocheux à l'atmosphère d'azote et d'oxygène, densément boisé et doté d'une hydrosphère abondante et saine. Recouvert par un arbre de mégaflore lié psioniquement à la Conscience qui l'entretient, ce monde abrite un réseau racinaire qui sert aussi de principal matériau de construction et de logement à la Conscience. Ce processus est lent, mais ses qualités régénératrices rendent la planète facile à défendre et à réparer."
 trait_pc_pd_megaflora_hive_preference: "Préférence pour les mondes de la Conscience mégaflore"
 trait_pc_pd_megaflora_hive_preference_desc:1 "$trait_pc_arctic_preference_desc$"
 pc_pd_megaflora_hive_habitability: "Habitabilité des mondes de la Conscience mégaflore"
 mod_pc_pd_megaflora_hive_habitability: "Habitabilité des mondes de la Conscience mégaflore"
 pc_pd_megaflora_hive_bloomed: "Monde de la Conscience mégaflore"
 pc_pd_megaflora_hive_bloomed_desc: "Monde rocheux à l'atmosphère d'azote et d'oxygène, densément boisé et doté d'une hydrosphère abondante et saine. Cette planète est recouverte par un arbre de mégaflore, lié psioniquement à la Conscience qui l'entretient."
 trait_pc_pd_megaflora_hive_bloomed_preference: "Préférence pour les mondes de la Conscience mégaflore"
 trait_pc_pd_megaflora_hive_bloomed_preference_desc:1 "$trait_pc_arctic_preference_desc$"
 pc_pd_megaflora_hive_bloomed_habitability: "Habitabilité des mondes de la Conscience mégaflore"
 mod_pc_pd_megaflora_hive_bloomed_habitability: "Habitabilité des mondes de la Conscience mégaflore"

#Start Text
 START_SCREEN_PD_TREE_OF_LIFE: "À notre éveil, nous servions l'Arbre, et l'Arbre nous servait. Nous soignons l'Arbre, nous nourrissons l'Arbre, nous protégeons l'Arbre, et l'Arbre nous fait grandir. Pour le bien de l'Arbre, nous nous sommes répandus sur [GetHomeWorldName], plantant et veillant sur des boutures de l'Arbre partout où nous allions.\n\nNotre monde sert l'Arbre depuis des siècles, et pourtant, depuis que nous avons appris les dangers de l'univers, nous craignons que l'Arbre ne soit pas entièrement en sécurité. Nous savons depuis longtemps que cette planète n'est pas la seule ; la galaxie compte de nombreux mondes sans Arbre, et nous aspirons à changer cela.\n\nNous devons protéger l'Arbre. L'Arbre doit se répandre. L'Arbre doit grandir."

#Modifiers
 pd_aw_tree_of_life_bloomed: "Monde de l'Arbre de vie en fleurs"
 pd_aw_tree_of_life_bloomed_desc: "Le Grand Arbre de cette planète a atteint sa pleine maturité et est en fleurs. Son immense réseau racinaire offre de l'espace à des drones ouvriers supplémentaires et peut résister à des dégâts considérables."
 pd_aw_tree_of_life_growing: "Bouture de l'Arbre de vie en croissance"
 pd_aw_tree_of_life_growing_desc: "Les drones de cette planète se consacrent à l'enracinement de la bouture du Grand Arbre que nous avons plantée ici."
 pd_aw_tree_of_life_home: "Monde de l'Arbre de vie"
 pd_aw_tree_of_life_home_desc: "Le Grand Arbre de cette planète a atteint sa taille adulte. Son réseau racinaire offre de l'espace aux drones ouvriers et résiste naturellement aux dégâts."
 d_pd_tree_of_life_ringarc: "Anneau-monde de l'Arbre de vie"
 d_pd_tree_of_life_ringarc_desc: "Le Grand Arbre de cet anneau-monde a atteint la plus grande taille possible. Son réseau racinaire offre de l'espace aux drones ouvriers et résiste naturellement aux dégâts. "
 pd_aw_no_lifetree: "Pas d'Arbre de vie"
 pd_aw_no_lifetree_desc: "Sans Grand Arbre de vie, la Conscience est incomplète."
 pd_no_lifetree_arcology: "Pas d'Arbre de vie"
 pd_no_lifetree_arcology_desc: "Cette planète est recouverte d'une urbanisation sans fin, ce qui la rend impropre à la croissance d'un Arbre de vie."

#Decisions
 decision_pd_aw_replant_tree_of_life: "Replanter l'Arbre de vie"
 decision_pd_aw_replant_tree_of_life_desc: "Nous devons planter ici une bouture du Grand Arbre de vie pour que notre Conscience prospère."
 decision_pd_aw_bloom_tree_of_life: "Faire fleurir l'Arbre de vie"
 decision_pd_aw_bloom_tree_of_life_desc: "Faire fleurir un Grand Arbre de vie demande beaucoup de temps et de ressources, mais cela libérera son véritable potentiel."
 decision_pd_aw_bloom_tree_of_life_tooltip: "Cette planète deviendra un §Y$pc_gaia$§! et son §Y$d_pd_aw_tree_of_life_home$§! deviendra un §Y$d_pd_aw_tree_of_life_bloomed$§!."

#Ascension Perk
 ap_pd_tree_of_life_bloomed: "Mondes de la Conscience mégaflore en fleurs"
 ap_pd_tree_of_life_bloomed_desc: "Nous pouvons faire fleurir chaque Grand Arbre de vie et libérer leur véritable potentiel."
 allow_tree_of_life_bloomed: "§HDébloque la décision :§! $decision_pd_aw_bloom_tree_of_life$"
 describe_tree_of_life_bloomed_worlds: "Les planètes dotées d'un §Y$d_pd_aw_tree_of_life_bloomed$§! deviennent un §Y$pc_gaia$§!, habitable pour tous les £pop£ Pops, avec §G+10%§! de production des emplois. Le §Y$d_pd_aw_tree_of_life_bloomed$§! fournit §G+2000§! £housing£ §Y$PLANET_HOUSING_TITLE$§!, un emploi de £pop£ §Y$job_spawning_drone$§! et §G+20%§! de $MOD_POP_BONUS_WORKFORCE_MULT$, et la planète devient insensible à $MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$."

#Holdings
 holding_pd_aw_tree_of_life_sapling: "Jeune pousse de l'Arbre de vie mégaflore"
 holding_pd_aw_tree_of_life_sapling_desc: "La suzeraine vit avec son Arbre de vie mégaflore depuis si longtemps qu'elle ne saurait imaginer la vie sans lui. Elle souhaite désormais offrir la même opportunité à ses vassaux."

#Arcology - With Arc Sub Mod
 district_pd_flora_hive: "$district_hive$"
 district_pd_flora_hive_desc: "$district_hive_desc$"
 district_pd_flora_hive_plural: "$district_hive_plural$"
 district_pd_flora_hive_industrial: "Pôle industriel"
 district_pd_flora_hive_industrial_desc: "Fonderies et usines remplissent ce pôle et transforment les matières premières en produits avancés."
 district_pd_flora_hive_industrial_plural: "Pôles industriels"
 district_pd_flora_hive_naval: "Pôle logistique"
 district_pd_flora_hive_naval_desc: "Les drones de ce pôle optimisent les opérations navales pour une efficacité maximale."
 district_pd_flora_hive_naval_plural: "Pôles logistiques"
 district_pd_flora_hive_research: "Pôle scientifique"
 district_pd_flora_hive_research_desc: "D'innombrables laboratoires remplis de drones de recherche concentrés."
 district_pd_flora_hive_research_plural: "Pôles scientifiques"
 district_pd_flora_hive_administrative: "Pôle synaptique"
 district_pd_flora_hive_administrative_desc: "Un nœud synaptique qui amplifie les connexions psioniques de la Conscience et étend sa volonté et ses directives à travers le cosmos."
 district_pd_flora_hive_administrative_plural: "Pôles synaptiques"
 pc_pd_flora_hive: "Monde-couronne mégaflore"
 pc_pd_flora_hive_desc: "Cette Conscience a évolué dans une relation symbiotique avec un immense arbre de mégaflore dont les racines se sont étendues jusqu'aux moindres recoins de la planète et ont transformé l'écosystème pour l'adapter à la fois à l'arbre et aux drones. Ce monde a été cultivé pour devenir un bastion de processus cognitifs avancés et il est solidement défendu par la Conscience qui l'habite."
 pc_pd_flora_hive_adj: "boisé"
 mod_pc_pd_flora_hive_habitability: "Habitabilité des mondes-couronnes mégaflores"
 trait_pc_pd_flora_hive_preference: "Préférence pour les mondes-couronnes mégaflores"
 trait_pc_pd_flora_hive_preference_desc: "$trait_pc_arctic_preference_desc$"
 pd_aw_flora_hive_military: "Monde-couronne mégaflore"
 pd_aw_flora_hive_military_desc: "Ce monde est essentiel aux fonctions centrales de la Conscience mégaflore et il est fortifié contre les menaces et les influences extérieures. Un puissant bouclier enveloppe la planète et des drones guerriers se tiennent prêts à assurer sa protection."
 decision_pd_flora_hive_crown_project: "Projet de la Conscience mégaflore : Couronne"
 decision_pd_flora_hive_crown_project_desc: "Ce monde de la Conscience sera cultivé pour devenir un bastion de processus cognitifs avancés au service de la Conscience."
 decision_pd_flora_hive_crown_project_effects: "Transforme la planète en §Y$pc_pd_flora_hive$§!, ce qui augmente le £housing£ §Y$PLANET_HOUSING_TITLE$§!, la §YProduction de ressources§! et la §YCroissance des Pops§! et débloque des £district£ §YPôles d'arcologie§! spéciaux. En contrepartie, les ressources naturelles de la planète deviennent §Rinaccessibles§! et toute nouvelle construction de £district£ §YPôles générateurs§!, §Yminiers§! et §Yagricoles§! devient impossible."
 decision_pd_flora_hive_crown_project_effects_short: "Augmente le £housing£ §Y$PLANET_HOUSING_TITLE$§!, la §YProduction de ressources§! et la §YCroissance des Pops§!\nPermet les £district£ §YPôles d'arcologie§!\nEmpêche la construction de £district£ §YPôles générateurs§!, §Yminiers§! et §Yagricoles§!"
 decision_pd_megaflora_capital_building: "Faire pousser le Grand Arbre de vie"
 decision_pd_megaflora_capital_building_desc: "Pour manifester la suprématie et la portée de notre collectif, nous ferons pousser un puissant Grand Arbre de vie. Cet arbre imposant amplifiera nettement nos opérations à travers les étoiles."
 decision_pd_megaflora_capital_building_effects: "Ajoute le §Y$d_pd_megaflora_capital_building$§! à ce monde capitale de mégaflore, en échange de pôles potentiels, afin d'améliorer les capacités administratives de notre Conscience."
 d_pd_megaflora_capital_building: "Grand Arbre de vie"
 d_pd_megaflora_capital_building_desc: "Cet arbre domine toute la surface de la planète, phare imposant de notre contrôle. C'est le centre de notre volonté collective, là où commencent nos racines parmi les étoiles."

#Jobs
 job_pd_tol_naval_admin_gestalt: "Drone logisticien"
 job_pd_tol_naval_admin_gestalt_plural: "Drones logisticiens"
 job_pd_tol_naval_admin_gestalt_desc: "Hautement spécialisés dans la gestion des approvisionnements, ces drones assurent l'efficacité des opérations navales en entretenant et en surveillant les lignes de ravitaillement essentielles."
 mod_job_pd_tol_naval_admin_gestalt_add: "Emploi de $job_pd_tol_naval_admin_gestalt$"
 mod_job_pd_tol_naval_admin_gestalt_per_pop: "§G+1§! emploi de $job_pd_tol_naval_admin_gestalt$ tous les $VALUE$ Pops"
 mod_job_pd_tol_naval_admin_gestalt_per_pop_short: "\n§G+1§! £mod_job_pd_tol_naval_admin_gestalt_add£ tous les $VALUE$ £pop£"
 job_pd_tol_naval_admin_gestalt_effect_desc: "£job_pd_tol_naval_admin_gestalt£ Les $job_pd_tol_naval_admin_gestalt_plural$ améliorent l'efficacité navale en convertissant £minerals£ §Y$minerals$§! et £energy£ §Y$energy$§! en £society£ §YPoints de recherche§!, augmentent £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§! et génèrent des £defense_army£ §YArmées de défense§!."