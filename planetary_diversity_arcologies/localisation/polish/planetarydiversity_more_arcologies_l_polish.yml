 ##Archeotech Preserve (Ex-Relic Worlds)
 zone_pd_archeotech_preserve: "Rezerwat archeotechnologiczny"
 zone_pd_archeotech_preserve_desc: "Rozległy rezerwat na tej arkologii, niegdyś świecie relikcie, przeznaczono do starannych badań pradawnej historii planety. Wykopaliska i cierpliwa obserwacja stopniowo odsłaniają tajemnice zaginionych cywilizacji."
