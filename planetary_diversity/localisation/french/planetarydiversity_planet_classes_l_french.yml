### PD Relic Worlds
pc_nuked_relic: "Monde des Reliques Funéraires"
pc_nuked_relic_desc: "Autrefois, une ville s'étendait sur l'ensemble de ce monde. Seuls des vestiges anciens et abandonnés subsistent maintenant, leurs habitants d'origine ayant depuis longtemps disparu. Il connaît actuellement un hiver nucléaire, avec des couches d'aérosols poussiéreux denses dans l'atmosphère. Niveaux élevés de radiation en surface. Signes minimaux de vie."

pc_pd_dry_gaia: "Monde Gaia Sec"
