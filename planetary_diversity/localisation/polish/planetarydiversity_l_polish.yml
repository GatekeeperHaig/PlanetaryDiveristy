 pd_tidally_dayside_collector: "$job_pd_tidally_dayside_collector$"
 job_pd_tidally_dayside_collector: "Operator kolektorów dziennych"
 job_pd_tidally_dayside_collector_plural: "Operatorzy kolektorów dziennych"
 job_pd_tidally_dayside_collector_desc: "Operatorzy kolektorów dziennych pracują na półkuli wiecznego dnia. Nieprzerwane światło słoneczne pozwala im pozyskiwać więcej energii niż jakiejkolwiek innej załodze elektrowni."
 pd_tidally_dayside_collector_drone: "$job_pd_tidally_dayside_collector_drone$"
