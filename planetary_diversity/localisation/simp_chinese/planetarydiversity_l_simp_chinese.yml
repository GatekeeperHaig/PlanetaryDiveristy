 job_pd_reef_ecologist: "礁区生态学家 "
 job_pd_reef_ecologist_plural: "礁区生态学家 "
 job_pd_reef_ecologist_desc: "礁区生态学家负责对礁区高度密集的生物多样性进行编目，在产出社会学研究的同时，也带来源源不断的工程学发现。"
 job_pd_reef_ecologist_drone: "礁区生态学家 "
 job_pd_reef_ecologist_drone_plural: "礁区生态学家 "
