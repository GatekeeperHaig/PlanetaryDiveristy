#Decisions
 decision_pd_ma_hive_overmind_project: "Projeto Colmeia - Mente Suprema"
 decision_pd_ma_hive_overmind_project_desc: "Este mundo colmeia será remodelado em um bastião de processos de pensamento avançados para a mente colmeia."
 decision_pd_ma_hive_overmind_project_effects: "Transforma o planeta em um §Y$pc_pd_hive_superhabitable$§!, aumentando £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProdução de Recursos§! e §YCrescimento Populacional§! e desbloqueando £district£ §YDistritos de Arcologia§! especiais à custa de os recursos naturais do planeta se tornarem §Rinacessíveis§!, o que impede qualquer nova construção de £district£ §YDistritos Geradores§!, §YMineradores§! e §YAgrícolas§!."
 decision_pd_ma_hive_overmind_project_effects_short: "Aumenta £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProdução de Recursos§! e §YCrescimento Populacional§!\nHabilita £district£ §YDistritos de Arcologia§!\nDesabilita a construção de £district£ §YDistritos Geradores§!, §YMineradores§! e §YAgrícolas§!"

 decision_pd_ma_machine_nexus_project: "Projeto Maquinário - Nexo"
 decision_pd_ma_machine_nexus_project_desc: "Este mundo maquinário será aprimorado até se tornar um bastião de sub-rotinas avançadas."
 decision_pd_ma_machine_nexus_project_effects: "Transforma o planeta em um §Y$pc_pd_machine_superhabitable$§!, aumentando £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProdução de Recursos§! e §YCrescimento Populacional§! e desbloqueando £district£ §YDistritos de Arcologia§! especiais à custa de os recursos naturais do planeta se tornarem §Rinacessíveis§!, o que impede qualquer nova construção de £district£ §YDistritos Geradores§!, §YMineradores§! e §YAgrícolas§!."
 decision_pd_ma_machine_nexus_project_effects_short: "Aumenta £housing£ §Y$PLANET_HOUSING_TITLE$§!, §YProdução de Recursos§! e §YCrescimento Populacional§!\nHabilita £district£ §YDistritos de Arcologia§!\nDesabilita a construção de £district£ §YDistritos Geradores§!, §YMineradores§! e §YAgrícolas§!"

