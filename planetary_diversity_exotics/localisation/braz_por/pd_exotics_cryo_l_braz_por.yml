 # Ammonia signature buildings (pick one)
 building_pd_ammonia_fixation_institute: "Instituto de Síntese de Amônia"
 building_pd_ammonia_fixation_institute_desc: "A química rica em nitrogênio do planeta oferece aos nossos biólogos e engenheiros uma riqueza de reações inéditas para estudar e refinar."
 building_pd_ammonia_pharma_works: "Indústria Farmacêutica de Amônia"
 building_pd_ammonia_pharma_works_desc: "A amônia abundante daqui é facilmente refinada em fármacos e produtos de limpeza que abastecem mercados em todo o império."
 building_pd_ammonia_biome_reserve: "Reserva do Bioma de Amônia"
 building_pd_ammonia_biome_reserve_desc: "O estranho ecossistema de química fria deste mundo atrai visitantes curiosos de todas as estrelas."

 # Methane signature buildings (pick one)
 building_pd_methane_tholin_lab: "Laboratório de Química do Metano"
 building_pd_methane_tholin_lab_desc: "A espessa névoa orgânica deste mundo está repleta de química exótica de baixa temperatura para nossos pesquisadores desvendarem."
 building_pd_methane_hydrocarbon_foundry: "Fundição de Craqueamento de Metano"
 building_pd_methane_hydrocarbon_foundry_desc: "Os hidrocarbonetos inesgotáveis daqui são craqueados e reforjados em ligas, e o combustível local barato mantém nossas fundições funcionando."
 building_pd_methane_polymer_plant: "Usina de Polímeros de Metano"
 building_pd_methane_polymer_plant_desc: "Os mares de metano oferecem matéria-prima quase ilimitada para plásticos e outros bens acabados."

 # Nitrogen signature buildings (pick one)
 building_pd_nitrogen_supercomputer: "Complexo de Supercomputadores de Nitrogênio"
