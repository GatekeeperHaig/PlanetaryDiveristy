 #Zones
 zone_pd_preserve: "Rezerwat"
 zone_pd_preserve_desc: "Rezerwat to delikatny ekosystem, który nie nadaje się do rozwoju przemysłu. Można tu wznosić jedynie budowle o niewielkim wpływie na środowisko, przeznaczone do badań, edukacji lub rozrywki."
