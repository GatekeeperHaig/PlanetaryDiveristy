 job_pd_superhab_biosphere_ecologist_plural: "Ekolodzy biosfery"
 job_pd_superhab_biosphere_ecologist_desc: "Ekolodzy biosfery badają świat, na którym życie ewoluuje szybciej niż niemal gdziekolwiek indziej. Zbierane przez nich okazy pomagają również wyżywić kolonię."
