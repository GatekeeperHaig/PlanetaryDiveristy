 zone_pd_cave_lab: "Jaskiniowa gildia inżynierów"
 zone_pd_cave_lab_desc: "Budowanie miast pod ziemią to nie lada wyzwanie. Ta gildia współpracuje z miejscowymi badaczami, zwiększając wyniki prowadzonych tutaj badań technicznych."
