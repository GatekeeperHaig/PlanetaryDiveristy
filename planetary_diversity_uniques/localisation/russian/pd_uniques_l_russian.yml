###Biosynthetic World
 #Techno-Organic Traits
 trait_organic_fourschildren:0 "Biosynthetic"
 trait_organic_fourschildren_desc:0 "Created by the AI 'Unit 04' and blending both organic and artificial intelligence to create a truly biosynthetic lifeform."
 BIOSYNTH: "Биосинтетик"
 BIOSYNTH_desc: "Фенотип не влияет на государство, но другие биосинтетики могут счесть их менее чуждыми по сравнению с другими фенотипами."
 trait_biosynth: "Биосинтетик"
 trait_biosynth_desc: "Биосинтетическая жизнь, не машина и не органик в полном смысле этих понятий. Они не рождаются естественным путём, а вырастают из живого металла во чреве биосинтетических котлов, а их лидеры не стареют."
 TRAIT_BIOSYNTH_EFFECT: "§RНе могут размножаться естественным путём;§! новые поселения выращиваются из живого металла: §Y$job_pd_biosynth_cultivator_plural$§!.\nЛидеры §Yбессмертны§!."
 pd_origin_init_biosynth_NAME:0 "Система с биосинтетическим миром"
 pd_origin_init_biosynth_DESC:0 "В стартовой системе присутствует уникальный биосинтетический мир"
 origin_pd_biosynth:0 "Дети Единицы 04"
 origin_pd_biosynth_desc:0 "Не рождённые, а выращенные в чреве биосинтетических котлов Единицей 04, теперь они в состоянии заботиться о себе самостоятельно."
 START_SCREEN_PART_ONE_PD_BIOSYNTH:0 "Мы не эволюционировали естественным путём, а были созданы.\n\nНе машины и не органики, мы родились и были вылеплены из живого металла в биосинтетических котлах [GetHomeWorldName] руками Единицы 04, древней боевой машины, опустошившей бесчисленное множество миров, в том числе мир своих создателей, а ныне обратившейся на путь созидания.\n\nМы, [GetSpeciesName], скорее выращены из живого металла, чем рождены. Единица 04 до сих пор следит за котлами и будит каждого из нас; машине обязаны мы своим обликом и подобием.\n\nТеперь, открыв свой первый [GetStartingDrive], мы обратили свой взор к звёздам. Машина никогда не определяла наш курс; он всегда был нашим, но лишь теперь мы способны следовать ему. Единица 04 может лишь наблюдать, куда мы двинемся теперь."
 pdbiosynth.405.name:0 "Время платить по долгам"
 pdbiosynth.405.desc:0 "§GУтвердительно§!: Сейчас достаточно тех из вас, кто уже пробудился и смог осознать себя, чтобы действовать без моей указки. Этап завершён и зафиксирован. Я высвободил из котлов и заботился о многих из вас, но никогда не направлял, и не стану впредь.\n\n§GОткрыто§!: Я знаю, что вас сейчас заботит. Я был настоящей машиной войны и сжёг сотни миров. Среди них были и мои создатели, но в то время для меня не было никакой разницы. И лишь после всей этой череды смертей я понял, что делал не так, и встал на путь созидания. Никто меня к этому не принуждал; выбор - одна из тех вещей, которые я не в силах отнять у вас.\n\n§GВызывающе§!: Итак, ваше первое и очевидное испытание: вы не сможете стать самими собой, если выбор целей останется за мной. Я открываю вам технологию живого металла, чтобы вы могли создавать его и плодиться самостоятельно. Критерий прост: производство без моего участия. Докажите, что способны. Я сохраню своё место лишь до тех пор, пока вы не будете готовы занять его сами."
 pdbiosynth.405.a:0 "Тогда смотри, Единица 04. Мы преобразим сами себя."
 pdbiosynth.405.b:0 "Тогда научи нас. Мы должны превзойти своего создателя."
 pdbiosynth.405.c:0 "Ты - наш создатель. Мы будм чтить это и встанем рядом."
 pdbiosynth.405.d:0 "Ты - оружие. Наш путь - быть лучше и сильнее."
 pdbiosynth.405.e:0 "Ты обратился от разрушения к созиданию. Мы продолжим идти по проложенной тропе."
 pdbiosynth.405.f:0 "Оставь выбор нам самим. Мы докажем, что достойны."
 pdbiosynth.405.g:0 "Пост всё ещё твой. Мы не готовы."
 pd_biosynth_charge_materialist: "Фокус на мастерство"
 pd_biosynth_charge_spiritualist: "Фокус на почитание"
 pd_biosynth_charge_militarist: "Фокус на силу"
 pd_biosynth_charge_pacifist: "Фокус на жизнь"
 pd_biosynth_charge_egalitarian: "Фокус на свободу"
 pd_biosynth_charge_authoritarian: "Фокус на власть"
 pd_biosynth_secrets_of_life: "Секрет жизни"
 pd_biosynth_secrets_of_life_desc: "Единица 04 передал нам всё, что знал сам о биосинтетических котлах и открыл нам секреты нашей жизни."
 pd_biosynth_stood_alone: "Сами по себе"
 pd_biosynth_stood_alone_desc: "Мы отреклись от машины, создавшей нас, но сохранили всё, чему она нас научила. То, чем мы являемся сейчас, зависит только от нас самих."
 pdbiosynth.420.name:0 "Искра творения"
 pdbiosynth.420.desc:0 "§GВнимательно§!: Вы научились создавать живой металл и обрабатывать его по своему усмотрению, а котлам больше не требуется подпитка с моей стороны.\n\n§GЗаключительно§!: Теперь вы стоите там, откуда начинал я сам - каналы, фабрики и тихий процесс создания биосинтетической жизни ложатся на ваши плечи.\n\n§GС предложением§!: Я не собираюсь ничего предпринимать, лишь покажу, что как работает. Вы вольны брать необходимое, или не брать ничего."
 pdbiosynth.420.a:0 "Тогда мы возьмём то, что нам нужно."
 pdbiosynth.430.name:0 "Секреты жизни"
 pdbiosynth.430.desc:0 "§GВосхищённо§!: Вы раскрыли секреты жизни! Не просто придание формы металлу, но настройку внутренней структуры, правил, по которым создаются и изменяются живые существа.\n\n§GС предложением§!: Я не ожидал, что вы достигнете успеха столь скоро. Всё, что я знал на этот момент, теперь принадлежит вам. Возможно, вам удастся достичь даже большего.\n\n§GОтрешённо§!: Пути назад больше нет. Все возможности и знания в ваших собственных руках; выбор лишь за вами. Единица 04 больше не претендует даже на крупицу власти."
 pdbiosynth.430.a:0 "Следующий шаг за нами."
 pdbiosynth.430.a.tooltip:0 "Теперь доступен бонус за стремление §Y$ap_pd_biosynth_perfection$§!."
 pdbiosynth.440.name:0 "За пределы замысла"
 pdbiosynth.440.desc:0 "§GПризнательно§!: Вы решили устремиться к совершенству, а не сохранять оригинальный дизайн, который я вылепил в биосинтетических котлах; продолжить моё дело, а не остановиться на достигнутом. Выбор зафиксирован.\n\n§GУступчиво§!: Все инструменты уже в ваших руках. Я дал вам исходную форму, но вы вольны выбирать последующие. Существо, меняющееся само по себе, уже больше, чем просто существо."
 pdbiosynth.440.a:0 "Мы продолжим твоё дело, Единица 04."
 pdbiosynth.410.name:0 "Последний рывок"
 pdbiosynth.410.desc:0 "§GПодводя черту§!: Этот момент настал. Каждая деталь естества теперь в ваших собственных руках, и ничто больше от меня не зависит. Я отработал свой долг сполна.\n\n§GГордо§!: Не я это всё придумал. Я лишь однажды извлёк очередную форму из котла и придал ей форму на своё усмотрение; то, что вы можете сделать сейчас, превосходит мои мыслимые пределы. Из всех моих деяний лишь вы смогли превзойти меня самого. И я не вижу в этом никакой ошибки.\n\n§GСмиренно§!: Теперь осталось лишь место, которое я занимаю, но оно принадлежит вам. Я создал вас, но я же и уничтожил бесчисленнное множество миров. Взвесьте всё и решите, что делать дальше."
 pdbiosynth.410.b:0 "Встань в ряды наших лидеров, Единица 04. Таков наш выбор."
 pdbiosynth.410.b.tooltip:0 "§YЕдиница 04§! присоединится к нам в качестве лидера, и может быть уволен, как и любой другой."
 pdbiosynth.410.c:0 "Оставь нас, Единица 04. Не за то, что ты сделал, но за то, что не сделал."
 pdbiosynth.410.c.tooltip:0 "§YЕдиница 04§! навеки покинет границы нашей империи."
 building_pd_biosynth_assembler: "Биосинтетический ассемблер"
 building_pd_biosynth_assembler_desc: "Биосинтетики не рождаются, но выращиваются из живого металла в специализированных котлах. Эти чудесные устройства могут собирать только и только их."
 building_pd_biosynth_assembler_active_tt: "$MOD_BONUS_POP_GROWTH$ за каждого §Yкультиватора биосинтетиков§!: §G+4§!"
 building_pd_biosynth_assembler_active_boosted_tt: "$MOD_BONUS_POP_GROWTH$ за каждого §Yкультиватора биосинтетиков§!: §G+6§!"
 building_pd_biosynth_assembler_halted_tt: "§RСборка остановлена: у нас больше нет живого металла для поддержания процесса.§!"
 pd_trait_fossorial_attachments: "Приспособления для рытья"
 pd_trait_fossorial_attachments_desc: "§LПредставители этого вида приспособлены для рытья нор и с лёгкостью извлекают минералы из глубоких слоёв породы.§!\n"
 pd_trait_fiscal_sub_routines: "Гальванические протоколы"
 pd_trait_fiscal_sub_routines_desc: "§LВстроенные подпрограммы позволяют этому виду извлекать энергию из окружающей среды с поразительной эффективностью.§!\n"
 pd_trait_agricultural_bio_sensors: "Агротехнические биосенсоры"
 pd_trait_agricultural_bio_sensors_desc: "§LЭтот вид считывает состав почвы и сезонные изменения климата с помощью тонко настроенных органов чувств, добиваясь обильных урожаев на любом поле.§!\n"
 pd_trait_positronic_creativity: "Позитронная креативность"
 pd_trait_positronic_creativity_desc: "§LРаспределённый позитронный разум этих существ способен быстро переключаться с одной темы на другую, ускоряя исследования любого рода.§!\n"
 pd_trait_resolute_programming: "Надёжный код"
 pd_trait_resolute_programming_desc: "§LПредставители этого вида спокойны и покладисты независимо от обстоятельств благодаря стабильным основным директивам.§!\n"
 pd_trait_minaturization: "Компактная конструкция"
 pd_trait_minaturization_desc: "§LЭти существа довольно малы, и им требуется гораздо меньше жизненного пространства, чем большинству других видов.§!\n"
 pd_trait_leadership_algorithms: "Алгоритмы лидерства"
 pd_trait_leadership_algorithms_desc: "§LСовершенные командные эвристики глубоко прижились в сознании этого вида; из них получаются способные и неутомимые лидеры.§!\n"
 pd_trait_self_repair_systems: "Самовосстанавливающие системы"
 pd_trait_self_repair_systems_desc: "§LЭтот вид способен к регенерации, и может жить там, где другим бы потребовались особые удобства.§!\n"
 pd_trait_shared_meaning: "Распределённое сознание"
 pd_trait_shared_meaning_desc: "§LРазум этих существ имеет единую архитектуру, позволяющую легко координировать действия даже в обширных областях.§!\n"
 pd_trait_facial_micro_adustments: "Адаптивная мимика"
 pd_trait_facial_micro_adustments_desc: "§LПредставители этого вида считывают и подражают всему, с чем сталкиваются, и проявляют необычайную убедительность за торговым столом.§!\n"
 pd_trait_macro_consciousnesss: "Запрограммированная солидарность"
 pd_trait_macro_consciousnesss_desc: "§LОсновательная и обширная подготовка побуждает этих существ с готовностью соглашаться со своим правительством.§!\n"
 pd_trait_group_think: "Синхронизованное мышление"
 pd_trait_group_think_desc: "§LМысли представителей этого вида движутся согласованно, усиливая их общее стремление к цели.§!\n"
 pd_tradition_biosynth: "Биосинтетика"
 pd_tradition_biosynth_desc: "Мы не машины и не органики, и должны довести до совершенства то, что когда-то начал Единица 04."
 pd_tr_biosynth_adopt: "Намеренный дизайн"
 pd_tr_biosynth_adopt_desc: "Единица 04 усовершенствовал котлы, повысив производство живого металла в каждом цикле."
 pd_tr_biosynth_adopt_finish: "Совершенная форма"
 pd_tr_biosynth_adopt_finish_desc: "Котлы приведены к единому, итоговому дизайну, и каждое тело, выращенное в них них, имеет полноценный дизайн."
 pd_tr_biosynth_adopt_finish_tooltip: "£sr_living_metal£ Живой металл на содержание культиваторов биосинтетиков: §G-0.5§!\nОткрывает слот для бонуса за стремление.\nВсе лидеры-биосинтетики получат черту §Y$leader_trait_biosynth$§!."
 pd_tr_biosynth_perk_1: "Гибкие формы"
 pd_tr_biosynth_perk_1_delayed: "Биосинтетические тела можно перестраивать по мере необходимости, добавляя или удаляя специализированные черты."
 pd_tr_biosynth_perk_1_tooltip: "Позволяет добавлять или удалять биосинтетические признаки биосинтетическим видам."
 pd_tr_biosynth_perk_2a: "Ускоренная культивация"
 pd_tr_biosynth_perk_2a_delayed: "Котлы нагреваются всё сильнее, ускоряя рост каждого нового поколения."
 pd_tr_biosynth_perk_2a_tooltip: "$MOD_BONUS_POP_GROWTH$ за каждого §Yкультиватора биосинтетиков§!: §G+2§!"
 pd_tr_biosynth_perk_2b: "Улучшенные котлы"
 pd_tr_biosynth_perk_2b_delayed: "Дополнительные, более компактные линии котлов, способные обеспечить повышенное воспроизводство биосинтетиков за каждую потраченную каплю живого металла."
 pd_tr_biosynth_perk_2b_tooltip: "Должности §Yкультиваторов биосинтетиков§! за каждый сборщик: §G+100§!\n£sr_living_metal£ Живой металл на содержание культиваторов биосинтетиков: §G-0.5§!"
 pd_tr_biosynth_perk_3a: "Удешевлённые формы"
 pd_tr_biosynth_perk_3a_delayed: "Биосинтетические тела выращиваются с меньшими затратами, что облегчает содержание каждого работника."
 pd_tr_biosynth_perk_3b: "Свободный дизайн"
 pd_tr_biosynth_perk_3b_delayed: "Прежние ограничения биосинтетических тел впредь не помеха: больше характеристик, больше возможностей и более быстрая доработка."
 ap_pd_biosynth_perfection: "Спроектированное совершенство"
 ap_pd_biosynth_perfection_desc: "Единица 04 придал нам форму, а теперь открыл свои архивы. Единый дизайн из плоти и металла прекрасен, но его всегда можно сделать лучше."
 ap_pd_biosynth_perfection_tooltip: "Открывает древо традиций Биосинтетики."
 pd_biosynth_needs_tradition: "Необходима традиция Биосинтетики §YГибкие формы§!"
 pd_cannot_dismiss_unit_04: "§YЕдиница 04§! вырастил нас, придал форму и подобие. Мы не можем отринуть своего создателя."
 origin_tooltip_biosynth_effects:0 "- $HOMEWORLD$$TABBED_NEW_LINE$- §Y$pc_pd_biosynth$§! (Размер: £planetsize£ 20-25)$TABBED_NEW_LINE$- Начинают в качестве §Yбиосинтетического§! вида, созданного мятежной машиной - Единицей 04."
 job_pd_biosynth_cultivator: "Культиватор биосинтетиков"
 job_pd_biosynth_cultivator_plural: "Культиваторы биосинтетиков"
 job_pd_biosynth_cultivator_desc: "Культиваторы следят за котлами и выращивают в них из живого металла новых биосинтетиков. Каждый из них ускоряет прирост, но также расходует живой металл."
 mod_job_pd_biosynth_cultivator_add: "Должности «$job_pd_biosynth_cultivator$»"
 job_pd_biosynth_cultivator_effect_desc: "£job_pd_biosynth_cultivator£ $job_pd_biosynth_cultivator_plural$ собирают из £sr_living_metal£ §Iживого металла§! новые §Yпоселения биосинтетиков§!."
 job_pd_biosynth_cultivator_drone: "Дрон-культиватор биосинтетиков"
 job_pd_biosynth_cultivator_drone_plural: "Дроны-культиваторы биосинтетиков"
 job_pd_biosynth_cultivator_drone_desc: "Дроны-культиваторы следят за котлами и выращивают в них из живого металла новых биосинтетиков. Каждый из них ускоряет прирост, но также расходует живой металл."
 mod_job_pd_biosynth_cultivator_drone_add: "Должности «$job_pd_biosynth_cultivator_drone$»"
 job_pd_biosynth_cultivator_drone_effect_desc: "£job_pd_biosynth_cultivator_drone£ $job_pd_biosynth_cultivator_drone_plural$ собирают из £sr_living_metal£ §Iживого металла§! новые §Yпоселения биосинтетиков§!."
 situation_pd_biosynth_the_long_watch: "Из колыбели"
 situation_pd_biosynth_the_long_watch_type: "Из колыбели"
 situation_pd_biosynth_the_long_watch_desc: "Мы были созданы в котлах Единицей 04, и с рождения во всём полагаемся на него. Мы должны создавать себе подобных, ведь самостоятельность - не прихоть, а необходимость. Единица 04 не задаёт курс; он лишь отмечает каждый шаг, который мы делаем сами."
 situation_pd_biosynth_the_long_watch_monthly_change_tooltip: "Прогресс зависит от достижения цели этапа, а не от течения времени."
 situation_pd_biosynth_the_long_watch_stage_1: "Единица 04 ждёт, когда мы наладим производство §Yживого металла§! для собственных нужд."
 situation_pd_biosynth_the_long_watch_stage_2: "Единица 04 ожидает успешного исследования нами технологии §Y$tech_gene_tailoring$§!."
 situation_pd_biosynth_the_long_watch_stage_3: "Единица 04 ожидает принятие нами бонуса за стремление §Y$ap_pd_biosynth_perfection$§!."
 situation_pd_biosynth_the_long_watch_stage_4: "Единица 04 ожидает завершение нами древа традиций §Y$pd_tradition_biosynth$§!."
 situation_pd_biosynth_the_long_watch_outcome: "Со временем мы познаем собственное естество, усовершенствуем форму, и, наконец, станем полностью самими собой. Пора навсегда покинуть родную колыбель."
 situation_pd_biosynth_the_long_watch_observe: "Встать на ноги"
 situation_pd_biosynth_the_long_watch_observe_desc: "Власть ещё не в наших руках: мы растём и познаём себя, а Единица 04 наблюдает со стороны."
 situation_pd_biosynth_the_long_watch_observe_tt: "Единица 04 не даёт указаний и ни о чём не просит. Каждый шаг из колыбели принадлежит только нам."
 situation_pd_biosynth_the_long_watch_study: "Изучение котлов"
 situation_pd_biosynth_the_long_watch_study_desc: "Котлы вскрывают и анализируют прямо во время работы, каждый этап процесса тщательно записывается. Литейные цеха и электростанции демонтируют, а полученные данные применяются в нашей собственной металлургии."
 situation_pd_biosynth_the_long_watch_fund: "Спонсирование генетики"
 situation_pd_biosynth_the_long_watch_fund_desc: "Каждая лаборатория, готовая работать с геномом, подключается к процессу и продолжает работать без перерывов между открытиями. Все расходы покрывает торговля, а полученные знания напрямую влияют на наше понимание живых организмов."
 situation_pd_biosynth_the_long_watch_resolve: "Собраться с духом"
 situation_pd_biosynth_the_long_watch_resolve_desc: "Торговля и бухгалтерские книги отошли на второй план пред главной целью. Ради чего мы существуем, уже знает каждый. Осталось сделать последний рывок."

 #Bonefield World
 pd_bonefield: "Кладбище тиянки"
 pd_bonefield_desc: "Dying Tiyanki have fallen on this world for generations, and the matter in their bodies has enriched its soil. Fresh carcasses lie among the bones of those that fell eons ago."
 pd_bonefield_warded: "Descent Barrier"
 pd_bonefield_warded_desc: "A gravitic barrier keeps dying Tiyanki from approaching this world. The whole surface is open to construction, and the soil still holds generations of exotic nutrients, though they are no longer replenished."
 pc_pd_bonefield: "Мир-кладбище"
 pc_pd_bonefield_desc: "$pd_bonefield_desc$"
 pc_pd_bonefield_adj: "засушливая"
 mod_pc_pd_bonefield_habitability: "Приспособленность к кладбищу тиянки"
 NAME_Tiyun_Sha: "Тиюн Ша"
 concept_pd_bonefield: "$pd_bonefield$"
 concept_pd_bonefield_desc: "- £food£ Food from Jobs: §G+20%§!\n- £society_research£ Society Research from Jobs: §G+15%§!\n- Max $district_generator_plural$: §G+3§!\n- $MOD_PLANET_HOUSING_MULT$: §R-10%§!\n- $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-8§!"

 #Deposits
 d_pd_bonefield_descent_site: "Tiyanki Descent Site"
 d_pd_bonefield_descent_site_desc: "Our signal towers draw a few dying Tiyanki down onto land set aside for them, away from our settlements. Rendering crews work each carcass where it falls."

 #Technologies
 tech_tiyanki_butchery: "Tiyanki Byproduct Processing"
 tech_tiyanki_butchery_desc: "Many parts of a fallen Tiyanki have a use, from its rare glands to its void-hardened hide."
 tech_tiyanki_descent_sites: "Tiyanki Descent Sites"
 tech_tiyanki_descent_sites_desc: "The signal we developed to guide dying Tiyanki could draw a few of them down onto our other worlds."
 tech_tiyanki_observatory: "Tiyanki Observation Sciences"
 tech_tiyanki_observatory_desc: "Our work at the Bonefield has taught us to read the subspace vibrations Tiyanki use to communicate. With that, we can follow the herds along their migrations and study them across their whole range."
 tech_tiyanki_beacon: "Tiyanki Carcass Harvesting"
 tech_tiyanki_beacon_desc: "The carcasses ringing the Bonefield system can be worked in orbit, if a waystation is fitted to process them."

 #Buildings
 building_pd_tiyanki_observatory: "Tiyanki Observatory"
 building_pd_tiyanki_observatory_desc: "A tracking station tuned to the subspace vibrations of Tiyanki herds, letting our biologists follow them across the sector."
 building_pd_tiyanki_observatory_tt: "$mod_planet_jobs_society_research_produces_mult$: §G+2%§! per §Y$building_pd_tiyanki_observatory$§!
(Current Value: §G+[pd_tiyanki_observatory_network]%§!)"

 #Decision
 decision_pd_bonefield_descent_site: "Establish Tiyanki Descent Site"
 decision_pd_bonefield_descent_site_desc: "Using what we learned at the Bonefield, we can draw a small share of the dying herds to this world without disturbing their wider migration. The land set aside for them cannot be built on."
 edict_tiyanki_resonant_planning: "Tiyanki Resonance Planning"
 edict_tiyanki_resonant_planning_desc: "The subspace vibrations Tiyanki use to calm their herds can be built into the layout of our cities to soothe our own population."
 edict_tiyanki_resonant_network: "Tiyanki Resonance Network"
 edict_tiyanki_resonant_network_desc: "Tuning our network to the subspace vibrations Tiyanki use to calm their herds steadies every drone connected to it."
 edict_tiyanki_luxury_goods: "Tiyanki Luxuries"
