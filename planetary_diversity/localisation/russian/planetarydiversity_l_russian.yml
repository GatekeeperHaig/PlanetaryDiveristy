 job_pd_tidally_duskbelt_astrobiologist_drone: "Дрон-сумеречный астробиолог"
 job_pd_tidally_duskbelt_astrobiologist_drone_plural: "Дроны-сумеречные астробиологи"
 job_pd_tidally_duskbelt_astrobiologist_drone_desc: "$job_pd_tidally_duskbelt_astrobiologist_desc$"
 pd_cave_deepvent_technician: "$job_pd_cave_deepvent_technician$"
 job_pd_cave_deepvent_technician: "Глубинный техник"
 job_pd_cave_deepvent_technician_plural: "Глубинные техники"
 job_pd_cave_deepvent_technician_desc: "Глубинные техники извлекают геотермальное тепло из пещерных трещин для генерации энергии, а также собирают полезные ископаемые из минеральных полос на стенах каверн."
