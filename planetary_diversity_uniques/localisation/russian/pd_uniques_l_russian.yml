 #Situation
 situation_pd_biosynth_world: "Исследование биосинтетического мира"
 situation_pd_biosynth_world_type: "Исследование биосинтетического мира"
 situation_pd_biosynth_world_desc: "За следами разрушений, продвинутой системой каналов и странными синтетическими существами планета скрывает историю, которую ещё предстоит раскрыть в ходе обустройства сельхозугодий.\n\nМы должны копнуть глубже, чтобы приоткрыть завесу тайны прошлого."
 situation_pd_biosynth_world_monthly_change_tooltip: "Изменение в месяц"
