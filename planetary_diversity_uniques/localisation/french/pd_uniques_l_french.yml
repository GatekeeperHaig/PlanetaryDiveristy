 NAME_Unit_04: "Unité 04"
 unit_04_desc: "§YUnité 04§! a détruit d'innombrables mondes, dont son monde natal. $leader_trait_unit_04$ est maintenant dédiée à défaire les dommages qu'elle a autrefois causés."
 unit_04_catch_phrase: "Veuillez sélectionner une désignation utile pour cette unité."
 NAME_Unit_04_evil: "Unité 04"
 unit_04_evi_desc: "§YUnité 04§! a détruit d'innombrables mondes, dont son monde natal. $leader_trait_unit_04$ a été reprogrammée selon ses paramètres d'origine, en faisant un puissant robot de guerre."
 unit_04_evi_catch_phrase: "Tous les systèmes en ligne. Efficacité de combat à son niveau maximum. En attente de vérification de cible."

