l_polish:

#Flooded/Aquatic Planets
 decision_pd_aw_flood_planet: "Poszerz morza planety"
 decision_pd_aw_flood_planet_desc: "Ta oceaniczna planeta ma potencjał, by stać się idealnym domem dla naszego ludu. Poprzez podniesienie poziomu mórz i przeniesienie miast pod wodę zapewnimy rozwój życia przystosowanego do głębin."
 decision_pd_aw_flood_planet_tooltip: "Lód zostanie pozyskany z układu ze stacją §Y$sm_ice_mining_station$§!\nDodano modyfikator §Y$pd_aw_flooded_planet$§!:\n$pd_aw_flooded_planet_tooltip$"
 flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YZamieszkiwalność dla gatunków niewodnych§!: §R-20%§!"
 decision_pd_aw_unflood_planet: "Osusz planetę"
 decision_pd_aw_unflood_planet_desc: "Ta oceaniczna planeta ma potencjał, by stać się idealnym domem dla naszego ludu. Obniżając poziom mórz i przenosząc miasta na wyspy, możemy zapewnić rozwój życia przystosowanego do lądu."
 decision_pd_aw_flood_ringworld: "Zalej świat pierścieniowy"
 decision_pd_aw_flood_ringworld_desc: "Ten świat pierścieniowy ma potencjał, by stać się idealnym domem dla naszego ludu. Poprzez podniesienie poziomu mórz i przeniesienie miast pod wodę zapewnimy rozwój życia przystosowanego do głębin."
 decision_pd_aw_unflood_ringworld: "Osusz świat pierścieniowy"
 decision_pd_aw_unflood_ringworld_desc: "Ten świat pierścieniowy ma potencjał, by stać się idealnym domem dla naszego ludu. Obniżając poziom mórz i przenosząc miasta na ląd, możemy zapewnić rozwój życia przystosowanego do lądu."
 decision_pd_aw_unflood_habitat: "Osusz stację mieszkalną"
 decision_pd_aw_unflood_habitat_desc: "Ta stacja mieszkalna może stać się idealnym domem dla naszego ludu. Osuszając ją, zapewnimy warunki do rozwoju życia przystosowanego do lądu."
 decision_pd_aw_flood_habitat_tooltip: "Możliwość zamieszkania: §R-20%§!\nJest traktowana jako świat §Yoceaniczny§! dla gatunków z cechą §YAkwatycy§!.\nLód zostanie pozyskany z układu, w którym znajduje się §Y$sm_ice_mining_station$§! w bazie gwiezdnej."
 ap_hydrocentric_tooltip "Allows the construction of §YIce Mining Stations§! on starbases, which enable the following decisions:\n    - §Y$decision_pd_aw_flood_planet$§!: §Y$pc_ocean$§!, §Y$pc_gaia$§!, §Y$pc_hive$§!, §Y$pc_machine$§!, §Y$pc_relic$§!, §Y$pc_city$§!\n    - §Y$decision_flood_habitat$§!: §Y$pc_habitat$§!\n    - §Y$decision_pd_aw_flood_ringworld$§!: §Y$pc_ringworld_habitable$§!\n§RNo other planet class can be flooded.§!\nSpecies with the §Y$trait_aquatic$§! or §Y$trait_robot_aquatic$§! trait gain 50% greater benefits for living on §YOcean§! worlds, but penalties for living on non-§YWet§! worlds are likewise amplified."

 flooded_habitat: "Zalany"
 flooded_habitat_desc: "Ten zalany wodą świat stanowi idealne środowisko dla wodnych mieszkańców."
 pd_aw_flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YZamieszkiwalność dla gatunków niewodnych§!: §R-20%§!\n$MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$: §G-10%§!"

 pd_aw_flooded_planet: "Zalany świat"
 pd_aw_flooded_planet_desc: "Ta oceaniczna planeta jest idealnym domem dla gatunków wodnych. Zapewnia doskonałe warunki do rozwoju życia przystosowanego do głębin."
 pd_aw_flooded_habitat: "Zalana stacja mieszkalna"
 pd_aw_flooded_habitat_desc: "Ta stacja mieszkalna została wypełniona wodą, aby odtworzyć naturalne środowisko istot wodnych."

 ICE_MINING_PLANET_SUCCESS_TITLE: "Planeta zalana"
 ICE_MINING_PLANET_SUCCESS_DESC: "Dzięki wykorzystaniu lodu wydobytego w układzie $SYSTEM|Y$ udało nam się zalać świat §Y[This.GetName]§!."

 ocean_paradise_2: "$ocean_paradise$"
 ocean_paradise_2_desc: "$ocean_paradise_desc$"
 ocean_paradise_hive_2: "$ocean_paradise_hive$"
 ocean_paradise_hive_2_desc: "$ocean_paradise_hive_desc$"

 #Pelagic Planet
 pd_pelagic_planet: "Pelagiczny"
 pd_pelagic_planet_desc: "Całą powierzchnię tej planety pokrywa globalny ocean. Żaden ląd nie wynurza się ponad jego powierzchnię."
 ap_hydrocentric_tooltip:3 "Umożliwia budowę §Ylodowych stacji górniczych§! w bazach gwiezdnych. Odblokowują one następujące decyzje:\n    - §Y$decision_pd_aw_flood_planet$§!: §Y$pc_ocean$§!, §Y$pc_gaia$§!, §Y$pc_hive$§!, §Y$pc_machine$§!, §Y$pc_relic$§!, §Y$pc_city$§!\n    - §Y$decision_flood_habitat$§!: §Y$pc_habitat$§!\n    - §Y$decision_pd_aw_flood_ringworld$§!: §Y$pc_ringworld_habitable$§!\n§RNie można zalewać planet żadnej innej klasy.§!\nGatunki mające cechę §Y$trait_aquatic$§! lub §Y$trait_robot_aquatic$§! otrzymują o 50% większe korzyści za zamieszkiwanie światów §Yoceanicznych§!, ale rosną też ich kary za mieszkanie na światach innych niż §Ywilgotne§!."
