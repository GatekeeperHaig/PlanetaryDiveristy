 job_pd_petrified_lithoglyph_scholar: "岩纹学者"
 job_pd_petrified_lithoglyph_scholar_plural: "岩纹学者"
 job_pd_petrified_lithoglyph_scholar_desc: "岩纹学者从岩石中解读这颗星球动荡的历史，在工程学研究中融入对社会学的深刻洞察。"
 job_pd_petrified_lithoglyph_scholar_drone: "岩纹学者"
 job_pd_petrified_lithoglyph_scholar_drone_plural: "岩纹学者"
