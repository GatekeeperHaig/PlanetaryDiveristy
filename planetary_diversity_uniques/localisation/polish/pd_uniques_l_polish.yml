 #Paragon
 NAME_Unit_04: "Jednostka 04"
 unit_04_desc: "§YJednostka 04§! zniszczyła niezliczone światy, w tym własną planetę macierzystą. Obecnie $leader_trait_unit_04$ poświęca się naprawianiu wyrządzonych niegdyś szkód."
 unit_04_catch_phrase: "Proszę wybrać użyteczne oznaczenie dla tej jednostki."
 NAME_Unit_04_evil: "Jednostka 04"
 unit_04_evil_desc: "§YJednostka 04§! zniszczyła niezliczone światy, w tym własną planetę macierzystą. Przywrócono jej pierwotne ustawienia, dzięki czemu $leader_trait_unit_04$ stała się potężnym robotem bojowym."
