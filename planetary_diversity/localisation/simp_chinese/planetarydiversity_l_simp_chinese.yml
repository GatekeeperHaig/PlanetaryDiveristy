 job_pd_megaflora_canopy_ecologist: "林冠生态学家"
 job_pd_megaflora_canopy_ecologist_plural: "林冠生态学家"
 job_pd_megaflora_canopy_ecologist_desc: "林冠生态学家致力于研究参天巨木及其所庇护的多层次生命，以源源不断的工程学洞见，推动社会学研究的发展。"
 job_pd_megaflora_canopy_ecologist_drone: "林冠生态学家"
 job_pd_megaflora_canopy_ecologist_drone_plural: "林冠生态学家"
 job_pd_megaflora_canopy_ecologist_drone_desc: "$job_pd_megaflora_canopy_ecologist_desc$"
