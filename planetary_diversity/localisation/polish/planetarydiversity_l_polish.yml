 job_pd_superhab_abundance_cultivator_plural: "Rolnicy urodzaju"
 job_pd_superhab_abundance_cultivator_desc: "Rolnicy urodzaju uprawiają ziemię tak żyzną, że niemal nie wymaga pielęgnacji. Utrzymywane przez nich sielskie krajobrazy poprawiają nastroje w całej kolonii."
