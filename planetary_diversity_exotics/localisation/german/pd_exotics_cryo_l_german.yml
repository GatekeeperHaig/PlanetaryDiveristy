 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Pressurize Domes"
 decision_pd_exotic_domed_add_atmosphere_desc: "Refit the colony's domes with our cryogenic atmosphere so our kind can settle here. Only cryogenic-adapted species will be able to live under the domes once the air shifts."
 decision_pd_exotic_domed_remove_atmosphere: "Vent Domes"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Scrub the cryogenic atmosphere out of the domes and replace it with a conventional oxygen mix. Cryogenic species will no longer be able to settle here."
