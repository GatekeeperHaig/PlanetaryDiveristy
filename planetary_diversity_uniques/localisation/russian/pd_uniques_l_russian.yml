 mod_job_pd_biosynth_engineer_drone_per_pop_short: "\n§G+1§! £mod_job_pd_biosynth_engineer_drone_add£ за $VALUE$ £pop£"
 job_pd_biosynth_engineer_drone_effect_desc: "£job_pd_biosynth_engineer_drone£ $job_pd_biosynth_engineer_drone_plural$ производят £society£ и £engineering£ §Yисследования§!, а также $i_living_metal$ ценой затрат £consumer_goods£ §Yтоваров массового спроса§!."

 #Edicts
 edict_pd_living_metal_robot_assembly: "Живой металл в конструкциях роботов"
 edict_pd_living_metal_robot_assembly_desc: "Внедрение живого металла в процессы производства роботов существенно повышает время их сборки."
 edict_pd_living_metal_engineering: "Передача живого металла исследователям"
