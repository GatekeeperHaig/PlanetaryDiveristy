 concept_pd_toxoid_empire_desc: "$concept_pd_toxoid_empire$ está formado por imperios con \n- $TOX$ $SPECIES_CLASS$$NEW_LINE$- ['civic:civic_relentless_industrialists']$NEW_LINE$- ['civic:civic_corporate_relentless_industrialists']$NEW_LINE$- ['civic:civic_toxic_baths']$NEW_LINE$- ['civic:civic_hive_toxic_baths']$NEW_LINE$- ['civic:civic_machine_toxic_baths']$NEW_LINE$- ['civic:civic_corporate_toxic_baths']$NEW_LINE$- ['civic:origin_overtuned']"

