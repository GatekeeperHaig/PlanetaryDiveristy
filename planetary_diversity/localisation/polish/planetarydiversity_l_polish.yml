 job_pd_geothermal_slurry_refiner_plural: "Rafinerzy zawiesiny mineralnej"
 job_pd_geothermal_slurry_refiner_desc: "Rafinerzy zawiesiny mineralnej pozyskują część surowca bezpośrednio z bogatej w minerały zawiesiny geotermalnej. Dzięki temu produkują więcej stopów, zużywając mniej wydobytych minerałów, a ich odkrycia metalurgiczne wnoszą niewielki wkład w badania techniczne."
