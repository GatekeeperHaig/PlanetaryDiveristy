 zone_pd_tidally_lab: "Synchroniczne laboratoria badań biologicznych"
 zone_pd_tidally_lab_desc: "Poszczególne strefy planety mają tak odmienne warunki środowiskowe, że ich flora i fauna rozwinęły się w wyjątkowy, niespotykany gdzie indziej sposób."
