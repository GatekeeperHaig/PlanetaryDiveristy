 pd_tidally_dayside_collector: "$job_pd_tidally_dayside_collector$"
 job_pd_tidally_dayside_collector: "Солнечный техник"
 job_pd_tidally_dayside_collector_plural: "Солнечные техники"
 job_pd_tidally_dayside_collector_desc: "Солнечные техники работают в полушарии вечного дня, где непрерывный световой поток позволяет вырабатывать энергии больше, чем может дать любой другой генератор."
 pd_tidally_dayside_collector_drone: "$job_pd_tidally_dayside_collector_drone$"
 job_pd_tidally_dayside_collector_drone: "Дрон-солнечный техник"
 job_pd_tidally_dayside_collector_drone_plural: "Дроны-солнечные техники"
 job_pd_tidally_dayside_collector_drone_desc: "$job_pd_tidally_dayside_collector_desc$"
 pd_tidally_duskbelt_gardener: "$job_pd_tidally_duskbelt_gardener$"
 job_pd_tidally_duskbelt_gardener: "Сумеречный садовник"
 job_pd_tidally_duskbelt_gardener_plural: "Сумеречные садовники"
 job_pd_tidally_duskbelt_gardener_desc: "Сумеречные садовники обрабатывают землю в полоске терминатора - области между вечным днём и бесконечной ночью, где постоянный свет и ветер питают как сельхоз культуры, так и энергостанции."
 pd_tidally_duskbelt_gardener_drone: "$job_pd_tidally_duskbelt_gardener_drone$"
 job_pd_tidally_duskbelt_gardener_drone: "Дрон-сумеречный садовник"
 job_pd_tidally_duskbelt_gardener_drone_plural: "Дроны-сумеречные садовники"
 job_pd_tidally_duskbelt_gardener_drone_desc: "$job_pd_tidally_duskbelt_gardener_desc$"
 pd_tidally_duskbelt_astrobiologist: "$job_pd_tidally_duskbelt_astrobiologist$"
 job_pd_tidally_duskbelt_astrobiologist: "Сумеречный астробиолог"
 job_pd_tidally_duskbelt_astrobiologist_plural: "Сумеречные астробиологи"
 job_pd_tidally_duskbelt_astrobiologist_desc: "Сумеречные астробиологи изучают, как развивалась жизнь в выжженных, замёрзших и сумеречных зонах планеты, чем продвигают биологические и физические изыскания."
