 job_pd_naval_admin_gestalt_effect_desc: "£job_pd_naval_admin_gestalt£ $job_pd_naval_admin_gestalt_plural$ usprawniają działania floty, przetwarzając £minerals£ §Y$minerals$§! i £energy£ §Y$energy$§! w £society£ §Ypunkty badań§! oraz £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!."
 job_pd_capital_bio_politician: "Biodelegat"
 job_pd_capital_bio_politician_plural: "Biodelegaci"
 job_pd_capital_bio_politician_desc: "Niektóre biotrofea są bardziej zadowolone, gdy uważają się za ważniejsze od innych. Pozory dominującej pozycji podnoszą ich morale i zwiększają zadowolenie wszystkich."
 mod_job_pd_capital_bio_politician_add: "Miejsca pracy: $job_pd_capital_bio_politician$"
