l_french:
#Planetary Superprojects
 #Notification
 MESSAGE_PD_AW_SUPERPROJECT_DESC: "Le superprojet sur $PLANET|Y$ est achevé."
 MESSAGE_PD_AW_SUPERPROJECT_MESSAGE_TYPE_TITLE: "Superprojet planétaire achevé"

#Core Tap
 #Planet Class
 pc_pd_core_tap: "Forage du noyau"
 pc_pd_core_tap_desc: "Ce monde rocheux abrite désormais un vaste réseau de machines qui creusent jusqu'à son noyau pour en extraire l'énergie primordiale. L'écosystème d'origine de la planète n'a pas survécu au forage."
 pc_pd_core_tap_adj: "énergétique"
 mod_pc_pd_core_tap_habitability: "Habitabilité des forages du noyau"
 trait_pc_pd_core_tap_preference: "Préférence pour les forages du noyau"
 trait_pc_pd_core_tap_preference_desc: "$trait_pc_arctic_preference_desc$"

 #Decision
 decision_pd_aw_core_tap: "Superprojet planétaire : Forage du noyau"
 decision_pd_aw_core_tap_desc: "En créant un réseau de machines qui creusent jusqu'au cœur même de ce monde, nous pourrons générer de vastes quantités d'énergie au détriment de l'écosystème de la planète."
 decision_pd_megacoretap_requirements: "£trigger_no£ §RLa planète doit compter au moins §Y3§! £district£ §Y$district_generator_plural$§! et aucun autre £district£ §Ydistrict rural§!."

 #Modifier
 pd_aw_core_tap: "Forage du noyau"
 pd_aw_core_tap_desc: "Ce monde abrite un vaste réseau de machines qui creusent jusqu'à son noyau pour en extraire l'énergie primordiale, détruisant au passage l'écosystème d'origine."
 pd_aw_core_tap_tooltip: "Les £district£ §G$district_generator_plural$§! ne sont plus plafonnés"

 #Technology
 tech_pd_planetary_core_tap: "Superprojet planétaire : Forage du noyau"
 tech_pd_planetary_core_tap_desc: "En créant un réseau de machines qui creusent jusqu'au cœur même d'un monde, nous pourrons générer de vastes quantités d'énergie au détriment de l'écosystème de la planète."
 tech_pd_planetary_core_tap_tooltip: "§HDébloque la décision :§! $decision_pd_aw_core_tap$"

#Agriworld
 #Planet Class
 pc_pd_agriworld: "Monde agricole"
 pc_pd_agriworld_desc: "Cette planète rocheuse regorge de cultures industrielles à perte de vue, qui reposent largement sur de puissants engrais, un contrôle météorologique complexe et des systèmes d'irrigation avancés. Si elle fournit une abondance continue, elle a remplacé l'écosystème naturel de la planète."
 pc_pd_agriworld_adj: "agraire"
 mod_pc_pd_agriworld_habitability: "Habitabilité des mondes agricoles"
 trait_pc_pd_agriworld_preference: "Préférence pour les mondes agricoles"
 trait_pc_pd_agriworld_preference_desc: "$trait_pc_arctic_preference_desc$"

 #Decision
 decision_pd_aw_agriworld: "Superprojet planétaire : Monde agricole"
 decision_pd_aw_agriworld_desc: "En transformant cette planète en monde agricole, nous créerons de vastes champs de cultures industrielles et remplacerons l'écosystème naturel par une étendue agricole artificielle et abondante."
 decision_pd_agriworld_requirements: "£trigger_no£ §RLa planète doit compter au moins §Y3§! £district£ §Y$district_farming_plural$§! et aucun autre £district£ §Ydistrict rural§!."

 #Modifier
 pd_aw_agriworld: "Monde agricole"
 pd_aw_agriworld_desc: "Ce monde abrite des cultures industrielles qui reposent largement sur de puissants engrais, un contrôle météorologique complexe et des systèmes d'irrigation avancés."
 pd_aw_agriworld_tooltip: "Les £district£ §G$district_farming_plural$§! ne sont plus plafonnés"

 #Technology
 tech_pd_planetary_agriworld: "Superprojet planétaire : Monde agricole"
 tech_pd_planetary_agriworld_desc: "En transformant une planète en monde agricole, nous créerons de vastes champs de cultures industrielles et remplacerons l'écosystème naturel par une étendue agricole artificielle et abondante."
 tech_pd_planetary_agriworld_tooltip: "§HDébloque la décision :§! $decision_pd_aw_agriworld$"

#Stripmine
 #Planet Class
 pc_pd_stripmine: "Mine à ciel ouvert"
 pc_pd_stripmine_desc: "Cette planète n'est plus qu'une étendue d'exploitations minières à ciel ouvert, sa surface sillonnée par un labyrinthe d'excavatrices industrielles et de foreuses. L'écosystème naturel a été ruiné dans la quête incessante de ressources."
 pc_pd_stripmine_adj: "minier"
 mod_pc_pd_stripmine_habitability: "Habitabilité des mines à ciel ouvert"
 trait_pc_pd_stripmine_preference: "Préférence pour les mines à ciel ouvert"
 trait_pc_pd_stripmine_preference_desc: "$trait_pc_arctic_preference_desc$"

 #Decision
 decision_pd_aw_stripmine: "Superprojet planétaire : Mine à ciel ouvert"
 decision_pd_aw_stripmine_desc: "Nous pourrions extraire des ressources de chaque parcelle de la surface de cette planète en construisant des excavatrices industrielles et des foreuses avancées. L'écosystème naturel en souffrira considérablement."
 decision_pd_stripmine_requirements: "£trigger_no£ §RLa planète doit compter au moins §Y3§! £district£ §Y$district_mining_plural$§! et aucun autre £district£ §Ydistrict rural§!."

 #Modifier
 pd_aw_stripmine: "Mine à ciel ouvert"
 pd_aw_stripmine_desc: "Cette planète est une étendue d'exploitations minières à ciel ouvert, sa surface sillonnée par un labyrinthe d'excavatrices industrielles et de foreuses."
 pd_aw_stripmine_tooltip: "Les £district£ §G$district_mining_plural$§! ne sont plus plafonnés"

 #Technology
