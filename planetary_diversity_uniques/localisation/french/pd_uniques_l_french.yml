###Crystal World
 sr_acean:0 "Cristal Acéen"
 sr_acean_desc:0 "La résonance unique de ce cristal améliore la régénération de la santé et la croissance des formes de vie organiques."
 mod_planet_miners_sr_acean_produces_add: "£sr_acean£ $sr_acean$ de £job_miner£ [GetMinerPlural]"
 pd_crystal: "Monde de Cristal"
 pd_crystal_desc: "La planète est couverte de grands piliers de Cristal Acéen, dont la résonance unique améliore la régénération de la santé et la croissance des formes de vie organiques."
 pd_dead_crystal: "Monde de Cristal Mort"
 pd_dead_crystal_desc: "Le superorganisme qui créait le Cristal Acéen a été tué, mettant fin à ses effets positifs sur la vie organique. Cependant, l'exploitation minière de cristaux est maintenant beaucoup plus productive."
 pd_living_crystal: "Monde de Cristal Restauré"
 pd_living_crystal_desc: "Le superorganisme a été restauré, améliorant ses effets positifs sur la vie organique. L'exploitation minière de cristaux s'est améliorée, mais la créature se nourrit désormais de toute vie qu'elle peut capturer."
 pc_pd_crystal: "Monde de Cristal"
 pc_pd_crystal_desc: "$pd_crystal_desc$"
 pc_pd_crystal_adj: "cristallin"
 mod_pc_pd_crystal_habitability: "Habitabilité Cristalline"
 trait_pc_pd_crystal_preference: "Préférence Cristalline"
 trait_pc_pd_crystal_preference_desc: "$trait_pc_arctic_preference_desc$"
 d_pd_khel_ruins: "Ruines Khel"
 d_pd_khel_ruins_desc: "Les vestiges d'une colonie abandonnée, dont de gigantesques installations de recherche à fond de puits, jonchent une section de cette planète."
 d_pd_acean_pillars: "Piliers Acéens"
 d_pd_acean_pillars_desc: "Cette planète est couverte de grands piliers de Cristal Acéen qui, bien que connectés à la planète, affectent profondément la vie organique à proximité, calmant les émotions et stimulant la fertilité."

 #Events
 pdcrystal.100.name: "Gemme de Vie"
 pdcrystal.100.desc: "Un scan profond de §Y[From.GetName]§! a révélé quelque chose d'extraordinaire : de grandes formations de cristaux dispersées dans le paysage, que nous avons désignées §YCristal Acéen§!. Ces gemmes semblent améliorer la santé des formes de vie organiques à proximité, et remarquablement, leurs effets persistent même dans des échantillons isolés.\n\n§Y[Root.Leader.GetName]§! a également découvert des signes d'un avant-poste dans la jungle ; si nous pouvons tenir la planète, nous pourrons explorer les ruines."
 pdcrystal.100.a: "Incroyable."
 pdcrystal.200.name: "Ruines dans la Jungle"
 pdcrystal.200.desc: "Au fur et à mesure que notre colonie s'établit sur §Y[Root.GetName]§!, nous avons découvert que les ruines trouvées par notre équipe initiale n'étaient en aucun cas les seules. Plusieurs campements désertés, silencieux et usés par le temps, peuvent être trouvés dispersés dans la nature environnante.\n\nQui étaient ces premiers habitants et ce qui leur est arrivé reste incertain."
 pdcrystal.200.a: "Nous explorerons ces ruines."
 pdcrystal.300.name: "Le Destin de la Planète"
 pdcrystal.300.desc: "Nous connaissons maintenant le destin des Khels et le sombre secret du Cristal Acéen. Nous avons trois options : laisser le superorganisme tel qu'il est, le tuer, ou le soigner pour le ramener à son état d'origine.\n\nLe tuer augmenterait l'exploitation minière de cristaux mais mettrait fin à ses effets sur la vie organique. Le restaurer améliorerait son impact sur la vie mais augmenterait le risque de décès de colons, bien que des mesures de sécurité pourraient aider à atténuer ce risque."
 pdcrystal.300.a: "Il a été lobotomisé pour une raison."
 pdcrystal.300.a.tooltip: "Nous laisserons le superorganisme intact, ne changeant rien à notre façon d'interagir avec la planète."
 pdcrystal.300.b: "Nous mettrons fin à la vie de cette créature."
 pdcrystal.300.b.tooltip: "Nous terminerons ce que les Khels ont commencé et tuerons le superorganisme. Cela mettra fin aux effets de la planète sur la vie organique, mais augmentera considérablement la production minière Acéenne."
 pdcrystal.300.c: "Nous devrions défaire ce crime injuste."
 pdcrystal.300.c.tooltip: "Inverser la lobotomie des Khels restaurera le superorganisme, améliorant ses effets sur la vie et stimulant légèrement l'exploitation minière Acéenne, mais il reprendra également à se nourrir de créatures vivantes, y compris les colons."

 #Archaeology Site
 pdcrystal_site: "Les Ruines Envahies"
 pdcrystal_site_desc: "Une région de la planète est parsemée de ruines abandonnées. Une investigation approfondie pourrait nous aider à comprendre les gisements de Cristal Acéen uniques à ce monde et leur remarquable influence sur le développement de la vie organique."
 pdcrystal.250.name: "Les Ruines Khel"
 pdcrystal.250.desc: "La jungle a envahi une grande partie des bases en décomposition et leur technologie, mais nous avons récupéré quelques informations utiles. Les Khels, une espèce extraterrestre non originaire de ce monde, menaient une expérience planétaire impliquant de profonds forages dans la croûte.\n\nBien que la plupart des données aient été corrompues, nous avons trouvé des indices indiquant une grande colonie Khel non découverte près de notre poste de recherche."
 pdcrystal.250.a: "Intéressant."
 pdcrystal.251.desc: "Au niveau de la colonie, nous avons trouvé les vestiges d'un vaisseau de génération qui manquait de technologie hyperespace. Les Khels, fuyant une catastrophe climatique sur leur monde natal, ont erré dans plusieurs systèmes pendant des générations. Ils ont finalement trouvé cette planète, qui semblait répondre à tous leurs besoins, et ont commencé à construire une nouvelle demeure.\n\nNous continuerons à parcourir les archives des Khels."
 ancrel.251.a: "Quelle chance pour eux."
 pdcrystal.252.desc: "La colonie prospéra pendant plusieurs années, aidée par des piliers de cristaux qui amélioraient leurs cultures transplantées. Puis des colons commencèrent à disparaître. Au début, cela semblait aléatoire, mais le taux augmenta. En enquêtant sur les disparitions, leur scientifique principal fit une découverte choquante : la planète était vivante et se nourrissait d'eux. Sans moyen de relancer leur vaisseau, ils se concentrèrent sur la communication et la pacification de la planète.\n\nNous commencerons à explorer l'un des emplacements de forage ensuite."
 pdcrystal.252.a: "La colonie est-elle en danger ?"
 pdcrystal.253.desc: "L'étude révéla que le cristal est un superorganisme lithoïde doté d'une intelligence rudimentaire, utilisant l'Acéen pour attirer des animaux dans des gouffres cachés. Les Khels percèrent des forages et utilisèrent une impulsion électromagnétique pour perturber son alimentation tout en préservant les propriétés du cristal.\n\nNous avons également découvert le centre de contrôle du projet de forage."
 pdcrystal.253.a: "Comme ils devaient être désespérés."
 pdcrystal.254.desc: "Les forages des Khels n'ont fait qu'accélérer l'alimentation de la planète, peut-être comme mécanisme de défense. Au moment où ils étaient prêts à activer leur arme, il ne restait que quelques dizaines de Khels. Après la détonation, la planète libéra une immense vague d'énergie, et toutes les archives des Khels cessèrent brusquement.\n\nBien que les Khels n'aient pas survécu pour en être témoins, ils avaient raison : la planète avait perdu sa capacité à se nourrir de la vie. C'est l'origine sinistre des pouvoirs du Cristal Acéen."
 pdcrystal.254.a: "Quelle fin sinistre pour tout le monde."

