pc_pd_dry_cave: "Monde de Caverne Sèche"
pc_pd_dry_cave_desc: "Monde rocheux avec une atmosphère azote-oxygène. Avec un magnétosphère faible, une grande partie de la surface de ce monde est constituée de roche stérile. Sous la surface, une série infinie de cavernes de grès supporte une hydrosphère faible et une végétation résistante à la sécheresse."
pc_pd_dry_cave_adj: "caverneux"
mod_pc_pd_dry_cave_habitability: "Habitabilité de Caverne Sèche"
trait_pc_pd_dry_cave_preference: "Préférence de Caverne Sèche"
