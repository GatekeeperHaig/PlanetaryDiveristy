 ##Fortress Arc
 #Tooltip
 decision_miltary_arcology_project_effects: "Przekształca planetę w §Y$pc_city$§!, zwiększając £housing£ §Y$PLANET_HOUSING_TITLE$§!, §Yprodukcję zasobów§! i §Yprzyrost populacji§!. Odblokowuje specjalne £district£ §Ydzielnice arkologii-twierdzy§!. Wszystkie zasoby naturalne stają się jednak §Rniedostępne§!. Trwale uniemożliwia to budowę £district£ §Ydzielnic produkujących energię§!, §Ygórniczych§! i §Yrolniczych§!. §YSpecjalizacje biurokratyczne i handlowe§! oraz powiązane z nimi budynki zostaną §Rusunięte§!, a ich ponowna budowa zostanie §Rzablokowana§!."
 #Districts
