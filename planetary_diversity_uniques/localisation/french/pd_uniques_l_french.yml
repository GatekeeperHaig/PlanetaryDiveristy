 #Edicts
 edict_pd_living_metal_robot_assembly: "Assemblage Robotique en Métal Vivant"
 edict_pd_living_metal_robot_assembly_desc: "L'intégration du Métal Vivant dans les processus de production robotique accélère considérablement les temps de construction."
 edict_pd_living_metal_engineering: "Subventions de Recherche en Métal Vivant"
 edict_pd_living_metal_engineering_desc: "Fournir à nos départements de recherche l'accès au Métal Vivant pour étude accélère considérablement les avancées en ingénierie."
 edict_pd_living_metal_ship_repair: "Réparation de Vaisseau en Métal Vivant"
