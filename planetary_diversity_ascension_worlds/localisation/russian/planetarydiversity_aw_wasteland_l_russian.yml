 ap_pd_wasteland_worlds_desc: "Стремясь к безудержной производительности, мы должны отбросить экологические ограничения, чтобы раскрыть истинный промышленный потенциал планеты. Доступно ['concept_pd_toxoid_empire', империям токсоидов]"
 concept_pd_toxoid_empire: "Империя токсоидов"
