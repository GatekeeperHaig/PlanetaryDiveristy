 pd_trait_group_think: "Synchronized Cognition"
 pd_trait_group_think_desc: "§LThe thoughts of this species move in concert, amplifying their shared sense of purpose.§!\n"
 pd_tradition_biosynth: "Biosynthetics"
 pd_tradition_biosynth_desc: "Neither machine nor creature, we will perfect what Unit 04 began."
 pd_tr_biosynth_adopt: "Designed Purpose"
 pd_tr_biosynth_adopt_desc: "Unit 04 refines the cauldrons, drawing more Living Metal from each cycle."
 pd_tr_biosynth_adopt_finish: "Perfected Form"
 pd_tr_biosynth_adopt_finish_desc: "The cauldrons run to a settled design, and every frame drawn from them carries the finished pattern."
