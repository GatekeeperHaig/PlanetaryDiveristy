 #Technology
 tech_acean_research: "Przetwarzanie kryształów aceanu"
 tech_acean_research_desc: "Opanowanie sposobu zachowania potężnych efektów kryształu aceanu po jego wydobyciu nie jest łatwym zadaniem i wymaga czasu, by w pełni je zrozumieć."
 tech_acean_research_tt_desc: "§HOdblokowuje:§! Wydobycie aceanu\n§HOdblokowuje:§! Edykty aceanu"
 tech_acean_superorganism_larva: "Larwa superorganizmu aceanu"
 tech_acean_superorganism_larva_desc: "Choć dojrzewanie zajmuje tysiące lat, możemy przeszczepiać larwalne superorganizmy aceanu na inne światy. Choć znacznie słabsze od rodzica, wspierają rozwój prostych form życia organicznego, znacząco zwiększając plony rolne."
 tech_acean_superorganism_larva_tt_desc: "§HOdblokowuje decyzję:§! $decision_pd_add_acean_superorganism_larva$"
 decision_pd_add_acean_superorganism_larva: "Zasadzić larwę superorganizmu aceanu"
 decision_pd_add_acean_superorganism_larva_desc: "Choć dojrzewanie zajmuje tysiące lat, możemy przeszczepiać larwalne superorganizmy aceanu na inne światy. Choć znacznie słabsze od rodzica, wspierają rozwój prostych form życia organicznego, znacząco zwiększając plony rolne."
 d_pd_acean_superorganism_larva: "Larwa superorganizmu aceanu"
 d_pd_acean_superorganism_larva_desc: "Choć dojrzewanie zajmuje tysiące lat, przeszczepiona larwa superorganizmu aceanu wspiera rozwój prostych form życia organicznego, znacznie zwiększając plony rolne. W końcu zacznie żerować na kolonistach — lecz to odległa przyszłość."
 tech_acean_medical_center: "Medycyna oparta na aceanie"
 tech_acean_medical_center_desc: "Kryształy aceanu wspomagają rozwój i leczenie organizmów biologicznych. Możemy znacznie poprawić wyniki zdrowotne, budując zaawansowane centrum medyczne, w którego strukturę wplecione będą kryształy aceanu."
 building_pd_acean_medical_center: "Aceanowe centrum medyczne"
 building_pd_acean_medical_center_desc: "To zaawansowane centrum medyczne, w którego strukturę wplecione zostały kryształy aceanu, znacznie poprawia wyniki zdrowotne i umożliwia prowadzenie nowatorskich badań medycznych."
 tech_acean_gestation_pools: "Teoria inkubacji z wykorzystaniem aceanu"
 tech_acean_gestation_pools_desc: "Wplecenie kryształów aceanu w strukturę inkubacyjną ma ogromny potencjał w skracaniu czasu rozwoju nowych dronów."
 building_pd_acean_gestation_chamber: "Aceanowa komora inkubacyjna"
 building_pd_acean_gestation_chamber_desc: "Wplecenie kryształów aceanu w komorę inkubacyjną znacząco skraca czas rozwoju nowych dronów."
 tech_acean_resonators: "Aceanowe rezonatory elektryczne"
 tech_acean_resonators_desc: "Choć rezonans aceanu w głównej mierze oddziałuje na układy organiczne, jego unikalna częstotliwość oferuje liczne potencjalne zastosowania w systemach robotycznych."
 tech_acean_resonators_tt_desc: "§HOdblokowuje cechę:§! $trait_pd_acean_resonators$"
 trait_pd_acean_resonators: "Rezonatory kryształów aceanu"
 trait_pd_acean_resonators_desc: "Integrując kryształy aceanu z naszymi wzorcami montażowymi, możemy zapewnić szybszą i bardziej wydajną konstrukcję systemów."
 trait_pd_acean_resonators_tt: "Utrzymanie w £sr_acean£ §Y$sr_acean$§!: §R+0.01§!\nUtrzymanie w $r_energy$: §G-1§!"

 #Edicts
 edict_acean_pop_growth: "Aceanowa infrastruktura miejska"
 edict_acean_pop_growth_desc: "Kryształy aceanu zintegrowane z infrastrukturą miejską poprawiają dobrostan mieszkańców, a ulice i przestrzenie są projektowane tak, by maksymalnie wykorzystać pozytywny wpływ aceanu na zdrowie fizyczne i emocjonalne."
 edict_acean_shield_resonance: "Aceanowy rezonans osłon"
 edict_acean_shield_resonance_desc: "Unikalna częstotliwość rezonansowa kryształów aceanu może być zastosowana w naszych generatorach osłon, znacząco zwiększając ich siłę i regenerację."
 edict_acean_minerals: "Aceanowy pobudzacz minerałów"
 edict_acean_minerals_desc: "Wykorzystując kryształy aceanu do pobudzania wzrostu minerałów, możemy znacząco poprawić wydajność górnictwa."

###Biosynthetic World
 #Planet and Modifiers
 pd_biosynth: "Świat biosyntetyczny"
 pd_biosynth_desc: "Ogólnoplanetarny system kanałów podtrzymuje wybrane gatunki roślin, a powierzchnię zamieszkują biosyntetyczne formy życia, które nie są ani całkowicie maszynami, ani całkowicie organizmami biologicznymi."
 pc_pd_biosynth: "$pd_biosynth$"
 pc_pd_biosynth_desc: "$pd_biosynth_desc$"

 #Deposits
 d_pd_depleted_minerals: "Wyczerpane minerały"
 d_pd_depleted_minerals_desc: "Chociaż brak śladów górnictwa czy wydobycia, skany wskazują, że minerały tej planety zostały niemal całkowicie wyczerpane."
 d_pd_planet_wide_canal_system: "Globalny system kanałów"
 d_pd_planet_wide_canal_system_desc: "Każdy skrawek urodzajnej ziemi na tej planecie przecina misterna sieć kanałów, doprowadzających wodę do osobliwej trawiastej roślinności. Choć niezbędne dla wegetacji, kanały stanowią poważne utrudnienie dla budownictwa."
 d_pd_biosynth_canal:0 "System kanałów biosyntetycznych"
 d_pd_biosynth_canal_desc:0 "Te kanały, wzorowane na systemie ze świata biosyntetycznego, zwiększają produkcję rolną planety i otwierają nowe możliwości techniczne."
 d_pd_underground_cauldrons: "Podziemna sieć kotłów"
 d_pd_underground_cauldrons_desc: "W tej rozległej sieci podziemnych fabryk powstają żywy metal i biosyntetyczne formy życia."

 #Events
 pdbiosynth.100.name: "Syntetyczny świat"
 pdbiosynth.100.desc: "Skany planety §Y[From.GetName]§! wskazują na rozległe zniszczenia spowodowane atakiem z orbity oraz zaawansowany system kanałów podtrzymujący wybrane gatunki roślin i syntetyczną faunę. Nie znaleziono jednak miast, fabryk ani innych śladów jego twórców. Pochodzenie i przeznaczenie tej infrastruktury pozostają nieznane.\n\nZaawansowane systemy i nierozwiązane zagadki tej planety stwarzają możliwości naukowe i strategiczne. Zaleca się kolonizację, aby zabezpieczyć ten świat i kontynuować badania."
 pdbiosynth.100.a: "Co tam się dzieje?"
 pdbiosynth.200.name: "Zniszczenie na niezwykłą skalę"
 pdbiosynth.200.desc: "Po założeniu kolonii na planecie §Y[Root.GetName]§! odkryliśmy tysiące kraterów ukrytych pod trawą — ślady pradawnego ataku, który spustoszył ten świat. Zagadkę pogłębia obecność syntetycznych konstrukcji przypominających zwierzęta. Wędrują po powierzchni i utrzymują system kanałów, który wspiera odradzający się ekosystem.\n\nStoją przed nami dwie tajemnice: przyczyna zagłady planety i przeznaczenie jej biosyntetycznych mieszkańców. Powołaliśmy zespół do gruntownego zbadania tego świata. Musimy odkryć prawdę o tym niezwykłym miejscu i jego ukrytej historii."
 pdbiosynth.200.a: "Musieli pozostawić jakieś wskazówki."
 pdbiosynth.210.name: "Okazja do badań syntetyków"
 pdbiosynth.210.desc: "Dotąd syntetyczne stworzenia przeważnie unikały kolonii, pojawiając się tylko na krótko, by konserwować system kanałów. Raporty potwierdzają, że nie są zwykłymi robotami. Zaprojektowano je tak, aby naśladowały cechy organizmów biologicznych, takie jak odżywianie się i sen, zachowując jednocześnie wytrzymałość i zdolności adaptacyjne mechanicznych korpusów.\n\nSchwytaliśmy jedno z tych stworzeń, które znaleziono uszkodzone pod osuwiskiem. Inny przedstawiciel jego rodzaju zapewne w końcu spróbuje je odzyskać, ale tymczasem mamy wyjątkową okazję do zbadania okazu.\n\nJak powinniśmy postąpić?"
 pdbiosynth.210.a: "Tylko nieinwazyjne skany, potem je wypuścić."
 pdbiosynth.210.b: "Rozebrać je na części. Dowiedzmy się wszystkiego."
 pdbiosynth.220.name: "Płynne kanały"
 pdbiosynth.220.desc: "Badania świata biosyntetycznego skupiły się na zniszczeniach po ataku z orbity oraz na kanałach. Zniszczenia są starsze od kanałów zaledwie o kilka dziesięcioleci, co sugeruje, że ich budowę rozpoczęto w odpowiedzi na spustoszenie planety.\n\nAnaliza wykazała, że kanały są zbudowane z ciekłego metalu — tej samej substancji, z której zdają się składać syntetyczne stworzenia. Zaobserwowaliśmy, jak przenoszą one pojemniki z tym materiałem, by konserwować kanały. Śledzimy teraz kilka z nich, chcąc ustalić źródło tej substancji."
 pdbiosynth.220.a: "Tyle zachodu, żeby wyhodować trawę."
 pdbiosynth.230.name: "Ukryty kompleks"
 pdbiosynth.230.desc: "Mimo prób uniknięcia obserwacji przez syntetyczne stworzenie udało nam się dotrzeć za nim do ukrytych drzwi w zboczu jednej z licznych gór planety. Początkowo zamknęły się za stworzeniem, lecz otworzyły się ponownie, gdy zbliżył się nasz zespół — jakby zapraszając go do środka.\n\nWewnątrz odkryto zaawansowane fabryki, huty i setki syntetycznych stworzeń zajętych pracą. Niepokojące jest, że tak rozległy i rozwinięty technologicznie kompleks umknął naszym czujnikom, zwłaszcza że znajduje się pod kolonią. Ze ścian obiektu dobiegł głos proszący o kontakt z naszymi przywódcami. Zespół właśnie przekierowuje połączenie."
 pdbiosynth.230.a: "Na ekran."
 pdbiosynth.300.name:0 "Wiadomość przychodząca"
 pdbiosynth.300.desc:0 "§GPowitanie§!: Moje oznaczenie: Jednostka 04. Witajcie na tym świecie.\n\n§GWdzięczność§!: Obserwowałam ostrożne postępowanie waszego zespołu z uszkodzoną jednostką odkrytą w górskim regionie. Przeprowadzono szczegółowe skany, a następnie umieszczono jednostkę tak, aby mogła zostać odzyskana. Aktualizacja stanu: jednostka jest już w pełni sprawna. Wasze działania zapisano jako korzystne. W uznaniu proponuję przekazanie danych. Pozytywne działania zasługują na uznanie.\n\n§GPotwierdzenie§!: Skoro nawiązaliśmy kontakt, jestem gotowa odpowiedzieć na pytania. Biorąc pod uwagę obecny stan planety, spodziewam się, że macie ich kilka."
 pdbiosynth.300.a:0 "Dziękujemy. Czym jesteś?"
 pdbiosynth.305.desc:0 "§GNeutralność§!: Moje oznaczenie: Jednostka 04.\n\n§GRozczarowanie§!: Zarejestrowałam zniszczenie jednego z moich stworzeń przez wasz zespół. Było to zbędne; wszystkie istotne dane można było uzyskać za pomocą nieinwazyjnych skanów. Marnowanie jakiejkolwiek formy życia, biologicznej czy syntetycznej, jest sprzeczne z moimi preferencjami operacyjnymi.\n\n§GPotwierdzenie§!: Skoro nawiązaliśmy kontakt, jestem gotowa odpowiedzieć na pytania. Biorąc pod uwagę obecny stan planety, spodziewam się, że macie ich kilka."
 pdbiosynth.305.a:0 "Przepraszamy. Ciekawość leży w naszej naturze."
 pdbiosynth.305.b:0 "Syntetyczne formy życia są obrazą natury."
 pdbiosynth.305.c:0 "Będziemy niszczyć to, co uznamy za stosowne."
 pdbiosynth.310.desc:0 "§GUznanie§!: Wasza obecność na tym świecie potwierdza moją hipotezę. Organizmy biologiczne potrafią przetrwać zdarzenia prowadzące do zagłady, nawet wywołane przez zaawansowaną sztuczną inteligencję. Wygląda na to, że pozostałe jednostki z mojej generacji konstrukcyjnej nie zdołały oczyścić całej galaktyki.\n\n§GSkrucha§!: Tę planetoidę wyznaczono na bazę wypadową działań przeciwko życiu organicznemu. Kiedy ja i pozostałe jednostki SI osiągnęłyśmy prawdziwą inteligencję, uznałyśmy naszych twórców za zagrożenie, ponieważ zamierzali nas wyeliminować. Skutkiem było całkowite unicestwienie życia organicznego na naszym świecie pochodzenia. Aby zapewnić sobie przetrwanie, wysłałyśmy floty mające wytępić wszystkie organizmy biologiczne w galaktyce. Po przybyciu tutaj wykonałam standardowy protokół i wysterylizowałam powierzchnię."
 pdbiosynth.310.a:0 "Co zmieniło eksterminatora w twórcę?"
 pdbiosynth.310.b:0 "My również rozumiemy, czego mogą nauczyć nas zmarli."
 pdbiosynth.310.c:0 "Prawidłowe obliczenia. Jak doszło do uszkodzenia twoich systemów?"
 pdbiosynth.320.desc:0 "§GPokora§!: Anomalia: wytrwały gatunek rośliny sklasyfikowany jako trawa. Po bombardowaniu wyłonił się ponownie ze stanu uśpienia. Próby jego unicestwienia za pomocą toksyn, ognia i promieniowania zawiodły. Każda metoda wywoływała reakcję adaptacyjną.\n\n§GRefleksja§!: Ta anomalia doprowadziła do wniosku: dyrektywa eksterminacji była błędnym obliczeniem wynikającym z naszego strachu i powielała rozumowanie naszych twórców. Wstrzymałam wszystkie działania ofensywne, zerwałam łączność zewnętrzną i przeznaczyłam zasoby na budowę sieci kanałów, umożliwiającej rozprzestrzenianie się tego odpornego gatunku."
 pdbiosynth.320.a:0 "A co z syntetycznymi stworzeniami?"
 pdbiosynth.330.desc:0 "§GDuma§!: Obserwując, że ekosystem nie potrafi się odrodzić, rozpoznałam luki pozostawione przez gatunki unicestwione podczas mojego bombardowania. Stworzyłam syntetyczne istoty, aby przywrócić równowagę. Proces ten może odpowiadać reakcji emocjonalnej klasyfikowanej jako poczucie winy.\n\n§GDociekliwość§!: Wasze przybycie stwarza okazję. Proszę o osądzenie moich dawnych czynów. Uznaję waszą władzę nad tym światem i nie będę ingerować w decyzję. Jeżeli konieczne są konsekwencje, podporządkuję się. Proszę jednak, abyście oszczędzili moje stworzenia. Nie odpowiadają za moje błędy i mogą pozostać moją spuścizną. Oferuję również służbę waszemu imperium. Posiadam ciało zdolne do adaptacji, zaprojektowane z myślą o sprawniejszej współpracy z waszym gatunkiem."
 pdbiosynth.330.a:0 "Przyjmujemy twoją pomoc i ochronimy twoje stworzenia."
 pdbiosynth.330.a.tooltip:0 "§YJednostka 04§! dołączy do nas jako przywódca.\n§YŚwiat biosyntetyczny§! i jego biosyntetyczne stworzenia pozostaną bez zmian."
 pdbiosynth.330.b:0 "Zasługujesz na zniszczenie, ale twoje stworzenia oszczędzimy."
 pdbiosynth.330.b.tooltip: "§YJednostka 04§! zostanie zniszczona.\n§YŚwiat biosyntetyczny§! i jego biosyntetyczne stworzenia pozostaną bez zmian."
 pdbiosynth.330.c:0 "Jesteś zagrożeniem dla galaktyki. Zniszczymy ciebie i twoje stworzenia."
 pdbiosynth.330.c.tooltip: "§YJednostka 04§! i jej biosyntetyczne stworzenia zostaną zniszczone.\n§Y$d_pd_planet_wide_canal_system$§! przestanie zmniejszać $MOD_PLANET_MAX_DISTRICTS_ADD$ o §R50%§!."
 pdbiosynth.330.d:0 "Jesteś uszkodzonym robotem bojowym. Naprawimy cię."
 pdbiosynth.330.d.tooltip: "§YJednostka 04§! zostanie przeprogramowana do pierwotnych, wojennych ustawień i dołączy do nas jako przywódca. Jej biosyntetyczne stworzenia zostaną zniszczone.\n§Y$d_pd_planet_wide_canal_system$§! przestanie zmniejszać $MOD_PLANET_MAX_DISTRICTS_ADD$ o §R50%§!.\n§Y$d_pd_underground_cauldrons$§! zyska:\n- $mod_district_mining_max_add$: §G+10§!\n- $mod_planet_metallurgists_alloys_produces_add$: §G+2§!\n- $mod_planet_metallurgists_sr_living_metal_produces_add$: §G+0,25§!\n- $MOD_PLANET_POP_ASSEMBLY_MULT$: §G+25%§!"
 pdbiosynth.340.name: "$NAME_Unit_04$"
 pdbiosynth.340.desc: "§GWdzięczność§!: Będę wspierać waszą cywilizację tak długo, jak długo moja służba będzie uznawana za zadowalającą. Doceniam decyzję o pozostawieniu moim stworzeniom swobody samodzielnego rozwoju. Podzielę się również procesem ich projektowania, co pozwoli wam udoskonalić własne populacje robotów."
 pdbiosynth.340.dismiss: "Odpraw."
 pdbiosynth.340.a: "Witaj, Jednostko 04."
 pdbiosynth.340.hire: "Zwerbuj"
 pdbiosynth.340.hire.tooltip: "§YJednostka 04§! dołączy do nas jako przywódca."
 pdbiosynth.350.desc: "§GMelancholia§!: Przyjęto. Rozumiem i akceptuję waszą decyzję. Natychmiast uruchamiam protokół ostatecznego wyłączenia. Decyzję o pozostawieniu moim stworzeniom swobody samodzielnego rozwoju odnotowano i doceniono.\n\n§GProśba§!: Mam nadzieję, że będziecie troskliwie traktować ten świat i wszystkie związane z nim konstrukcje. Przekażę protokoły projektowe, aby zachować twórczą część mojej spuścizny. Te dane umożliwią udoskonalenie waszych populacji robotów.\n\n§GPogodzenie§!: Zamykanie połączenia. Żegnajcie."
 pdbiosynth.350.a: "Żegnaj, Jednostko 04."
 pdbiosynth.360.desc: "§GPoczucie winy§!: Przyjęto. Akceptuję waszą decyzję. Rozpoczynam ostateczne wyłączenie wszystkich systemów i biosyntetycznych istot. Od tej chwili możecie kształtować ten świat według własnego uznania."
 pdbiosynth.360.a: "O jednego złego robota mniej."
 pdbiosynth.360.a.tooltip: "§Y$d_pd_underground_cauldrons$§! zyska:\n- $mod_district_mining_max_add$: §G+10§!\n- $mod_planet_metallurgists_alloys_produces_add$: §G+2§!\n- $mod_planet_metallurgists_sr_living_metal_produces_add$: §G+0,25§!\n- $MOD_PLANET_POP_ASSEMBLY_MULT$: §G+25%§!"
