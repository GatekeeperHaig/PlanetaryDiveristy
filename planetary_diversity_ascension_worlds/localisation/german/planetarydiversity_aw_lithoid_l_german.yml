l_german :
### Lithoide Planeten
#Entscheidung
decision_pd_aw_lithoid_planet: " Lithotrophes Ökosystem erstellen "
decision_pd_aw_lithoid_planet_desc: "Diese Welt wartet darauf, in eine Welt aus Kristall und Stein geätzt zu werden. Das schwache biologische Ökosystem steht uns im Weg."
decision_pd_aw_lithoid_planet_effects_short: " Auf dieser Welt wird ein lithotrophes Ökosystem geschaffen, das es uns ermöglicht, die kristallinen Frequenzen fein abzustimmen, um sie besser an unsere Bedürfnisse anzupassen."
decision_pd_aw_lithoid_planet_tooltip: "Sobald dies abgeschlossen ist, können wir die Häufigkeit der lithotrophen Kristalle dieses Planeten auswählen."
decision_pd_aw_lithoid_planet_cleanup: "Biologisches Ökosystem wiederherstellen"
decision_pd_aw_lithoid_planet_cleanup_desc: "Wir müssen das biologische Ökosystem dieses Planeten wieder in seiner ursprünglichen Pracht erstrahlen lassen."
decision_pd_aw_lithoid_planet_cleanup_effects_short: "Das künstlich geschaffene lithotrophe Ökosystem wird entfernt und sein biologischer Charakter wiederhergestellt."
decision_pd_aw_lithoid_planet_cleanup_tooltip: "Alle lithotrophen Modifikatoren werden entfernt und der Planet wird in ein biologisches Ökosystem zurückverwandelt."
decision_pd_aw_lithoid_change_frequency: " Lithotrophe Frequenz ändern"
decision_pd_aw_lithoid_change_frequency_desc: "Wir werden die Häufigkeit der Kristalle des lithotrophen Ökosystems ändern, um sie unseren Bedürfnissen anzupassen."
decision_pd_aw_lithoid_change_frequency_effects_short: "Wir können die Frequenz der Kristalle dieses Planeten ändern."
decision_pd_aw_lithoid_change_frequency_tooltip: "Der aktuelle lithotrophe Modifikator wird entfernt, sodass wir ihn auf eine andere Frequenz ändern können."

#Modifikatoren
pd_aw_lithoid_planet_cyan: " Lithotrophe Welt"
pd_aw_lithoid_planet_cyan_desc: "Wellenlänge: 500 nm\nDie resonierenden Vibrationen fördern den guten Willen und katalysieren eine beschleunigte Wachstumsrate der Lithoiden ."
pd_aw_lithoid_planet_red: " Lithotrophe Welt"
pd_aw_lithoid_planet_red_desc: "Wellenlänge: 650 nm\nDie robuste kristalline Resonanz synergiert nahtlos mit Mineralvorkommen und macht sie für die Gewinnung leichter zugänglich."
pd_aw_lithoid_planet_yellow: " Lithotrophe Welt"
pd_aw_lithoid_planet_yellow_desc: "Wellenlänge: 580 nm\nDie dynamischen Harmonischen dieser kristallinen Resonanz integrieren sich nahtlos in unsere Stromnetze und setzen deren gesamte Kapazität frei."

# Aufstiegsvorteil
ap_pd_lithoid_worlds: " Lithotrophe Welten"
ap_pd_lithoid_worlds_desc: "Wir werden unsere Welten in unnachgiebige lithotrophe Paradiese verwandeln und ein Fundament ewiger Stabilität schmieden."
allow_lithoid_worlds: "§HEntsperrt Entscheidung :§! $decision_pd_aw_lithoid_planet$"
describe_lithoid_worlds: "§YLithotrophic Worlds§! are a special planet class with lithotrophic ecosystems, whose large crystal structures can be tuned to improve $i_unity$, $i_minerals$ or $i_energy$.\n$MOD_LITHOID_POP_HAPPINESS$: §G25%§!\n$mod_LITHOID_logistic_growth_mult$: §G10%§! (§G25%§! at 500 nm)\n$MOD_BIOLOGICAL_POP_HAPPINESS$: §R-50%§!\n$MOD_BIO_LOGISTIC_GROWTH_MULT$: §R-50%§!"

#Benachrichtigungsnachricht
MESSAGE_PD_AW_LITHOID_DESC:1 "$PLANET|Y$ ist jetzt eine §YLithotrophe Welt§!"
MESSAGE_PD_AW_LITHOID_MESSAGE_TYPE_TITLE: " Lithotrophes Biom abgeschlossen"
MESSAGE_PD_AW_LITHOID_CLEANUP_DESC:1 "Das biologische Biom auf $PLANET|Y$ wurde wiederhergestellt."
MESSAGE_PD_AW_LITHOID_CLEANUP_MESSAGE_TYPE_TITLE: " Lithotrophes Biom entfernt"

#Veranstaltung auswählen
pdawlithoidplanets.100.name: "Kristalline Frequenz"
pdawlithoidplanets.100.desc: "Auf welche Resonanzfrequenz sollen wir das lithotrophe Biom auf §Y[ This.GetName ]§! abstimmen?"
pdawlithoidplanets.100.cyan: "Cyan"
pdawlithoidplanets.100.cyan.tooltip: "Diese Resonanzfrequenz wirkt wie eine verbindende Kraft, die die Einheit unserer lithoiden Bevölkerung fördert und einen harmonischen Anstieg des Bevölkerungswachstums begünstigt."
pdawlithoidplanets.100.red: "Rot"
pdawlithoidplanets.100.red.tooltip: "Diese Resonanz wirkt nahtlos mit Mineralvorkommen zusammen und macht sie leichter zugänglich und reif für die Gewinnung."
pdawlithoidplanets.100.yellow: "Gelb"
pdawlithoidplanets.100.yellow.tooltip: "Diese Resonanzfrequenz lässt sich nahtlos in unsere Stromnetze integrieren und ermöglicht eine Steigerung ihrer Gesamtkapazität."

