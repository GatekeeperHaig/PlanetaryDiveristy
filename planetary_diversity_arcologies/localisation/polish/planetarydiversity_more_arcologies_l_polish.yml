 job_pd_naval_admin_effect_desc: "£job_pd_naval_admin£ $job_pd_naval_admin_plural$ usprawniają działania floty, przetwarzając £consumer_goods£ §Y$consumer_goods$§! w £society£ §Ypunkty badań§! oraz £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!."
 #Gestalt Logistics
