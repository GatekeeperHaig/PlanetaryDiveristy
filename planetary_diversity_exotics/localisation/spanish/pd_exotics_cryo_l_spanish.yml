 # Ammonia signature buildings (pick one)
 building_pd_ammonia_fixation_institute: "Instituto de síntesis de amoníaco"
 building_pd_ammonia_fixation_institute_desc: "La química rica en nitrógeno del planeta ofrece a nuestros biólogos e ingenieros multitud de reacciones nuevas que estudiar y perfeccionar."
 building_pd_ammonia_pharma_works: "Planta farmacéutica de amoníaco"
 building_pd_ammonia_pharma_works_desc: "El abundante amoníaco de este lugar se refina con facilidad en fármacos y productos de limpieza que abastecen a los mercados de todo el imperio."
 building_pd_ammonia_biome_reserve: "Reserva del bioma de amoníaco"
 building_pd_ammonia_biome_reserve_desc: "El extraño ecosistema de química fría de este mundo atrae a visitantes curiosos de todas las estrellas."

 # Methane signature buildings (pick one)
 building_pd_methane_tholin_lab: "Laboratorio de química del metano"
 building_pd_methane_tholin_lab_desc: "La densa bruma orgánica de este mundo está repleta de química exótica de baja temperatura que nuestros investigadores pueden desentrañar."
 building_pd_methane_hydrocarbon_foundry: "Fundición de craqueo de metano"
 building_pd_methane_hydrocarbon_foundry_desc: "Los inagotables hidrocarburos de este lugar se craquean y se refunden en aleaciones, y el combustible local barato mantiene en marcha nuestras fundiciones."
 building_pd_methane_polymer_plant: "Planta de polímeros de metano"
