trait_pc_pd_wet_tidally_locked_preference_desc: "$trait_pc_arctic_preference_desc$"
pc_pd_dry_tidally_locked: "Monde Crépusculaire Sec"
pc_pd_dry_tidally_locked_desc: "Un monde rocheux avec une atmosphère azote-oxygène, cette planète tidalement verrouillée a un côté en lumière constante tandis que l'autre est dans la nuit continue. Une fine zone habitable existe dans la région du crépuscule. La lumière du soleil et le vent constants sont idéaux pour la production de nourriture et d'énergie."
pc_pd_dry_tidally_locked_adj: "tidallement verrouillé"
mod_pc_pd_dry_tidally_locked_habitability: "Habitabilité Crépusculaire Sec"
