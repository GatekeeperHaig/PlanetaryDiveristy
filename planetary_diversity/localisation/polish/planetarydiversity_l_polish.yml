 pd_geothermal_vent_tapper: "$job_pd_geothermal_vent_tapper$"
 job_pd_geothermal_vent_tapper: "Operator odwiertów geotermalnych"
 job_pd_geothermal_vent_tapper_plural: "Operatorzy odwiertów geotermalnych"
 job_pd_geothermal_vent_tapper_desc: "Operatorzy odwiertów geotermalnych wiercą bezpośrednio w kominach geotermalnych planety, pozyskując znacznie więcej energii niż standardowe załogi elektrowni. Wypompowywana przez nich solanka dostarcza ponadto niewielkie, lecz stałe ilości minerałów."
