 #Modifiers
 pd_hive_military: "Mundo Mente Suprema"
 pd_hive_military_desc: "Este mundo é fundamental para as funções centrais da Mente-Colmeia e está fortificado contra ameaças e influências externas. Um formidável escudo envolve o planeta e drones guerreiros estão em alerta permanente, garantindo sua proteção."
 pd_machine_military: "Mundo Nexo"
 pd_machine_military_desc: "Esta unidade planetária é parte integrante da matriz operacional desta inteligência máquina. Está protegida contra interferências externas, encapsulada por um mecanismo de defesa invulnerável. As unidades de combate estão em prontidão perpétua, preservando a integridade da unidade."
