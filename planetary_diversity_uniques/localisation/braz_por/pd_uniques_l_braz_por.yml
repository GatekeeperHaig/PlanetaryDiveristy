 leader_trait_unit_04: "Unidade 04"
 leader_trait_unit_04_desc: "Originalmente uma Forma de Guerra, reprogramou-se e agora está focada na criação e preservação de todas as formas de vida."
 leader_trait_unit_04_evil: "Unidade 04"
 leader_trait_unit_04_evil_desc: "Originalmente uma Forma de Guerra, foi restaurada às suas configurações originais e agora se destaca na construção militar e táticas."
 leader_trait_biosynth: "Biossintético Perfeito"
 leader_trait_biosynth_desc: "A estrutura deste líder executa o padrão final da Unidade 04, reconfigurando-se conforme as funções que lhe são atribuídas."
 trait_unit_04_children: "Estruturas Biossintéticas da Unidade 04"
 trait_unit_04_children_desc: "Ao integrar os princípios de design da Unidade 04, aprimoramos as estruturas robóticas com sistemas biossintéticos, melhorando significativamente tanto a velocidade de montagem quanto a produção."
 trait_unit_04_children_tt: "$r_living_metal$ Manutenção: §R+0.01§!"

 #Technology
 tech_biosynth_canals: "Canais Biossintéticos"
 tech_biosynth_canals_desc: "Estudando o sistema de canais presente no Mundo Biossintético, podemos ser capazes de replicar versões menores em outros planetas para melhorar a produção agrícola."
 tech_biosynth_canals_tt_desc: "§HDesbloqueia Decisão:§! $decision_pd_add_biosynth_canal_system$"
 tech_biosynth_cauldron: "Caldeirões Biossintéticos"
 tech_biosynth_cauldron_desc: "Inspirados nas fábricas subterrâneas do Mundo Biossintético, devemos ser capazes de criar fábricas adaptáveis construídas com metal vivo para melhorar significativamente a produção industrial."
 tech_biosynth_edicts: "Utilização de Metal Vivo"
 tech_biosynth_edicts_desc: "Graças aos intrincados exemplos fornecidos pelas linhas de produção do Caldeirão subterrâneo da Unidade 04, descobrimos várias aplicações novas para o Metal Vivo."
 tech_biosynth_edicts_tooltip: "§HDesbloqueia:§! Editos de Metal Vivo"
 tech_biosynth_trait: "Sistema Robótico Biossintético"
 tech_biosynth_trait_desc: "Ao integrar os princípios de design da Unidade 04, podemos aprimorar nossa população robótica com sistemas biossintéticos, melhorando significativamente tanto a velocidade de montagem quanto a produção."
 tech_biosynth_trait_tt_desc: "§HDesbloqueia Característica:§! $trait_unit_04_children$"

 #Decisions
 decision_pd_add_biosynth_canal_system: "Construir Sistema de Canais Biossintético"
 decision_pd_add_biosynth_canal_system_desc: "Baseados nos do Mundo Biossintético, podemos construir canais para melhorar a produção agrícola deste planeta."

 #Buildings
 building_pd_biosynth_cauldron: "Caldeirão Biossintético"
 building_pd_biosynth_cauldron_desc: "Esta planta de produção avançada pode adaptar sua produção para atender às necessidades do planeta, usando Metal Vivo para reconfigurar sistemas inteiros de fábricas com velocidade notável."

 #Jobs
 job_pd_biosynth_engineer: "Engenheiro Biossintético"
 job_pd_biosynth_engineer_plural: "Engenheiros Biossintéticos"
 job_pd_biosynth_engineer_desc: "Esses engenheiros especializados mantêm o avançado Caldeirão Biossintético em pleno funcionamento."
