 job_pd_reef_nacre_artisan: "珠贝工匠"
 job_pd_reef_nacre_artisan_plural: "珠贝工匠"
 job_pd_reef_nacre_artisan_desc: "珠贝工匠将礁石上闪烁着虹彩的贝壳打造成备受追捧的消费品，为殖民地的生活设施增光添彩。"
 job_pd_reef_nacre_artisan_drone: "珠贝工匠"
 job_pd_reef_nacre_artisan_drone_plural: "珠贝工匠"
