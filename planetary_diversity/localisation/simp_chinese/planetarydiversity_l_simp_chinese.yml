 job_pd_megaflora_xylem_tapper: "木质部萃取者"
 job_pd_megaflora_xylem_tapper_plural: "木质部萃取者"
 job_pd_megaflora_xylem_tapper_desc: "木质部萃取者从巨树庞大的树液压力网络中提取动力，该系统在实现自供能的同时，还能产出可食用的生物质。"
 job_pd_megaflora_xylem_tapper_drone: "木质部萃取者"
 job_pd_megaflora_xylem_tapper_drone_plural: "木质部萃取者"
