 pd_trait_positronic_creativity: "Positronic Creativity"
 pd_trait_positronic_creativity_desc: "§LThe branching, positronic minds of this species leap between disciplines, hastening research of every kind.§!\n"
 pd_trait_resolute_programming: "Resolute Programming"
