#Planetary Superprojects
 #Notification
 MESSAGE_PD_AW_SUPERPROJECT_DESC: "Superprojekt na planecie $PLANET|Y$ został ukończony."
 MESSAGE_PD_AW_SUPERPROJECT_MESSAGE_TYPE_TITLE: "Superprojekt planetarny ukończony"

#Core Tap
 #Planet Class
 pc_pd_core_tap: "Megaodwiert rdzenia"
 pc_pd_core_tap_desc: "Tę skalistą planetę pokrywa teraz rozległa sieć maszyn sięgających do jej rdzenia, by czerpać z niego pierwotną energię. To świadectwo kunsztu inżynieryjnego powstało kosztem naturalnego ekosystemu planety."
 pc_pd_core_tap_adj: "energetyczny"
 mod_pc_pd_core_tap_habitability: "Możliwość zamieszkania megaodwiertu rdzenia"
 trait_pc_pd_core_tap_preference: "Preferencja — megaodwiert rdzenia"
 trait_pc_pd_core_tap_preference_desc: "$trait_pc_arctic_preference_desc$"

 #Decision
 decision_pd_aw_core_tap: "Superprojekt planetarny: megaodwiert rdzenia"
 decision_pd_aw_core_tap_desc: "Tworząc sieć maszyn sięgających do samego rdzenia tego świata, będziemy mogli wytwarzać niewiarygodne ilości energii kosztem ekosystemu planety."
 decision_pd_megacoretap_requirements: "£trigger_no£ §RWymagane są co najmniej §Y3§! dzielnice typu £district£ §Y$district_generator_plural$§! i brak innych £district£ §Ydzielnic surowcowych§! na planecie.§!"

 #Modifier
 pd_aw_core_tap: "Megaodwiert rdzenia"
 pd_aw_core_tap_desc: "Ten świat pokrywa rozległa sieć maszyn sięgających do jego rdzenia, by czerpać z niego pierwotną energię kosztem naturalnego ekosystemu."
 pd_aw_core_tap_tooltip: "£district£ §G$district_generator_plural$§! nie mają limitu"

 #Technology
 tech_pd_planetary_core_tap: "Superprojekt planetarny: megaodwiert rdzenia"
 tech_pd_planetary_core_tap_desc: "Tworząc sieć maszyn sięgających do samego rdzenia planety, będziemy mogli wytwarzać niewiarygodne ilości energii kosztem jej ekosystemu."
 tech_pd_planetary_core_tap_tooltip: "§HOdblokowuje decyzję:§! $decision_pd_aw_core_tap$"

#Agriworld
 #Planet Class
 pc_pd_agriworld: "Agroświat"
 pc_pd_agriworld_desc: "Tę skalistą planetę pokrywają bezkresne uprawy przemysłowe, uzależnione od silnych nawozów, złożonych systemów kontroli pogody i zaawansowanego nawadniania. Zapewniają nieprzerwane obfite plony, lecz zajęły miejsce naturalnego ekosystemu planety."
 pc_pd_agriworld_adj: "rolniczy"
 mod_pc_pd_agriworld_habitability: "Możliwość zamieszkania agroświata"
 trait_pc_pd_agriworld_preference: "Preferencja — agroświat"
 trait_pc_pd_agriworld_preference_desc: "$trait_pc_arctic_preference_desc$"

 #Decision
 decision_pd_aw_agriworld: "Superprojekt planetarny: agroświat"
 decision_pd_aw_agriworld_desc: "Przekształcając tę planetę w agroświat, stworzymy rozległe uprawy przemysłowe. Naturalny ekosystem ustąpi miejsca sztucznym terenom rolniczym zapewniającym obfite plony."
 decision_pd_agriworld_requirements: "£trigger_no£ §RWymagane są co najmniej §Y3§! dzielnice typu £district£ §Y$district_farming_plural$§! i brak innych £district£ §Ydzielnic surowcowych§! na planecie.§!"

