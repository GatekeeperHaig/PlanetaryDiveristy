pc_pd_cold_gaia_tidally_locked: "Monde Crépusculaire Froid Gaia"
pc_pd_cold_gaia_tidally_locked_desc: "Un monde rocheux, idéal et tempéré, tidallement verrouillé avec une atmosphère azote-oxygène et un écosystème résilient. Conditions optimales pour toutes les formes de vie supérieures connues à différentes latitudes."
pc_pd_cold_gaia_tidally_locked_adj: "tidallement verrouillé"
mod_pc_pd_cold_gaia_tidally_locked_habitability: "Habitabilité Crépusculaire Froid Gaia"
