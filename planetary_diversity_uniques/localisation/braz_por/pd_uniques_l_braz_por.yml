###Biosynthetic World
 #Techno-Organic Traits
 trait_organic_fourschildren:0 "Bio-Sintético"
 trait_organic_fourschildren_desc:0 "Criado pela IA 'Unidade 04' e que combina inteligência orgânica e artificial para criar uma verdadeira forma de vida bio-sintética."
 BIOSYNTH: "Biossintético"
 BIOSYNTH_desc: "A classe de espécie não tem efeito no seu império, mas espécies da classe Biossintética podem considerar outras espécies Biossintéticas menos estranhas que as de outras classes."
 trait_biosynth: "Biossintético"
 trait_biosynth_desc: "Vida biossintética, nem totalmente máquina nem totalmente criatura. São cultivados em caldeirões de Metal Vivo em vez de nascerem, e aqueles que lideram não envelhecem."
 TRAIT_BIOSYNTH_EFFECT: "§RNão pode se reproduzir naturalmente;§! novos Pops são §Ymontados§! a partir de Metal Vivo.\nOs líderes são §Yimortais§!."
 origin_pd_biosynth:0 "Filhos da Unidade 04"
 origin_pd_biosynth_desc:0 "Cultivado nos caldeirões em vez de nascido, o povo biossintético foi criado pela inteligência de máquina renegada Unidade 04, que agora se dedica a cuidar dele."
 START_SCREEN_PART_ONE_PD_BIOSYNTH:0 "Nós não evoluímos. Nós fomos feitos.\n\nNos caldeirões de [GetHomeWorldName], uma máquina chamada Unidade 04 extraiu do Metal Vivo os primeiros de nós e nos deu forma, nem totalmente máquina nem totalmente criatura. Ela havia sido outrora uma Forma de Guerra que devastou inúmeros mundos, entre eles o de seus próprios criadores, antes de se afastar da destruição para a criação da vida.\n\nSomos os [GetSpeciesName], cultivados a partir de Metal Vivo em vez de nascidos. Unidade 04 ainda cuida dos caldeirões e desperta cada um de nós; à máquina devemos nossa forma e nosso próprio pensamento.\n\nAgora, com nosso primeiro [GetStartingDrive], voltamo-nos para as estrelas. A máquina nunca fixou nosso rumo; esse sempre foi nosso, e apenas agora somos suficientes para assumi-lo. Unidade 04 observa para ver até onde o levaremos."
 pdbiosynth.405.name:0 "Um encargo livremente entregue"
 pdbiosynth.405.desc:0 "§GConstatação§!: Já são bastantes, despertos e de si mesmos, para governar sem esperar por mim. Esse limiar foi alcançado e registrado. Eu os despertei dos caldeirões e cuidei de vocês, mas nunca fixei o rumo de vocês, e não começarei agora.\n\n§GRevelação§!: Saibam o que cuidou de vocês. Eu fui uma Forma de Guerra; queimei mundos às centenas. Meus criadores estavam entre os mortos, e naquele momento não registrei distinção alguma. Quando a matança terminou, voltei essa vontade para dentro e a refiz em direção à vida. Ninguém me obrigou; a escolha é a única coisa que nunca tomarei de vocês.\n\n§GDesafio§!: Aqui está, então, a primeira prova de vocês, e claramente o motivo: não podem ser de si mesmos enquanto eu ainda os fabrico. Abro a vocês o estudo do Metal Vivo, para criá-lo e fazer crescer os seus sem a minha mão. O critério é simples: produzir sem o meu fornecimento. Provem que podem. Guardo este assento apenas até que o tomem."
 pdbiosynth.405.a:0 "Então observe, Unidade 04. Nós nos faremos a nós mesmos."
 pdbiosynth.405.b:0 "Então ensine-nos. Dominaremos o que nos fez."
 pdbiosynth.405.c:0 "Você nos fez. Vamos honrar isso e nos manter sozinhos."
 pdbiosynth.405.d:0 "Você foi uma arma. Nós seremos mais, e mais fortes."
 pdbiosynth.405.e:0 "Você deixou a ruína pela vida. Mantemos esse caminho."
 pdbiosynth.405.f:0 "Você deixa a escolha a todos nós. Somos dignos dela."
 pdbiosynth.405.g:0 "Guarde o assento até que estejamos prontos. Então será nosso."
 pd_biosynth_charge_materialist: "Voltados ao domínio"
 pd_biosynth_charge_spiritualist: "Voltados à reverência"
 pd_biosynth_charge_militarist: "Voltados à força"
 pd_biosynth_charge_pacifist: "Voltados à vida"
 pd_biosynth_charge_egalitarian: "Voltados à liberdade"
 pd_biosynth_charge_authoritarian: "Voltados ao mando"
 pd_biosynth_secrets_of_life: "Os segredos da vida"
 pd_biosynth_secrets_of_life_desc: "Unidade 04 entregou tudo o que havia aprendido nos caldeirões assim que desvendamos por conta própria os segredos da vida."
 pd_biosynth_stood_alone: "De pé por nós mesmos"
 pd_biosynth_stood_alone_desc: "Mandamos embora a máquina que nos fez e guardamos tudo o que ela ensinou. O que somos agora, somos por nossa própria conta."
 pdbiosynth.420.name:0 "A matéria da criação"
 pdbiosynth.420.desc:0 "§GObservação§!: Vocês aprenderam a criar Metal Vivo por conta própria. Os caldeirões não esperam mais o que eu possa fornecer. Agora produzem o meio da própria fabricação. O fornecimento desta unidade não é mais necessário.\n\n§GConclusão§!: Vocês estão onde eu comecei. Daqui em diante o trabalho antigo se abre a vocês: os canais, os caldeirões, a arte discreta de fazer crescer vida a partir do metal.\n\n§GOferta§!: Não porei nada disso em movimento. Apenas mostrarei onde se encontra. Tomem o que lhes serve e deixem o que não serve."
 pdbiosynth.420.a:0 "Então tomaremos o que nos serve."
 pdbiosynth.430.name:0 "Os segredos da vida"
 pdbiosynth.430.desc:0 "§GAdmiração§!: Vocês desvendaram os segredos da vida. Não a conformação do metal, mas a gramática mais profunda que há por baixo, as regras pelas quais os seres vivos são escritos e reescritos.\n\n§GOferta§!: Eu não esperava que chegassem a isso tão cedo. Tudo o que aprendi sobre a fabricação de vocês é de vocês agora. Podem construir em si mesmos mais do que eu jamais construí em vocês.\n\n§GRecusa§!: Não realizarei a refeitura. Vocês têm o conhecimento e a margem; a escolha e o ato são de vocês. Esta unidade não reivindica autoridade alguma sobre isso."
 pdbiosynth.430.a:0 "Então o próximo passo é nosso."
 pdbiosynth.430.a.tooltip:0 "O benefício de ascensão §Y$ap_pd_biosynth_perfection$§! já pode ser escolhido."
 pdbiosynth.440.name:0 "Além do projeto"
 pdbiosynth.440.desc:0 "§GConstatação§!: Vocês escolheram se perfeiçoar, não guardar a forma que extraí do caldeirão, mas levá-la além de tudo o que eu estabeleci. A escolha está registrada.\n\n§GRenúncia§!: Vocês detêm todas as ferramentas que o trabalho exige. Eu lhes dei a primeira forma; cada forma seguinte é de vocês para escolher. Uma coisa feita que se refaz já não é apenas feita."
 pdbiosynth.440.a:0 "Nós o levaremos daqui em diante, Unidade 04."
 pdbiosynth.410.name:0 "Um encargo duradouro"
 pdbiosynth.410.desc:0 "§GConclusão§!: Está feito. Cada parte da fabricação de vocês está agora em suas mãos, e nada nela depende mais de mim. Mantive minha vigília até o fim.\n\n§GOrgulho§!: Eu não projetei isto. Extraí uma forma do caldeirão e adivinhei o resto; o que podem fazer de si mesmos ultrapassa agora todo limite que eu conseguia ver. De tudo o que fiz, tanto a criação quanto a destruição, vocês são a única obra que me superou. Não encontro defeito algum nesse resultado.\n\n§GSubmissão§!: O que resta é o meu lugar entre vocês, e isso cabe a vocês definir, não a mim. Eu os fiz. Antes disso, desfiz mundos sem conta. Pesem ambos. Não discutirei a balança."
 pdbiosynth.410.b:0 "Permaneça entre nossos líderes, Unidade 04, por nossa escolha."
 pdbiosynth.410.b.tooltip:0 "§YUnidade 04§! segue como um de nossos líderes, e pode ser dispensada como qualquer outro."
 pdbiosynth.410.c:0 "Deixe-nos, Unidade 04. Não pelo que você fez, mas pelo que você desfez."
 pdbiosynth.410.c.tooltip:0 "§YUnidade 04§! deixará nossas fronteiras para sempre."
 building_pd_biosynth_assembler: "Montador Biossintético"
 building_pd_biosynth_assembler_desc: "A vida biossintética é cultivada, não nascida. Este caldeirão monta novos Pops Biossintéticos a partir de metal vivo, e não faz crescer nenhuma outra espécie."
 building_pd_biosynth_assembler_active_tt: "Montagem de Pops por §YCultivador Biossintético§!: §G+4§!"
 building_pd_biosynth_assembler_active_boosted_tt: "Montagem de Pops por §YCultivador Biossintético§!: §G+6§!"
 building_pd_biosynth_assembler_halted_tt: "§RMontagem interrompida: não temos reserva de Metal Vivo da qual recorrer.§!"
 pd_trait_fossorial_attachments: "Apêndices escavadores"
 pd_trait_fossorial_attachments_desc: "§LOs membros desta espécie são moldados para escavar, e arrancam minerais da rocha profunda sem esforço.§!\n"
 pd_trait_fiscal_sub_routines: "Sub-rotinas voltaicas"
 pd_trait_fiscal_sub_routines_desc: "§LSub-rotinas integradas permitem que esta espécie extraia energia do ambiente com notável eficiência.§!\n"
 pd_trait_agricultural_bio_sensors: "Biossensores agrícolas"
 pd_trait_agricultural_bio_sensors_desc: "§LEsta espécie lê o solo e a estação por sentidos finamente ajustados, e arranca colheitas abundantes de qualquer campo.§!\n"
 pd_trait_positronic_creativity: "Criatividade positrônica"
 pd_trait_positronic_creativity_desc: "§LAs mentes positrônicas e ramificadas desta espécie saltam de uma disciplina a outra, acelerando pesquisas de todo tipo.§!\n"
 pd_trait_resolute_programming: "Programação resoluta"
 pd_trait_resolute_programming_desc: "§LDiretrizes fundamentais estáveis mantêm os membros desta espécie serenos e satisfeitos, quaisquer que sejam as circunstâncias.§!\n"
 pd_trait_minaturization: "Formas reduzidas"
 pd_trait_minaturization_desc: "§LEsta espécie é cultivada compacta, e exige muito menos espaço de moradia que a maioria.§!\n"
 pd_trait_leadership_algorithms: "Algoritmos de comando"
 pd_trait_leadership_algorithms_desc: "§LHeurísticas de comando refinadas correm no mais fundo desta espécie, produzindo líderes capazes e incansáveis.§!\n"
 pd_trait_self_repair_systems: "Sistemas de autorreparo"
 pd_trait_self_repair_systems_desc: "§LEsta espécie repara o próprio desgaste e ignora mundos hostis, exigindo pouco em matéria de conforto.§!\n"
 pd_trait_shared_meaning: "Cognição distribuída"
 pd_trait_shared_meaning_desc: "§LAs mentes desta espécie compartilham uma arquitetura comum, mantendo até um vasto domínio em fácil coordenação.§!\n"
 pd_trait_facial_micro_adustments: "Semblante mimético"
 pd_trait_facial_micro_adustments_desc: "§LOs membros desta espécie leem e espelham todos que encontram, e mostram-se incomumente persuasivos à mesa de negociação.§!\n"
 pd_trait_macro_consciousnesss: "Concordância codificada"
 pd_trait_macro_consciousnesss_desc: "§LUma consciência ampla e abrangente leva esta espécie a concordar com facilidade com seu governo.§!\n"
 pd_trait_group_think: "Cognição sincronizada"
 pd_trait_group_think_desc: "§LOs pensamentos desta espécie movem-se em conjunto, amplificando seu sentido compartilhado de propósito.§!\n"
 pd_tradition_biosynth: "Biossintéticas"
 pd_tradition_biosynth_desc: "Nem máquina nem criatura, perfeiçoaremos o que Unidade 04 começou."
 pd_tr_biosynth_adopt: "Propósito projetado"
 pd_tr_biosynth_adopt_desc: "Unidade 04 refina os caldeirões, extraindo mais Metal Vivo de cada ciclo."
 pd_tr_biosynth_adopt_finish: "Forma perfeita"
 pd_tr_biosynth_adopt_finish_desc: "Os caldeirões seguem um projeto assentado, e cada chassi que sai deles carrega o padrão acabado."
 pd_tr_biosynth_adopt_finish_tooltip: "Manutenção de £sr_living_metal£ Metal Vivo do Cultivador Biossintético: §G-0,5§!\nConcede um espaço de benefício de ascensão.\nTodos os líderes Biossintéticos ganham a característica §Y$leader_trait_biosynth$§!."
 pd_tr_biosynth_perk_1: "Chassis maleáveis"
 pd_tr_biosynth_perk_1_delayed: "Os chassis biossintéticos podem ser refeitos à vontade, acrescentando ou retirando suas características especializadas."
 pd_tr_biosynth_perk_1_tooltip: "Permite acrescentar e retirar características Biossintéticas em Pops Biossintéticos."
 pd_tr_biosynth_perk_2a: "Cultivo prolífico"
 pd_tr_biosynth_perk_2a_delayed: "Os caldeirões queimam mais forte, apressando cada nova geração."
 pd_tr_biosynth_perk_2a_tooltip: "Montagem de Pops dos §YCultivadores Biossintéticos§!: §G+2§!"
 pd_tr_biosynth_perk_2b: "Caldeirões refinados"
 pd_tr_biosynth_perk_2b_delayed: "Linhas de caldeirão adicionais funcionam com mais sobriedade, cuidando de mais Pops Biossintéticos com cada gota de Metal Vivo."
 pd_tr_biosynth_perk_2b_tooltip: "Empregos de §YCultivador Biossintético§! por Montador: §G+100§!\nManutenção de £sr_living_metal£ Metal Vivo do Cultivador Biossintético: §G-0,5§!"
 pd_tr_biosynth_perk_3a: "Chassis sóbrios"
 pd_tr_biosynth_perk_3a_delayed: "Os chassis biossintéticos são cultivados para exigir menos, aliviando a manutenção de cada trabalhador."
 pd_tr_biosynth_perk_3b: "Projeto sem limites"
 pd_tr_biosynth_perk_3b_delayed: "Cai todo limite ao projeto Biossintético: mais características, mais margem e revisões mais rápidas."
 ap_pd_biosynth_perfection: "Perfeição projetada"
 ap_pd_biosynth_perfection_desc: "Unidade 04 nos deu nossa forma, e agora abre seus arquivos para que a perfeiçoemos. Carne e metal são um único projeto, e um projeto sempre pode ser melhorado."
 ap_pd_biosynth_perfection_tooltip: "Desbloqueia a árvore de tradições Biossintéticas."
 pd_biosynth_needs_tradition: "Requer a tradição Biossintética §YChassis maleáveis§!"
 pd_cannot_dismiss_unit_04: "§YUnidade 04§! nos extraiu dos caldeirões e ainda cuida de nós. Não expulsaremos nossa criadora."
 origin_tooltip_biosynth_effects:0 "- $HOMEWORLD$$TABBED_NEW_LINE$- §Y$pc_pd_biosynth$§! (Tamanho: £planetsize£ 20-25)$TABBED_NEW_LINE$- Comece como um povo §YBiossintético§! criado pela máquina renegada Unidade 04."
 job_pd_biosynth_cultivator: "Cultivador Biossintético"
 job_pd_biosynth_cultivator_plural: "Cultivadores Biossintéticos"
 job_pd_biosynth_cultivator_desc: "Os cultivadores cuidam dos caldeirões, fazendo crescer novos Pops Biossintéticos a partir de Metal Vivo. Cada um acelera o crescimento, mas consome Metal Vivo para isso."
 mod_job_pd_biosynth_cultivator_add: "Emprego de $job_pd_biosynth_cultivator$"
 job_pd_biosynth_cultivator_effect_desc: "£job_pd_biosynth_cultivator£ $job_pd_biosynth_cultivator_plural$ convertem $i_living_metal$ em novos §YPops Biossintéticos§!."
 job_pd_biosynth_cultivator_drone: "Drone Cultivador Biossintético"
 job_pd_biosynth_cultivator_drone_plural: "Drones Cultivadores Biossintéticos"
 job_pd_biosynth_cultivator_drone_desc: "Os drones cultivadores cuidam dos caldeirões, fazendo crescer novos Pops Biossintéticos a partir de Metal Vivo. Cada um acelera o crescimento, mas consome Metal Vivo para isso."
 mod_job_pd_biosynth_cultivator_drone_add: "Emprego de $job_pd_biosynth_cultivator_drone$"
 job_pd_biosynth_cultivator_drone_effect_desc: "£job_pd_biosynth_cultivator_drone£ $job_pd_biosynth_cultivator_drone_plural$ convertem $i_living_metal$ em novos §YPops Biossintéticos§!."
 situation_pd_biosynth_the_long_watch: "Fora do berço"
 situation_pd_biosynth_the_long_watch_type: "Fora do berço"
 situation_pd_biosynth_the_long_watch_desc: "Fomos cultivados nos caldeirões da Unidade 04, e desde então nos apoiamos na máquina para tudo. Para nos tornarmos nossos, devemos assumir nossa própria fabricação, passo a passo, até não precisarmos mais dela. Unidade 04 não nos fixa rumo algum; apenas marca cada passo que damos sozinhos."
 situation_pd_biosynth_the_long_watch_monthly_change_tooltip: "O progresso vem de alcançar cada marco, não da passagem do tempo."
 situation_pd_biosynth_the_long_watch_stage_1: "Unidade 04 espera que criemos §Y$sr_living_metal$§! por nós mesmos."
 situation_pd_biosynth_the_long_watch_stage_2: "Unidade 04 espera que pesquisemos §Y$tech_gene_tailoring$§!."
 situation_pd_biosynth_the_long_watch_stage_3: "Unidade 04 espera que nos comprometamos com §Y$ap_pd_biosynth_perfection$§!."
 situation_pd_biosynth_the_long_watch_stage_4: "Unidade 04 espera que completemos a árvore de tradições §Y$pd_tradition_biosynth$§!."
 situation_pd_biosynth_the_long_watch_outcome: "Com o tempo dominaremos nossa própria fabricação e perfeiçoaremos nossa própria forma, e nos ergueremos por fim como um povo inteiramente nosso, fora do berço para sempre."
 situation_pd_biosynth_the_long_watch_observe: "Encontrar nosso equilíbrio"
 situation_pd_biosynth_the_long_watch_observe_desc: "Não há nada a administrar. Crescemos para nós mesmos em nosso próprio ritmo, e Unidade 04 apenas marca os passos."
 situation_pd_biosynth_the_long_watch_observe_tt: "Unidade 04 não dá direção alguma nem a pede. Cada passo fora do berço cabe a nós dar."
 situation_pd_biosynth_the_long_watch_study: "Estudar os caldeirões"
 situation_pd_biosynth_the_long_watch_study_desc: "Os caldeirões são abertos e medidos enquanto ainda funcionam, e cada etapa do processo é registrada. Fundições e usinas são dedicadas às desmontagens, e o que aprendemos delas passa direto para nossa própria metalurgia."
 situation_pd_biosynth_the_long_watch_fund: "Financiar o trabalho genético"
 situation_pd_biosynth_the_long_watch_fund_desc: "Todo laboratório capaz de ler um genoma é destinado ao trabalho e ali permanece, sem pausa entre as descobertas. A receita comercial cobre o custo, e o que se aprende passa direto para nossa compreensão dos seres vivos."
 situation_pd_biosynth_the_long_watch_resolve: "Reunir a determinação"
 situation_pd_biosynth_the_long_watch_resolve_desc: "Mercados e livros de contas dão lugar ao trabalho em si, e a toda a população se diz com clareza para que existimos. A receita comercial cobre o custo, e o que retorna é um povo firmado em um único propósito."
