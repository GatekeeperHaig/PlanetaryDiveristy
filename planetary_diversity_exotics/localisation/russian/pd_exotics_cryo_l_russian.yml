 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Нагнать криоатмосферу"
 decision_pd_exotic_domed_add_atmosphere_desc: "Заполнить подходящей для жизнедеятельности криофилов атмосферой, с учётом их предпочтений в газовой смеси. Купольная колония станет пригодной лишь для видов с соответствующим признаком."
 decision_pd_exotic_domed_remove_atmosphere: "Сбросить криоатмосферу"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Удаление любых следов криоатмосферы из систем жизнеобеспечения и её замена на стандартную азотно-кислородную смесь. Купольная колония станет непригодной для криофилов."

 tankbound_species_class_requirement: "Вид имеет портрет, связанный с признаком  ['trait:trait_tankbound']:\n$t$$BULLET_POINT$§Y$AQUATIC$§!\n$t$$BULLET_POINT$§Y$CRYO$§!\n$t$$BULLET_POINT$§Y$INF$§!\n$t$$BULLET_POINT$§Y$NECROID$§!\n$t$$BULLET_POINT$§Y$TOX$§!"
 CRYO: "Криофил"
 CRYO_desc: "Фенотип не влияет на государство, но другие криофилы могут счесть нас менее чуждыми по сравнению с другими фенотипами."
 climate_cryogenic: "Ультрахолодный"
 cryogenic: "§B(Ультрахолодный климат)§!"
 pc_pd_methane: "Метановый мир"
 pc_pd_methane_desc: "Крайне холодный, каменистый мир с плотной азотно-метановой атмосферой. Поверхность покрывают моря из жидкого метана и этана, а постоянная углеводородная дымка окрашивает небо в оранжевый цвет. Местная жизнь основана на углеводородной биохимии."
 pc_pd_ammonia: "Аммиачный мир"
 pc_pd_ammonia_desc: "Холодный, каменистый мир с плотной азотно-аммиачной атмосферой. Большую часть поверхности покрывает океан жидкого аммиака, на полюсах присутствуют постоянные ледники из аммиачной воды. Местная жизнь основана на аммиачной биохимии."
 pc_pd_nitrogen: "Азотный мир"
 pc_pd_nitrogen_desc: "Крайне холодный, каменистый мир с разреженной азотной атмосферой. В низинах разливаются моря жидкого азота, а из трещин в ледяной коре бьют азотные гейзеры. Местная жизнь основана на азотной биохимии."
 pd_ammonia: "Аммиачный мир"
 pd_ammonia_desc: "Поверхность планеты покрыта океанами жидкого аммиака, окутанными плотной азотно-аммиачной атмосферой, а большое количество связанного азота поддерживает жизнеспособную биосферу на основе аммиака. Так как аммиак разъедает большинство металлов, поддержание инфраструктуры требует дополнительных усилий."
 pd_methane: "Метановый мир"
 pd_methane_desc: "Эта крайне холодная планета покрыта плотной азотно-метановой атмосферой, под которой простираются бескрайние моря жидкого метана и этана - огромные резервуары природного топлива. Из-за высокой концентрации горючих газов постройки следует возводить устойчивыми к взрывам и возгораниям."
 pd_nitrogen: "Азотный мир"
 pd_nitrogen_desc: "Эта крайне холодная планета покрыта разреженной азотной атмосферой, под которой простираются моря жидкого азота; под пластами льда залегают плотные слои нитратов и минералов. Экстремально низкие температуры окружающей среды позволяют свободно использовать сверхпроводники, однако все остальные структуры придётся постоянно отапливать."
 trait_cryophile: "Криофил"
 trait_cryophile_desc: "Эти существа обладают медленным, низкотемпературным метаболизмом, требующим соединения экзотических гидридов с обычной органикой. Они живут в разы дольше высокотемпературных видов, но при этом настолько же медлительны в выполнении задач."
 TRAIT_CRYOPHILE_EFFECT: "$r_exotic_gases$ на содержание за каждые $pop_group_unit$ £pop£ поселений: §R+0.05§!"
 trait_pc_pd_methane_preference: "Предпочтение метановых миров"
 trait_pc_pd_methane_preference_desc: "Этот вид развился в условиях крайне низких температур, среди морей из жидкого метана. Его биохимия так же основана на этом углеводороде."
 trait_pc_pd_ammonia_preference: "Предпочтение аммиачных миров"
 trait_pc_pd_ammonia_preference_desc: "Этот вид развился в условиях низких температур, среди плотных аммиачных облаков. Его биохимия так же основана на аммиаке и его соединениях."
 trait_pc_pd_nitrogen_preference: "Предпочтение азотных миров"
 trait_pc_pd_nitrogen_preference_desc: "Этот вид развился в условиях крайне низких температур, среди морей жидкого азота и криовулканов. Его биохимия так же основана на жидком азоте."
 mod_pc_pd_methane_habitability: "Приспособленность к метановым мирам"
 mod_pc_pd_ammonia_habitability: "Приспособленность к аммиачным мирам"
 mod_pc_pd_nitrogen_habitability: "Приспособленность к азотным мирам"
 pd_ammonia_atmosphere:0 "Аммиачная атмосфера"
 pd_ammonia_atmosphere_desc:0 "Состоит преимущественно из азота и газообразного аммиака в условиях низких температур. Присутствуют следы метанола и замёрзших частиц углеводородов."
 pd_methane_atmosphere:0 "Метановая атмосфера"
 pd_methane_atmosphere_desc:0 "Состоит преимущественно из азота, метана и этана в условиях крайне низких температур. Рассеянные частицы толина придают местному воздуху характерный оранжевый оттенок."
 pd_nitrogen_atmosphere:0 "Азотная атмосфера"
 pd_nitrogen_atmosphere_desc:0 "Тонкий слой молекулярного азота в условиях экстремально низких температур. Рассеянные частицы льда и следы неона придают неплотному воздуху бледно-голубой оттенок."
 START_SCREEN_PART_ONE_PD_METHANE: "Тысячи лет, что прошли с той поры, как в лагунах метановых морей [GetHomeWorldName] возникли первые общины [GetSpeciesName], наша цивилизация развивалась и процветала."
 START_SCREEN_PART_ONE_PD_AMMONIA: "Тысячи лет, что прошли с той поры, как среди облаков аммиака [GetHomeWorldName] возникли первые общины [GetSpeciesName], наша цивилизация развивалась и процветала."
 START_SCREEN_PART_ONE_PD_NITROGEN: "Тысячи лет, что прошли с той поры, как в лагунах азотных морей [GetHomeWorldName] возникли первые общины [GetSpeciesName], наша цивилизация развивалась и процветала."
 d_pd_ammonia_lightning_storms: "Азотные грозовые фронты"
 d_pd_ammonia_lightning_storms_desc: "В местах столкновения скоплений аммиака и азота небо озаряется почти непрерывным каскадом молний. Ток можно черпать прямо из воздуха."
 d_pd_ammonia_thermocline: "Слоистые аммиачные облака"
 d_pd_ammonia_thermocline_desc: "В этой местности атмосфера разделяется на чётко выраженные слои облаков с заметной отличающейся температурой. Этот эффект можно использовать для генерации электроэнергии."
 d_pd_ammonia_salt_dunes: "Дюны из аммиачных солей"
 d_pd_ammonia_salt_dunes_desc: "Всю эту местность покрывают созданные ветром дюны из чистых аммиачных солей. Их можно собрать и переработать для получения полезных ископаемых."
 d_pd_ammonia_brine_caverns: "Проточенные аммиаком пещеры"
 d_pd_ammonia_brine_caverns_desc: "Глубокая сеть пещер, стены которых покрыты глубокими минеральными отложениями, образованными просачивающимся на протяжении веков аммиаком."
 d_pd_ammonia_chemosynthetic_pools: "Озерца жидкого аммиака"
 d_pd_ammonia_chemosynthetic_pools_desc: "Крупные стоячие бассейны из жидкого аммиака, покрытые толстыми микробными матами. Биомасса пригодна в пищу для любых криофилов."
 d_pd_ammonia_organic_haze: "Аммиачный снегопад"
 d_pd_ammonia_organic_haze_desc: "Мягкие хлопья аммиачного снега непрерывным потоком слетают из верхних слоёв облаков, принося с собой съедобную органику."
 d_pd_ammonia_pure_gas_vents: "Амиачно-азотные гейзеры"
 d_pd_ammonia_pure_gas_vents_desc: "Из глубоких разломов выходят струи аммиака и азота, достаточно чистые для прямой их поставки на перерабатывающие заводы."
 d_pd_ammonia_polar_ion_columns: "Полярные джеты"
 d_pd_ammonia_polar_ion_columns_desc: "На полюсах насыщенный аммиаком воздух ионизируется, образуя высокие столпы разрядов, поднимающиеся на сотни километров в небо. Этот феномен можно использовать для получения электроэнергии."
 d_pd_ammonia_cryolite_reefs: "Криолитовые рифы"
 d_pd_ammonia_cryolite_reefs_desc: "Обширные залежи кристаллизованных криолитов на морском дне, образовавшиеся за период порядка геологической эпохи, а также пронизанные редкими минералами и литиевыми рудами."
 d_pd_ammonia_ammoniated_kelp_forests: "Заросли аммиачных водорослей"
 d_pd_ammonia_ammoniated_kelp_forests_desc: "Высокие подводные леса поглощают аммиак прямо из морских вод и превращают его в густую, съедобную биомассу. Лучший урожай, что только можно собрать на замёрзших мирах этого типа."
 d_pd_methane_tholin_storm_belts: "Толиновый штормовой пояс"
 d_pd_methane_tholin_storm_belts_desc: "Ионизированные космическим излучением взвеси толина образуют в верхних слоях атмосферы устойчивые шторма, рассеивая накапливающиеся статические заряды в облачном слое. Это атмосферное электричество можно собирать при помощи башенных громоотводов."
 d_pd_methane_cryovolcanic_vents: "Криовулканические расщелины"
 d_pd_methane_cryovolcanic_vents_desc: "Из трещин в морозный воздух периодически вырываются потоки жидкого метана и аммиачной воды. Температура струй достаточно высока для установки на жерла геотермальных генераторов."
 d_pd_methane_supercooled_geysers: "Криогейзеры"
 d_pd_methane_supercooled_geysers_desc: "Заключённый в подземных полостях под давлением этан периодически выходит на поверхность через разломы в виде высоких струй переохлажденного пара. Отличное место для производства электричества."
 d_pd_methane_carbonate_caverns: "Карбонатные пещеры"
 d_pd_methane_carbonate_caverns_desc: "Древние сети пещер, вымытые в аммиачной породе потоками жидкого метана, покрытые изнутри толстыми слоями карбонатных отложений и сложной органики."
 d_pd_methane_clathrate_shelves: "Метановый шельфовый ледник"
 d_pd_methane_clathrate_shelves_desc: "Местный континентальный шельф покрыт слоями метанового клатратного льда, содержащего в больших количествах металлические руды и кристаллы солей."
 d_pd_methane_ice_diamonds: "Метановые алмазы"
 d_pd_methane_ice_diamonds_desc: "Огромное атмосферное давление сжимает углерод, высвобождённый из метана в ходе химических реакций, до состояния микрокристаллов, оседающих сверкающим дождём на полярных плато."
 d_pd_methane_tholin_haze: "Толиновая дымка"
 d_pd_methane_tholin_haze_desc: "Suspended hydrocarbon aerosols settle out of the sky as a continuous edible precipitate. Surface fauna feed directly on the fallout."
 d_pd_methane_liquid_methane_seas: "Море жидкого метана"
 d_pd_methane_liquid_methane_seas_desc: "Огромное море жидкого метана и этана. Мелководья покрыты толстыми микробными матами. Эта биомасса пригодна в пищу для любых криофилов."
 d_pd_methane_hydrocarbon_marshes: "Углеводородные болота"
 d_pd_methane_hydrocarbon_marshes_desc: "Широкие прибрежные болота, богатые фиксирующей метан флорой. Эта растительность преобразует атмосферные углеводороды в густую съедобную биомассу. Лучший урожай, что только можно собрать на замёрзших мирах этого типа."
 d_pd_methane_pure_gas_vents: "Метан-этановые гейзеры"
 d_pd_methane_pure_gas_vents_desc: "Из глубоких трещин вырываются струи метана и более тяжёлых углеводородов, достаточно чистых для прямой их поставки на перерабатывающие заводы."
 d_pd_nitrogen_geyser_fields: "Поля азотных гейзеров"
 d_pd_nitrogen_geyser_fields_desc: "Обширная равнина, усеянная трещинами, из которых регулярно вырываются сильные струи переохлаждённого пара под давлением. Жерла отлично подходят для установки электрогенераторов."
 d_pd_nitrogen_aurora_curtains: "Полярные сияния"
 d_pd_nitrogen_aurora_curtains_desc: "Солнечный ветер вызывает постоянные полярные сияния в верхних слоях разреженной атмосферы. Местная ионосфера хорошо подходит для производства электроэнергии с помощью заземлённых антенн."
 d_pd_nitrogen_plasma_columns: "Полярные плазменные столпы"
 d_pd_nitrogen_plasma_columns_desc: "На магнитных полюсах ионизированный азот поднимается в виде огромных плазменных столпов высотой в сотни километров. Этот феномен можно использовать для получения электроэнергии."
 d_pd_nitrogen_frost_caverns: "Ледяные пещеры"
 d_pd_nitrogen_frost_caverns_desc: "Глубокая сеть пещер, пронизанных металлорудными жилами, заключёнными в древний азотный лёд. Без предварительного нагрева стен извлечь полезные ископаемые вряд ли получится."
 d_pd_nitrogen_nitrate_flats: "Плато из замёрзших нитратов"
 d_pd_nitrogen_nitrate_flats_desc: "Огромные пласты кристаллов солей азота, оставшиеся на месте высохших древних азотных морей. Залежи залегают достаточно глубоко для обеспечения непрерывной добычи полезных ископаемых."
 d_pd_nitrogen_diamond_rinds: "Алмазное месторождение"
 d_pd_nitrogen_diamond_rinds_desc: "Древний азотный лёд спрессовал атмосферный углерод в толстые алмазные слои вдоль полярных плато. Пласты расположены достаточно близко к поверхности, чтобы вести открытую разработку."
 d_pd_nitrogen_frost_blooms: "Равнины морозных цветов"
 d_pd_nitrogen_frost_blooms_desc: "Ледяные низины клочьями занимют участки местной криофлоры, фиксирующей азот прямо из воздуха. Биомасса этих растений пригодна в пищу."
 d_pd_nitrogen_nitrogen_seas: "Море жидкого азота"
 d_pd_nitrogen_nitrogen_seas_desc: "Огромные моря жидкого азота. Мелководья покрыты толстыми микробными матами. Эта биомасса пригодна в пищу для любых криофилов."
 d_pd_nitrogen_cryoplankton_drifts: "Скопления криопланктона"
 d_pd_nitrogen_cryoplankton_drifts_desc: "Огромные скопления дрейфующего криопланктона перерабатывают жидкий азот в густую съедобную биомассу. Лучший урожай, что только можно собрать на замёрзших мирах этого типа."
 d_pd_nitrogen_pure_gas_vents: "Места выхода чистого азота"
 d_pd_nitrogen_pure_gas_vents_desc: "Из глубоких трещин вырываются струи азота со следами редких газов, достаточно чистых для прямой их поставки на перерабатывающие заводы."
 district_pdexotic_cryo_riftvent: "Разломная электростанция"
 district_pdexotic_cryo_riftvent_plural: "Разломные электростанции"
 district_pdexotic_cryo_riftvent_desc: "Криовулканические жерла периодически выбрасывают переохлаждённый соляной раствор и скопившийся газ. Установленные над ними энерготурбины вырабатывают электричество за счёт большой разницы температур между атмосферой и недрами."
 district_pdexotic_cryo_sublimation: "Сублимационная яма"
 district_pdexotic_cryo_sublimation_plural: "Сублимационные ямы"
 district_pdexotic_cryo_sublimation_desc: "Шахта открытого типа, в которой огромные объёмы летучего льда подвергаются мгновенной сублимации для высвобождения содержащихся в нём металлов и солей. Каждый карьер окутан клубами пара."
 district_pdexotic_cryo_chemovat: "Хемосинтетический сад"
 district_pdexotic_cryo_chemovat_plural: "Хемосинтетический сад"
 district_pdexotic_cryo_chemovat_desc: "Резервуар под давлением, предназначенный для культивации культур местных хемосинтетиков. Организмы связывают атмосферные газы в съедобную биомассу, а в качестве побочного продукта выделяют редкие газы."
 pdexotic_cryo_chemovat_basic: "Площадка для хемокультурирования"
 pdexotic_cryo_chemovat_basic_desc: "Готовое место для производства: колония хемосинтетиков в естественных условиях, ждущая своего хозяина."
 mod_district_pdexotic_cryo_riftvent_max_add: "Максимум разломных электростанций"
 mod_district_pdexotic_cryo_sublimation_max_add: "Максимум сублимационных ям"
 mod_district_pdexotic_cryo_chemovat_max_add: "Максимум хемосинтетических садов"
 zone_pdexotic_cryo_chemovat_refinement: "Хемокультиватор"
 zone_pdexotic_cryo_chemovat_refinement_desc: "Резервуар под давлением, предназначенный для культивации культур местных хемосинтетиков, связывающих атмосферные газы в съедобную биомассу в промышленных масштабах."
 zone_pdexotic_cryo_chemovat_hydride_synthesis: "Гидридный дистиллятор"
 zone_pdexotic_cryo_chemovat_hydride_synthesis_desc: "Каждый резервуар оснащён дистилляционными колоннами, конденсирующими летучие гидриды в герметичные ёмкости. Увеличение выработки газов снижает производство биомассы."
 zone_unavailable_tech_mine_exotic_gases: "$engineering_research_icon_with_space$$tech_mine_exotic_gases$"
 mod_job_pdexotic_cryo_chemist_add: "Должности «[pdexotic_cryo_chemist.GetName]»"
 mod_job_pdexotic_cryo_chemist_drone_add: "Должности «[pdexotic_cryo_chemist_drone.GetName]»"
 mod_job_pdexotic_cryo_chemist_machine_add: "Должности «[pdexotic_cryo_chemist_machine.GetName]»"
 mod_job_pdexotic_cryo_chemist_automated_workforce_mult: "[pdexotic_cryo_chemist.GetIcon] [pdexotic_cryo_chemist.GetNamePlural] $MOD_PLANET_AUTOMATED_WORKFORCE$"
 job_pdexotic_cryo_chemist: "Хемосадовник"
 job_pdexotic_cryo_chemist_plural: "Хемосадовники"
 job_pdexotic_cryo_chemist_desc: "Хемосадовники следят за резервуарами под давлением, в которых в родной для них атмосфере культивируются организмы-хемосинтетики. Это наполовину сельское хозяйство, наполовину низкотемпературная химия: организмы дают съедобную биомассу, а в качестве побочного продукта выделяют редкие газы."
 job_pdexotic_cryo_chemist_drone: "Дрон-хемосадовник"
 job_pdexotic_cryo_chemist_drone_plural: "Дроны-хемосадовники"
 job_pdexotic_cryo_chemist_drone_desc: "Эти дроны обслуживают герметичные резервуары, направляя выращенную хемосинтетическую биомассу в пищевой поток и собирая скапливающиеся газы на нужды роя."
 job_pdexotic_cryo_chemist_machine: "Единица-хемосадовник"
 job_pdexotic_cryo_chemist_machine_plural: "Единицы-хемосадовники"
 job_pdexotic_cryo_chemist_machine_desc: "Единицы-хемосадовники используют резервуары под давлением для добычи газа, извлекаемого в качестве побочного продукта жизнедеятельности криогенных хемосинтетиков. Биомасса как вторичный продукт производства перенаправляется туда, где она всё ещё необходима."
 job_livestock_cryophile: "$job_livestock$"
 job_livestock_cryophile_plural: "$job_livestock_plural$"
 job_livestock_cryophile_desc: "$job_livestock_desc$"
 tech_pd_cryogenic_terraforming: "Криогенное терраформирование"
 tech_pd_cryogenic_terraforming_desc: "Достижения в криоинженерии и обнаружение экзотических растворителей вывели инженерную геологию на немыслимый ранее уровень. Теперь мы можем преобразовать сверхохлаждённый мир в планету с умеренным климатом."
