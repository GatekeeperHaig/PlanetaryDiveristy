 concept_zone_pd_superhab_lab_desc: "§L$zone_pd_superhab_lab_desc$§!\n\n£building£ $MOD_PLANET_MAX_BUILDINGS_ADD$: §G+3§!\nДолжности[pd_superhab_biosphere_ecologist.GetIcon] «[pd_superhab_biosphere_ecologist.GetName]» за каждый £district£: §G+100§!\n[pd_superhab_biosphere_ecologist.GetIcon] [pd_superhab_biosphere_ecologist.GetNamePlural] производят £society_research£ £food£"
 zone_pd_superhab_farm: "Суперземельная сельхоз-сеть"
 zone_pd_superhab_farm_desc: "Идеальные климатические условия на этой планете позволяют производить продукцию сельского хозяйства в объемах, превышающих обычные."
 concept_zone_pd_superhab_farm: "$zone_pd_superhab_farm$"
