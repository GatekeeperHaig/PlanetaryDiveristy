 NAME_Unit_04: "Unidade 04"
 unit_04_desc: "§YUnidade 04§! destruiu incontáveis mundos, incluindo seu mundo natal. $leader_trait_unit_04$ está agora dedicada a desfazer o dano que causou outrora."
 unit_04_catch_phrase: "Por favor, selecione uma designação útil para esta unidade."
