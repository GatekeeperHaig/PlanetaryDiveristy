 #Nemma World
 pd_nemma: "Мир немм"
 pd_nemma_desc: "Невероятно, но острова на поверхности этой планеты - это колоссальные морские черепахи. Их называют Немма, и они спокойно плавают по океанам, если их не беспокоить."
 #Alpha Centauri
 pd_alpha_centauri: "Хирон"
 pd_alpha_centauri_desc: "Измождённая экстремальной погодой и сейсмической активностью, поверхность планеты всё же не безжизненна и покрыта полями ксеногрибов. Несмотря на угрозы, здесь есть чем поживиться, ведь кора богата на ресурсы, а биосфера приспособленна к недружелюбному климату."

 #Zones
 zone_pd_hive_spawning: "Место размножения"
 zone_pd_hive_spawning_desc: "Область, предназначенная для размножения новых дронов."
 zone_pd_machine_replication: "Зона сборки"
 zone_pd_machine_replication_desc: "Область, предназначенная для сборки новых единиц."

 #Pelagic Planet
 pd_pelagic_planet: "Панталассический мир"
 pd_pelagic_planet_desc: "Эта планета целиком покрыта глобальным океаном, и на его поверхность не пробивается ни единого кусочка земли."
