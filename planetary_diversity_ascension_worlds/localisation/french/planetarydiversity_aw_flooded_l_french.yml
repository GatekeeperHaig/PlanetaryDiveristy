l_french:

#Flooded/Aquatic Planets
 decision_pd_aw_flood_planet: "Étendre l'océan planétaire"
 decision_pd_aw_flood_planet_desc: "Cette planète océanique pourrait devenir un foyer idéal pour notre peuple. En ajustant le niveau des mers et en déplaçant nos villes sous l'eau, nous pouvons assurer l'épanouissement de ceux qui sont adaptés à la vie sous les vagues."
 decision_pd_aw_flood_planet_tooltip: "De la glace sera récoltée dans un système doté d'une §Y$sm_ice_mining_station$§!\nLe modificateur §Y$pd_aw_flooded_planet$§! est ajouté :\n$pd_aw_flooded_planet_tooltip$"
 flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YHabitabilité non aquatique§!: §R-20%§!"
 decision_pd_aw_unflood_planet: "Assécher la planète"
 decision_pd_aw_unflood_planet_desc: "Cette planète océanique pourrait devenir un foyer idéal pour notre peuple. En abaissant le niveau des mers et en déplaçant nos villes sur des îles, nous pouvons assurer l'épanouissement de ceux qui sont adaptés à la vie au-dessus des vagues."
 decision_pd_aw_flood_ringworld: "Inonder l'anneau-monde"
 decision_pd_aw_flood_ringworld_desc: "Cet anneau-monde pourrait devenir un foyer idéal pour notre peuple. En ajustant le niveau des mers et en déplaçant nos villes sous l'eau, nous pouvons assurer l'épanouissement de ceux qui sont adaptés à la vie sous les vagues."
 decision_pd_aw_unflood_ringworld: "Assécher l'anneau-monde"
 decision_pd_aw_unflood_ringworld_desc: "Cet anneau-monde pourrait devenir un foyer idéal pour notre peuple. En abaissant le niveau des mers et en ramenant nos villes sur la terre ferme, nous pouvons assurer l'épanouissement de ceux qui sont adaptés à la vie au-dessus des vagues."
 decision_pd_aw_unflood_habitat: "Assécher l'habitat"
 decision_pd_aw_unflood_habitat_desc: "Cet habitat pourrait devenir un foyer idéal pour notre peuple. En le drainant, nous pouvons assurer l'épanouissement de ceux qui sont adaptés à la vie au-dessus des vagues."
 decision_pd_aw_flood_habitat_tooltip: "Habitabilité : §R-20%§!\nConsidéré comme un monde §Yocéanique§! pour les espèces §Yaquatiques§!.\nDe la glace sera récoltée dans un système doté d'une §Y$sm_ice_mining_station$§! sur la base stellaire."
 ap_hydrocentric_tooltip:3 "Permet la construction de §Ystations de minage de glace§! sur les bases stellaires, donnant accès aux décisions suivantes :\n    - §Y$decision_pd_aw_flood_planet$§!: §Y$pc_ocean$§!, §Y$pc_gaia$§!, §Y$pc_hive$§!, §Y$pc_machine$§!, §Y$pc_relic$§!, §Y$pc_city$§!\n    - §Y$decision_flood_habitat$§!: §Y$pc_habitat$§!\n    - §Y$decision_pd_aw_flood_ringworld$§!: §Y$pc_ringworld_habitable$§!\n§RAucune autre classe de planète ne peut être inondée.§!\nLes espèces ayant le trait §Y$trait_aquatic$§! ou §Y$trait_robot_aquatic$§! tirent 50% de bénéfices supplémentaires lorsqu'elles vivent sur les mondes §Yocéaniques§!, mais les pénalités liées aux mondes §Ynon humides§! sont elles aussi majorées."

 flooded_habitat: "Inondé"
 flooded_habitat_desc: "Submergé par les eaux, ce monde offre un environnement idyllique à ses habitants aquatiques."
 pd_aw_flooded_planet_tooltip: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+3§!\n$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!\n§YHabitabilité non aquatique§!: §R-20%§!\n$MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$: §G-10%§!"

 pd_aw_flooded_planet: "Monde inondé"
 pd_aw_flooded_planet_desc: "Cette planète océanique est un foyer idéal pour les espèces aquatiques. La vie y prospère pour ceux qui sont adaptés à vivre sous les vagues."
 pd_aw_flooded_habitat: "Habitat inondé"
 pd_aw_flooded_habitat_desc: "Cet habitat a été rempli d'eau, imitant l'environnement naturel des créatures aquatiques."

 ICE_MINING_PLANET_SUCCESS_TITLE: "Planète inondée"
 ICE_MINING_PLANET_SUCCESS_DESC: "Grâce à la glace extraite dans le système $SYSTEM|Y$, nous avons réussi à inonder §Y[This.GetName]§!."

 ocean_paradise_2: "$ocean_paradise$"
 ocean_paradise_2_desc: "$ocean_paradise_desc$"
 ocean_paradise_hive_2: "$ocean_paradise_hive$"
 ocean_paradise_hive_2_desc: "$ocean_paradise_hive_desc$"

 #Pelagic Planet
 pd_pelagic_planet: "Pélagique"
 pd_pelagic_planet_desc: "Cette planète est entièrement recouverte par un océan global, sans aucune terre émergée."