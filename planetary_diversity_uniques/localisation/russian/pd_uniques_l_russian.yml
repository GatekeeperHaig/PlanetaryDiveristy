 job_pd_biosynth_engineer_effect_desc: "£job_pd_biosynth_engineer£ $job_pd_biosynth_engineer_plural$ производят £society£ и £engineering£ §Yисследования§!, а также $i_living_metal$ ценой затрат £consumer_goods£ §Yтоваров массового спроса§!."
 job_pd_biosynth_engineer_drone: "Инженерный дрон-биосинтетик"
 job_pd_biosynth_engineer_drone_plural: "Инженерные дроны-биосинтетики"
 job_pd_biosynth_engineer_drone_desc: "Эти особые инженерные дроны, так же разбирающиеся в биосинтетике, следят за тем, чтобы биосинтетические котлы функционировали без сбоев."
 mod_job_pd_biosynth_engineer_drone_add: "Должности «$job_pd_biosynth_engineer_drone$»"
