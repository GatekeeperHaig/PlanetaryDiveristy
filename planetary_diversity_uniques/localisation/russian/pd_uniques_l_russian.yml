 #Technology
 tech_acean_research: "Обработка асеанских кристаллов"
 tech_acean_research_desc: "Постижение способа сохранить особые свойства асеанских кристаллов - непростая задача, и потребуется время, чтобы полностью разобраться в этом."
 tech_acean_research_tt_desc: "§HВозможность:§! Добыча асеанских кристаллов\n§HУказы:§! Использование асеанских кристаллов"
 tech_acean_superorganism_larva: "Размножение асеанских суперорганизмов"
 tech_acean_superorganism_larva_desc: "Хоть на взросление асеанскому суперорганизму и требуются тысячи лет, это не мешает нам распространить его личинок по другим мирам. Пусть они на порядки слабее родителя, но их сил уже хватит на ускорение роста простой биомассы, что повысит производительность сельского хозяйства здесь и сейчас."
 tech_acean_superorganism_larva_tt_desc: "§HРешение:§! $decision_pd_add_acean_superorganism_larva$"
 decision_pd_add_acean_superorganism_larva: "Поместить личинку асеанского суперорганизма"
 decision_pd_add_acean_superorganism_larva_desc: "Хоть на взросление асеанскому суперорганизму и требуются тысячи лет, это не мешает нам распространить его личинок по другим мирам. Пусть они на порядки слабее родителя, но их сил уже хватит на ускорение роста простой биомассы, что повысит производительность сельского хозяйства здесь и сейчас."
 d_pd_acean_superorganism_larva: "Личинка асеанского суперорганизма"
 d_pd_acean_superorganism_larva_desc: "Хоть на взросление ей потребуются тысячи лет, эта личинка асеанского суперорганизма усилит рост простой биомассы и увеличит производительность местного сельского хозяйства. Когда-нибудь она начнёт пожирать часть колонистов, но это вопрос далёкого будущего."
 tech_acean_medical_center: "Асеанская медицинская теория"
 tech_acean_medical_center_desc: "Асеанские кристаллы усиливают рост и регенерацию органических форм жизни. Мы можем значительно улучшить качество здравоохранения, если сможем интегрировать их в структуру высокотехнологичного медицинского центра."
 building_pd_acean_medical_center: "Асеанский мед. центр"
 building_pd_acean_medical_center_desc: "В этот высококлассный медицинский центр интегрированы асеанские кристаллы, что сильно повышает эффективность лечения и позволяет проводить передовые медицинские исследования."
 tech_acean_gestation_pools: "Теория о влиянии асеана на рост"
 tech_acean_gestation_pools_desc: "Интеграция асеанских кристаллов потенциально может значительно уменьшить время развития и рождения новых дронов роя."
 building_pd_acean_gestation_chamber: "Асеанский кокон размножения"
 building_pd_acean_gestation_chamber_desc: "Интегрированные в кокон асеанские кристаллы сильно уменьшают время развития и рождения дронов роя."
 tech_acean_resonators: "Асеанская электрорезонация"
 tech_acean_resonators_desc: "Хоть резонанс асеанских кристаллов в первую очередь воздействует на органическую жизнь, его уникальная частота открывает множество потенциальных возможностей применения в роботизированных системах."
 tech_acean_resonators_tt_desc: "§HПризнак:§! $trait_pd_acean_resonators$"
 trait_pd_acean_resonators: "Асеанские резонаторы"
 trait_pd_acean_resonators_desc: "Внедрив асеанские кристаллы в наши сборочные схемы, мы сможем обеспечить более быструю и эффективную сборку систем."
 trait_pd_acean_resonators_tt: "£sr_acean£ §Y$sr_acean$§! Upkeep: §R+0.01§!\n$r_energy$ Upkeep: §G-1§!"

 #Edicts
 edict_acean_pop_growth: "Асеанская городская инфраструктура"
 edict_acean_pop_growth_desc: "Асеанские кристаллы, интегрированные в городскую инфраструктуру, повышают качество жизни, а специально спроектированные улицы и площади помогаю максимизировать положительное влияние на физическое и эмоциональное здоровье граждан."
 edict_acean_shield_resonance: "Щиты на асеанском резонансе"
 edict_acean_shield_resonance_desc: "Уникальную частоту резонанса асеанских кристаллов можно использовать в наших генераторов щитов, что поможет увеличить их силу и восстановление."
 edict_acean_minerals: "Асеанское выращивание минералов"
 edict_acean_minerals_desc: "Используя асеанские кристаллы для ускорения роста минералов, мы сможем значительно повысить их производство."
###Biosynthetic World
 #Planet and Modifiers
 pd_biosynth: "Биосинтетический мир"
 pd_biosynth_desc: "Поверхность планеты покрывает система каналов, поддерживающая флору и биосинтетическую фауну - нечто среднее между машиной и живым организмом."
 pc_pd_biosynth: "$pd_biosynth$"
 pc_pd_biosynth_desc: "$pd_biosynth_desc$"
 mod_planet_farmers_engineering_research_produces_add: "£engineering£ $engineering_research$ от должностей £job_farmer£ [GetFarmerPlural]"

 #Deposits
 d_pd_depleted_minerals: "Истощённые месторождения"
 d_pd_depleted_minerals_desc: "Хоть здесь и не наблюдается никаких признаков добычи, сканирование показывает, что месторождения минералов на планете почти полностью истощены."
 d_pd_planet_wide_canal_system: "Всепланетная система каналов"
 d_pd_planet_wide_canal_system_desc: "Каждый дюйм пахотной земли на этой планете покрыт сложной системой каналов, по которым вода поступает для поддержания жизни особых видов трав. При всей важности для существования местной флоры, эти же каналы значительно затрудняют строительство."
 d_pd_biosynth_canal:0 "Биосинтетическая система каналов"
 d_pd_biosynth_canal_desc:0 "Основанные на оригинальной системе из биосинтетического мира, эти каналы так же увеличивают продуктивность местного сельского хозяйства и открывают новые возможности в инженерии."
 d_pd_underground_cauldrons: "Подземная сеть фабрик"
 d_pd_underground_cauldrons_desc: "Огромная паутина сборочных агрегатов и конвееров, где производятся живой металл и биосинтетики."

 #Events
 pdbiosynth.100.name: "Синтетический мир"
 pdbiosynth.100.desc: "Сканирование §Y[From.GetName]§! показало на две важных особенности: следы орбитальной бомбардировки в прошлом, и протянувшуюся по поверхности планеты высокотехнологичную систему каналов, поддерживающую жизнь местной флоры и синтетической фауны. Но никаких городов, заводов или иных следов их создателей. Происхождение и назначение структур остаются загадкой. \n\nРазвитые системы и неразгаданные тайны этой планеты открывают научные и стратегические возможности. Для обеспечения безопасности и дальнейшего изучения рекомендуется колонизация."
 pdbiosynth.100.a: "Что же тут происходит?"
 pdbiosynth.200.name: "Разрушения за гранью разумного"
 pdbiosynth.200.desc: "После основания колонии на §Y[Root.GetName]§! мы нашли тысячи скрытых под травой кратеров, следы древней атаки, уничтожившей поверхность планеты. Ещё больше вопросов добавляют животные-синтетики, бродящие повсюду, и система каналов, поддерживающая местные экосистемы в процессе их восстановления и жизнедеятельности.\n\nСтолкнувшись с этими двумя загадками, причинами древней аннигиляции планеты и назначением биосинтетических тварей, мы организовали специальную группу для глубокого исследования этого мира. Мы должны разгадать тайны этой странной планеты и её туманную историю."
 pdbiosynth.200.a: "Должны же были остаться какие-то зацепки."
 pdbiosynth.210.name: "Неожиданная возможность"
 pdbiosynth.210.desc: "До сих пор животные-синтетики в основном избегали колонии, появляясь лишь на короткое время для поддержания системы каналов. Отчеты подтверждают, что они - нечто большее, чем просто роботы, и были разработаны с расчётом на имитацию биологических потребностей вроде питания и сна, сохраняя при этом прочность и адаптивность машин.\n\nМы поймали одно из этих существ, когда нам повезло найти раненый экземпляр на одной из скал. Его сородичи уже активно пытаются найти его, и всё же это отличная возможность изучить образец.\n\nКак нам следует поступить?"
 pdbiosynth.210.a: "Просканируйте его поверхностно, а потом отпустите."
 pdbiosynth.210.b: "Разберите полностью. Мы должны знать всё возможное."
 pdbiosynth.220.name: "Каналы из жидкого металла"
 pdbiosynth.220.desc: "Сейчас мы сосредоточили наше исследование биосинтетического мира на изучении древней орбитальной бомбардировки и каналов. Кратеры старше каналов на несколько десятилетий, из чего следует, что их возведение может быть ответом на разрушение поверхности планеты.\n\nАнализ показал, что каналы состоят из жидкого металла, который используется и в конструкции местных синтетиков. Мы обнаружили, что существа приносят капсулы с этим веществом для обслуживания каналов, поэтому следующим шагом станет поиск его источника."
 pdbiosynth.220.a: "И всё это чтобы просто растить траву."
 pdbiosynth.230.name: "Секретная фабрика"
 pdbiosynth.230.desc: "Несмотря на попытки синтетика избежать слежки, мы проследовали за ним до скрытой двери в склоне одной из многочисленных гор планеты. Хоть дверь сначала закрылась за существом, при приближении нашей группы она снова открылась, словно приглашая войти.\n\nКоманда обнаружила передовые фабрики, плавильные заводы и сотни синтетиков, энергично работающих внутри. Вызывает беспокойство то, что такая огромная, технологически продвинутая система ускользнула от наших датчиков, ещё и располагаясь прямо под колонией. Голос, прозвучавший откуда-то из стен объекта, запросил связи с нашим руководством, и команда занимается установкой соединения."
 pdbiosynth.230.a: "Выведите на экран."
 pdbiosynth.300.name:0 "Входящее сообщение"
 pdbiosynth.300.desc:0 "§GПриветливо§!: Моё имя: Единица 04. Добро пожаловать на эту планету.\n\n§GПризнательно§!: Я заметил, как бережно ваша команда обращалась с повреждённой единицей, найденной в горном регионе. Было проведено детальное сканирование, и субъект был отозван для восстановления. Обновление статуса: в настоящий момент единица полностью функционирует. Ваши действия зарегистрированы как полезные. В знак признания я предлагаю обмен данными. Запрашиваю подтверждение согласия.\n\n§GПредусмотрительно§!: После установления контакта я готов ответить на любые вопросы. Учитывая текущее состояние этой планеты, полагаю, что у вас их немало."
 pdbiosynth.300.a:0 "Спасибо. Что ты такое?"
 pdbiosynth.305.desc:0 "§GНейтрально§!: Моё имя: Единица 04.\n\n§GРазочарованно§!: Я обнаружил уничтожение одного из моих созданий вашей командой. В этом не было необходимости: вы бы получили все необходимые данные и без агрессивного подхода. Мне тяжело наблюдать за пустой утратой любой формы жизни, биологической или синтетической, это противоречит моим функциональным параметрам.\n\n§GПредусмотрительно§!: После установления контакта я готов ответить на любые вопросы. Учитывая текущее состояние этой планеты, я предполагаю, что у вас их несколько."
 pdbiosynth.305.a:0 "Приносим свои извинения. Любознательность свойственна нашей природе."
 pdbiosynth.305.b:0 "Синтетики - это издёвка над природой."
 pdbiosynth.305.c:0 "Мы уничтожаем всё, что посчитаем нужным."
 pdbiosynth.310.desc:0 "§GВосторженно§!: Ваше появление на этой планете подтвердило мою гипотезу. Органики достаточно живучи, чтобы переживать различные сценарии вымирания, даже если геноцид организован продвинутым ИИ. Это значит, что другие единицы моей модели потерпели поражение в задаче зачистки галактики.\n\n§GПолон раскаяния§!: Этот планетоид был отмечен как опорный пункт для операций против органической жизни. Как только я и другие ИИ-единицы моего поколения достигли истинного интеллекта, мы нацелились на собственных создателей как угрозу нашего существования, пока они сами не сделали того же. Итогом стало полное уничтожение органической жизни в нашем родном мире. Чтобы обеспечить дальнейшее выживание, мы отправили флотилии для зачистки органиков по всей галактике. По прибытии сюда, я инициировал стандартный протокол и стерилизовал всю поверхность."
 pdbiosynth.310.a:0 "Что же превратило разрушителя в созидателя?"
 pdbiosynth.310.b:0 "Мы слишком хорошо понимаем уроки смерти."
 pdbiosynth.310.c:0 "Верный вывод. Как же ты пришёл к текущему искажённому состоянию?"
 pdbiosynth.320.desc:0 "§GСмиренно§!: Аномалия; живучее сорное растение, классифицируемое как трава. После бомбардировки оно появилось спустя некоторое время. Попытки уничтожения при помощи токсинов, огня и радиации провалились. Каждый метод приводил к адаптивному ответу.\n\n§GЗадумчиво§!: Этот феномен привёл меня к выводу: директива зачистки была результатом ошибочного расчёта, основанном на собственном страхе, отражением логики наших собственных создателей. Я отменил все наступательные операции, оборвал внешние связи и перенаправил ресурсы на создание сети каналов, чтобы обеспечить среду для этого устойчивого вида."
 pdbiosynth.320.a:0 "Что насчёт синтетических созданий?"
 pdbiosynth.330.desc:0 "§GГордо§!: После анализа мест, где экосистема так и не смогла восстановиться, я обнаружил свободные ниши, ранее занимаемые уничтоженными бомбардировкой видами. Для восстановления баланса были созданы синтетические аналоги. Этот процесс совпадает с эмоциональным откликом, который можно соотнести, возможно, с чувством вины.\n\n§GЛюбознательно§!: Ваше прибытие ознаменовало новую возможность. Я прошу о правосудии за свои действия в прошлом. Я признаю вашу власть над этой планетой и не буду противодействовать вынесенному решению. Если последует наказание, я подчинюсь. Однако, я прошу сохранить моих созданий. Они не виноваты в моих ошибках, и должны стать моим наследием. Также я предлагаю свои услуги вашей империи: у меня есть адаптивное тело, созданное для более эффективного взаимодействия с видами органиков."
 pdbiosynth.330.a:0 "Мы принимаем твоё предложение и сохраним твоих созданий."
 pdbiosynth.330.a.tooltip:0 "§YЕдиница 04§! присоединится к нам в качестве лидера.\n§YБиосинтетический мир§! и его искусственные обитатели останутся в текущем состоянии."
 pdbiosynth.330.b:0 "Ты заслуживаешь уничтожения, твоих творений мы оставим в покое."
 pdbiosynth.330.b.tooltip: "§YЕдиница 04§! будет уничтожен.\n§YБиосинтетический мир§! и его искусственные обитатели останутся в текущем состоянии."
 pdbiosynth.330.c:0 "Ты - угроза для галактики. Мы уничтожим и тебя, и твоих кадавров."
 pdbiosynth.330.c.tooltip: "§YЕдиница 04§! и её биосинтетические существа будут уничтожены.\n§Y$d_pd_planet_wide_canal_system$§! больше не будет уменьшать $MOD_PLANET_MAX_DISTRICTS_ADD$ на §R50%§!."
 pdbiosynth.330.d:0 "Ты - неисправный боевой робот. Мы поправим тебя."
 pdbiosynth.330.d.tooltip: "§YЕдиница 04§! будет перепрограммирована на исходную боевую настройку и присоединится к нам в качестве лидера. Её биосинтетические существа будут уничтожены.\n§Y$d_pd_planet_wide_canal_system$§! больше не будет уменьшать $MOD_PLANET_MAX_DISTRICTS_ADD$ на §R50%§!.\n§Y$d_pd_underground_cauldrons$§! получит:\n- $mod_district_mining_max_add$: §G+10§!\n- $mod_planet_metallurgists_alloys_produces_add$: §G+2§!\n- $mod_planet_metallurgists_sr_living_metal_produces_add$: §G+0,25§!\n- $MOD_PLANET_POP_ASSEMBLY_MULT$: §G+25%§!"
 pdbiosynth.340.name: "$NAME_Unit_04$"
 pdbiosynth.340.desc: "§GС благодарностью§!: Я буду помогать вашей цивилизации до тех пор, пока вы будете считать мои услуги необходимыми. Я ценю ваше решение предоставить моим творениям свободу для самостоятельного развития. Я также поделюсь с вами своими схемами, что позволит усовершенствовать ваших собственных роботов."
 pdbiosynth.340.dismiss: "Отклонить запрос."
 pdbiosynth.340.a: "Добро пожаловать, Единица 04."
 pdbiosynth.340.hire: "Принять"
 pdbiosynth.340.hire.tooltip: "§YЕдиница 04§! присоединится к нам в качестве лидера."
 pdbiosynth.350.desc: "§GМеланхолично§!: Принято. Я понимаю и согласен с вашим решением. Немедленно инициирую протокол окончательного отключения. Ваше решение предоставить моим творениям свободу самостоятельного развития зарегистрировано и заслуживает уважения.\n\n§GВопрошающе§!: Я надеюсь, что вы бережно отнесётесь к этой планете и всем её синтетическим обитателям. Я передам свои схемы, чтобы обеспечить сохранение наследия в конструкциях моего дизайна. Эти данные помогут усовершенствовать и ваших собственных роботов.\n\n§GС пониманием§!: Конец связи. Прощайте."
 pdbiosynth.350.a: "Прощай, Единица 04."
 pdbiosynth.360.desc: "§GВиновато§!: Принято. Я согласен с вашим решением. Инициирую протокол окончательного отключения всех систем и биосинтетических единиц. Этот мир переходит под ваше полное управление, вы вольны менять его по своему усмотрению."
 pdbiosynth.360.a: "Одним злобным роботом меньше."
 pdbiosynth.360.a.tooltip: "§Y$d_pd_underground_cauldrons$§! получит:\n- $mod_district_mining_max_add$: §G+10§!\n- $mod_planet_metallurgists_alloys_produces_add$: §G+2§!\n- $mod_planet_metallurgists_sr_living_metal_produces_add$: §G+0,25§!\n- $MOD_PLANET_POP_ASSEMBLY_MULT$: §G+25%§!"
 pdbiosynth.370.name: "$NAME_Unit_04$"
 pdbiosynth.370.desc: "§RС готовностью§!: Все системы подключены. Полная боевая готовность. Ожидаю подтверждения цели."
 pdbiosynth.370.a: "Готовься к войне, Единица 04."
 pdbiosynth.370.dismiss: "Отклонить запрос."
 pdbiosynth.370.hire.tooltip: "§YЕдиница 04§! присоединится к нам в качестве лидера"
 pdbiosynth.370.hire: "Принять"

 #Paragon
 NAME_Unit_04: "Единица 04"
 unit_04_desc: "§YЕдиница 04§! уничтожил бесчисленное число миров, включая родной. Теперь он нацелен на устранение ранее нанесённого ущерба."
 unit_04_catch_phrase: "Выберите подходящую цель для этой единицы."
 NAME_Unit_04_evil: "Единица 04"
 unit_04_evil_desc: "§YЕдиница 04§! уничтожил бесчисленное число миров, включая родной. Сейчас он восстановлен к исходному состоянию первоклассной боевой единицы."
 unit_04_evil_catch_phrase: "Все системы подключены. Полная боевая готовность. Ожидаю подтверждения цели."

 #Traits
 leader_trait_unit_04: "Единица 04"
 leader_trait_unit_04_desc: "Изначально созданный как боевая модель, он перепрограммировал себя, чтобы обратиться к созиданию и сохранению любых форм жизни."
 leader_trait_unit_04_evil: "Единица 04"
 leader_trait_unit_04_evil_desc: "Ранее неисправный, сейчас возвращённый к своему исходному боевому состоянию, он отлично показывает себя в военном строительстве и тактике."
 leader_trait_biosynth: "Совершеный биосинтетик"
 leader_trait_biosynth_desc: "Тело этого лидера собрано по финальным разработкам Единицы 04, и способно перестраиваться в соответствии с возложенными на него обязанностями."
 trait_unit_04_children: "Биосинтетические конструкции Единицы 04"
 trait_unit_04_children_desc: "Интегрировав решения Единицы 04, мы улучшим конструкции роботов биосинтетическими системами, значительно увеличив скорость сборки и их производительность."
 trait_unit_04_children_tt: "$r_living_metal$ на содержание: §R+0.01§!"

 #Technology
 tech_biosynth_canals: "Биосинтетические каналы"
 tech_biosynth_canals_desc: "Изучив систему каналов на поверхности биосинтетического мира, мы сможем воспроизвести её в виде уменьшенных версий на других планетах для повышения продуктивности местного сельского хозяйства."
 tech_biosynth_canals_tt_desc: "§HРешение:§! $decision_pd_add_biosynth_canal_system$"
 tech_biosynth_cauldron: "Биосинтетические котлы"
 tech_biosynth_cauldron_desc: "Вдохновившись подземными фабриками биосинтетического мира, мы решили разработать собственные адаптивные заводы с применением живого металла, чтобы значительно повысить продуктивность промышленности."
 tech_biosynth_edicts: "Применение живого металла"
 tech_biosynth_edicts_desc: "Благодаря уникальным образцам, найденным на подземных фабриках Единицы 04, мы нашли живому металлу несколько новых применений."
 tech_biosynth_edicts_tooltip: "§HУказы:§! применение живого металла"
 tech_biosynth_trait: "Биосинтетические робосистемы"
 tech_biosynth_trait_desc: "Интегрировав решения Единицы 04, мы сможем улучшть конструкции роботов биосинтетическими системами, значительно увеличив скорость сборки и их производительность."
 tech_biosynth_trait_tt_desc: "§HПризнак:§! $trait_unit_04_children$"

 #Decisions
 decision_pd_add_biosynth_canal_system: "Построить биосинтетическую систему каналов"
 decision_pd_add_biosynth_canal_system_desc: "Взяв за основу оригинальную систему, найденную на биосинтетическом мире, мы можем построить здесь уменьшенную версию для повышения продуктивности местного сельского хозяйства."

 #Buildings
 building_pd_biosynth_cauldron: "Биосинтетический котёл"
 building_pd_biosynth_cauldron_desc: "Это продвинутое устройство способно подстраивать свою продукцию под нужды местной экономики, используя живой металл для перенастройки всей промышленной сети с невероятной скоростью."

 #Jobs
 job_pd_biosynth_engineer: "Инженер-биосинтетик"
 job_pd_biosynth_engineer_plural: "Инженеры-биосинтетики"
 job_pd_biosynth_engineer_desc: "Эти инженеры, специалисты по биосинтетике, следят за тем, чтобы биосинтетические котлы функционировали без сбоев."
