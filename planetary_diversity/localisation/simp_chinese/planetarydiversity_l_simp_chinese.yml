 zone_pd_tidally_lab: "生物研究实验室（潮汐锁定星球）"
 zone_pd_tidally_lab_desc: "这颗星球的每一片区域都是一处相当独特的环境，其中的动植物以奇特而新颖的方式发生了分化。"
