 zone_pd_superhab_lab: "Superziemskie laboratoria ewolucyjne"
 zone_pd_superhab_lab_desc: "Choć światy superziemskie nie są idealne dla wszystkich stworzeń, stwarzają doskonałe warunki do ewolucji życia. Częste odkrycia wspierają badania socjologiczne na całej planecie."
