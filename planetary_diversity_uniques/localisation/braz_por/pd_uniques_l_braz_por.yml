 #Edicts
 edict_pd_living_metal_robot_assembly: "Montagem Robótica de Metal Vivo"
 edict_pd_living_metal_robot_assembly_desc: "A integração do Metal Vivo nos processos de produção robótica acelera drasticamente os tempos de construção."
 edict_pd_living_metal_engineering: "Subsídios de Pesquisa de Metal Vivo"
 edict_pd_living_metal_engineering_desc: "Fornecer aos nossos departamentos de pesquisa acesso ao Metal Vivo para estudo acelera significativamente os avanços em engenharia."
 edict_pd_living_metal_ship_repair: "Reparo de Naves com Metal Vivo"
 edict_pd_living_metal_ship_repair_desc: "As propriedades regenerativas do Metal Vivo podem ser aproveitadas para melhorar nossa frota, aumentando significativamente as velocidades de reparo de blindagem e casco."

 #Situation
 situation_pd_biosynth_world: "Explorar o Mundo Biossintético"
 situation_pd_biosynth_world_type: "Explorar o Mundo Biossintético"
 situation_pd_biosynth_world_desc: "Com sinais de destruição, canais avançados e criaturas sintéticas, este planeta esconde uma história que suas imaculadas seções agrícolas ainda não revelaram.\n\nEstamos aprofundando a investigação para descobrir seu misterioso passado."
 situation_pd_biosynth_world_monthly_change_tooltip: "Mudança Mensal"
 situation_pd_biosynth_world_do_nothing: "Foco Colonial"
 situation_pd_biosynth_world_do_nothing_desc: "Deixaremos a administração da busca aos administradores coloniais."
 situation_pd_biosynth_world_extra_funding: "Financiamento Adicional"
 situation_pd_biosynth_world_extra_funding_desc: "Fundos extras nunca atrasaram um projeto."
 situation_pd_biosynth_stage_effects: "Continuaremos explorando este mundo em busca de pistas."

