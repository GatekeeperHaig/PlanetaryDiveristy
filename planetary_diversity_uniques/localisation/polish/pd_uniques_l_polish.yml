 decision_pd_add_biosynth_canal_system_desc: "Możemy zbudować kanały wzorowane na tych ze świata biosyntetycznego, aby zwiększyć produkcję rolną tej planety."

 #Buildings
 building_pd_biosynth_cauldron: "Kocioł biosyntetyczny"
 building_pd_biosynth_cauldron_desc: "Ten zaawansowany zakład dostosowuje produkcję do potrzeb planety, wykorzystując żywy metal do niezwykle szybkiej przebudowy całych systemów fabrycznych."

