 ap_pd_cryothermal_engineering: "Inżynieria kriotermiczna"
 ap_pd_cryothermal_engineering_desc: "Rozwój w warunkach kriogenicznych wymaga zupełnie nowego podejścia do materiałów, biologii i chemii. Przecieramy szlaki w nauce o zimnie."
