 zone_pd_superhab_lab: "Laboratoires d'évolution superhabitables"
 zone_pd_superhab_lab_desc: "Bien que les mondes superhabitables ne soient pas idéaux pour toutes les créatures, ils sont idéaux pour l'évolution de la vie biologique. La fréquence des découvertes améliore la recherche sociétale à l'échelle planétaire."
