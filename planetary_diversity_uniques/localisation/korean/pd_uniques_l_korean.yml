 pd_tr_biosynth_perk_3a: "Lean Frames"
 pd_tr_biosynth_perk_3a_delayed: "Biosynthetic frames are grown to want for less, easing the upkeep of every worker."
 pd_tr_biosynth_perk_3b: "Unbound Design"
 pd_tr_biosynth_perk_3b_delayed: "Every limit on Biosynthetic design falls away: more traits, more room, and swifter revision."
 ap_pd_biosynth_perfection: "Designed Perfection"
 ap_pd_biosynth_perfection_desc: "Unit 04 gave us our form, and now opens its archives so that we might perfect it. Flesh and metal are a single design, and a design can always be improved."
 ap_pd_biosynth_perfection_tooltip: "Unlocks the Biosynthetics tradition tree."
 pd_biosynth_needs_tradition: "Requires the §YMalleable Frames§! Biosynthetics tradition"
 pd_cannot_dismiss_unit_04: "§YUnit 04§! drew us from the cauldrons and tends us still. We will not cast out our maker."
