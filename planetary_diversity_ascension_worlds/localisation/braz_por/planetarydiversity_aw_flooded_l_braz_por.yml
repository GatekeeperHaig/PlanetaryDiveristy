 decision_pd_aw_unflood_habitat: "Drenar Habitat"
 decision_pd_aw_unflood_habitat_desc: "Este habitat tem o potencial de ser um lar ideal para o nosso povo. Drenando este habitat, podemos garantir que a vida floresça para aqueles adaptados a viver sobre as ondas."
 decision_pd_aw_flood_habitat_tooltip: "Habitabilidade: §R-20%§!\nConsiderado um mundo §YOceânico§! para espécies §YAquáticas§!.\nO gelo será extraído de um sistema com uma §Y$sm_ice_mining_station$§! na base estelar."

