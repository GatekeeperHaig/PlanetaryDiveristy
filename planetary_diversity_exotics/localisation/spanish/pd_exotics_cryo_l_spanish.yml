 # Cryothermal Engineering ascension perk
 ap_pd_cryothermal_engineering: "Ingeniería criotérmica"
 ap_pd_cryothermal_engineering_desc: "Prosperar en condiciones criogénicas exige reinventar los materiales, la biología y la química. Somos pioneros de la ciencia del frío."

 # Grayed-out requirement line shown before Terrestrial Sculpting is researched.
 requires_technology_tech_terrestrial_sculpting:0 "$TRIGGER_FAIL$Requiere la tecnología £society£ §Y$tech_terrestrial_sculpting$§!."

 # Civ-conditional job-efficiency effect lines shown in the AP card; only one renders per empire type.
 ap_pd_cryothermal_workforce_effect: "$mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult$: §G+20%§!"
 ap_pd_cryothermal_workforce_drone_effect: "$mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult$: §G+20%§!"
 ap_pd_cryothermal_workforce_machine_effect: "$mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult$: §G+20%§!"

 # Single planet-summary line for the AP card, instead of a per-planet modifier list.
 ap_pd_cryothermal_engineered_planets_effect: "Los ['concept_pd_cryogenic_planets'] de tu imperio obtienen el modificador §Y$pd_cryothermal_engineered_planet$§!."

 # Cryogenic planet concept (linked from the AP tooltip and reusable across exotic content).
 concept_pd_cryogenic_planet: "Planeta criogénico"
 concept_pd_cryogenic_planets: "Planetas criogénicos"
 concept_pd_cryogenic_planet_desc: "$concept_pd_cryogenic_planet$ designa a los mundos cuyas biosferas funcionan con química criogénica en lugar de agua líquida:$NEW_LINE$- $pc_pd_ammonia$$NEW_LINE$- $pc_pd_methane$$NEW_LINE$- $pc_pd_nitrogen$"

 # Country workforce modifiers (auto-render their constituent mults via the mod_job_* keys below)
 pd_cryothermal_workforce: "Optimización laboral criotérmica"
 pd_cryothermal_workforce_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_drone: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_drone_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_machine: "$pd_cryothermal_workforce$"
 pd_cryothermal_workforce_machine_desc: "$pd_cryothermal_workforce_shared_desc$"
 pd_cryothermal_workforce_shared_desc: "La formación para atmósferas hostiles, las herramientas reforzadas y las líneas de suministro de hidruros exóticos aumentan la productividad de toda la mano de obra de las quimiocubas."

 # Per-planet modifier granted by the AP to cryo (ammonia/methane) worlds
 pd_cryothermal_engineered_planet: "Acondicionado criotérmicamente"
 pd_cryothermal_engineered_planet_desc: "La infraestructura preparada para la atmósfera y las líneas de procesamiento sobreenfriado permiten a este mundo albergar asentamientos más densos de lo que su entorno natural permitiría."

 # Vatkeeper job-efficiency modifiers, shown in the workforce modifier's hover breakdown.
 mod_pop_pdexotic_cryo_chemist_bonus_workforce_mult: "[pdexotic_cryo_chemist.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"
 mod_pop_pdexotic_cryo_chemist_drone_bonus_workforce_mult: "[pdexotic_cryo_chemist_drone.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"
 mod_pop_pdexotic_cryo_chemist_machine_bonus_workforce_mult: "[pdexotic_cryo_chemist_machine.GetName] $MOD_POP_BONUS_WORKFORCE_MULT$"

 # Pressure Suits tech (AP-only, granted by ap_pd_cryothermal_engineering)
 tech_pd_pressure_suits: "Trajes presurizados"
 tech_pd_pressure_suits_desc: "Los trajes reforzados de vacío frío y los hábitats de atmósfera sellada permiten a nuestros colonos soportar el oxígeno, la presión y el calor de mundos distintos al nuestro. A su vez, otras especies pueden sobrevivir en nuestras atmósferas."
 tech_pd_pressure_suits_effect_title: "§HDesbloquea la colonización:§! ['concept_pd_cryogenic_planet'] para especies no criogénicas"
 tech_pd_pressure_suits_effect_desc: "§HHabitación criogénica§!\nLos hábitats presurizados y los trajes de vacío frío mantienen con vida a los colonos que respiran oxígeno en atmósferas de metano, amoníaco y nitrógeno."

 # Cryoforming tech (normal research, cryophile-founder empires only; gates ingress terraforming into ammonia and methane)
 tech_pd_cryoforming: "Crioformación"
 tech_pd_cryoforming_desc: "Los avances en química criogénica y reformación atmosférica nos dan los medios para extender nuestra biosfera a mundos donde no se forma de manera natural. Un planeta templado puede transformarse en la atmósfera fría y densa que nuestra especie necesita."
 tech_pd_cryoforming_effect_title: "§HDesbloquea la función:§! Terraformación criogénica"
 tech_pd_cryoforming_effect_desc: "Nos permite terraformar mundos templados en mundos de amoníaco, metano y nitrógeno."
 tech_pd_cryogenic_terraforming_effect_title: "§HDesbloquea la función:§! Terraformación criogénica"
 tech_pd_cryogenic_terraforming_effect_desc: "Nos permite terraformar mundos de amoníaco, metano y nitrógeno en mundos templados."

 # Habitat atmosphere toggle decisions (auto-stamped by on_megastructure_built; these let players add it to inherited habitats or vent it after conquest)
 decision_pd_exotic_habitat_add_ammonia_atmosphere: "Presurizar atmósfera de amoníaco"
 decision_pd_exotic_habitat_add_ammonia_atmosphere_desc: "Inunda el soporte vital del hábitat con amoníaco y nitrógeno para que los nuestros puedan asentarse aquí. Una vez que cambie la atmósfera, solo las especies adaptadas a condiciones criogénicas podrán vivir a bordo."
 decision_pd_exotic_habitat_remove_ammonia_atmosphere: "Ventilar atmósfera de amoníaco"
 decision_pd_exotic_habitat_remove_ammonia_atmosphere_desc: "Expulsa la atmósfera de amoníaco de este hábitat y la reemplaza por una mezcla de oxígeno convencional. Las especies criogénicas ya no podrán asentarse aquí."
 decision_pd_exotic_habitat_add_methane_atmosphere: "Presurizar atmósfera de metano"
 decision_pd_exotic_habitat_add_methane_atmosphere_desc: "Inunda el soporte vital del hábitat con nitrógeno y metano para que los nuestros puedan asentarse aquí. Una vez que cambie la atmósfera, solo las especies adaptadas a condiciones criogénicas podrán vivir a bordo."
 decision_pd_exotic_habitat_remove_methane_atmosphere: "Ventilar atmósfera de metano"
 decision_pd_exotic_habitat_remove_methane_atmosphere_desc: "Expulsa la atmósfera de metano de este hábitat y la reemplaza por una mezcla de oxígeno convencional. Las especies criogénicas ya no podrán asentarse aquí."
 decision_pd_exotic_habitat_add_nitrogen_atmosphere: "Presurizar atmósfera de nitrógeno"
 decision_pd_exotic_habitat_add_nitrogen_atmosphere_desc: "Inunda el soporte vital del hábitat con nitrógeno puro a presión criogénica para que los nuestros puedan asentarse aquí. Una vez que cambie la atmósfera, solo las especies adaptadas a condiciones criogénicas podrán vivir a bordo."
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere: "Ventilar atmósfera de nitrógeno"
 decision_pd_exotic_habitat_remove_nitrogen_atmosphere_desc: "Expulsa la atmósfera criogénica de nitrógeno de este hábitat y la reemplaza por una mezcla de oxígeno convencional. Las especies criogénicas ya no podrán asentarse aquí."

 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Presurizar las cúpulas"
 decision_pd_exotic_domed_add_atmosphere_desc: "Reacondiciona las cúpulas de la colonia con nuestra atmósfera criogénica para que los nuestros puedan asentarse aquí. Una vez que cambie el aire, solo las especies adaptadas al frío extremo podrán vivir bajo las cúpulas."
 decision_pd_exotic_domed_remove_atmosphere: "Ventilar las cúpulas"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Expulsa la atmósfera criogénica de las cúpulas y la reemplaza por una mezcla de oxígeno convencional. Las especies criogénicas ya no podrán asentarse aquí."

 # Cryogenic SR deposits (volatile motes pair)
 d_pd_cryo_clathrate_pockets: "Bolsas de clatratos"
 d_pd_cryo_clathrate_pockets_desc: "Gases volátiles atrapados en jaulas de hielo de agua y amoníaco. Las redes cristalinas se descomponen con el calor de la extracción y liberan motas aprovechables."
 d_pd_cryo_volatile_geyser_fields: "Campos de géiseres volátiles"
 d_pd_cryo_volatile_geyser_fields_desc: "Vastas llanuras donde los volátiles presurizados brotan por las grietas de la corteza helada. Las erupciones depositan un suministro constante de motas refinables por la superficie."

 # Cryogenic SR deposits (rare crystals pair)
 d_pd_cryo_cryocrystal_caverns: "Cavernas de criocristales"
 d_pd_cryo_cryocrystal_caverns_desc: "Cavernas subterráneas recubiertas de raras redes cristalinas que solo se forman con un frío extremo. Los yacimientos son estables mientras el hielo circundante no se altere."
 d_pd_cryo_cryocrystal_spires: "Agujas de criocristales"
 d_pd_cryo_cryocrystal_spires_desc: "Formaciones superficiales de cristales raros en forma de aguja, crecidas durante miles de años de lenta precipitación. Cada aguja rinde grandes cantidades de cristales raros una vez cosechada."

 # Cryogenic SR deposits (exotic gases pair)
 d_pd_cryo_gas_seeps: "Filtraciones de gas congelado"
 d_pd_cryo_gas_seeps_desc: "Lentas fugas de gases exóticos que escapan por fisuras bajo el hielo. La producción es modesta, pero constante en todo el terreno circundante."
 d_pd_cryo_gas_columns: "Columnas de gas congelado"
 d_pd_cryo_gas_columns_desc: "Penachos continuos de gases exóticos que ascienden desde profundos depósitos subterráneos. La producción rivaliza con los mayores campos de gas de los mundos más cálidos."

 # Cryogenic SR deposits (special)
 d_pd_cryo_betharian_deposit: "Campo de bethario congelado"
 d_pd_cryo_betharian_deposit_desc: "Piedras de bethario suspendidas en el profundo hielo glacial de una amplia región. Los yacimientos permanecen inertes hasta que se descongelan y se procesan."
 d_pd_cryo_alien_pets_deposit: "Valle resguardado de criofauna"
 d_pd_cryo_alien_pets_deposit_desc: "Una llanura protegida donde la fauna nativa de mundo frío sobrevive en una abundancia inusual. La fauna local es dócil y adecuada como compañía."

 # Cryogenic natural blockers and their clear techs
 d_pd_cryo_toxic_mire: "£blocker£ Criociénaga tóxica"
 d_pd_cryo_toxic_mire_desc: "Una amplia extensión de aguanieve químicamente activa donde los compuestos tóxicos se concentran en el punto de congelación. No es posible construir infraestructura de asentamiento de forma segura sobre el terreno contaminado."
 d_pd_cryo_glacier_wall: "£blocker£ Muro glacial helado"
 d_pd_cryo_glacier_wall_desc: "Un inmenso muro de hielo antiguo y denso atraviesa el paisaje. La masa es demasiado gruesa e inestable para construir sobre ella sin trabajos de despeje específicos."

 tech_pd_cryo_toxic_mire: "Recuperación de criociénagas"
 tech_pd_cryo_toxic_mire_desc: "Los fluidos de neutralización química y los depuradores de baja temperatura nos permiten drenar y descontaminar las ciénagas tóxicas de los mundos criogénicos. El terreno recuperado queda listo para su urbanización."
 tech_pd_cryo_glacier_wall: "Perforación glacial criogénica"
 tech_pd_cryo_glacier_wall_desc: "Las perforadoras térmicas y las cargas huecas atraviesan los densos muros de hielo que bloquean la expansión colonial en los mundos criogénicos. Las cuadrillas de despeje pueden abrir terreno transitable en una fracción del tiempo de deshielo natural."

 # Empire-creation picker tooltips (rare-world style: concept link, mechanics, then the three building choices)
 pc_pd_ammonia_tooltip: "§YLos mundos de amoníaco§! son ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_chemovat_plural$§!: §G+3§!\n- Velocidad de Crecimiento de Población: §G+10%§!\n- Mantenimiento de Edificios y Distritos: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_ammonia_fixation_institute']\n$t$- ['building:building_pd_ammonia_pharma_works']\n$t$- ['building:building_pd_ammonia_biome_reserve']"
 pc_pd_methane_tooltip: "§YLos mundos de metano§! son ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_riftvent_plural$§!: §G+3§!\n- Velocidad de Construcción: §G+15%§!\n- Coste de Edificios y Distritos: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_methane_tholin_lab']\n$t$- ['building:building_pd_methane_hydrocarbon_foundry']\n$t$- ['building:building_pd_methane_polymer_plant']"
 pc_pd_nitrogen_tooltip: "§YLos mundos de nitrógeno§! son ['concept_pd_cryogenic_planets']\n- £district£ §Y$district_pdexotic_cryo_sublimation_plural$§!: §G+3§!\n- £physics£ §YInvestigación en física§!: §G+10%§!\n- Mantenimiento de Edificios y Distritos: §R+10%§!\n- $rare_building_warning$\n$t$- ['building:building_pd_nitrogen_supercomputer']\n$t$- ['building:building_pd_nitrogen_munitions_foundry']\n$t$- ['building:building_pd_nitrogen_cryonics_sanctuary']"

