l_spanish:

 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Presurizar las cúpulas"
 decision_pd_exotic_domed_add_atmosphere_desc: "Reacondiciona las cúpulas de la colonia con nuestra atmósfera criogénica para que los nuestros puedan asentarse aquí. Una vez que cambie el aire, solo las especies adaptadas al frío extremo podrán vivir bajo las cúpulas."
 decision_pd_exotic_domed_remove_atmosphere: "Ventilar las cúpulas"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Expulsa la atmósfera criogénica de las cúpulas y la reemplaza por una mezcla de oxígeno convencional. Las especies criogénicas ya no podrán asentarse aquí."
