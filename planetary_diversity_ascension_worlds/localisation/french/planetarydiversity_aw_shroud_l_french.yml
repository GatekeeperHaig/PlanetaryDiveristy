l_french:

###Shroud Planets
#AP
 ap_pd_shroud_worlds: "Mise en phase avec le Suaire"
 ap_pd_shroud_worlds_desc: "Les barrières entre le plan mortel et le Suaire sont plus minces que prévu. En concentrant notre énergie psionique, nous pouvons affaiblir davantage ces barrières et créer des mondes qui s'étendent sur les deux dimensions."
 allow_shroud_worlds: "§YDébloque la décision :§! $decision_pd_aw_shroud_planet$"
 describe_shroud_worlds: "Modificateur §Y$decision_pd_aw_shroud_planet$§! :\n$t$- £pop£ Pops §Gpsioniques§! :\n- $mod_planet_psionic_jobs_produces_mult$ : §G10%§!\n- $MOD_POP_HAPPINESS$ : §G10%§!\n\n£pop£ Pops §Ynon psioniques§! :\n- £mod_pop_environment_tolerance£ §YHabitabilité planétaire§! : §R-50%§!\n- $MOD_POP_HAPPINESS$ : §R-25%§!\n- $MOD_LOGISTIC_GROWTH_MULT$ : §R-25%§!"

#Decisions
 decision_pd_aw_shroud_planet: "Mise en phase avec le Suaire"
 decision_pd_aw_shroud_planet_desc: "Nous pouvons affaiblir la barrière entre cette planète et le Suaire et créer un équilibre entre le plan matériel et le plan psionique."
 decision_pd_aw_shroud_planet_effects_short: "Ajout du modificateur §Y$pd_aw_shroud_planet$§!.\n\nAugmente la £pop£ §GProduction des Pops psioniques§! mais réduit la £pop£ §YProduction des Pops non psioniques§!."
 decision_pd_aw_shroud_planet_cleanup: "Verrouiller la phase planétaire"
 decision_pd_aw_shroud_planet_cleanup_desc: "Nos physiciens peuvent renforcer la barrière entre cette planète et le Suaire et l'ancrer dans le plan matériel."
 decision_pd_aw_shroud_planet_cleanup_tooltip: "\nNous retirerons l'influence psionique de cette planète."
 decision_pd_aw_sever_shroud_planet: "Rompre la phase planétaire"
 decision_pd_aw_sever_shroud_planet_desc: "Nos psions peuvent rompre la communion entre cette planète et le Suaire et la ramener dans le plan matériel."
 decision_pd_aw_sever_shroud_planet_tooltip: "\nNous romprons la communion de cette planète avec le Suaire."

#Modifiers
 pd_aw_shroud_planet: "Touché par le Suaire"
 pd_aw_shroud_planet_desc: "Ici, la barrière délibérément affaiblie entre le plan matériel et le Suaire permet aux individus dotés de capacités psychiques de remodeler la réalité dans une certaine mesure. Mais pour ceux qui ne possèdent pas ce don, la frontière entre cauchemar et réalité s'estompe et laisse place à un cycle sans fin de souffrances et de tourments."
 pd_aw_shroud_planet_tooltip: "£pop£ Pops §Gpsioniques§! :\n- $mod_psionic_pop_bonus_workforce_mult$ : §G10%§!\n- $MOD_POP_HAPPINESS$ : §G25%§!\n\n£pop£ Pops §Ynon psioniques§! :\n- £mod_pop_environment_tolerance£ §YHabitabilité planétaire§! : §R-50%§!\n- $MOD_POP_HAPPINESS$ : §R-25%§!\n- $MOD_LOGISTIC_GROWTH_MULT$ : §R-25%§!"
 pd_shroud_planet: "$pd_aw_shroud_planet$"
 pd_shroud_planet_desc: "$pd_aw_shroud_planet_desc$"
 pd_shroud_planet_tooltip: "$pd_aw_shroud_planet_tooltip$"
 pd_aw_shroud_severed: "Communion rompue"
 pd_aw_shroud_severed_desc: "Le lien entre ce monde et le Suaire a été arraché par la force. Ceux qui communiaient avec lui restent à vif et ébranlés."

#Notification Message
 MESSAGE_PD_AW_SHROUD_DESC:1 "$PLANET|Y$ est désormais §Y$pd_aw_shroud_planet$§!"
 MESSAGE_PD_AW_SHROUD_MESSAGE_TYPE_TITLE: "Communion planétaire avec le Suaire achevée"
 MESSAGE_PD_AW_SHROUD_CLEANUP_DESC:1 "L'influence du Suaire a été retirée de $PLANET|Y$."
 MESSAGE_PD_AW_SHROUD_CLEANUP_MESSAGE_TYPE_TITLE: "Planète libérée du Suaire"
 MESSAGE_PD_AW_SHROUD_SEVER_DESC:1 "La communion avec le Suaire a été rompue sur $PLANET|Y$."
