l_french:
 #Modules de station relais des mondes uniques
 sm_waystation_pd_eludium_relay: "Relais de Recherche en Eludium"
 sm_waystation_pd_eludium_relay_desc: "L'Eludium raffiné, acheminé le long de la voie, permet à toutes les divisions de recherche du réseau d'étudier en même temps les propriétés du minerai qui défient la physique."
 sm_waystation_pd_acean_spire: "Flèche de Diffusion de Résonance"
 sm_waystation_pd_acean_spire_desc: "La résonance du Cristal Acéen, qui persiste même dans des fragments isolés, est amplifiée ici puis diffusée le long de la voie pour accélérer la croissance organique dans tout le réseau."
 sm_waystation_pd_biosynth_foundry: "Fonderie d'Alliage Vivant"
 sm_waystation_pd_biosynth_foundry_desc: "Le Métal Vivant extrait du Monde Biosynthétique est forgé en alliages autoréparateurs et partagé le long de la voie, réparant les coques et blindages de la flotte partout où le réseau s'étend."
 sm_pd_requires_floating_world: "Nécessite un §YMonde Flottant§! dans ce système"
 sm_pd_requires_crystal_world: "Nécessite un §YMonde de Cristal§! dans ce système"
 sm_pd_requires_biosynth_world: "Nécessite un §YMonde Biosynthétique§! dans ce système"
 tech_eludium_research_relay: "Relais d'Eludium"
 tech_eludium_research_relay_desc: "En accordant les systèmes d'une station relais aux veines d'Eludium du Monde Flottant, nous pouvons relayer le potentiel de recherche du minerai aux laboratoires de tout notre réseau."
 tech_eludium_research_relay_tt_desc: "§HDébloque :§! Relais de Recherche en Eludium (Module de station relais)"
 tech_acean_resonance_spire: "Diffusion de Résonance Acéenne"
 tech_acean_resonance_spire_desc: "En étudiant le Monde de Cristal depuis l'orbite, nous avons appris à capter la résonance acéenne et à la rediffuser le long de nos voies."
 tech_acean_resonance_spire_tt_desc: "§HDébloque :§! Flèche de Diffusion de Résonance (Module de station relais)"
 tech_biosynth_living_foundry: "Synthèse d'Alliage Vivant"
 tech_biosynth_living_foundry_desc: "En étudiant les gisements de Métal Vivant du Monde Biosynthétique, nos ingénieurs ont appris à forger des alliages autoréparateurs à bord d'une station relais."
 tech_biosynth_living_foundry_tt_desc: "§HDébloque :§! Fonderie d'Alliage Vivant (Module de station relais)"
###Floating World
 sr_eludium:0 "Minerai d'Eludium"
 sr_eludium_desc:0 "Cette substance exotique possède de nombreuses propriétés qui défient les lois de la physique. Seule sur cette planète peut-elle modifier la masse de la matière en affectant la gravité."
 mod_planet_miners_sr_eludium_produces_add: "£sr_eludium£ $sr_eludium$ de £job_miner£ [GetMinerPlural]"
 pd_floating: "Monde Flottant"
 pd_floating_desc: "Ce monde étrange présente des îles qui flottent dans le ciel, soutenues par un minerai rare que l'on ne trouve que là. Les multiples couches d'îles offrent à la planète un espace de vie considérablement plus important."
 pc_pd_floating: "Monde Flottant"
 pc_pd_floating_desc: "Un monde étrange présentant des îles qui flottent dans le ciel, soutenues par un minerai rare que l'on ne trouve que là. Les multiples couches d'îles offrent à la planète un espace de vie considérablement plus important."
 pc_pd_floating_adj: "flottant"
 mod_pc_pd_floating_habitability: "Habitabilité Flottante"
 trait_pc_pd_floating_preference: "Préférence Flottante"
 trait_pc_pd_floating_preference_desc: "$trait_pc_arctic_preference_desc$"
 d_pd_floating_the_great_knot: "Le Grand Nœud"
 d_pd_floating_the_great_knot_desc: "Un groupe dispersé d'îles où d'anciens arbres, déracinés par des vents changeants, forment des ponts naturels entre les terres flottantes. Les schémas de vent uniques, les microclimats variés et la faune rare font de cet endroit un lieu idéal pour étudier les adaptations évolutives et la résilience de la vie dans des environnements dynamiques."
 d_pd_floating_whispering_glades: "Clairières Murmurantes"
 d_pd_floating_whispering_glades_desc: "Un groupe serein d'îles flottantes verticales survole des prairies. L'interaction douce du vent avec les passages étroits crée un son apaisant, presque musical, idéal pour la relaxation et le ressourcement."
 d_pd_floating_skyfall_islands: "Îles de Chutecel"
 d_pd_floating_skyfall_islands_desc: "Une région d'îles en forme d'anneau avec une forte hydrosphère, où des cascades tombent des bords et disparaissent dans le brouillard en dessous. Le paysage à couper le souffle et la beauté naturelle en font une destination privilégiée pour le commerce et le tourisme, attirant visiteurs et marchands de toute la galaxie."
 d_pd_floating_mining_operation: "Opération Minière à Ciel Ouvert d'Eludium"
 d_pd_floating_mining_operation_desc: "L'écosystème de la planète, qui avait auparavant bloqué les opérations minières à grande échelle, a été défriché pour exploiter pleinement le rare minerai d'Eludium."
 d_pd_eludium_islands: "Îles d'Eludium"
 d_pd_eludium_islands_desc: "Bien que le socle rocheux de cette planète soit saturé d'Eludium, de nombreuses îles plus petites contiennent des gisements concentrés faciles d'accès, permettant aux opérations minières d'avoir un impact environnemental minimal."
 decision_d_pd_the_great_knot_mining: "$d_pd_floating_the_great_knot$ Opération Minière"
 decision_d_pd_the_great_knot_mining_desc: "La zone connue sous le nom de $d_pd_floating_the_great_knot$ sera développée en une grande opération minière d'Eludium."
 decision_d_pd_whispering_glades_mining: "$d_pd_floating_whispering_glades$ Opération Minière"
 decision_d_pd_whispering_glades_mining_desc: "La zone connue sous le nom de $d_pd_floating_whispering_glades$ sera développée en une grande opération minière d'Eludium."
 decision_d_pd_skyfall_islands_mining: "$d_pd_floating_skyfall_islands$ Opération Minière"
 decision_d_pd_skyfall_islands_mining_desc: "La zone connue sous le nom de $d_pd_floating_skyfall_islands$ sera développée en une grande opération minière d'Eludium."
 tech_eludium_research:1 "Raffinage de l'Eludium"
 tech_eludium_research_desc: "L'extraction de l'Eludium est simple, mais comprendre son potentiel et son processus de raffinage est beaucoup plus compliqué. Comme toutes les ressources, déverrouiller son plein potentiel prendra du temps."
 tech_eludium_research_tt_desc: "§HDéverrouille :§! Extraction d'Eludium\n§HDéverrouille :§! Édits d'Eludium"
 edict_eludium_research:0 "Boost de Recherche Eludium"
 edict_eludium_research_desc:0 "Alimenter nos laboratoires avec de l'Eludium raffiné décuplera les capacités de recherche de nos départements de physique."
 edict_eludium_energy:0 "Réseau Énergétique Eludium"
 edict_eludium_energy_desc:0 "L'intégration de l'Eludium comme matériau hyper-conducteur dans notre réseau énergétique amplifie son débit de puissance."
 edict_eludium_weapons:0 "Transistors d'Armes Eludium"
 edict_eludium_weapons_desc:0 "L'intégration de transistors à base d'Eludium dans nos armes à énergie améliore radicalement leur vitesse de décharge et leur rendement d'impact."
 decision_pd_add_floating_island: "Créer des Îles Flottantes Artificielles"
 decision_pd_add_floating_island_desc: "En exploitant la puissance de l'Eludium, nous pouvons soulever des îles entières dans les cieux de ce monde, ouvrant de vastes nouveaux espaces à la construction."
 d_pd_artifical_floating_islands: "Îles Flottantes Artificielles"
 d_pd_artifical_floating_islands_desc: "En exploitant la puissance de l'Eludium, nous avons soulevé des îles entières dans les cieux de ce monde, ouvrant de vastes nouveaux espaces à la construction."
 tech_eludium_floating_islands: "Formation d'Îles Artificielles"
 tech_eludium_floating_islands_desc: "Bien que les îles infusées d'Eludium flottent naturellement, des dispositifs de flottabilité peuvent être créés sous les îles d'autres mondes, nous permettant d'élargir considérablement l'espace de vie sur d'autres planètes."
 tech_eludium_floating_islands_tt_desc: "§HDéverrouille Décision :§! $decision_pd_add_floating_island$"
 building_pd_eludium_floating_resort: "Station Balnéaire Flottante"
 building_pd_eludium_floating_resort_desc: "Utilisant l'Eludium pour maintenir cette structure en lévitation, cet impressionnant complexe offre des vues spectaculaires grâce à sa nature céleste."
 tech_eludium_floating_resort: "Construction de Station Balnéaire Flottante"
 tech_eludium_floating_resort_desc: "Utilisant l'Eludium pour maintenir les structures en lévitation, nous pouvons créer des complexes impressionnants offrant des vues spectaculaires grâce à leur nature céleste."
 tech_eludium_floating_overseer: "Stations de Surveillance Flottantes"
 tech_eludium_floating_overseer_desc: "Utilisant l'Eludium pour maintenir des structures en lévitation, nous pouvons créer des stations de surveillance flottantes pour surveiller nos drones."
 building_pd_eludium_floating_overseer: "Station de Surveillance Flottante"
 building_pd_eludium_floating_overseer_desc: "Utilisant l'Eludium pour maintenir les structures en lévitation, ces stations de surveillance flottantes rappellent constamment aux drones leur raison d'être."
 pd_origin_init_floating_NAME:0 "Système Flottant"
 pd_origin_init_floating_DESC:0 "Un système de départ contenant le Monde Flottant"

 #Events
 pdfloating.100.name: "Îles dans le Ciel"
 pdfloating.100.desc: "Après avoir complété son scan de §Y[From.GetName]§!, le §Y[Root.GetName]§! rapporte une découverte remarquable. Les masses terrestres de cette planète flottent dans le ciel, défiant les lois de la physique grâce à un minerai unique appelé Eludium.\n\nLes propriétés de ce minerai extraordinaire méritent une investigation approfondie. Sécuriser et tenir cette planète sera crucial pour étudier le potentiel de l'Eludium et en dévoiler les secrets."
 pdfloating.100.a: "Comme c'est incroyable."

 #Origin
 origin_pd_floating_world:0 "Îles dans le Ciel"
 origin_pd_floating_world_desc:0 "Cette civilisation a évolué sur un monde sans pareil dans la galaxie. Grâce à l'élément Eludium, les masses terrestres de cette planète flottent sans effort dans le ciel."
