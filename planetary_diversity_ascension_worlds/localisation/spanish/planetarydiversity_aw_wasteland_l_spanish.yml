 decision_pd_aw_wasteland_planet_desc: "Las preocupaciones medioambientales no hacen más que frenarnos. Ignorando el estado del ecosistema natural del planeta, desbloquearemos su verdadero potencial industrial."
 decision_pd_aw_wasteland_planet_effects_short: "Se añade el modificador §Y$pd_aw_wasteland_planet$§!.\n\nAumenta la §GProducción industrial§! pero reduce la £mod_pop_environment_tolerance£ §RHabitabilidad§! y la producción de £food£ §RAlimentos§!.\nSe eliminarán todos los £district£ §Y$district_farming_plural$§! y los Obstáculos."
 decision_pd_aw_wasteland_planet_cleanup: "Limpieza Medioambiental"
 decision_pd_aw_wasteland_planet_cleanup_desc: "La grave degradación medioambiental en este planeta ha dejado su ecosistema en un estado precario. Rectificaremos el daño infligido a este mundo."
 decision_pd_aw_wasteland_planet_cleanup_tooltip: "Restauraremos el ecosistema original de este planeta."

