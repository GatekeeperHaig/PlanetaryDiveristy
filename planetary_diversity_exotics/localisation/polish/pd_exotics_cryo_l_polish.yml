 # Domed Colony atmosphere toggle decisions (auto-stamped on build and at game start; these let players add it to inherited colonies or vent it after conquest)
 decision_pd_exotic_domed_add_atmosphere: "Wprowadź atmosferę do kopuł"
 decision_pd_exotic_domed_add_atmosphere_desc: "Przystosuj kopuły kolonii do naszej atmosfery kriogenicznej, by nasz gatunek mógł się tu osiedlić. Po zmianie atmosfery tylko gatunki przystosowane do warunków kriogenicznych będą mogły zamieszkać pod kopułami."
 decision_pd_exotic_domed_remove_atmosphere: "Usuń atmosferę z kopuł"
 decision_pd_exotic_domed_remove_atmosphere_desc: "Usuń atmosferę kriogeniczną z kopuł i zastąp ją standardową mieszaniną tlenową. Gatunki kriogeniczne nie będą już mogły się tu osiedlać."

 tankbound_species_class_requirement: "Klasa gatunku musi zawierać portret z cechą ['trait:trait_tankbound']:\n$t$$BULLET_POINT$§Y$AQUATIC$§!\n$t$$BULLET_POINT$§Y$CRYO$§!\n$t$$BULLET_POINT$§Y$INF$§!\n$t$$BULLET_POINT$§Y$NECROID$§!\n$t$$BULLET_POINT$§Y$TOX$§!"
 CRYO: "Kriofil"
 CRYO_desc: "Klasa gatunku nie ma wpływu na twoje imperium, ale gatunki z klasy kriofilów mogą uważać inne kriofile za mniej obce niż gatunki z pozostałych klas."
 climate_cryogenic: "Kriogeniczny"
 cryogenic: "§B(Klimat kriogeniczny)§!"
 pc_pd_methane: "Świat metanowy"
 pc_pd_methane_desc: "Lodowaty, skalisty świat z gęstą atmosferą azotowo-metanową. Morza ciekłego metanu i etanu pokrywają znaczną część powierzchni, a nieustanna węglowodorowa mgła nadaje niebu pomarańczową barwę. Tutejsze życie opiera się na biochemii węglowodorów."
 pc_pd_ammonia: "Świat amoniakalny"
 pc_pd_ammonia_desc: "Zimny, skalisty świat z gęstą atmosferą azotowo-amoniakalną. Oceany ciekłego amoniaku pokrywają znaczną część powierzchni, a na biegunach stale utrzymuje się lód z wody i amoniaku. Tutejsze życie opiera się na biochemii amoniaku."
 pc_pd_nitrogen: "Świat azotowy"
 pc_pd_nitrogen_desc: "Zamarznięty, skalisty świat z rzadką atmosferą azotową. W obniżeniach terenu rozciągają się morza ciekłego azotu, a ze szczelin w lodowej skorupie wytryskują azotowe gejzery. Tutejsze życie opiera się na biochemii azotu."
 pd_ammonia: "Świat amoniakalny"
 pd_ammonia_desc: "Ta zimna planeta ma gęstą atmosferę azotowo-amoniakalną nad oceanami ciekłego amoniaku. Obfitość związanego azotu podtrzymuje bujną biosferę opartą na amoniaku. Ten sam amoniak powoduje korozję większości metali, stopniowo niszcząc nieosłoniętą infrastrukturę."
 pd_methane: "Świat metanowy"
 pd_methane_desc: "Ta lodowata planeta ma gęstą atmosferę azotowo-metanową nad rozległymi morzami ciekłego metanu i etanu — ogromnym rezerwuarem paliwa. Lotność tych substancji sprawia zarazem, że atmosfera jest niebezpiecznie łatwopalna, dlatego każda konstrukcja wymaga solidnego zabezpieczenia przed wybuchami."
 pd_nitrogen: "Świat azotowy"
 pd_nitrogen_desc: "Ta zamarznięta planeta ma rzadką atmosferę azotową nad morzami ciekłego azotu, a pod lodem kryją się grube warstwy azotanów i minerałów. Skrajne zimno umożliwia wykorzystanie naturalnych nadprzewodników, lecz zmusza do ciągłego ogrzewania wszystkich obiektów, by mogły funkcjonować."
 trait_cryophile: "Kriofil"
 trait_cryophile_desc: "Powolny metabolizm tego gatunku, działający w niskich temperaturach, wymaga mieszanki egzotycznych wodorków oprócz zwykłych składników odżywczych. Jego przedstawiciele żyją o całe pokolenia dłużej niż inne gatunki, ale wykonanie każdego zadania zajmuje im znacznie więcej czasu."
 TRAIT_CRYOPHILE_EFFECT: "$r_exotic_gases$ — utrzymanie na $pop_group_unit$ £pop£ populacji: §R+0.05§!"
 trait_pc_pd_methane_preference: "Preferowany teren: świat metanowy"
 trait_pc_pd_methane_preference_desc: "Gatunek ten wyewoluował nad morzami ciekłych węglowodorów na światach metanowych. Doskonale radzi sobie w głębokim zimnie, a jego biochemia jest w pełni przystosowana do ciekłego metanu."
 trait_pc_pd_ammonia_preference: "Preferowany teren: świat amoniakalny"
 trait_pc_pd_ammonia_preference_desc: "Gatunek ten wyewoluował w gęstych atmosferach światów amoniakalnych, pośród chmur amoniaku. Doskonale radzi sobie w głębokim zimnie, a jego biochemia jest w pełni przystosowana do związków amoniaku."
 trait_pc_pd_nitrogen_preference: "Preferowany teren: świat azotowy"
 trait_pc_pd_nitrogen_preference_desc: "Gatunek ten wyewoluował nad morzami ciekłego azotu i wśród kriowulkanicznych gejzerów na światach azotowych. Doskonale radzi sobie w głębokim zimnie, a jego biochemia jest w pełni przystosowana do ciekłego azotu."
 mod_pc_pd_methane_habitability: "Możliwość zamieszkania świata metanowego"
 mod_pc_pd_ammonia_habitability: "Możliwość zamieszkania świata amoniakalnego"
 mod_pc_pd_nitrogen_habitability: "Możliwość zamieszkania świata azotowego"
 pd_ammonia_atmosphere:0 "Atmosfera amoniakalna"
 pd_ammonia_atmosphere_desc:0 "Gęsty azot i gazowy amoniak w niskich temperaturach. W całej atmosferze unoszą się śladowe ilości metanolu i zamarznięte cząstki węglowodorów."
 pd_methane_atmosphere:0 "Atmosfera metanowa"
 pd_methane_atmosphere_desc:0 "Gęsty azot, metan i etan w bardzo niskich temperaturach. Unoszące się aerozole tolinowe nadają powietrzu charakterystyczny pomarańczowy odcień."
 pd_nitrogen_atmosphere:0 "Atmosfera azotowa"
 pd_nitrogen_atmosphere_desc:0 "Rozrzedzony azot cząsteczkowy w skrajnie niskich temperaturach kriogenicznych. Unoszące się drobiny lodu i śladowe ilości neonu nadają powietrzu bladoniebieski odcień."
 START_SCREEN_PART_ONE_PD_METHANE: "Pierwsze prymitywne społeczności gatunku [GetSpeciesName] powstały na planecie [GetHomeWorldName], na brzegach mórz ciekłych węglowodorów. Przez eony, które od tamtej pory upłynęły, nasza cywilizacja rozrastała się i kwitła."
 START_SCREEN_PART_ONE_PD_AMMONIA: "Pierwsze prymitywne społeczności gatunku [GetSpeciesName] powstały na planecie [GetHomeWorldName], pod amoniakalnymi chmurami. Przez eony, które od tamtej pory upłynęły, nasza cywilizacja rozrastała się i kwitła."
 START_SCREEN_PART_ONE_PD_NITROGEN: "Pierwsze prymitywne społeczności gatunku [GetSpeciesName] powstały na planecie [GetHomeWorldName], nad morzami ciekłego azotu. Przez eony, które od tamtej pory upłynęły, nasza cywilizacja rozrastała się i kwitła."
 d_pd_ammonia_lightning_storms: "Azotowe fronty burzowe"
 d_pd_ammonia_lightning_storms_desc: "Tam, gdzie zderzają się fronty amoniakalne i azotowe, niebo rozświetla niemal nieustanna kaskada błyskawic. Prąd można pozyskiwać bezpośrednio z powietrza."
 d_pd_ammonia_thermocline: "Uwarstwienie chmur amoniakalnych"
 d_pd_ammonia_thermocline_desc: "Atmosfera dzieli się na wyraźne warstwy chmur, z których każda jest cieplejsza od tej położonej wyżej. Różnica temperatur między nimi pozwala pozyskiwać energię."
 d_pd_ammonia_salt_dunes: "Wydmy soli amonowych"
 d_pd_ammonia_salt_dunes_desc: "Ukształtowane przez wiatr wydmy czystych soli amonowych ciągną się po powierzchni. Wystarczy zebrać ich materiał i przetworzyć go, by pozyskać minerały."
 d_pd_ammonia_brine_caverns: "Jaskinie roztworów amoniaku"
 d_pd_ammonia_brine_caverns_desc: "Rozległa sieć głębokich jaskiń, w których przesączający się amoniak przez wieki pokrywał ściany bogatymi żyłami rud."
 d_pd_ammonia_chemosynthetic_pools: "Rozlewiska ciekłego amoniaku"
 d_pd_ammonia_chemosynthetic_pools_desc: "Rozległe, spokojne zbiorniki ciekłego amoniaku pokrywają grube maty mikroorganizmów. Ich biomasa stanowi podstawowe źródło pożywienia dla każdej kolonii przystosowanej do zimna."
 d_pd_ammonia_organic_haze: "Amoniakalne opady śniegu"
 d_pd_ammonia_organic_haze_desc: "Z górnych warstw chmur nieustannie opadają delikatne płatki amoniakalnego lodu, niosąc ze sobą jadalne związki organiczne."
 d_pd_ammonia_pure_gas_vents: "Wyloty amoniaku i azotu"
 d_pd_ammonia_pure_gas_vents_desc: "Z głębokich szczelin wydobywają się strumienie gazowego amoniaku i azotu, dostatecznie czystych, by zasilać rafinerie bez wstępnego przetwarzania."
 d_pd_ammonia_polar_ion_columns: "Polarne kolumny jonizacyjne"
 d_pd_ammonia_polar_ion_columns_desc: "Na biegunach powietrze nasycone amoniakiem ulega jonizacji, tworząc potężne kolumny prądu sięgające setek kilometrów w górę. Ich wyładowania można wykorzystać do bezpośredniego pozyskiwania energii elektrycznej."
 d_pd_ammonia_cryolite_reefs: "Rafy kriolitowe"
 d_pd_ammonia_cryolite_reefs_desc: "Rozległe ławice skrystalizowanego kriolitu na dnie mórz, powstałe w ciągu epok geologicznych i poprzecinane rudami pierwiastków ziem rzadkich oraz litu."
 d_pd_ammonia_ammoniated_kelp_forests: "Amoniakalne lasy wodorostów"
 d_pd_ammonia_ammoniated_kelp_forests_desc: "Wysokie podwodne lasy pobierają amoniak bezpośrednio z morza i przekształcają go w gęstą, jadalną biomasę. To najobfitsze źródło zbiorów na zamarzniętym świecie."
 d_pd_methane_tholin_storm_belts: "Pasy burz tolinowych"
 d_pd_methane_tholin_storm_belts_desc: "Naładowane aerozole tolinowe wirują w górnych warstwach atmosfery, tworząc nieprzerwane pasy burz i uwalniając ładunki elektrostatyczne w warstwie chmur. Wyładowania można sprowadzać na powierzchnię za pomocą przewodzących wież."
 d_pd_methane_cryovolcanic_vents: "Wyloty kriowulkaniczne"
 d_pd_methane_cryovolcanic_vents_desc: "Ze szczelin tryskają w lodowate powietrze mieszaniny ciekłego metanu i wodno-amoniakalnej magmy. Różnica temperatur napędza turbiny zamontowane nad każdym wylotem."
 d_pd_methane_supercooled_geysers: "Przechłodzone gejzery"
 d_pd_methane_supercooled_geysers_desc: "Podpowierzchniowe zbiorniki etanu pod ciśnieniem wyrzucają przez uskoki potężne strugi przechłodzonej cieczy. Każda z nich tworzy trwałą kolumnę energii możliwej do pozyskania."
 d_pd_methane_carbonate_caverns: "Jaskinie węglanowe"
 d_pd_methane_carbonate_caverns_desc: "Sieci jaskiń wyżłobione przez pradawne przepływy metanu w wodno-amoniakalnym podłożu skalnym. Ich ściany pokrywają krystaliczne węglany i złożone związki organiczne."
 d_pd_methane_clathrate_shelves: "Szelfy klatratów metanu"
 d_pd_methane_clathrate_shelves_desc: "Rozległe szelfy lodu zawierającego klatraty metanu pokrywają obrzeża kontynentów. Ich sieć krystaliczna więzi użyteczne metale i sole w ilościach nadających się do wydobycia."
 d_pd_methane_ice_diamonds: "Diamenty lodu metanowego"
 d_pd_methane_ice_diamonds_desc: "Ogromne ciśnienie atmosferyczne spręża węgiel pochodzący z metanu, tworząc deszcze mikrodiamentów osiadających na polarnych płaskowyżach."
 d_pd_methane_tholin_haze: "Mgła tolinowa"
 d_pd_methane_tholin_haze_desc: "Zawieszone w powietrzu aerozole węglowodorowe nieustannie opadają z nieba, tworząc jadalny osad. Fauna powierzchniowa żywi się nim bezpośrednio."
 d_pd_methane_liquid_methane_seas: "Morza ciekłego metanu"
 d_pd_methane_liquid_methane_seas_desc: "W rozległych morzach ciekłego metanu i etanu, na płyciznach, rozwijają się grube maty rodzimych mikroorganizmów. Ich biomasa stanowi podstawowe źródło pożywienia dla każdej kolonii przystosowanej do zimna."
 d_pd_methane_hydrocarbon_marshes: "Mokradła węglowodorowe"
 d_pd_methane_hydrocarbon_marshes_desc: "Wzdłuż wybrzeży rozciągają się rozległe mokradła pływowe porośnięte rodzimą florą odżywiającą się metanem, która przekształca atmosferyczne węglowodory w gęstą, jadalną biomasę. To najobfitsze źródło zbiorów na zamarzniętym świecie."
 d_pd_methane_pure_gas_vents: "Wyloty metanu i etanu"
 d_pd_methane_pure_gas_vents_desc: "Z głębokich szczelin wydobywają się strumienie metanu i cięższych gazowych węglowodorów, dostatecznie czystych, by zasilać rafinerie bez wstępnego przetwarzania."
 d_pd_nitrogen_geyser_fields: "Pola gejzerów azotowych"
 d_pd_nitrogen_geyser_fields_desc: "Rozległe równiny, na których azot z podpowierzchniowych zbiorników pod ciśnieniem tryska stałymi strugami przechłodzonej pary. Turbiny zamontowane nad każdym wylotem pozyskują energię z tych kolumn."
 d_pd_nitrogen_aurora_curtains: "Kurtyny zorzowe"
 d_pd_nitrogen_aurora_curtains_desc: "Wiatr słoneczny wywołuje niemal nieustanne zorze w rozrzedzonych górnych warstwach atmosfery. Za pomocą uziemionych anten można wykorzystywać te naładowane kurtyny do bezpośredniego pozyskiwania energii elektrycznej."
 d_pd_nitrogen_plasma_columns: "Polarne kolumny plazmowe"
 d_pd_nitrogen_plasma_columns_desc: "Na biegunach magnetycznych zjonizowany azot wznosi się w potężnych kolumnach plazmy, sięgających setek kilometrów w górę. Ich wyładowania można wykorzystać do bezpośredniego pozyskiwania energii elektrycznej."
 d_pd_nitrogen_frost_caverns: "Jaskinie lodowych kryształów"
 d_pd_nitrogen_frost_caverns_desc: "Ściany sieci głębokich jaskiń pokrywają żyły rud metali uwięzione w pradawnym lodzie azotowym. Po ogrzaniu do temperatury umożliwiającej przetwarzanie można z nich pozyskać cenne surowce."
 d_pd_nitrogen_nitrate_flats: "Zamarznięte równiny azotanowe"
 d_pd_nitrogen_nitrate_flats_desc: "Rozległe niecki skrystalizowanych soli azotanowych, pozostawionych przez pradawne morza azotu. Złoża sięgają głęboko i zapewniają stałą produkcję minerałów."
 d_pd_nitrogen_diamond_rinds: "Diamentowe skorupy"
 d_pd_nitrogen_diamond_rinds_desc: "Pradawny lód azotowy sprasował węgiel atmosferyczny w grube skorupy krystalicznego węgla na polarnych płaskowyżach. Pokłady leżą dostatecznie blisko powierzchni, by można je było bezpośrednio wydobywać."
 d_pd_nitrogen_frost_blooms: "Azotowe kwiaty mrozu"
 d_pd_nitrogen_frost_blooms_desc: "Skupiska rodzimej krioflory porastają zamarznięte niziny, pobierając azot bezpośrednio z powietrza. Ich biomasę można zbierać jako surowiec do produkcji żywności."
 d_pd_nitrogen_nitrogen_seas: "Morza ciekłego azotu"
 d_pd_nitrogen_nitrogen_seas_desc: "W rozległych zbiornikach ciekłego azotu, na płyciznach, rozwijają się grube maty rodzimych mikroorganizmów. Ich biomasa stanowi podstawowe źródło pożywienia dla każdej kolonii przystosowanej do zimna."
 d_pd_nitrogen_cryoplankton_drifts: "Dryfujące skupiska krioplanktonu"
 d_pd_nitrogen_cryoplankton_drifts_desc: "Rozległe, dryfujące zakwity rodzimego krioplanktonu przetwarzają ciekły azot w gęstą, jadalną biomasę. To najobfitsze źródło zbiorów na zamarzniętym świecie."
 d_pd_nitrogen_pure_gas_vents: "Wyloty czystego azotu"
 d_pd_nitrogen_pure_gas_vents_desc: "Z głębokich szczelin wydobywają się strumienie czystego azotu i śladowych ilości gazów egzotycznych, dostatecznie czystych, by zasilać rafinerie bez wstępnego przetwarzania."
 district_pdexotic_cryo_riftvent: "Stacja szczelinowa"
 district_pdexotic_cryo_riftvent_plural: "Stacje szczelinowe"
 district_pdexotic_cryo_riftvent_desc: "Ujścia kriowulkaniczne uwalniają przechłodzoną solankę i uwięziony gaz. Zespoły turbin zamontowane nad szczelinami pozyskują energię dzięki dużej różnicy temperatur między ciepłym wnętrzem planety a powietrzem przy powierzchni."
 district_pdexotic_cryo_sublimation: "Wyrobisko sublimacyjne"
 district_pdexotic_cryo_sublimation_plural: "Wyrobiska sublimacyjne"
 district_pdexotic_cryo_sublimation_desc: "Wyrobiska odkrywkowe, w których ogromne ilości lodu z lotnych substancji poddaje się błyskawicznej sublimacji, by uwolnić uwięzione w nim metale i sole. Nad każdym frontem robót unoszą się kurtyny oparów."
 district_pdexotic_cryo_chemovat: "Ogród chemosyntetyczny"
 district_pdexotic_cryo_chemovat_plural: "Ogrody chemosyntetyczne"
 district_pdexotic_cryo_chemovat_desc: "Kompleksy zbiorników ciśnieniowych, w których hoduje się rodzime organizmy chemosyntetyczne. Przetwarzają one atmosferę planety w jadalną biomasę, uwalniając przy tym rzadkie gazy jako produkt uboczny."
 pdexotic_cryo_chemovat_basic: "Podstawowe kadzie chemosyntetyczne"
 pdexotic_cryo_chemovat_basic_desc: "Podstawowa działalność kadzi chemosyntetycznych: hodowla rodzimej biomasy chemosyntetycznej, oczekująca na specjalizację."
 mod_district_pdexotic_cryo_riftvent_max_add: "Maksymalna liczba dzielnic: $district_pdexotic_cryo_riftvent_plural$"
 mod_district_pdexotic_cryo_sublimation_max_add: "Maksymalna liczba dzielnic: $district_pdexotic_cryo_sublimation_plural$"
 mod_district_pdexotic_cryo_chemovat_max_add: "Maksymalna liczba dzielnic: $district_pdexotic_cryo_chemovat_plural$"
 zone_pdexotic_cryo_chemovat_refinement: "Hodowla w kadziach"
 zone_pdexotic_cryo_chemovat_refinement_desc: "Zbiorniki ciśnieniowe w kompleksach kadzi służą do hodowli rodzimych szczepów chemosyntetycznych, które na skalę przemysłową przetwarzają zamkniętą w nich atmosferę w jadalną biomasę."
 zone_pdexotic_cryo_chemovat_hydride_synthesis: "Destylacja wodorków"
 zone_pdexotic_cryo_chemovat_hydride_synthesis_desc: "Każda kadź chemosyntetyczna jest wyposażona w kolumny destylacyjne, które skraplają lotne wodorki i gromadzą je w zbiornikach. Wydajność produkcji biomasy spada proporcjonalnie do wzrostu produkcji gazu."
 zone_unavailable_tech_mine_exotic_gases: "$engineering_research_icon_with_space$$tech_mine_exotic_gases$"
 mod_job_pdexotic_cryo_chemist_add: "Miejsca pracy: [pdexotic_cryo_chemist.GetName]"
 mod_job_pdexotic_cryo_chemist_drone_add: "Miejsca pracy: [pdexotic_cryo_chemist_drone.GetName]"
 mod_job_pdexotic_cryo_chemist_machine_add: "Miejsca pracy: [pdexotic_cryo_chemist_machine.GetName]"
 mod_job_pdexotic_cryo_chemist_automated_workforce_mult: "[pdexotic_cryo_chemist.GetIcon] [pdexotic_cryo_chemist.GetNamePlural] $MOD_PLANET_AUTOMATED_WORKFORCE$"
 job_pdexotic_cryo_chemist: "Opiekun kadzi"
 job_pdexotic_cryo_chemist_plural: "Opiekunowie kadzi"
 job_pdexotic_cryo_chemist_desc: "Opiekunowie kadzi doglądają ciśnieniowych kadzi chemosyntetycznych, w których hoduje się rodzime organizmy żywiące się atmosferą planety. Praca ta łączy rolnictwo z chemią niskich temperatur: organizmy dostarczają jadalnej biomasy i uwalniają rzadkie gazy jako produkt uboczny."
 job_pdexotic_cryo_chemist_drone: "Dron obsługi kadzi"
 job_pdexotic_cryo_chemist_drone_plural: "Drony obsługi kadzi"
 job_pdexotic_cryo_chemist_drone_desc: "Drony obsługi kadzi doglądają ciśnieniowych kadzi chemosyntetycznych roju, kierując wyhodowaną biomasę chemosyntetyczną do produkcji żywności i odzyskując uwalniane gazy na potrzeby przemysłu roju."
 job_pdexotic_cryo_chemist_machine: "Jednostka obsługi kadzi"
 job_pdexotic_cryo_chemist_machine_plural: "Jednostki obsługi kadzi"
 job_pdexotic_cryo_chemist_machine_desc: "Jednostki obsługi kadzi wykorzystują ciśnieniowe kadzie chemosyntetyczne do pozyskiwania gazów, odzyskując lotne produkty uboczne z kriogenicznego obiegu biomasy. W imperiach, które nadal potrzebują organicznego pożywienia, odzyskuje się również biomasę jako produkt dodatkowy."
