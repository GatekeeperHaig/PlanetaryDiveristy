l_polish:

#Senate
 decision_pd_arcology_senate: "Zbuduj Kopułę Senatu"
 decision_pd_arcology_senate_desc: "Aby sprostać rosnącym potrzebom naszego państwa, musimy wznieść monumentalny budynek Senatu w naszej stolicy, przeznaczając znaczną przestrzeń na wzmocnienie zdolności administracyjnych rządu."
 decision_pd_arcology_senate_effects: "W tej stolicy powstaje §Y$d_pd_senate_building$§!, co zwiększa możliwości administracyjne naszego rządu kosztem miejsca na dzielnice."
 d_pd_senate_building: "Kopuła Senatu"
 d_pd_senate_building_desc: "Kopuła Senatu, majestatyczny symbol rządów, góruje jako administracyjne serce, w którym kształtowana jest przyszłość naszej cywilizacji."

#Palace
 decision_pd_arcology_palace: "Zbuduj Kompleks Pałacowy"
 decision_pd_arcology_palace_desc: "Aby odzwierciedlić potęgę i autorytet naszego imperium, wzniesiemy monumentalny Pałac w stolicy. Ta wspaniała budowla ucieleśni siłę naszego przywództwa i znacząco zwiększy możliwości administracyjne rządu."
 decision_pd_arcology_palace_effects: "W tej stolicy powstaje §Y$d_pd_palace_building$§!, co zwiększa możliwości administracyjne naszego rządu kosztem miejsca na dzielnice."
 d_pd_palace_building: "Kompleks Pałacowy"
 d_pd_palace_building_desc: "Kompleks Pałacowy, wielki symbol naszej suwerenności i potęgi władcy, dominuje nad stolicą. Jest sercem administracji, gdzie kształtowany jest los imperium."

#Headquarters
 decision_pd_arcology_headquarters: "Zbuduj Planetarną Kwaterę Główną"
 decision_pd_arcology_headquarters_desc: "Aby ukazać potęgę i wpływy naszej megakorporacji, wzniesiemy strzelistą Kwaterę Główną w tym centrum gospodarczym. Ta imponująca konstrukcja będzie świadectwem siły naszego kierownictwa i znacząco usprawni nasze operacje galaktyczne."
 decision_pd_arcology_headquarters_effects: "W tej stolicy powstaje §Y$d_pd_headquarters_building$§!, co zwiększa możliwości administracyjne naszej korporacji kosztem miejsca na dzielnice."
 d_pd_headquarters_building: "Planetarna Kwatera Główna"
 d_pd_headquarters_building_desc: "Ta kwatera główna jest monumentalnym symbolem dominacji i góruje nad planetą. To centrum zarządzania naszymi działaniami, w którym kształtuje się przyszłość naszej megakorporacji."

#Hive Confluence Spire
 decision_pd_hive_confluence_spire: "Zbuduj Iglicę Konwergencji"
 decision_pd_hive_confluence_spire_desc: "Aby zamanifestować wyższość i zasięg naszego kolektywu, wyhodujemy potężną Iglicę Konwergencji. Ta imponująca konstrukcja znacząco wzmocni nasze działania wśród gwiazd."
 decision_pd_hive_confluence_spire_effects: "W tej stolicy powstaje §Y$d_pd_confluence_spire_building$§!, co zwiększa nasze możliwości administracyjne kosztem miejsca na dzielnice."
 d_pd_confluence_spire_building: "Iglica Konwergencji"
 d_pd_confluence_spire_building_desc: "Ta iglica góruje nad powierzchnią planety, będąc strzelistym symbolem kontroli. To centrum naszej zbiorowej woli, w którym misternie wytyczamy naszą drogę wśród gwiazd."

#Machine Centralized Processing
 decision_pd_machine_centralized_processing: "Zbuduj Centralną Jednostkę Przetwarzania"
 decision_pd_machine_centralized_processing_desc: "Aby potwierdzić naszą wyższość i zwiększyć zdolności operacyjne, skonstruujemy Centralną Jednostkę Przetwarzania. Ta konstrukcja znacząco usprawni nasze działania na skalę galaktyczną."
 decision_pd_machine_centralized_processing_effects: "W tej stolicy powstaje §Y$d_pd_machine_centralized_processing$§!, co zwiększa nasze możliwości administracyjne kosztem miejsca na dzielnice."
 d_pd_machine_centralized_processing: "Centralna Jednostka Przetwarzania"
 d_pd_machine_centralized_processing_desc: "Jednostka ta dominuje nad powierzchnią planety i stanowi centralny węzeł naszych zbiorowych dyrektyw, precyzyjnie koordynując działania dronów."
