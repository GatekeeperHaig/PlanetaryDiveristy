 #Garden Districts
 district_pd_garden_arcology_housing: "Arkologia ekoiglicy"
 district_pd_garden_arcology_housing_plural: "Arkologie ekoiglic"
 district_pd_garden_arcology_housing_desc: "Te arkologie łączą ekologiczną harmonię z miejską nowoczesnością, oferując zaawansowaną infrastrukturę, wielopoziomową zabudowę mieszkalną oraz rozległe, idylliczne tereny zielone."
 district_pd_garden_arcology_urban_1: "Rezerwat Przyrody"
 district_pd_garden_arcology_urban_1_plural: "Rezerwaty Przyrody"
 district_pd_garden_arcology_urban_1_desc: "Ten rozległy rezerwat to starannie zaprojektowany ekosystem, stworzony, by równoważyć skrajną urbanizację ekumenopolis poprzez zapewnienie niezbędnych funkcji ekologicznych i opieki nad środowiskiem."
